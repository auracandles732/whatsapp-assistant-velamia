                                {channelStats.filter(ch => ch.id === 'all' || ch.id === 'whatsapp' || ch.count > 0 || channelFilter === ch.id).map(ch => {
                                    const on = channelFilter === ch.id;
                                    if (ch.id === 'all') return <button key={ch.id} type="button" role="tab" aria-selected={on} className={'mx-chip' + (on ? ' on' : '')} onClick={() => chooseChannel('all')}>Todas <span className="n">{ch.count}</span></button>;
                                    const logo = on || ch.id === 'whatsapp'
                                        ? <PlatIcon name={ch.icon} size={19} color={on ? '#fff' : ch.color} />
                                        : <PbNetLogo net={ch.id === 'instagram' ? 'instagram' : 'facebook'} size={19} />;
                                    return (
                                        <button key={ch.id} type="button" role="tab" aria-selected={on} className={'mx-netchip' + (on ? ' on' : '')} style={{ '--ch': ch.color }} onClick={() => chooseChannel(ch.id)}>
                                            {logo} {ch.label} <span className="c">{ch.count}</span>
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="mx-chipscroll">
                                {statusChips.map(([id, label, n]) => <button key={id} type="button" className={'mx-chip' + (listFilter === id ? ' on' : '')} onClick={() => setListFilter(id)}>{label}{n > 0 && <span className="n">{n}</span>}</button>)}
                            </div>
                            {visibleConversations.length === 0 ? (
                                <div className="mx-none">{conversations.length === 0 ? 'Todavía no hay conversaciones.' : 'No hay conversaciones con ese filtro.'}</div>
                            ) : (
                                <div className="mx-list">
                                    {visibleConversations.map(conv => {
                                        const preview = listOverview.previews[conv.id];
                                        const label = contactName(conv);
                                        const unread = unreadMap[conv.id] || 0;
                                        return (
                                            <button key={conv.id} type="button" className={'mx-conv ch-' + channelOf(conv) + (unread ? ' unread' : '')} onClick={() => setSelectedConv(conv)}>
                                                <Avatar name={label} size={50} />
                                                <div className="body">
                                                    <div className="row">
                                                        <span className="name"><ChannelMark phone={conv.phone_number} size={17} all /><span className="nt">{label}</span></span>
                                                        <span className="time">{listTime(conv.last_message_time)}</span>
                                                    </div>
                                                    <div className="prev-row">
                                                        <div className="prev">{preview && preview.text ? (preview.sender === 'customer' ? '' : 'Tú: ') + preview.text : contactLine(conv.phone_number)}</div>
                                                        {unread > 0 && <span className="mx-badge">{unread}</span>}
                                                    </div>
                                                    <div className="mx-tags">{tagsOf(conv).map(([text, color]) => <span key={text} className={'mx-tag ' + color}>{text}</span>)}</div>
                                                </div>
                                                <span className="go"><PbIcon name="next" size={20} color="#5C668F" /></span>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    );
                };

                const chatView = () => {
                    const conv = currentConv;
                    const ch = channelInfo(conv.phone_number);
                    const social = socialChannel(conv.phone_number);
                    return (
                        <div className="mx-chat">
                            <div className="mx-chat-head">
                                <button type="button" className="mx-icon" aria-label="Volver a los chats" onClick={() => setSelectedConv(null)}><PbIcon name="back" size={24} /></button>
                                <Avatar name={contactName(conv)} size={46} />
                                <div className="who">
                                    <div className="nm">{contactName(conv)}</div>
                                    <div className="ch"><PlatIcon name={ch.icon} size={15} color={ch.color} /> {ch.label}{isClosedConv(conv) ? ' · cerrada' : ''}</div>
                                </div>
                                {!social && <a className="mx-icon" href={'tel:+' + conv.phone_number} aria-label="Llamar"><MxIcon name="phone" size={22} /></a>}
                                <PbMenu items={[
                                    { label: 'Ver cliente', onClick: () => setSideOpen(true) },
                                    canEdit && { label: botPausedInChat ? 'Reactivar bot' : 'Pausar bot', onClick: pauseOrResumeBot },
                                    canEdit && { label: isClosedConv(conv) ? 'Reabrir chat' : 'Cerrar chat', onClick: toggleClosed },
                                    canEdit && summary && summary.phase2 && { label: noteMode ? 'Volver a escribir mensajes' : 'Escribir nota interna', onClick: () => setNoteMode(!noteMode) },
                                    canEdit && !showQuick && { label: 'Mostrar acciones rápidas', onClick: () => toggleQuick(true) },
                                    canConfigure && { label: deletingChat ? 'Eliminando...' : 'Eliminar chat', danger: true, onClick: deleteChat }
                                ]} />
                            </div>
                            {botPausedInChat && (
                                <div className="mx-banner">
                                    <span>Bot pausado: atiendes tú en este chat</span>
                                    {canEdit && <button type="button" onClick={pauseOrResumeBot} disabled={pausingBot}>Reactivar bot</button>}
                                </div>
                            )}
                            <div className="mx-msgs" ref={messagesRef} onScroll={handleMessagesScroll}>
                                {timeline.map((item, index) => {
                                    const newDay = index === 0 || dayKey(timeline[index - 1].ts) !== dayKey(item.ts);
                                    const dayPill = newDay ? <div className="mx-day">{dayLabel(item.ts)}</div> : null;
                                    if (item.kind === 'note') {
                                        const note = item.data;
                                        return (
                                            <React.Fragment key={item.key}>
                                                {dayPill}
                                                <div className="mx-note">
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, fontSize: 12, fontWeight: 700, marginBottom: 2 }}>
                                                        <span>📝 Nota interna · {note.author || 'Equipo'} · {formatTime(note.created_at)}</span>
                                                        {canEdit && <button type="button" aria-label="Borrar nota" onClick={() => removeNote(note)} style={{ background: 'none', border: 'none', padding: 0, fontSize: 18, lineHeight: 1, color: '#7A5F00' }}>×</button>}
                                                    </div>
                                                    {note.content}
                                                </div>
                                            </React.Fragment>
                                        );
                                    }
                                    const msg = item.data;
                                    const content = msg.content || '';
                                    const urlMatch = MEDIA_TYPES.includes(msg.type) ? content.match(/^https?:\/\/\S+/) : null;
                                    const mediaUrl = urlMatch ? urlMatch[0] : null;
                                    const textPart = mediaUrl ? content.slice(mediaUrl.length).replace(/^\n/, '') : content;
                                    const product = mediaUrl ? mxCatalogProductOf(msg, products) : null;
                                    if (product) {
                                        const extraLines = textPart.split('\n').filter(line => line.trim() && !/\*[^*]+\*/.test(line) && !/^\s*💰/.test(line));
                                        return (
                                            <React.Fragment key={item.key}>
                                                {dayPill}
                                                <div className={'mx-msg ' + msg.sender}>
                                                    <div className="mx-product">
                                                        <img src={mediaUrl} alt="" onLoad={keepAtBottom} onClick={() => window.open(mediaUrl, '_blank')} />
                                                        <div className="info">
                                                            <b>{product.name}</b>
                                                            <div className="price">{mxPrice(product.price)}</div>
                                                            <div className="more">{extraLines.length ? renderWa(extraLines.join('\n')) : mxPretty(product.category)}</div>
                                                            <button type="button" className="mx-link" onClick={() => { setCatalogFocus(product.id); goTab('catalogo'); }}>Ver más detalles <MxIcon name="external" size={15} /></button>
                                                            <div className="mx-time">{formatTime(msg.timestamp)}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </React.Fragment>
                                        );
                                    }
                                    return (
                                        <React.Fragment key={item.key}>
                                            {dayPill}
                                            <div className={'mx-msg ' + msg.sender}>
                                                <div className="mx-bubble">
                                                    {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} alt="" onLoad={keepAtBottom} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                    {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '230px', marginBottom: '6px', display: 'block' }} /> : null}
                                                    {msg.type === 'document' && mediaUrl ? <a href={mediaUrl} target="_blank" rel="noopener noreferrer" style={{ display: 'block', marginBottom: '6px', fontWeight: 600 }}>📎 Abrir documento</a> : null}
                                                    {renderWa(textPart)}
                                                    <div className="mx-time">{formatTime(msg.timestamp)}</div>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    );
                                })}
                            </div>
                            {photoPickerModal}
                            {photoStatus && <div style={{ padding: '8px 16px', fontSize: '13px', fontWeight: 600, color: '#4F5BD5', background: '#F5F8FF', borderTop: '1px solid #DCE2F5' }}>📤 {photoStatus} No cierres el chat.</div>}
                            {canEdit && showQuick && !noteMode && recordingSeconds === null && (
                                <div className="mx-suggest">
                                    <div className="h"><PlatIcon name="sparkle" size={16} color="#4F5BD5" /> Acciones rápidas<button type="button" className="x" aria-label="Ocultar acciones rápidas" onClick={() => toggleQuick(false)}>×</button></div>
                                    <div className="row">
                                        <button type="button" onClick={() => setComposer({ mode: 'quote', conv })}><PlatIcon name="doc" size={20} color="#4F5BD5" /> Responder con cotización</button>
                                        <button type="button" onClick={() => setPhotoPicker(true)} disabled={!!photoStatus}><MxIcon name="book" size={20} color="#4F5BD5" /> Enviar catálogo</button>
                                        <button type="button" onClick={() => setComposer({ mode: 'order', conv })}><PlatIcon name="bag" size={20} color="#4F5BD5" /> Crear pedido</button>
                                    </div>
                                </div>
                            )}
                            {!canEdit && <div className="mx-readonly">Tu usuario es solo de consulta: puedes ver los chats, pero no responder.</div>}
                            {canEdit && (
                                <div className={'mx-input' + (noteMode ? ' note' : '')}>
                                    {recordingSeconds === null ? (
                                        <>
                                            <button type="button" className="mx-round" aria-label="Enviar foto" onClick={() => setPhotoPicker(true)} disabled={!!photoStatus || noteMode}><MxIcon name="clip" size={22} color="#3A4570" /></button>
                                            <div className="mx-field">
                                                <textarea
                                                    rows={1}
                                                    placeholder={noteMode ? 'Nota interna: el cliente no la ve...' : 'Escribe un mensaje...'}
                                                    value={noteMode ? noteText : inputText}
                                                    ref={growInput}
                                                    onChange={e => { (noteMode ? setNoteText : setInputText)(e.target.value); growInput(e.target); }}
                                                    onPaste={e => {
                                                        const pasted = photosFrom(e.clipboardData);
                                                        if (pasted.length && selectedConv && !noteMode) { e.preventDefault(); sendPhotoFiles(selectedConv, pasted); }
                                                    }}
                                                ></textarea>
                                                <button type="button" className="mx-emoji" aria-label="Emojis" aria-expanded={emojiOpen} onClick={() => setEmojiOpen(!emojiOpen)}><MxIcon name="smile" size={24} color="#3A4570" /></button>
                                            </div>
                                            {emojiOpen && <div className="mx-emojis">{MX_EMOJIS.map(emoji => <button key={emoji} type="button" onClick={() => addEmoji(emoji)}>{emoji}</button>)}</div>}
                                            {noteMode
                                                ? <button type="button" className="mx-send" aria-label="Guardar nota" onClick={saveNote}><PlatIcon name="note" size={22} color="#fff" /></button>
                                                : !inputText.trim() && !social
                                                    ? <button type="button" className="mx-send" aria-label="Grabar nota de voz" onClick={startVoice}><MxIcon name="mic" size={23} color="#fff" /></button>
                                                    : <button type="button" className="mx-send" aria-label="Enviar" onClick={() => { setEmojiOpen(false); sendMessage(); }} disabled={sending}><PlatIcon name="send" size={22} color="#fff" /></button>}
                                        </>
                                    ) : (
                                        <>
                                            <button type="button" className="mx-round" aria-label="Cancelar grabación" onClick={() => stopVoice(true)}><PlatIcon name="trash" size={21} color="#D03535" /></button>
                                            <div className="mx-field" style={{ alignItems: 'center', padding: '12px 16px', color: '#D03535', fontWeight: 700, fontSize: 15 }}>● Grabando {Math.floor(recordingSeconds / 60)}:{String(recordingSeconds % 60).padStart(2, '0')}</div>
                                            <button type="button" className="mx-send rec" onClick={() => stopVoice(false)}>Enviar</button>
                                        </>
                                    )}
                                </div>
                            )}
                            {sideOpen && (
                                <div className="nx-side open">
                                    <div className="nx-side-head">
                                        <button type="button" className="nx-icon-btn" onClick={() => setSideOpen(false)}>← Volver al chat</button>
                                        <span className="t">{contactName(currentConv)}</span>
                                    </div>
                                    {summary && summary.phase2 && (
                                        <div className="nx-card">
                                            <div className="nx-card-h"><h3><PlatIcon name="tag" size={20} color="#4F5BD5" /> Etiquetas</h3></div>
                                            <TagBar tags={summary.tags || []} onChange={saveTags} readOnly={!canEdit} />
                                        </div>
                                    )}
                                    <ClientCard summary={summary} conv={currentConv} />
                                    <ProductsCard summary={summary} onCatalog={() => { setSideOpen(false); goTab('catalogo'); }} />
                                    {summary && summary.phase2 && <TasksCard tasks={summary.tasks} onAdd={addTask} onToggle={setTaskDone} onRemove={removeTask} readOnly={!canEdit} />}
                                    <AlertsCard alerts={summary ? summary.alerts : []} loading={!summary} />
                                </div>
                            )}
                        </div>
                    );
                };

                const statsView = () => {
                    const t = today?.today, y = today?.yesterday;
                    const dateLabel = new Date().toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'short', day: 'numeric', month: 'long' });
                    const tile = (icon, label, value, delta) => (
                        <div className="mx-tile">
                            <span className="ic"><PlatIcon name={icon} size={21} color="#4F5BD5" /></span>
                            <div style={{ minWidth: 0 }}><div className="lab">{label}</div><div className="val">{value}{delta}</div></div>
                        </div>
                    );
                    return (
                        <div className="mx-page">
                            <div className="mx-hero">
                                <div className="mx-hero-h"><PlatIcon name="calendar" size={22} color="#fff" /><b>Resumen de hoy</b><span>{dateLabel}</span></div>
                                {!t ? <div style={{ padding: '10px 4px 6px' }}>Cargando...</div> : (
                                    <div className="mx-tiles">
                                        {tile('chat', 'Conversaciones', t.conversations, <Delta now={t.conversations} before={y.conversations} />)}
                                        {tile('bag', 'Pedidos generados', t.orders, <Delta now={t.orders} before={y.orders} />)}
                                        {tile('doc', 'Cotizaciones enviadas', t.quotations, <Delta now={t.quotations} before={y.quotations} />)}
                                        {tile('clock', 'Tiempo de respuesta', formatDuration(t.responseSeconds), <Delta now={t.responseSeconds} before={y.responseSeconds} lowerIsBetter />)}
                                    </div>
                                )}
                            </div>
                            <button type="button" className="mx-row" onClick={() => goList(hasReadTracking ? 'unread' : 'all')}>
                                <span className="ic" style={{ background: '#EEEBFF' }}><PlatIcon name="chat" size={26} color="#6C5CE7" /></span>
                                <span className="tt"><b>Conversaciones pendientes</b><small>Clientes con mensajes que aún no has leído.</small><span className="big">{allUnread}</span></span>
                                <PbIcon name="next" size={20} color="#5C668F" />
                            </button>
                            <button type="button" className="mx-row" onClick={() => goList('needs')}>
                                <span className="ic" style={{ background: '#FDECE7' }}><PlatIcon name="users" size={26} color="#E5604D" /></span>
                                <span className="tt"><b>Clientes que necesitan atención</b><small>El bot se pausó y esperan tu respuesta.</small><span className="big">{allNeeds}</span></span>
                                <PbIcon name="next" size={20} color="#5C668F" />
                            </button>
                            <div className="mx-row">
                                <span className="ic" style={{ background: '#E8EFFF' }}><PlatIcon name="robot" size={26} color="#2F4BD8" /></span>
                                <span className="tt">
                                    <b>Rendimiento del bot</b>
                                    <small>Porcentaje de respuestas automáticas hoy.</small>
                                    <span className="big">{t && t.botShare !== null && t.botShare !== undefined ? t.botShare + '%' : '—'}{t && y && <Delta now={t.botShare} before={y.botShare} />}</span>
                                </span>
                            </div>
                            <div className="mx-card">
                                <div className="mx-card-h"><PbIcon name="bolt" size={20} color="#4F5BD5" /> Acciones rápidas</div>
                                <div className="mx-quick">
                                    <button type="button" className="a" disabled={!canEdit} onClick={() => setComposer({ mode: 'quote' })}><PlatIcon name="doc" size={30} color="#2F4BD8" />Nueva cotización</button>
                                    <button type="button" className="b" disabled={!canEdit} onClick={() => setComposer({ mode: 'order' })}><PlatIcon name="bag" size={30} color="#6B46E0" />Crear pedido</button>
                                    <button type="button" className="c" onClick={() => setShowKpis(!showKpis)}><PlatIcon name="chart" size={30} color="#1E8A4A" />{showKpis ? 'Ocultar estadísticas' : 'Ver estadísticas'}</button>
                                </div>
                            </div>
                            {showKpis && (
                                <div className="mx-card">
                                    <div className="mx-card-h"><PlatIcon name="chart" size={20} color="#4F5BD5" /> Estadísticas generales</div>
                                    <div className="mx-kpis">
                                        <div><small>Total clientes</small><b>{stats.total}</b></div>
                                        <div><small>Activas (últimas 24 h)</small><b>{stats.active}</b></div>
                                        <div><small>Pedidos</small><b>{stats.orders}</b></div>
                                        <div><small>Ventas en pedidos</small><b>${Number(stats.revenue || 0).toFixed(2)}</b></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                };

                const moreItems = [
                    ['cotizaciones', 'doc', 'Cotizaciones'],
                    ['catalogo', 'box', 'Catálogo'],
                    ['estadisticas', 'chart', 'Estadísticas'],
                    ['publicaciones', 'image', 'Publicaciones'],
                    ['configuracion', 'gear', 'Configuración'],
                    ['consumo', 'chart', 'Consumo de IA'],
                    session && session.role === 'owner' && !session.business?.legacy && ['claves', 'key', 'Claves']
                ].filter(Boolean);

                return (
                    <div className="container nx-page mx">
                        <div className="main">
                            <MxTop branding={branding} session={session} botEnabled={botEnabled} canConfigure={canConfigure} onToggleBot={toggleBotStatus} alert={allNeeds > 0} onBell={() => goList('needs')} />
                            <AiProblemBanner problem={aiProblem} />
                            {activeTab === 'claves' && session?.business && !session.business.legacy && (
                                <div className="settings-container nx-keys-page">
                                    <OwnerKeysPanel business={session.business} onChanged={loadSession} />
                                </div>
                            )}
                            {activeTab === 'conversaciones' && listView()}
                            {activeTab === 'estadisticas' && statsView()}
                            {activeTab === 'catalogo' && <CatalogMobile products={products} biz={biz} legacy={!!session?.business?.legacy} reload={loadProducts} readOnly={!canEdit} conversations={conversations} focus={catalogFocus} onFocusDone={() => goTab('conversaciones')} />}
                            {activeTab === 'publicaciones' && <PostsView canEdit={canEdit} canConfigure={canConfigure} isAdmin={isAdmin} />}
                            {activeTab === 'cotizaciones' && <QuotesMobile quotations={quotations} products={products} conversations={conversations} biz={biz} canEdit={canEdit} filter={quoteFilter} setFilter={setQuoteFilter} openId={mxQuoteId} setOpenId={setMxQuoteId} reload={loadQuotations} openChat={id => { setMxQuoteId(null); openChatFromQuotation(id); }} onCompose={setComposer} />}
                            {activeTab === 'pedidos' && (
                                <div className="mx-page">
                                    <div className="mx-head">
                                        <div className="grow"><h1>Pedidos</h1><p>Marca el avance de cada pedido: el asistente usa este estado cuando la clienta pregunta cómo va.</p></div>
                                        {canEdit && <button type="button" className="mx-headbtn act" onClick={() => setComposer({ mode: 'order' })}><PlatIcon name="plus" size={18} color="#fff" /> Crear</button>}
                                    </div>
                                    {ordersPage(true)}
                                </div>
                            )}
                            {activeTab === 'configuracion' && <BusinessProfileForm mobile legacy={!!session?.business?.legacy} readOnly={!canConfigure} canTest={canEdit} onSaved={profileSaved} extras={configExtras} />}
                            {activeTab === 'consumo' && <ConsumptionMobile />}
                        </div>
                        {activeTab === 'conversaciones' && selectedConv && chatView()}
                        {composer && <SaleComposer {...composer} conversations={conversations} products={products} biz={biz} onClose={() => setComposer(null)} onDone={finishSale} />}
                        <MxNav tab={activeTab} lastOther={lastOther} moreOpen={mxMore} onTab={tab => { if (tab === activeTab && tab === 'conversaciones') setSelectedConv(null); goTab(tab); }} onMore={() => setMxMore(true)} />
                        {mxMore && (
                            <MxSheet title="Más opciones" onClose={() => setMxMore(false)}>
                                {moreItems.map(([id, icon, label]) => (
                                    <button key={id} type="button" className="mx-sheet-item" onClick={() => goTab(id)}>
                                        <span className="ic"><PlatIcon name={icon} size={20} color="#4F5BD5" /></span>{label}
                                        {activeTab === id && <span style={{ marginLeft: 'auto', color: '#4F5BD5', fontSize: 13 }}>Abierto</span>}
                                    </button>
                                ))}
                                {isAdmin && session?.business && <button type="button" className="mx-sheet-item" onClick={changeCompany}><span className="ic"><PlatIcon name="building" size={20} color="#4F5BD5" /></span>Cambiar empresa ({session.business.name})</button>}
                                {session && !isAdmin && <button type="button" className="mx-sheet-item" onClick={() => { setMxMore(false); changeOwnPassword(); }}><span className="ic"><PlatIcon name="key" size={20} color="#4F5BD5" /></span>Mi contraseña</button>}
                                <button type="button" className="mx-sheet-item danger" onClick={onLogout}><span className="ic" style={{ background: '#FDECEC' }}><PlatIcon name="logout" size={20} color="#D03535" /></span>Salir</button>
                            </MxSheet>
                        )}
                        {mxToast && <div className="mx-toast" role="status">{mxToast}</div>}
                    </div>
                );
            }

            return (
                <div className="container nx-page">
                    <div className="main">
                        <div className="nx-top">
                            <div className="nx-brand">
                                {/* El logo por defecto (logo.png) es de VELAMIA: otra empresa sin logo propio no lo muestra. */}
                                {branding.logoUrl || session?.business?.legacy
                                    ? <img src={logoOf(branding)} alt={branding.name || 'Logo'} />
                                    : <Avatar name={branding.name || session?.business?.name || 'N'} size={40} />}
                                <div>
                                    <div className="t">{branding.name || session?.business?.name || 'Mi empresa'}</div>
                                    <div className="s"><span className="lbl">Asistente WhatsApp · </span><span className="nx-by" title="Plataforma Nexly"><NexlyMark size={12} id="nx-by" /> NEXLY</span></div>
                                </div>
                            </div>

                            <div className="nx-tabs">
                                {session && session.role === 'owner' && !session.business?.legacy && <div className={'nx-tab' + (activeTab === 'claves' ? ' active' : '')} onClick={() => setActiveTab('claves')}><PlatIcon name="key" size={19} /><span className="lbl">Claves</span></div>}
                                <div className={'nx-tab' + (activeTab === 'conversaciones' ? ' active' : '')} onClick={() => setActiveTab('conversaciones')}><PlatIcon name="chat" size={19} /><span className="lbl">Conversaciones</span></div>
                                <div className={'nx-tab' + (activeTab === 'cotizaciones' ? ' active' : '')} onClick={() => setActiveTab('cotizaciones')}><PlatIcon name="doc" size={19} /><span className="lbl">Cotizaciones</span></div>
                                <div className={'nx-tab' + (activeTab === 'pedidos' ? ' active' : '')} onClick={() => setActiveTab('pedidos')}><PlatIcon name="bag" size={19} /><span className="lbl">Pedidos</span></div>
                                <div className={'nx-tab' + (activeTab === 'catalogo' ? ' active' : '')} onClick={() => setActiveTab('catalogo')}><PlatIcon name="box" size={19} /><span className="lbl">Catálogo</span></div>
                                <div className={'nx-tab' + (activeTab === 'publicaciones' ? ' active' : '')} onClick={() => setActiveTab('publicaciones')}><PlatIcon name="image" size={19} /><span className="lbl">Publicaciones</span></div>

        // Conecta la página de Facebook y su Instagram: se abre la ventana de Facebook y el servidor guarda la clave.
        function SocialConnect({ available, canConfigure }) {
            const [status, setStatus] = useState(null);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');

            const load = () => api('/api/meta/status').then(setStatus).catch(() => setStatus({ estado: 'no se pudo revisar' }));
            useEffect(() => { if (available) load(); }, [available]);

            async function connect() {
                setError('');
                // La ventana se abre al instante: si se abre después de esperar al servidor, el navegador la bloquea.
                const win = window.open('about:blank', 'conectar-facebook', 'width=620,height=760');
                setBusy(true);
                try {
                    const { url } = await api('/api/meta/connect-url');
                    if (!win) { window.location.href = url; return; }
                    win.location.href = url;
                    // Al pasar a Facebook el navegador corta el vínculo con la ventana (protección de seguridad), así que
                    // no se sabe cuándo termina: se revisa el estado cada pocos segundos hasta que cambie o pasen 5 minutos.
                    const before = JSON.stringify(status);
                    const started = Date.now();
                    const timer = setInterval(async () => {
                        const now = await api('/api/meta/status').catch(() => null);
                        if (now) setStatus(now);
                        if ((now && JSON.stringify(now) !== before) || Date.now() - started > 5 * 60 * 1000) {
                            clearInterval(timer);
                            setBusy(false);
                        }
                    }, 4000);
                } catch (e) {
                    if (win) win.close();
                    setError(e.message);
                    setBusy(false);
                }
            }

            if (!available) return <p className="hint">Instagram y Facebook todavía no están disponibles para esta empresa.</p>;
            const connected = status && /^conectado/.test(status.estado || '');
            const row = (label, value) => value ? <div style={{ display: 'flex', gap: '8px', padding: '6px 0', borderBottom: '1px solid #EEF1F8' }}><span style={{ color: '#6B7599', minWidth: '130px' }}>{label}</span><span style={{ fontWeight: 600, wordBreak: 'break-word' }}>{value}</span></div> : null;
            return (
                <>
                    <p className="hint">El asistente responde los mensajes de Instagram y Messenger y los comentarios de tus publicaciones, igual que en WhatsApp. Al presionar el botón se abre Facebook: inicia sesión, elige tu página y tu Instagram, y <b>acepta todos los permisos</b>.</p>
                    {!status ? <div className="hint">Revisando...</div> : (
                        <div style={{ margin: '8px 0 12px', fontSize: '14px' }}>
                            {row('Estado', status.estado)}
                            {row('Instagram', status.instagram)}
                            {row('La clave vence', status.clave_vence)}
                            {row('Faltan permisos', status.faltan)}
                            {row('Motivo', status.motivo)}
                        </div>
                    )}
                    {error && <div style={{ color: '#E5484D', fontWeight: 600, margin: '8px 0' }}>{error}</div>}
                    <div className="settings-actions">
                        <span className="save-status">{connected && !status.faltan ? '✅ Todo conectado' : ''}</span>
                        <button type="button" className="btn-save-prompt" onClick={connect} disabled={busy || !canConfigure}>

        // ---------- Publicaciones en redes (servicio adicional) ----------
        const POST_CHANNEL_NAMES = { instagram_feed: 'Instagram', instagram_story: 'Historia de Instagram', facebook: 'Facebook' };
        const POST_STATUS = {
            draft: 'Programada', approved: 'Programada', publishing: 'Publicando…', published: 'Publicada',
            partial: 'Publicada en parte', failed: 'No se publicó', cancelled: 'Descartada'
        };
        const EDITABLE_POST = ['draft', 'approved', 'failed'];
        const WEEK_DAYS = [[1, 'Lun'], [2, 'Mar'], [3, 'Mié'], [4, 'Jue'], [5, 'Vie'], [6, 'Sáb'], [0, 'Dom']];
        const DAY_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const MONTH_SHORT = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const MONTH_LONG = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const CAPTION_MAX = 2200;

        // Día y hora en la zona del negocio (no en la de la computadora): la hora que se ve es la hora a la que sale.
        function tzParts(date) {
            const parts = {};
            new Intl.DateTimeFormat('en-CA', { timeZone: BUSINESS_TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
                .formatToParts(date).forEach(p => { parts[p.type] = p.value; });
            return parts;
        }
        function toTzInput(iso) {
            const p = tzParts(new Date(iso));
            return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
        }
        function fromTzInput(value) {
            const [d, t] = String(value).split('T');
            const [y, m, dd] = d.split('-').map(Number);
            const [hh, mm] = (t || '00:00').split(':').map(Number);
            const wanted = Date.UTC(y, m - 1, dd, hh, mm);
            let guess = wanted;
            for (let i = 0; i < 2; i++) {
                const p = tzParts(new Date(guess));
                guess += wanted - Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
            }
            return new Date(guess).toISOString();
        }
        const postWhen = iso => {
            const text = new Date(iso).toLocaleString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
            return text.charAt(0).toUpperCase() + text.slice(1);
        };

        // Días como "AAAA-MM-DD" en la zona del negocio.
        const dayOf = iso => { const p = tzParts(new Date(iso)); return `${p.year}-${p.month}-${p.day}`; };
        const pbToday = () => dayOf(new Date().toISOString());
        const dayParts = key => { const [y, m, d] = key.split('-').map(Number); return { y, m, d }; };
        const addDays = (key, n) => { const { y, m, d } = dayParts(key); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
        const weekdayOf = key => { const { y, m, d } = dayParts(key); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
        const mondayOf = key => addDays(key, -((weekdayOf(key) + 6) % 7));
        const monthStart = key => key.slice(0, 8) + '01';
        const monthGridStart = key => mondayOf(monthStart(key));
        const addMonths = (key, n) => { const { y, m } = dayParts(key); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 10); };
        const pbDayLabel = key => { const { m, d } = dayParts(key); return `${DAY_SHORT[weekdayOf(key)]} ${d} ${MONTH_SHORT[m - 1]}`; };
        const timeOf = iso => { const p = tzParts(new Date(iso)); return `${p.hour}:${p.minute}`; };
        const weekLabel = start => {
            const a = dayParts(start), b = dayParts(addDays(start, 6));
            return a.m === b.m ? `${a.d} – ${b.d} ${MONTH_SHORT[b.m - 1]} ${b.y}` : `${a.d} ${MONTH_SHORT[a.m - 1]} – ${b.d} ${MONTH_SHORT[b.m - 1]} ${b.y}`;
        };
        const monthLabel = key => { const { y, m } = dayParts(key); return `${MONTH_LONG[m - 1].charAt(0).toUpperCase()}${MONTH_LONG[m - 1].slice(1)} ${y}`; };
        const tzCity = () => BUSINESS_TZ.split('/').pop().replace(/_/g, ' ');
        function tzOffset() {
            try {
                const part = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TZ, timeZoneName: 'shortOffset' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName');
                return part ? part.value.replace('GMT', 'GMT ') : '';
            } catch {
                return '';
            }
        }
        const niceName = name => { const t = String(name || '').toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); };
        const postNets = post => ({ ig: post.channels.some(c => c.startsWith('instagram')), fb: post.channels.includes('facebook') });
        function hourOptions(current) {
            const list = [];
            for (let h = 5; h <= 23; h++) for (const m of ['00', '30']) list.push(`${String(h).padStart(2, '0')}:${m}`);
            if (current && !list.includes(current)) list.push(current);
            return list.sort();
        }

        // En el celular Publicaciones se recorre en pantallas; en la computadora todo va en una sola.

            return mobile;
        }

        function PbIcon({ name, size = 20, color = 'currentColor' }) {
            const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true };

        // Menú de tres puntos: se cierra al tocar fuera.
        function PbMenu({ items }) {

            useEffect(() => {
                if (!open) return;
                const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', close);
                document.addEventListener('touchstart', close);
                return () => { document.removeEventListener('mousedown', close); document.removeEventListener('touchstart', close); };
            }, [open]);
            const shown = items.filter(Boolean);
            if (shown.length === 0) return null;
            return (
                <div className="pb-menu" ref={ref}>
                    <button type="button" className="pb-dots" aria-label="Más opciones" aria-expanded={open} onClick={e => { e.stopPropagation(); setOpen(!open); }}><PbIcon name="dots" size={18} /></button>
                    {open && (
                        <div className="pb-menu-list">

        function PbModal({ title, extra, onClose, children }) {
            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onKey);
                const before = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = before; };
            }, []);
            return (
                <div className="pb-modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>

        // Ver, editar o publicar una publicación (lo programado sale solo a su hora, sin aprobarlo).
        function PbPostEditor({ post, canEdit, onChanged, onDeleted, onClose }) {
            const [caption, setCaption] = useState(post.caption);
            const [when, setWhen] = useState(toTzInput(post.scheduled_at));
            const [channels, setChannels] = useState(post.channels);
            const [busy, setBusy] = useState('');
            const [msg, setMsg] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                setCaption(post.caption);
                setWhen(toTzInput(post.scheduled_at));
                setChannels(post.channels);
            }, [post.id, post.caption, post.scheduled_at, post.channels.join(',')]);

            const editable = canEdit && EDITABLE_POST.includes(post.status);
            const dirty = caption !== post.caption || when !== toTzInput(post.scheduled_at) || channels.join(',') !== post.channels.join(',');
            const tooLong = caption.length > CAPTION_MAX;

            async function run(label, fn) {
                setBusy(label);
                setError('');
                setMsg('');
                try {
                    await fn();
                } catch (e) {
                    setError(e.message);
                } finally {
                    setBusy('');
                }
            }
            const patch = extra => api(`/api/posts/${post.id}`, {
                method: 'PATCH',
                body: JSON.stringify({ caption, scheduled_at: fromTzInput(when), channels, ...extra })
            }).then(r => r.post);

            const save = () => run('save', async () => { onChanged(await patch({})); setMsg('Guardado: se publicará sola a esa hora'); });
            const discard = () => {
                if (!confirm('¿Eliminar esta publicación? Se borra del calendario y ese día queda libre.')) return;
                run('discard', async () => { await api(`/api/posts/${post.id}`, { method: 'DELETE' }); onDeleted(post.id); onClose(); });
            };
            const rewrite = () => run('rewrite', async () => {
                const r = await api(`/api/posts/${post.id}/rewrite`, { method: 'POST' });
                setCaption(r.caption);
                setMsg('Texto nuevo: guárdalo si te gusta');
            });
            const publishNow = () => {
                const where = channels.map(c => POST_CHANNEL_NAMES[c]).join(', ');
                if (!confirm(`¿Publicar ahora en ${where}? Se verá de inmediato en tus redes.`)) return;
                run('publish', async () => {
                    if (dirty) await patch({});
                    const done = (await api(`/api/posts/${post.id}/publish`, { method: 'POST' })).post;
                    onChanged(done);
                    setMsg(done.status === 'published' ? '¡Publicada!' : '');
                });
            };

            const links = Object.entries(post.results || {}).filter(([, r]) => r && r.permalink);
            return (
                <PbModal title={postWhen(post.scheduled_at)} onClose={onClose} extra={<span className={'pb-st inline ' + post.status}>{POST_STATUS[post.status] || post.status}</span>}>
                    <div className="pb-modal-b">
                        <div className="pb-gallery">
                            {postItems(post).map((item, i) => (item.type === 'video' ? <video key={i} src={item.url} controls playsInline style={{ width: '100%', borderRadius: 12 }} /> : <img key={i} src={item.url} alt={item.name} title={item.name} />))}
                        </div>
                        <div>
                            <div className="pb-post-theme" style={{ marginBottom: '14px' }}>{post.theme}{postItems(post).length > 1 ? ` · carrusel de ${postItems(post).length}` : postItems(post)[0]?.type === 'video' ? ' · video (reel)' : ''}{post.products.length ? ' · ' + post.products.map(p => niceName(p.name)).join(', ') : ''}</div>
                            <div className="pb-field">
                                <span className="pb-label">Dónde se publica</span>
                                <PbNetChips channels={channels} setChannels={setChannels} disabled={!editable} />
                            </div>
                            {editable && (
                                <div className="pb-field">
                                    <label className="pb-label" htmlFor={'pb-when-' + post.id}>Día y hora</label>
                                    <input id={'pb-when-' + post.id} type="datetime-local" value={when} onChange={e => setWhen(e.target.value)} />
                                </div>
                            )}
                            <div className="pb-field">
                                <label className="pb-label" htmlFor={'pb-text-' + post.id}>Texto</label>
                                <textarea id={'pb-text-' + post.id} value={caption} readOnly={!editable} onChange={e => setCaption(e.target.value)} />
                                <div className={'pb-count' + (tooLong ? ' bad' : '')}>{caption.length} / {CAPTION_MAX}</div>
                            </div>
                            {links.length > 0 && (
                                <div className="pb-links">
                                    {links.map(([c, r]) => <a key={c} href={r.permalink} target="_blank" rel="noopener noreferrer">Ver en {POST_CHANNEL_NAMES[c] || c} ↗</a>)}
                                </div>
                            )}
                            {post.error && <div className="pb-err" style={{ marginBottom: '12px' }}>{post.error}</div>}
                            {error && <div className="pb-err" style={{ marginBottom: '12px' }}>{error}</div>}
                            {editable && (
                                <div className="pb-actions">
                                    {(dirty || post.status === 'failed') && <button type="button" className="pb-btn main sm" disabled={!!busy || tooLong} onClick={save}>{busy === 'save' ? 'Guardando…' : post.status === 'failed' ? 'Programar de nuevo' : 'Guardar cambios'}</button>}
                                    <button type="button" className="pb-btn sm" disabled={!!busy} onClick={rewrite}>{busy === 'rewrite' ? 'Escribiendo…' : '✨ Otro texto'}</button>
                                    <button type="button" className="pb-btn sm" disabled={!!busy || tooLong || channels.length === 0} onClick={publishNow}>{busy === 'publish' ? 'Publicando…' : 'Publicar ahora'}</button>
                                    <button type="button" className="pb-btn sm danger" disabled={!!busy} onClick={discard}>{busy === 'discard' ? 'Eliminando…' : 'Eliminar'}</button>
                                    {msg && <span className="pb-msg">{msg}</span>}
                                </div>
                            )}
                            {!editable && msg && <div className="pb-msg">{msg}</div>}
                        </div>
                    </div>
                </PbModal>
            );
        }

        function PbNewPost({ settings, day, onCreated, onClose }) {

            useEffect(() => { api('/api/products').then(list => setCatalog(list.filter(p => p.image_url))).catch(e => setError(e.message)); }, []);
            useEffect(() => {
                if (source === 'biblioteca' && !library) api('/api/social/assets').then(r => setLibrary(r.assets)).catch(e => setError(e.message));
            }, [source]);
            const toggleMedia = id => setChosenMedia(chosenMedia.includes(id) ? chosenMedia.filter(x => x !== id) : chosenMedia.length >= 10 ? chosenMedia : [...chosenMedia, id]);
            const count = source === 'catalogo' ? chosen.length : chosenMedia.length;

            const plain = t => String(t || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
            const shown = (catalog || []).filter(p => !search || plain(p.name + ' ' + p.category).includes(plain(search)));
            const toggle = name => setChosen(chosen.includes(name) ? chosen.filter(n => n !== name) : chosen.length >= 10 ? chosen : [...chosen, name]);

            async function create() {
                setBusy(true);
                setError('');
                try {
                    const fromLibrary = source === 'biblioteca';
                    // El nombre del archivo ("IMG_2031") no sirve de tema para el texto: se usa el producto que muestra, si lo tiene.
                    const theme = fromLibrary ? (library.find(a => a.id === chosenMedia[0])?.product_name || 'Nuestros productos') : niceName(catalog.find(p => p.name === chosen[0])?.category || '');
                    onCreated((await api('/api/posts', { method: 'POST', body: JSON.stringify({ products: fromLibrary ? [] : chosen, media: fromLibrary ? chosenMedia : [], scheduled_at: fromTzInput(when), channels, caption, theme }) })).post);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setBusy(false);

            }

            return (
                <PbModal title="Nueva publicación" onClose={onClose}>
                    <div className="pb-modal-b single">
                        <div>
                            <div className="pb-field">
                                <span className="pb-label">Qué mostrar <span className="pb-muted">· {count ? `${count} elegido(s)${count > 1 ? ', va como carrusel' : ''}` : 'una foto o video, o varios (carrusel, hasta 10)'}</span></span>

        // Ancho, alto y duración del archivo (se guardan para que el agente elija bien dónde usarlo).
        function mediaInfo(file) {
            return new Promise(resolve => {
                const url = URL.createObjectURL(file);
                const done = info => { URL.revokeObjectURL(url); resolve(info); };
                if (file.type.startsWith('video/')) {
                    const v = document.createElement('video');
                    v.preload = 'metadata';
                    v.onloadedmetadata = () => done({ width: v.videoWidth, height: v.videoHeight, duration_seconds: Math.round(v.duration * 10) / 10 });
                    v.onerror = () => done({});
                    v.src = url;
                } else {
                    const img = new Image();
                    img.onload = () => done({ width: img.naturalWidth, height: img.naturalHeight });
                    img.onerror = () => done({});
                    img.src = url;
                }
            });
        }

        // Sube el archivo directo al almacenamiento (sin pasar por el servidor) y lo registra en la biblioteca.
        async function uploadToLibrary(file) {
            const meta = await mediaInfo(file);
            const up = await api('/api/social/assets/upload', { method: 'POST', body: JSON.stringify({ contentType: file.type, size: file.size }) });
            const form = new FormData();
            form.append('cacheControl', '3600');
            form.append('', file);
            const put = await fetch(up.uploadUrl, { method: 'PUT', headers: { 'x-upsert': 'false' }, body: form });
            if (!put.ok) throw new Error('No se pudo subir el archivo (' + put.status + ')');
            return (await api('/api/social/assets', { method: 'POST', body: JSON.stringify({ path: up.path, title: file.name.replace(/\.[^.]+$/, ''), size_bytes: file.size, ...meta }) })).asset;
        }

        // ---------- Lectura del PDF del proveedor (en el navegador) ----------

        // Nombre del catálogo desde el archivo: "Catalogo Halloween_20260916_204344_0000.pdf" → "HALLOWEEN".
        function catalogNameFromFile(name) {
            return String(name || '').replace(/\.pdf$/i, '').replace(/[_-]\d{6,}.*$/, '').replace(/cat[aá]logo(s)?/ig, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
        }

        /**
         * Lee el PDF con pdf.js: en cada página busca las fotos de los modelos (las que tienen nombre y precio debajo) y las
         * saca limpias, sin la marca de agua que el PDF dibuja encima. Las páginas sin precios (portada, políticas) se saltan.
         */
        async function extractSupplierPdf(file, onProgress) {
            const pdfjs = await import(/* webpackIgnore: true */ '/crm/pdfjs/pdf.min.mjs');
            pdfjs.GlobalWorkerOptions.workerSrc = '/crm/pdfjs/pdf.worker.min.mjs';
            const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
            const mul = (a, b) => [a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1], a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3], a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];
            const isPrice = s => /^\s*\$\s*\d/.test(s);
            const isNote = s => /medida|peso|cera|\bcm\b|\d\s*g\b/i.test(s);
            const products = [];
            for (let n = 1; n <= doc.numPages; n++) {
                onProgress && onProgress(`Leyendo página ${n} de ${doc.numPages}`);
                const page = await doc.getPage(n);
                const vp = page.getViewport({ scale: 1 });
                const texts = (await page.getTextContent()).items.filter(t => t.str && t.str.trim())
                    .map(t => ({ s: t.str.trim(), x: t.transform[4], w: t.width || 0, y: vp.height - t.transform[5] }));
                if (!texts.some(t => isPrice(t.s))) continue;
                const ops = await page.getOperatorList();
                let ctm = [1, 0, 0, 1, 0, 0];
                const stack = [], draws = [];
                for (let i = 0; i < ops.fnArray.length; i++) {
                    const fn = ops.fnArray[i], args = ops.argsArray[i];
                    if (fn === pdfjs.OPS.save) stack.push(ctm);
                    else if (fn === pdfjs.OPS.restore) ctm = stack.pop() || ctm;
                    else if (fn === pdfjs.OPS.transform) ctm = mul(ctm, args);
                    else if (fn === pdfjs.OPS.paintImageXObject) draws.push({ id: args[0], x: ctm[4], y: vp.height - ctm[5] - ctm[3], w: ctm[0], h: ctm[3] });
                }
                // El logo o la marca de agua se dibujan varias veces o casi a toda la página: no son modelos.
                const count = {};
                draws.forEach(d => { count[d.id] = (count[d.id] || 0) + 1; });
                const boxes = draws.filter(d => count[d.id] === 1 && d.w >= 60 && d.h >= 60 && d.w <= vp.width * 0.8);
                for (const box of boxes) {
                    const cx = box.x + box.w / 2, bottom = box.y + box.h;
                    const near = t => Math.abs(t.x + t.w / 2 - cx) < box.w / 2 + 30 && t.y > bottom - 5 && t.y < bottom + 170;
                    const below = texts.filter(near).sort((a, b) => a.y - b.y);
                    const price = below.find(t => isPrice(t.s));
                    const nameLines = below.filter(t => !isPrice(t.s) && !isNote(t.s) && (!price || t.y < price.y));
                    if (!price || nameLines.length === 0) continue;
                    const firstY = nameLines[0].y;
                    const name = nameLines.filter(t => Math.abs(t.y - firstY) < 6).sort((a, b) => a.x - b.x).map(t => t.s).join(' ').replace(/\s+/g, ' ').replace(/\b(\w) (\w)\b/g, '$1$2').trim();
                    const note = below.filter(t => isNote(t.s) && t.y < price.y + 40).map(t => t.s).join(' · ');
                    const obj = await new Promise(resolve => page.objs.get(box.id, resolve));
                    // La foto se saca tal cual (sin la marca de agua) y, si es muy grande, se reduce a 1200 px.
                    const raw = document.createElement('canvas');
                    raw.width = obj.width;
                    raw.height = obj.height;
                    const rctx = raw.getContext('2d');
                    rctx.fillStyle = '#fff';
                    rctx.fillRect(0, 0, raw.width, raw.height);
                    if (obj.bitmap) rctx.drawImage(obj.bitmap, 0, 0);
                    else if (obj.data) {
                        const img = rctx.createImageData(obj.width, obj.height);
                        if (obj.data.length === obj.width * obj.height * 4) img.data.set(obj.data);
                        else for (let p = 0, q = 0; p < obj.width * obj.height; p++) { img.data[q++] = obj.data[p * 3]; img.data[q++] = obj.data[p * 3 + 1]; img.data[q++] = obj.data[p * 3 + 2]; img.data[q++] = 255; }
                        rctx.putImageData(img, 0, 0);
                    }
                    const scale = Math.min(1, 1200 / Math.max(raw.width, raw.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(raw.width * scale);
                    canvas.height = Math.round(raw.height * scale);
                    canvas.getContext('2d').drawImage(raw, 0, 0, canvas.width, canvas.height);
                    const imageBase64 = canvas.toDataURL('image/jpeg', 0.88);
                    // Una página repetida en el PDF no duplica los modelos.
                    if (products.some(p => p.name === name && p.imageBase64 === imageBase64)) continue;
                    products.push({ page: n, name, supplierPrice: Number(price.s.replace(/[^\d.,]/g, '').replace(',', '.')) || null, sizeNote: note, imageBase64 });
                }
            }
            return { pages: doc.numPages, products };
        }

        const SIZE_LABELS = { pequena: 'Pequeña', mediana: 'Mediana', grande: 'Grande' };

        function SupplierCatalogs({ canEdit, canConfigure }) {
            const [data, setData] = useState(null);

            const load = () => api('/api/social/suppliers').then(r => {

                    setPackagingTypes(p.packaging?.enabled ? (p.packaging.types || []) : []);
                    setUnit(p.sales?.unitSingular || '');

            const s = settings || data?.settings;

            const setPrice = (size, value) => setSettings({ ...s, sizePrices: { ...s.sizePrices, [size]: value } });

            async function saveSettings() {
                setBusy('settings');
                try {
                    setSettings((await api('/api/social/suppliers/settings', { method: 'PUT', body: JSON.stringify(s) })).settings);
                    setNotice('✅ Regla de precios guardada');
                } catch (e) {
                    setError(e.message);
                } finally {
                    setBusy('');
                }
            }

            async function importPdf() {
                if (!pdf) return;
                setBusy('import');
                setError('');
                setNotice('');
                try {
                    const read = await extractSupplierPdf(pdf, text => setNotice('📖 ' + text + '…'));
                    if (!read.products.length) throw new Error('No encontré modelos con foto, nombre y precio en este PDF');
                    // Por partes de 12: un catálogo grande no choca con el límite de tamaño de cada envío.
                    const r = { total: 0, added: 0, estimated: 0, withoutPrice: 0, catalog: null };
                    for (let i = 0; i < read.products.length; i += 12) {
                        setNotice(`💾 Guardando modelos ${i + 1}-${Math.min(i + 12, read.products.length)} de ${read.products.length}${s.autoAddToCatalog ? ' y agregándolos al Catálogo' : ''}…`);
                        const part = await api('/api/social/suppliers', { method: 'POST', body: JSON.stringify({ catalogId: r.catalog?.id, name: pdfName, fileName: pdf.name, pages: read.pages, products: read.products.slice(i, i + 12) }) });
                        r.catalog = part.catalog;
                        ['total', 'added', 'estimated', 'withoutPrice'].forEach(k => { r[k] += part[k]; });
                    }
                    setNotice(`✅ ${r.total} modelos leídos del PDF${r.added ? ` · ${r.added} agregados al Catálogo en ${r.catalog.name}` : ''}${r.estimated ? ` · ${r.estimated} con tamaño estimado (${SIZE_LABELS[s.defaultSize]}): revísalos abajo` : ''}${r.withoutPrice ? ` · ${r.withoutPrice} sin precio (completa la regla de precios)` : ''}.`);
                    setPdf(null);
                    setPdfName('');
                    setOpenCatalog(r.catalog.id);
                    load();
                } catch (e) {
                    setNotice('');
                    setError('No se pudo leer el PDF: ' + e.message);
                } finally {
                    setBusy('');
                }
            }

            async function patchProduct(product, changes) {
                try {
                    const updated = (await api('/api/social/suppliers/products/' + product.id, { method: 'PATCH', body: JSON.stringify(changes) })).product;
                    setData(d => ({ ...d, products: d.products.map(p => (p.id === updated.id ? updated : p)) }));
                } catch (e) {
                    setError(e.message);
                }
            }

            async function addToCatalog(ids) {
                setBusy('catalog');
                try {
                    const r = await api('/api/social/suppliers/to-catalog', { method: 'POST', body: JSON.stringify({ ids }) });
                    setNotice(`✅ ${r.added} agregado(s) al Catálogo${r.withoutPrice ? ` · ${r.withoutPrice} sin precio` : ''}${r.alreadyThere ? ` · ${r.alreadyThere} ya existían` : ''}.`);
                    load();
                } catch (e) {
                    setError(e.message);
                } finally {
                    setBusy('');
                }
            }

            async function removeCatalog(catalog) {
                if (!confirm(`¿Borrar el catálogo ${catalog.name} de esta lista? Lo que ya pasó al Catálogo se queda ahí.`)) return;
                try {
                    await api('/api/social/suppliers/' + catalog.id, { method: 'DELETE' });
                    setOpenCatalog(null);
                    load();
                } catch (e) {
                    setError(e.message);
                }
            }

            if (!data) return <section className="pb-card">{error ? <div className="pb-err">{error}</div> : <div className="pb-muted">Cargando…</div>}</section>;
            const priceOf = p => Number(s.sizePrices[p.size]) || 0;
            return (
                <>
                    <section className="pb-card">
                        <div className="pb-card-h">
                            <div className="pb-tile"><PlatIcon name="box" size={22} color="#4F5BD5" /></div>

                        </div>
                        {notice && <div className="pb-notice ok">{notice}</div>}
                        {error && <div className="pb-err" style={{ marginBottom: 12 }}>{error}</div>}
                        <div className="sp-grid">
                            <div className="sp-box">
                                <b>1. Tu regla de precios</b>
                                <small>Precio de venta {unit ? 'por ' + unit : ''} según el tamaño de la vela.</small>
                                <div className="sp-prices">
                                    {['pequena', 'mediana', 'grande'].map(size => (
                                        <label key={size}>
                                            <span>{SIZE_LABELS[size]}</span>
                                            <div className="sp-money">$<input type="number" min="0" step="0.5" inputMode="decimal" value={s.sizePrices[size] || ''} disabled={!canConfigure} onChange={e => setPrice(size, e.target.value)} /></div>
                                        </label>
                                    ))}
                                </div>
                                <div className="sp-row2">
                                    <label><span>Si el PDF no dice el tamaño</span>
                                        <select value={s.defaultSize} disabled={!canConfigure} onChange={e => setSettings({ ...s, defaultSize: e.target.value })}>
                                            {Object.entries(SIZE_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                        </select>
                                    </label>
                                    <label><span>Palabra antes del nombre</span>
                                        <input type="text" maxLength={20} placeholder="Ej: VELA" value={s.namePrefix} disabled={!canConfigure} onChange={e => setSettings({ ...s, namePrefix: e.target.value })} />
                                    </label>
                                    {packagingTypes.length > 0 && (
                                        <label><span>Empaque incluido</span>
                                            <select value={s.packaging} disabled={!canConfigure} onChange={e => setSettings({ ...s, packaging: e.target.value })}>
                                                <option value="">Sin definir</option>
                                                {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                                            </select>
                                        </label>
                                    )}
                                </div>
                                <label className="pb-toggle" style={{ marginTop: 8 }}>
                                    <input type="checkbox" checked={s.autoAddToCatalog} disabled={!canConfigure} onChange={e => setSettings({ ...s, autoAddToCatalog: e.target.checked })} />
                                    <span><b>Agregar al Catálogo automáticamente</b><small>Cada modelo del PDF entra al Catálogo apenas lo subes.</small></span>
                                </label>
                                {canConfigure && <button type="button" className="pb-btn main sm" style={{ marginTop: 10 }} disabled={busy === 'settings'} onClick={saveSettings}><PlatIcon name="save" size={16} color="#fff" /> {busy === 'settings' ? 'Guardando…' : 'Guardar regla'}</button>}
                            </div>
                            <div className="sp-box">
                                <b>2. Sube el PDF</b>
                                <small>Se leen solas las páginas con modelos (nombre, precio y foto); portada y políticas se saltan.</small>
                                {canEdit && (
                                    <>
                                        <label className="sp-drop">
                                            <PlatIcon name="doc" size={28} color="#4F5BD5" />
                                            <span>{pdf ? pdf.name : 'Elegir PDF del proveedor'}</span>
                                            <input type="file" accept="application/pdf" style={{ display: 'none' }} onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (f) { setPdf(f); setPdfName(catalogNameFromFile(f.name)); } }} />
                                        </label>
                                        {pdf && (
                                            <label className="sp-name"><span>Categoría en el Catálogo</span>
                                                <input type="text" maxLength={60} value={pdfName} onChange={e => setPdfName(e.target.value.toUpperCase())} />
                                            </label>
                                        )}
                                        {pdf && !pricesReady && s.autoAddToCatalog && <div className="pb-muted" style={{ color: '#B36B00' }}>Primero guarda los 3 precios de la regla: sin precio los modelos no pueden entrar al Catálogo.</div>}
                                        <button type="button" className="pb-btn main" disabled={!pdf || !pdfName.trim() || !!busy} onClick={importPdf}>
                                            ✨ {busy === 'import' ? 'Leyendo…' : s.autoAddToCatalog ? 'Leer y agregar al Catálogo' : 'Leer PDF'}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </section>

                    {data.catalogs.map(catalog => {
                        const models = data.products.filter(p => p.catalog_id === catalog.id);
                        const pending = models.filter(p => p.status !== 'en_catalogo');
                        const estimated = models.filter(p => p.size_estimated).length;
                        const isOpen = openCatalog === catalog.id;
                        return (
                            <section key={catalog.id} className="pb-card">
                                <div className="pb-card-h" style={{ cursor: 'pointer' }} onClick={() => setOpenCatalog(isOpen ? null : catalog.id)}>
                                    <div className="pb-tile"><PlatIcon name="layers" size={22} color="#4F5BD5" /></div>
                                    <div className="grow"><h2>{catalog.name}</h2><p>{models.length} modelos · {models.length - pending.length} en el Catálogo{estimated ? ` · ${estimated} con tamaño estimado` : ''} · {catalog.file_name}</p></div>
                                    <PbIcon name={isOpen ? 'back' : 'next'} size={20} color="#3A4570" />
                                </div>
                                {isOpen && (
                                    <>
                                        <div className="pb-actions" style={{ marginBottom: 12 }}>
                                            {canEdit && pending.length > 0 && <button type="button" className="pb-btn main sm" disabled={!!busy} onClick={() => addToCatalog(pending.map(p => p.id))}>Agregar los {pending.length} que faltan al Catálogo</button>}
                                            {canEdit && <button type="button" className="pb-btn sm danger" onClick={() => removeCatalog(catalog)}>Borrar de esta lista</button>}
                                        </div>
                                        <div className="sp-models">
                                            {models.map(p => (
                                                <div key={p.id} className={'sp-model' + (p.size_estimated ? ' est' : '')}>
                                                    {p.image_url ? <img src={p.image_url} alt="" loading="lazy" /> : <div className="noimg"><PlatIcon name="image" size={26} color="#9AA3C7" /></div>}
                                                    <b title={p.supplier_name}>{p.name}</b>
                                                    <small>{p.supplier_name}{p.supplier_price ? ` · proveedor $${Number(p.supplier_price).toFixed(2).replace(/\.00$/, '')}` : ''} · pág. {p.page}</small>
                                                    <div className="sp-size">
                                                        <select value={p.size} disabled={!canEdit} onChange={e => patchProduct(p, { size: e.target.value })} aria-label="Tamaño">
                                                            {Object.entries(SIZE_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                                        </select>
                                                        <span className="price">{priceOf(p) ? '$' + priceOf(p).toFixed(2).replace(/\.00$/, '') : 'Sin precio'}</span>
                                                    </div>
                                                    {p.size_estimated && <span className="sp-tag warn" title={p.size_note || 'El PDF no dice el tamaño'}>Tamaño estimado</span>}
                                                    {p.status === 'en_catalogo'
                                                        ? <span className="sp-tag ok">En el Catálogo</span>
                                                        : canEdit && <button type="button" className="pb-btn sm" disabled={!!busy} onClick={() => addToCatalog([p.id])}>Agregar al Catálogo</button>}
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </section>
                        );
                    })}
                </>
            );
        }

        const METRIC_LABELS = [['likes', '❤', 'Me gusta'], ['comments', '💬', 'Comentarios'], ['views', '👁', 'Visualizaciones'], ['reach', '📣', 'Alcance']];

                setData(null);

                            <div className="sr-totals">

                            </div>
                            {data.posts.length === 0 ? <div className="pb-posts-empty">Todavía no hay publicaciones en este período.</div> : (
                                <div className="sr-list">

                                        const first = postItems(post)[0];
                                        return (
                                            <div key={post.id} className="sr-post">

                                                            <div key={channel} className="sr-row">

                                    })}
