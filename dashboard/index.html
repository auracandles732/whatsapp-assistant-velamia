        const SOCIAL_PROMPT_TEMPLATE = [
            '# OBJETIVO',
            'Mantener activas nuestras redes (Instagram y Facebook) y que cada publicación invite a pedir por WhatsApp.',
            '',
            '# TONO',
            'Cálido, cercano y elegante, como una persona de la marca. Frases cortas y fáciles de leer.',
            '',
            '# QUÉ DESTACAR',
            '- Que nuestros productos se personalizan (nombres, colores, frases).',
            '- Para qué ocasión es ideal cada producto (baby shower, bautizo, boda, 15 años, cumpleaños, fechas especiales).',
            '- Que los pedidos son bajo reserva y hacemos envíos.',
            '',
            '# QUÉ EVITAR',
            '- Prometer fechas de entrega exactas.',
            '- Palabras en inglés y textos muy largos.',
            '- Repetir la misma frase de inicio en publicaciones seguidas.',
            '',
            '# HASHTAGS FIJOS (siempre incluirlos)',
            '#velaspersonalizadas #recuerdos #guayaquil',
            '',
            '# ESTILO DE FOTOS (para cuando se generen con IA)',
            'Fondo acorde a la ocasión, luz cálida, colores suaves, el producto siempre completo y como protagonista.'
        ].join('\n');

        // Clave de OpenAI y modelos propios del agente de redes (nunca los del asistente que responde los mensajes).
        function SocialBrainCard({ canConfigure }) {
            const [data, setData] = useState(null);
            const [form, setForm] = useState(null);
            const [key, setKey] = useState('');
            const [busy, setBusy] = useState('');
            const [msg, setMsg] = useState(null);
            const [error, setError] = useState('');
            useEffect(() => {
                api('/api/social/ai').then(r => { setData(r); setForm({ textModel: r.textModel, imageModel: r.imageModel, imageQuality: r.imageQuality, prompt: r.prompt || '' }); }).catch(e => setError(e.message));
            }, []);

            async function run(label, fn) {
                setBusy(label);
                setMsg(null);
                setError('');
                try {
                    await fn();
                } catch (e) {
                    setError(e.message);
                } finally {
                    setBusy('');
                }
            }
            const save = extra => run('save', async () => {
                const r = await api('/api/social/ai', { method: 'PUT', body: JSON.stringify({ ...form, apiKey: key, ...extra }) });
                setData(r);
                setKey('');
                setMsg({ ok: true, text: extra && extra.clearKey ? 'Clave quitada: el agente publica con textos de respaldo.' : '✅ Guardado' });
            });
            const test = () => run('test', async () => {
                if (key.trim()) await api('/api/social/ai', { method: 'PUT', body: JSON.stringify({ ...form, apiKey: key }) }).then(r => { setData(r); setKey(''); });
                const r = await api('/api/social/ai/test', { method: 'POST' });
                setMsg({ ok: r.ok, text: (r.ok ? '✅ ' : '⚠️ ') + r.detail });
            });

            if (!data || !form) return <section className="pb-card">{error ? <div className="pb-err">{error}</div> : <div className="pb-muted">Cargando…</div>}</section>;
            const noteOf = (list, id) => (list.find(x => x.id === id) || {}).note || '';
            const promptMax = data.promptMax || 4000;
            const useTemplate = () => {
                if (form.prompt.trim() && !confirm('¿Reemplazar lo que escribiste por la plantilla?')) return;
                setForm({ ...form, prompt: SOCIAL_PROMPT_TEMPLATE });
            };
            return (
                <section className="pb-card">
                    <div className="pb-card-h">
                        <div className="pb-tile"><PlatIcon name="robot" size={22} color="#4F5BD5" /></div>
                        <div className="grow"><h2>Cerebro del agente de redes</h2><p>Su propia clave de OpenAI y sus propios modelos, separados del asistente que responde los mensajes. La clave se guarda cifrada.</p></div>
                    </div>
                    <div className={'pb-notice' + (data.configured ? ' ok' : '')} style={data.configured ? undefined : { background: '#FFF3DC', color: '#7A5300' }}>
                        {data.configured ? `🔑 Clave guardada (${data.keyHint}). El agente escribe con ${data.textModel}.` : '⚠️ Todavía sin clave: el agente publica con textos de respaldo (sin IA) hasta que la agregues.'}
                    </div>
                    <div className="sb-grid">
                        <label className="sb-f wide">
                            <span>Clave de OpenAI del agente</span>
                            <input type="password" autoComplete="off" spellCheck="false" disabled={!canConfigure} placeholder={data.configured ? 'Pega una clave nueva solo si quieres cambiarla' : 'sk-...'} value={key} onChange={e => setKey(e.target.value)} />
                            <small>Créala en platform.openai.com → API keys (puede ser de otra cuenta o proyecto, con sus propios créditos).</small>
                        </label>
                        <label className="sb-f wide">
                            <span className="sb-lab">Instrucciones del agente (prompt) {canConfigure && <button type="button" className="pb-btn sm" onClick={useTemplate}>Usar plantilla</button>}</span>
                            <textarea className="sb-prompt" maxLength={promptMax} disabled={!canConfigure} value={form.prompt} onChange={e => setForm({ ...form, prompt: e.target.value })}
                                placeholder={'# OBJETIVO\nMantener activas las redes y atraer pedidos por WhatsApp.\n\n# TONO\nCálido y cercano, frases cortas.\n\n# QUÉ DESTACAR\n- ...\n\n# QUÉ EVITAR\n- ...\n\n# HASHTAGS FIJOS\n#...'} />
                            <small>Separado de las instrucciones del asistente de WhatsApp. Guía el tono, el objetivo y qué decir en cada publicación (y, cuando las activemos, el estilo de las fotos). Los precios y productos siempre salen del Catálogo. {form.prompt.length}/{promptMax}</small>
                        </label>
                        <label className="sb-f">
                            <span>Cerebro (decide y escribe los textos)</span>
                            <select value={form.textModel} disabled={!canConfigure} onChange={e => setForm({ ...form, textModel: e.target.value })}>
                                {data.options.textModels.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                            </select>
                            <small>{noteOf(data.options.textModels, form.textModel)}</small>
                        </label>
                        <label className="sb-f">
                            <span>Modelo de fotos</span>
                            <select value={form.imageModel} disabled={!canConfigure} onChange={e => setForm({ ...form, imageModel: e.target.value })}>
                                {data.options.imageModels.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                            </select>
                            <small>{noteOf(data.options.imageModels, form.imageModel)}</small>
                        </label>
                        <label className="sb-f">
                            <span>Calidad de las fotos</span>
                            <select value={form.imageQuality} disabled={!canConfigure} onChange={e => setForm({ ...form, imageQuality: e.target.value })}>
                                {data.options.imageQualities.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                            </select>
                            <small>{noteOf(data.options.imageQualities, form.imageQuality)} · las fotos con IA se activan en el siguiente paso</small>
                        </label>
                    </div>
                    {error && <div className="pb-err" style={{ margin: '10px 0' }}>{error}</div>}
                    {msg && <div className={'pb-notice' + (msg.ok ? ' ok' : '')} style={msg.ok ? { marginTop: 10 } : { marginTop: 10, background: '#FDECEC', color: '#B42318' }}>{msg.text}</div>}
                    {canConfigure ? (
                        <div className="pb-actions" style={{ marginTop: 12 }}>
                            <button type="button" className="pb-btn main sm" disabled={!!busy} onClick={() => save()}>{busy === 'save' ? 'Guardando…' : 'Guardar'}</button>
                            <button type="button" className="pb-btn sm" disabled={!!busy || (!data.configured && !key.trim())} onClick={test}>{busy === 'test' ? 'Probando…' : 'Probar clave'}</button>
                            {data.configured && <button type="button" className="pb-btn sm danger" disabled={!!busy} onClick={() => { if (confirm('¿Quitar la clave del agente de redes? Publicará con textos de respaldo hasta que pongas otra.')) save({ clearKey: true }); }}>Quitar clave</button>}
                        </div>
                    ) : <p className="pb-muted" style={{ marginTop: 10 }}>Solo el dueño puede cambiar la clave y los modelos.</p>}
                </section>
            );
        }

        function PostsView({ canEdit, canConfigure, isAdmin }) {
            const mobile = useMobile();
            const [view, setView] = useState('home');
            const [mode, setMode] = useState('week');
            const [anchor, setAnchor] = useState(() => mondayOf(pbToday()));
            const [data, setData] = useState(null);
            const [posts, setPosts] = useState([]);
            const [error, setError] = useState('');
            const [settings, setSettings] = useState(null);
            const [savedMsg, setSavedMsg] = useState('');
            const [busy, setBusy] = useState('');
            const [notice, setNotice] = useState(null);
            const [editing, setEditing] = useState(null);
            const [creating, setCreating] = useState(null);
            const [selDay, setSelDay] = useState(pbToday());
            // Área del agente de redes: calendario, biblioteca, proveedores o resultados.
            const [area, setArea] = useState('calendario');
            const cardRefs = useRef({});

            const gridStart = mode === 'month' ? monthGridStart(anchor) : anchor;
            const load = () => {
                const from = fromTzInput(`${addDays(gridStart, -1)}T00:00`);

                return api(`/api/posts?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`).then(d => {
                    setData(d);
                    setPosts((d.posts || []).filter(p => p.status !== 'cancelled'));
                    if (d.settings) setSettings(prev => prev || d.settings);
                    setError('');
                    return d;
                }).catch(e => setError(e.message));
            };
            useEffect(() => { load(); }, [gridStart, mode]);

            if (!data) return error ? <div className="pb"><div className="pb-err">{error}</div></div> : <NexlyLoading text="Cargando publicaciones…" />;

            const hero = (withActions) => (
                <div className="pb-hero">
                    <div className="pb-hero-ic"><PlatIcon name="calendar" size={30} color="#fff" /></div>
                    <div className="pb-hero-tt">
                        <h1>Publicaciones</h1>
                        <p>Programa y publica contenido en Instagram y Facebook. En modo automático la IA prepara y publica tu semana con las fotos y precios de tu catálogo.</p>
                    </div>
                    {withActions && canEdit && (
                        <div className="pb-hero-actions">
                            <button type="button" className="pb-btn" onClick={() => setCreating({})}><PlatIcon name="plus" size={20} color="#2F3A8F" /> Nueva publicación</button>
                            <button type="button" className="pb-btn main" disabled={busy === 'plan'} onClick={plan}>✨ {busy === 'plan' ? 'Preparando…' : 'Preparar próximos 7 días'}</button>
                        </div>
                    )}
                    <PbHeroArt className="pb-hero-art" />
                </div>
            );

            if (!data.enabled) {
                return (
                    <div className="pb">
                        {hero(false)}
                        <section className="pb-card">
                            <div className="pb-card-h">
                                <div className="pb-tile"><PlatIcon name="sparkle" size={22} color="#4F5BD5" /></div>
                                <div className="grow"><h2>Publicaciones automáticas en Instagram y Facebook</h2><p>Servicio adicional</p></div>
                            </div>
                            <ul style={{ margin: 0, paddingLeft: '20px', fontSize: '14.5px', lineHeight: 1.8, color: '#2A3766' }}>
                                <li>Prepara cada semana tus publicaciones con las fotos y precios de tu catálogo.</li>
                                <li>Escribe los textos y hashtags con el tono de tu negocio.</li>
                                <li>Tú las programas (o la IA en modo automático) y puedes cambiarlas antes de que salgan.</li>
                                <li>Se publican solas en Instagram (publicación e historia) y en tu página de Facebook.</li>
                            </ul>
                            <p className="pb-muted" style={{ marginTop: '14px' }}>{isAdmin ? 'Actívalo para esta empresa en la pantalla de Empresas.' : 'Pide que lo activen para tu empresa.'}</p>
                        </section>
                    </div>
                );
            }

            const s = settings || data.settings;
            const setS = changes => { setSettings({ ...s, ...changes }); setSavedMsg(''); };
            const removePost = id => setPosts(list => list.filter(p => p.id !== id));
            const replacePost = updated => {
                if (!updated) return;
                setPosts(list => list.map(p => (p.id === updated.id ? updated : p)));
                setEditing(current => (current && current.id === updated.id ? updated : current));
            };
            const today = pbToday();
            const byDay = {};
            [...posts].sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at)).forEach(p => { (byDay[dayOf(p.scheduled_at)] = byDay[dayOf(p.scheduled_at)] || []).push(p); });
            const weekDays = Array.from({ length: 7 }, (_, i) => addDays(anchor, i));
            const now = Date.now();
            const st = data.status || {};

            async function saveSettings(next = s) {
                setBusy('settings');
                try {
                    const r = await api('/api/posts/settings', { method: 'PUT', body: JSON.stringify(next) });
                    setSettings(r.settings);
                    setData(d => ({ ...d, settingsSaved: true }));
                    setSavedMsg('✅ Guardado');
                    if (r.created) {
                        setNotice({ ok: true, text: `🤖 La IA programó ${r.created} publicación(es) para los próximos 7 días. Saldrán solas a su hora.` });
                        await load();
                    }
                } catch (e) {
                    alert('No se pudo guardar: ' + e.message);
                } finally {
                    setBusy('');
                }
            }

            // El modo automático se guarda al tocarlo: al encenderlo la IA programa de una vez la semana.
            function setAuto(on) {
                const next = { ...s, autoPlan: on };
                if (on && !next.days.length) return alert('Elige al menos un día de publicación');
                setSettings(next);
                saveSettings(next).then(() => { if (!on) setNotice({ ok: true, text: 'Modo automático apagado: solo sale lo que programes tú.' }); });
            }

            async function plan() {
                setBusy('plan');
                setNotice(null);
                try {
                    const r = await api('/api/posts/plan', { method: 'POST' });
                    setNotice(r.created.length
                        ? { ok: true, text: `Listo: se programaron ${r.created.length} publicación(es). Saldrán solas a su hora (puedes cambiarlas antes).` }
                        : { ok: true, text: 'Los próximos 7 días ya tienen sus publicaciones (o no hay días de publicación elegidos).' });
                    if (mode !== 'week' || anchor !== mondayOf(pbToday())) {
                        setMode('week');
                        setAnchor(mondayOf(pbToday()));
                    } else {
                        await load();
                    }
                } catch (e) {
                    setNotice({ ok: false, text: 'No se pudo preparar: ' + e.message });
                } finally {
                    setBusy('');
                }
            }

            async function connect() {
                const win = window.open('about:blank', 'conectar-facebook', 'width=620,height=760');
                setBusy('connect');
                try {
                    const { url } = await api('/api/meta/connect-url');
                    if (!win) { window.location.href = url; return; }
                    win.location.href = url;
                    const before = JSON.stringify(data.status);
                    const started = Date.now();
                    const timer = setInterval(async () => {
                        const fresh = await api('/api/posts').catch(() => null);
                        if (fresh && (JSON.stringify(fresh.status) !== before || Date.now() - started > 5 * 60 * 1000)) {
                            clearInterval(timer);
                            setData(d => ({ ...d, status: fresh.status }));
                            setBusy('');
                        }
                    }, 4000);
                } catch (e) {
                    if (win) win.close();
                    alert(e.message);
                    setBusy('');
                }
            }

            async function quick(post, action) {
                try {
                    const patch = body => api(`/api/posts/${post.id}`, { method: 'PATCH', body: JSON.stringify(body) }).then(r => r.post);
                    if (action === 'cancel') {
                        if (!confirm('¿Eliminar esta publicación? Se borra del calendario y ese día queda libre.')) return;
                        await api(`/api/posts/${post.id}`, { method: 'DELETE' });
                        removePost(post.id);
                        setNotice({ ok: true, text: s.autoPlan ? 'Publicación eliminada. En modo automático la IA puede preparar otra para ese día.' : 'Publicación eliminada.' });
                    }
                    if (action === 'publish') {
                        const where = post.channels.map(c => POST_CHANNEL_NAMES[c]).join(', ');
                        if (!confirm(`¿Publicar ahora en ${where}? Se verá de inmediato en tus redes.`)) return;
                        setNotice({ ok: true, text: 'Publicando…' });
                        const done = (await api(`/api/posts/${post.id}/publish`, { method: 'POST' })).post;
                        replacePost(done);
                        setNotice(done.status === 'published' ? { ok: true, text: '¡Publicada!' } : { ok: false, text: done.error || 'No se publicó' });
                    }
                } catch (e) {
                    setNotice({ ok: false, text: e.message });
                }
            }

            const postMenu = post => {
                const editable = canEdit && EDITABLE_POST.includes(post.status);
                return [
                    { label: editable ? 'Editar' : 'Ver detalle', onClick: () => setEditing(post) },
                    editable && { label: 'Publicar ahora', onClick: () => quick(post, 'publish') },
                    editable && { label: 'Eliminar', danger: true, onClick: () => quick(post, 'cancel') }
                ];
            };

            const shift = n => {
                if (mode === 'month') setAnchor(addMonths(anchor, n));
                else {
                    const next = addDays(anchor, 7 * n);
                    setAnchor(next);
                    setSelDay(next <= today && today <= addDays(next, 6) ? today : next);
                }
            };
            const toggleMode = () => {
                if (mode === 'week') { setMode('month'); setAnchor(monthStart(anchor)); }
                else { setMode('week'); setAnchor(mondayOf(anchor <= today && today < addMonths(anchor, 1) ? today : anchor)); }
            };

            const channelInfo = [
                {
                    net: 'instagram', name: 'Instagram',
                    sub: st.instagramUsername ? `@${st.instagramUsername}` : st.instagram ? 'Cuenta conectada' : 'Sin cuenta conectada',
                    state: st.instagramAllowed ? 'ok' : st.connected ? 'warn' : 'off',
                    text: st.instagramAllowed ? 'Conectado' : !st.connected ? 'Sin conectar' : st.instagram ? 'Falta permiso' : 'Sin Instagram profesional'
                },
                {
                    net: 'facebook', name: 'Facebook',
                    sub: st.pageName || (st.connected ? 'Tu página' : 'Sin página conectada'),
                    state: st.facebookAllowed ? 'ok' : st.connected ? 'warn' : 'off',
                    text: st.facebookAllowed ? 'Conectado' : st.connected ? 'Falta permiso' : 'Sin conectar'
                }
            ];
            const channelsCard = (
                <section className="pb-card">
                    <div className="pb-card-h">
                        <div className="pb-tile"><PbIcon name="link" size={22} color="#4F5BD5" /></div>
                        <div className="grow"><h2>Canales conectados</h2><p>Estas son tus redes sociales enlazadas con NEXLY.</p></div>
                        {canConfigure && <button type="button" className="pb-btn sm" disabled={busy === 'connect'} onClick={connect}><PlatIcon name="gear" size={17} color="#2F3A8F" /> {busy === 'connect' ? 'Esperando a Facebook…' : 'Administrar conexión'}</button>}
                    </div>
                    {st.error && <div className="pb-err" style={{ marginBottom: '12px' }}>La conexión no funciona: {st.error}</div>}
                    <div className="pb-channels">
                        {channelInfo.map(ch => (
                            <div className="pb-channel" key={ch.net}>
                                <PbNetLogo net={ch.net} size={44} />
                                <div className="who"><div className="nm">{ch.name}</div><div className="sub">{ch.sub}</div></div>
                                <span className={'pb-state ' + ch.state}>{ch.text}</span>
                                <PbMenu items={[canConfigure && { label: st.connected ? 'Volver a conectar' : 'Conectar con Facebook', onClick: connect }]} />
                            </div>
                        ))}
                    </div>
                </section>
            );

            const notices = (
                <>
                    {notice && <div className={'pb-notice' + (notice.ok ? ' ok' : '')} style={notice.ok ? undefined : { background: '#FDECEC', color: '#B42318' }}>{notice.text}</div>}
                    {canEdit && (
                        <div className={'pb-auto' + (s.autoPlan ? ' on' : '')}>
                            <span className="ic"><PlatIcon name="robot" size={24} color={s.autoPlan ? '#fff' : '#4F5BD5'} /></span>
                            <div className="tt">
                                <b>{s.autoPlan ? 'Modo automático activado' : 'Modo automático con IA'}</b>
                                <small>{s.autoPlan ? 'La IA elige los productos, escribe los textos y publica sola en tus días y horas.' : canConfigure ? 'Actívalo y la IA prepara y publica sola tus publicaciones cada semana.' : 'Solo el dueño puede activarlo.'}</small>
                            </div>
                            {canConfigure && <label className="pb-toggle" aria-label="Modo automático con IA"><input type="checkbox" checked={!!s.autoPlan} disabled={busy === 'settings'} onChange={e => setAuto(e.target.checked)} /></label>}
                        </div>
                    )}
                </>
            );

            const thumb = post => {
                const items = postItems(post);
                return (
                    <button type="button" className="pb-thumb" onClick={() => setEditing(post)} aria-label={'Ver ' + (items[0] ? items[0].name : 'publicación')}>
                        <PbMediaThumb item={items[0]} />
                        <span className={'pb-st ' + post.status}>{POST_STATUS[post.status]}</span>
                        {items[0]?.type === 'video' && <span className="more" style={{ left: 6, right: 'auto' }}>▶ Video</span>}
                        {items.length > 1 && <span className="more">+{items.length - 1}</span>}
                    </button>
                );
            };
            const nets = post => {
                const n = postNets(post);
                return <div className="pb-nets">{n.ig && <PbNetLogo net="instagram" size={20} />}{n.fb && <PbNetLogo net="facebook" size={20} />}</div>;
            };
            const nameOf = post => (post.products[0] ? niceName(post.products[0].name) : post.media && post.media.length ? post.theme || 'Biblioteca' : 'Sin foto');
            const canAddOn = day => canEdit && day >= today;

            const modals = (
                <>
                    {editing && <PbPostEditor post={editing} canEdit={canEdit} onChanged={replacePost} onDeleted={removePost} onClose={() => setEditing(null)} />}
                    {creating && <PbNewPost settings={s} day={creating.day} onClose={() => setCreating(null)} onCreated={post => { setCreating(null); setPosts(list => [...list, post]); setNotice({ ok: true, text: 'Publicación programada: saldrá sola a su hora.' }); }} />}
                </>
            );

            // Biblioteca, proveedores y resultados: las otras áreas del agente de redes.
            if (area !== 'calendario') {
                const areaView = area === 'biblioteca' ? <SocialLibrary canEdit={canEdit} /> : area === 'proveedores' ? <SupplierCatalogs canEdit={canEdit} canConfigure={canConfigure} /> : area === 'cerebro' ? <SocialBrainCard canConfigure={canConfigure} /> : <SocialResults />;
                return (
                    <div className="pb">
                        {mobile
                            ? <button type="button" className="pb-backlink" onClick={() => { setArea('calendario'); window.scrollTo(0, 0); }}><PbIcon name="back" size={18} /> Publicaciones</button>
                            : <>{hero(true)}<PbAreaTabs area={area} setArea={setArea} /></>}
                        {areaView}
                        {modals}
                    </div>
                );
            }

            // ---------- Celular ----------
            if (mobile) {
                const goTo = v => { setView(v); window.scrollTo(0, 0); };
                if (view === 'posts') {
                    cardRefs.current = {};
                    const weekPosts = weekDays.flatMap(day => byDay[day] || []);
                    const pickDay = day => {
                        setSelDay(day);
                        const el = cardRefs.current[day];
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    };
                    return (
                        <div className="pb">
                            <div className="pb-mhead">
                                <button type="button" className="pb-back" aria-label="Volver" onClick={() => goTo('home')}><PbIcon name="back" size={24} color="#141C3A" /></button>
                                <div className="pb-tile"><PlatIcon name="calendar" size={22} color="#4F5BD5" /></div>
                                <div><h2>Próximas publicaciones</h2><p>Hora de {tzCity()} · {weekLabel(anchor)}</p></div>
                            </div>
                            <div className="pb-weekrow">
                                <button type="button" className="pb-arrow" aria-label="Semana anterior" onClick={() => shift(-1)}><PbIcon name="back" size={18} /></button>
                                <div className="pb-daystrip">
                                    {weekDays.map(day => (
                                        <button key={day} type="button" className={'pb-daypill' + (day === selDay ? ' on' : '')} onClick={() => pickDay(day)}>
                                            {DAY_SHORT[weekdayOf(day)]}<b>{dayParts(day).d}</b><i className={(byDay[day] || []).length ? 'has' : ''} />
                                        </button>
                                    ))}
                                </div>
                                <button type="button" className="pb-arrow" aria-label="Semana siguiente" onClick={() => shift(1)}><PbIcon name="next" size={18} /></button>
                            </div>
                            {notices}
                            <div className="pb-mlist">
                                {weekPosts.length === 0 && <div className="pb-muted" style={{ textAlign: 'center', padding: '12px' }}>No hay publicaciones esta semana.</div>}
                                {weekPosts.map(post => {
                                    const day = dayOf(post.scheduled_at);
                                    return (
                                        <div key={post.id} className={'pb-mpost' + (post.status === 'cancelled' ? ' off' : '')} ref={el => { if (el && !cardRefs.current[day]) cardRefs.current[day] = el; }}>
                                            <div className="when">
                                                {DAY_SHORT[weekdayOf(day)]}<br />{dayParts(day).d} {MONTH_SHORT[dayParts(day).m - 1]}
                                                <div className="pb-time"><PlatIcon name="clock" size={12} color="#4A5582" /> {timeOf(post.scheduled_at)}</div>
                                            </div>
                                            {thumb(post)}
                                            <div className="info">
                                                <button type="button" className="pb-post-name" onClick={() => setEditing(post)}>{nameOf(post)}</button>
                                                <div className="pb-post-theme">{post.theme}</div>
                                                {nets(post)}
                                            </div>
                                            <PbMenu items={postMenu(post)} />
                                        </div>
                                    );
                                })}
                                {canAddOn(selDay) && (
                                    <button type="button" className="pb-add wide" onClick={() => setCreating({ day: selDay })}>
                                        <span className="plus"><PlatIcon name="plus" size={18} color="#4F5BD5" /></span>Agregar publicación
                                    </button>
                                )}
                            </div>
                            {modals}
                        </div>
                    );
                }
                if (view === 'settings') {
                    return (
                        <div className="pb">
                            <div className="pb-mhead">
                                <button type="button" className="pb-back" aria-label="Volver" onClick={() => goTo('home')}><PbIcon name="back" size={24} color="#141C3A" /></button>
                                <div className="pb-tile"><PlatIcon name="gear" size={22} color="#4F5BD5" /></div>
                                <div><h2>Cómo publicar</h2><p>Configura la programación y preferencias del asistente.</p></div>
                            </div>
                            <PbSettings s={s} setS={setS} canConfigure={canConfigure} mobile onSave={() => saveSettings()} onAuto={setAuto} saving={busy === 'settings'} savedMsg={savedMsg} />
                        </div>
                    );
                }
                const weekCount = weekDays.reduce((n, day) => n + (byDay[day] || []).filter(p => p.status !== 'cancelled').length, 0);
                return (
                    <div className="pb">
                        {hero(true)}
                        {notices}
                        {channelsCard}
                        <button type="button" className="pb-navcard" onClick={() => goTo('posts')}>
                            <div className="pb-tile"><PlatIcon name="calendar" size={22} color="#4F5BD5" /></div>
                            <div className="tt"><b>Próximas publicaciones</b><span>{weekCount} esta semana{s.autoPlan ? ' · modo automático' : ''}</span></div>
                            <PbIcon name="next" size={20} color="#3A4570" />
                        </button>
                        <button type="button" className="pb-navcard" onClick={() => goTo('settings')}>
                            <div className="pb-tile"><PlatIcon name="gear" size={22} color="#4F5BD5" /></div>
                            <div className="tt"><b>Cómo publicar</b><span>Días, hora, redes y textos</span></div>
                            <PbIcon name="next" size={20} color="#3A4570" />
                        </button>
                        {[['biblioteca', 'image', 'Biblioteca', 'Tus fotos y videos para redes'], ['proveedores', 'box', 'Proveedores', 'Sube un PDF y pasa sus modelos al Catálogo'], ['resultados', 'chart', 'Resultados', 'Me gusta, comentarios, visualizaciones y alcance'], ['cerebro', 'robot', 'Cerebro IA', 'Clave y modelos propios del agente']].map(([id, icon, title, sub]) => (
                            <button key={id} type="button" className="pb-navcard" onClick={() => { setArea(id); window.scrollTo(0, 0); }}>
                                <div className="pb-tile"><PlatIcon name={icon} size={22} color="#4F5BD5" /></div>
                                <div className="tt"><b>{title}</b><span>{sub}</span></div>
                                <PbIcon name="next" size={20} color="#3A4570" />
                            </button>
                        ))}
                        {modals}
                    </div>
                );
            }

            // ---------- Computadora ----------
            const monthCells = [];
            if (mode === 'month') {
                const start = monthGridStart(anchor);
                const month = dayParts(anchor).m;
                const weeks = addDays(start, 35) < addMonths(anchor, 1) ? 6 : 5;
                for (let i = 0; i < weeks * 7; i++) monthCells.push(addDays(start, i));
                monthCells.month = month;
            }
            return (
                <div className="pb">
                    {hero(true)}
                    <PbAreaTabs area={area} setArea={setArea} />
                    {notices}
                    {channelsCard}

                    <section className="pb-card">
                        <div className="pb-card-h">
                            <div className="pb-tile"><PlatIcon name="calendar" size={22} color="#4F5BD5" /></div>
                            <div className="grow" style={{ display: 'flex', alignItems: 'baseline', gap: '14px', flexWrap: 'wrap' }}>
                                <h2>Próximas publicaciones</h2><span className="pb-muted">Hora de {tzCity()}</span>
                            </div>
                            <div className="pb-weeknav">
                                <button type="button" className="pb-arrow" aria-label={mode === 'month' ? 'Mes anterior' : 'Semana anterior'} onClick={() => shift(-1)}><PbIcon name="back" size={18} /></button>
                                <span className="pb-range">{mode === 'month' ? monthLabel(anchor) : weekLabel(anchor)}</span>
                                <button type="button" className="pb-arrow" aria-label={mode === 'month' ? 'Mes siguiente' : 'Semana siguiente'} onClick={() => shift(1)}><PbIcon name="next" size={18} /></button>
                                <button type="button" className="pb-btn sm" onClick={toggleMode}><PlatIcon name="calendar" size={17} color="#2F3A8F" /> {mode === 'month' ? 'Ver semana' : 'Ver calendario'}</button>
                            </div>
                        </div>

                        {mode === 'week' ? (
                            <div className="pb-week">
                                {weekDays.map(day => {
                                    const list = byDay[day] || [];
                                    return (
                                        <div key={day} className={'pb-day' + (day === today ? ' today' : '')}>
                                            <div className="d">{pbDayLabel(day)}</div>
                                            {list.map(post => (
                                                <div key={post.id} className={'pb-slot' + (post.status === 'cancelled' ? ' off' : '')}>
                                                    <div className="pb-slot-h"><span className="t">{timeOf(post.scheduled_at)}</span><PbMenu items={postMenu(post)} /></div>
                                                    {thumb(post)}
                                                    <div>
                                                        <button type="button" className="pb-post-name" onClick={() => setEditing(post)}>{nameOf(post)}</button>
                                                        <div className="pb-post-theme">{post.theme}</div>
                                                    </div>
                                                    {nets(post)}
                                                </div>
                                            ))}
                                            {list.length === 0 && (canAddOn(day)
                                                ? <button type="button" className="pb-add" onClick={() => setCreating({ day })}><span className="plus"><PlatIcon name="plus" size={18} color="#4F5BD5" /></span>Agregar publicación</button>
                                                : <div className="pb-none">Sin publicación</div>)}
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="pb-month">
                                {WEEK_DAYS.map(([d, label]) => <div key={d} className="wd">{label}</div>)}
                                {monthCells.map(day => (
                                    <button key={day} type="button" className={'pb-mday' + (dayParts(day).m !== monthCells.month ? ' out' : '') + (day === today ? ' today' : '')}
                                        onClick={() => { setMode('week'); setAnchor(mondayOf(day)); setSelDay(day); }}>
                                        <span className="n">{dayParts(day).d}</span>
                                        <span className="pics">
                                            {(byDay[day] || []).slice(0, 4).map(p => { const first = postItems(p)[0]; return first && (first.type === 'video' ? <video key={p.id} src={first.url + '#t=0.5'} muted preload="metadata" className={p.status} title={`${timeOf(p.scheduled_at)} · ${POST_STATUS[p.status]}`} /> : <img key={p.id} src={first.url} alt="" className={p.status} title={`${timeOf(p.scheduled_at)} · ${POST_STATUS[p.status]}`} />); })}
                                        </span>
                                    </button>
                                ))}
                            </div>
                        )}
                    </section>

                    <section className="pb-card">
                        <div className="pb-card-h">
                            <div className="pb-tile"><PlatIcon name="gear" size={22} color="#4F5BD5" /></div>
                            <div className="grow"><h2>Cómo publicar</h2><p>{data.settingsSaved ? 'Configura la programación y preferencias del asistente.' : 'Guárdalo para que el asistente prepare la semana solo.'}</p></div>
                        </div>
                        <PbSettings s={s} setS={setS} canConfigure={canConfigure} onSave={() => saveSettings()} onAuto={setAuto} saving={busy === 'settings'} savedMsg={savedMsg} />
                    </section>
                    {modals}
                </div>
            );
        }

        // TikTok: el botón queda visible pero inactivo hasta que TikTok apruebe los permisos de mensajes y comentarios.
        function TikTokConnect() {
            return (
                <>
                    <p className="hint">Cuando esté activo, el asistente responderá los mensajes privados de tu cuenta de empresa de TikTok y los comentarios de tus videos, igual que en Instagram: a quien pregunta le responde corto en el comentario y sigue la venta por mensaje privado. Todo llega a este mismo CRM.</p>
                    <div style={{ margin: '8px 0 12px', fontSize: '14px' }}>
                        <div style={{ display: 'flex', gap: '8px', padding: '6px 0', borderBottom: '1px solid #EEF1F8' }}>
                            <span style={{ color: '#6B7599', minWidth: '130px' }}>Estado</span>
                            <span style={{ fontWeight: 600 }}>Esperando la aprobación de TikTok</span>
                        </div>
                    </div>
                    <div className="settings-actions">
                        <span className="save-status"></span>
                        <button type="button" className="btn-save-prompt" disabled title="Se activa cuando TikTok apruebe los permisos">Conectar con TikTok</button>
                    </div>
                </>
            );
        }

        function ConsumptionView() {
            const [usage, setUsage] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setLoading(true);
                api('/api/me/usage?days=7')
                    .then(data => setUsage(data))
                    .catch(err => console.error('Error cargando consumo:', err))
                    .finally(() => setLoading(false));
            }, []);

            if (loading) return <div style={{ padding: '40px', textAlign: 'center' }}>Cargando consumo...</div>;
            if (!usage) return <div style={{ padding: '40px', textAlign: 'center' }}>Error al cargar el consumo</div>;

            const purposeLabels = { respuesta: 'Respuestas', foto: 'Fotos', audio: 'Audio', pedido: 'Pedidos', otro: 'Otro' };

            return (
                <div style={{ padding: '20px', maxWidth: '1200px', margin: '0 auto' }}>
                    <h2>📊 Consumo de IA — Últimos 7 Días</h2>
                    {usage.byDay && Object.keys(usage.byDay).length > 0 && (
                        <p style={{ fontSize: '13px', color: '#9C8880', marginTop: '6px' }}>
                            El CRM mide desde el {Object.keys(usage.byDay).sort()[0].split('-').reverse().join('/')}: lo gastado antes de esa fecha solo aparece en OpenAI.
                        </p>
                    )}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginTop: '20px' }}>
                        <div style={{ background: '#F0DAD3', padding: '20px', borderRadius: '8px', textAlign: 'center' }}>
                            <div style={{ fontSize: '12px', color: '#9C5740', fontWeight: 600 }}>Total Llamadas</div>
                            <div style={{ fontSize: '32px', fontWeight: 700, color: '#B96B4F' }}>{usage.week?.calls || 0}</div>
                        </div>
                        <div style={{ background: '#A8C5D6', padding: '20px', borderRadius: '8px', textAlign: 'center' }}>
                            <div style={{ fontSize: '12px', color: '#4A6B7A', fontWeight: 600 }}>Tokens (entrada)</div>
                            <div style={{ fontSize: '28px', fontWeight: 700, color: '#3A5A6B' }}>{(usage.week?.input || 0).toLocaleString()}</div>
                        </div>
                        <div style={{ background: '#A8D5BA', padding: '20px', borderRadius: '8px', textAlign: 'center' }}>
                            <div style={{ fontSize: '12px', color: '#4A6B4A', fontWeight: 600 }}>Tokens (salida)</div>
                            <div style={{ fontSize: '28px', fontWeight: 700, color: '#3A5A3B' }}>{(usage.week?.output || 0).toLocaleString()}</div>
                        </div>
                        <div style={{ background: '#E8C88A', padding: '20px', borderRadius: '8px', textAlign: 'center' }}>
                            <div style={{ fontSize: '12px', color: '#8B6B2F', fontWeight: 600 }}>Costo USD</div>
                            <div style={{ fontSize: '32px', fontWeight: 700, color: '#9C7A2F' }}>${(usage.week?.cost || 0).toFixed(2)}</div>
                        </div>
                    </div>

                    <div style={{ marginTop: '40px' }}>
                        <h3>Desglose por Tipo de Uso</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '12px', marginTop: '12px' }}>
                            {usage.byPurpose && Object.entries(usage.byPurpose).map(([purpose, data]) => (
                                <div key={purpose} style={{ background: '#F7EFEA', padding: '12px', borderRadius: '6px', border: '1px solid #E3B7AC' }}>
                                    <div style={{ fontSize: '11px', color: '#9C8880', fontWeight: 600 }}>{purposeLabels[purpose] || purpose}</div>
                                    <div style={{ fontSize: '16px', fontWeight: 700, color: '#4A3B35', marginTop: '4px' }}>{data.calls} llamadas</div>
                                    <div style={{ fontSize: '12px', color: '#9C8880', marginTop: '4px' }}>${data.cost.toFixed(2)}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{ marginTop: '40px' }}>
                        <h3>Desglose por Día</h3>
                        <div style={{ overflowX: 'auto' }}>
                            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                                <thead>
                                    <tr style={{ borderBottom: '2px solid #E3B7AC' }}>
                                        <th style={{ padding: '10px', textAlign: 'left', fontWeight: 600, color: '#4A3B35' }}>Fecha</th>
                                        <th style={{ padding: '10px', textAlign: 'center', fontWeight: 600, color: '#4A3B35' }}>Llamadas</th>
                                        <th style={{ padding: '10px', textAlign: 'right', fontWeight: 600, color: '#4A3B35' }}>Entrada</th>
                                        <th style={{ padding: '10px', textAlign: 'right', fontWeight: 600, color: '#4A3B35' }}>Salida</th>
                                        <th style={{ padding: '10px', textAlign: 'right', fontWeight: 600, color: '#4A3B35' }}>Costo USD</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {usage.byDay && Object.entries(usage.byDay).sort().reverse().map(([date, data]) => (
                                        <tr key={date} style={{ borderBottom: '1px solid #FCF8F5', background: date === new Date().toISOString().slice(0, 10) ? '#F0DAD3' : 'transparent' }}>
                                            <td style={{ padding: '10px', color: '#4A3B35' }}>{date.split('-').reverse().join('/')}</td>
                                            <td style={{ padding: '10px', textAlign: 'center', color: '#4A3B35' }}>{data.calls}</td>
                                            <td style={{ padding: '10px', textAlign: 'right', color: '#4A3B35' }}>{data.input.toLocaleString()}</td>
                                            <td style={{ padding: '10px', textAlign: 'right', color: '#4A3B35' }}>{data.output.toLocaleString()}</td>
                                            <td style={{ padding: '10px', textAlign: 'right', fontWeight: 600, color: '#B96B4F' }}>${data.cost.toFixed(2)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div style={{ marginTop: '40px', padding: '16px', background: '#F0DAD3', borderRadius: '6px', fontSize: '12px', color: '#6B4540', lineHeight: '1.6' }}>
                        <strong>📌 Nota:</strong> Los datos se calculan desde la tabla `ai_usage` del servidor. El costo es una estimación basada en precios de OpenAI consultados el 17-sep-2026. La factura real de OpenAI siempre es autoridad. Si ves discrepancias, verifica en el dashboard de OpenAI que los tokens y modelos coincidan.
                    </div>
                </div>
            );
        }

        // Plataforma general: la marca de cada empresa se aplica recién al entrar en ella.
        const PLATFORM_BRANDING = { name: '', primaryColor: '', logoUrl: '', timezone: '' };

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());
            const [role, setRole] = useState(null);
            const [branding, setBranding] = useState(PLATFORM_BRANDING);

            useEffect(() => {
                onSessionExpired = () => { setRole(null); setAuthenticated(false); };
                document.title = 'Nexly';
            }, []);

            // Quién entró: la administradora sin empresa elegida ve la pantalla general de empresas.
            useEffect(() => {
                if (!authenticated) return;
                api('/api/session')
                    .then(data => setRole(data.role))
                    .catch(() => {
                        // La empresa elegida ya no existe o está desactivada: se vuelve a la pantalla general.
                        if (getCurrentBusinessId()) {
                            setCurrentBusinessId('');
                            window.location.reload();
                        }
                    });
            }, [authenticated]);

            const changeBranding = data => {
                applyBranding(data);
                setBranding(data);
            };

            const logout = () => {
                setToken(null);
                setCurrentBusinessId('');
                setRole(null);
                setAuthenticated(false);
            };

            if (!authenticated) {
                return <LoginScreen branding={PLATFORM_BRANDING} onLogin={() => setAuthenticated(true)} />;
            }
            if (!role) return <NexlyLoading />;
            if (role === 'admin' && !getCurrentBusinessId()) {
                return <CompanyHome onLogout={logout} />;
            }

            return <App branding={branding} onBrandingChange={changeBranding} onLogout={logout} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
