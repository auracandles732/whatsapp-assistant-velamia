        function QuotesMobile({ quotations, products, conversations, biz, canEdit, filter, setFilter, openId, setOpenId, reload, openChat, onCompose }) {
            const unit = biz?.sales?.unitSingular || 'unidad';
            const unitPlural = biz?.sales?.unitPlural || 'unidades';
            const [search, setSearch] = useState('');
            const [sort, setSort] = useState('recent');
            const [tools, setTools] = useState(false);
            const [example, setExample] = useState(false);
            const [how, setHow] = useState(false);
            const [busy, setBusy] = useState(false);
            const [notice, setNotice] = useState(null);
            const [pickChat, setPickChat] = useState(false);

            useEffect(() => { setNotice(null); setPickChat(false); }, [openId, example]);

            const pendingCount = quotations.filter(q => q.status === 'pending').length;
            const acceptedCount = quotations.filter(q => q.status === 'accepted').length;
            const totalQuoted = quotations.reduce((sum, q) => sum + Number(q.total_amount || 0), 0);
            const needle = search.trim().toLowerCase();
            const visible = quotations
                .filter(q => filter === 'all' || q.status === filter)
                .filter(q => !needle || [mxQuoteName(q), q.conversations?.phone_number, q.customer_phone, q.id.slice(0, 8), ...mxItems(q).map(i => i.name)].join(' ').toLowerCase().includes(needle))
                .sort((a, b) => sort === 'high' ? Number(b.total_amount) - Number(a.total_amount) : sort === 'low' ? Number(a.total_amount) - Number(b.total_amount) : (parseTs(b.created_at)?.getTime() || 0) - (parseTs(a.created_at)?.getTime() || 0));
            const thumb = (item, cls) => {
                const prod = item && mxProductByName(products, item.name);
                return prod?.image_url ? <img className={cls} src={prod.image_url} alt="" loading="lazy" /> : <div className={cls}><PlatIcon name="doc" size={28} color="#9AA3C7" /></div>;
            };
            const subOf = q => {
                const items = mxItems(q).filter(i => !i.type);
                const prod = items[0] && mxProductByName(products, items[0].name);
                return [mxPretty(prod?.category), items[0] ? items[0].name + (items.length > 1 ? ' +' + (items.length - 1) : '') : ''].filter(Boolean).join(' · ');
            };

            // Ejemplo con productos reales del catálogo, para ver cómo se verá una cotización antes de tener una.
            const sample = (() => {
                const picked = products.slice(0, 3);
                const items = picked.length ? picked.map((p, i) => ({ name: p.name, price: Number(p.price) || 0, quantity: i === 0 ? 2 : 1 })) : [{ name: 'Producto de ejemplo', price: 25, quantity: 2 }];
                const total = items.reduce((sum, i) => sum + i.price * i.quantity, 0);
                return { id: 'ejemplo00', customer_name: 'María González', customer_phone: '593991234567', products: items, total_amount: total, status: 'pending', created_at: new Date().toISOString(), expires_at: new Date(Date.now() + 3 * 86400000).toISOString() };
            })();

            const q = example ? sample : openId ? quotations.find(x => x.id === openId) : null;

            async function update(body, okText) {
                setBusy(true);
                try {
                    await api('/api/quotations/' + q.id, { method: 'PUT', body: JSON.stringify(body) });
                    setNotice({ text: okText });
                    reload();
                } catch (err) {
                    setNotice({ text: err.message, err: true });
                } finally {
                    setBusy(false);
                }
            }

            async function setStatus(status) {
                setBusy(true);
                try {
                    await api('/api/quotations/' + q.id, { method: 'PATCH', body: JSON.stringify({ status }) });
                    setNotice({ text: 'Cotización marcada como ' + MX_QUOTE_STATUS[status].toLowerCase() + '.' });
                    reload();
                } catch (err) {
                    setNotice({ text: err.message, err: true });
                } finally {
                    setBusy(false);
                }
            }

            async function send(target) {
                const phone = target ? target.phone_number : (q.conversations?.phone_number || q.customer_phone);
                const net = channelInfo(phone).label;
                const who = target ? contactName(target) : mxQuoteName(q);
                if (!confirm('Se enviará esta cotización a ' + who + ' por ' + net + ', con las fotos de los productos, el total y la forma de pago. El bot se pausará en ese chat para que tú sigas la conversación.\n\n¿Enviar?')) return;
                setPickChat(false);
                setBusy(true);
                try {
                    await api('/api/quotations/' + q.id + '/send', { method: 'POST', body: JSON.stringify(target ? { conversationId: target.id } : {}) });
                    setNotice({ text: '✅ Cotización enviada por ' + net + ' con sus fotos. El bot quedó pausado en ese chat.' });
                    reload();
                } catch (err) {
                    setNotice({ text: 'No se pudo enviar: ' + err.message, err: true });
                } finally {
                    setBusy(false);
                }
            }

            function changeQuantity(item) {
                const value = prompt('Nueva cantidad de "' + item.name + '" (en ' + unitPlural + '):', String(item.quantity));
                if (value === null) return;
                const quantity = Number(String(value).replace(',', '.'));
                if (!(quantity > 0)) return alert('Escribe una cantidad mayor que cero');
                const sale = mxSaleOf(q);
                sale.items = sale.items.map(i => (i.name === item.name ? { ...i, quantity } : i));
                update(sale, 'Cantidad actualizada: el total se volvió a calcular.');
            }

            function removeItem(item) {
                const sale = mxSaleOf(q);
                if (sale.items.length <= 1) return alert('La cotización necesita al menos un producto. Si ya no sirve, márcala como vencida.');
                if (!confirm('¿Quitar "' + item.name + '" de la cotización?')) return;
                sale.items = sale.items.filter(i => i.name !== item.name);
                update(sale, 'Producto quitado: el total se volvió a calcular.');
            }

            function editName() {
                const value = prompt('Nombre de la cliente:', mxQuoteName(q));
                if (value === null || !value.trim()) return;
                update({ customer_name: value.trim() }, 'Nombre actualizado.');
            }

            if (q) {
                const all = mxItems(q);
                const items = all.filter(i => !i.type);
                const shipping = all.find(i => i.type === 'shipping');
                const delivery = all.find(i => i.type === 'delivery');
                const total = Number(q.total_amount || 0);
                const subtotal = shipping ? total - Number(shipping.price || 0) : total;
                const phone = q.conversations?.phone_number || q.customer_phone || '';
                const locked = example || !canEdit;
                const close = () => { setExample(false); setOpenId(null); };
                const detailText = i => [i.personalization && 'Personalización: ' + i.personalization, i.packaging && 'Empaque ' + i.packaging + (i.packagingChanged ? ' (cambiado)' : '')].filter(Boolean).join(' · ');
                return (
                    <div className="mx-screen">
                        <div className="mx-screen-h">
                            <button type="button" className="mx-backbtn" aria-label="Volver" onClick={close}><PbIcon name="back" size={22} color="#141C3A" /></button>
                            <h2>Cotización</h2>
                            {!example && <PbMenu items={[
                                { label: 'Ver chat', onClick: () => openChat(q.conversation_id) },
                                canEdit && { label: 'Enviar a otro chat (WhatsApp, Instagram o Facebook)', onClick: () => setPickChat(true) },
                                canEdit && q.status !== 'pending' && { label: 'Volver a pendiente', onClick: () => setStatus('pending') },
                                canEdit && q.status !== 'sent' && { label: 'Marcar como enviada', onClick: () => setStatus('sent') },
                                canEdit && q.status !== 'expired' && { label: 'Marcar como vencida', danger: true, onClick: () => setStatus('expired') }
                            ]} />}
                        </div>
                        {example && <div className="mx-example">Ejemplo: así se ve una cotización cuando el bot le da el total a una clienta (o cuando tú la creas).</div>}
                        {notice && <div className={'mx-notice' + (notice.err ? ' err' : '')} style={{ marginTop: 8 }}>{notice.text}</div>}
                        <div className="mx-qtop" style={{ marginTop: 10 }}>
                            {thumb(items[0], 'th')}
                            <div className="mid">
                                <div className="nm">{mxQuoteName(q)}</div>
                                <div className="sub">{subOf(q)}</div>
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 6, marginTop: 6 }}>
                                    <span className="sub" style={{ display: 'flex', alignItems: 'center', gap: 5, marginTop: 0 }}><PlatIcon name="calendar" size={15} color="#6B7599" /> {mxDate(q.created_at)}</span>
                                    <span className={'mx-status ' + q.status}>{MX_QUOTE_STATUS[q.status] || q.status}</span>
                                </div>
                                <div className="amt">{mxMoney(total)}</div>
                            </div>
                        </div>
                        <div className="mx-info">
                            <h3><PlatIcon name="user" size={20} color="#4F5BD5" /> Datos de la cliente{!locked && <button type="button" className="mx-textbtn act" onClick={editName} disabled={busy}><PlatIcon name="edit" size={16} /> Editar</button>}</h3>
                            <div className="r"><PlatIcon name="user" size={19} color="#6B7599" /><span>{mxQuoteName(q)}</span></div>
                            {phone && <div className="r"><PlatIcon name={channelInfo(phone).icon} size={19} color={channelInfo(phone).color} /><span>{contactLine(phone)}</span></div>}
                            {shipping && <div className="r"><PlatIcon name="pin" size={19} color="#6B7599" /><span>{String(shipping.name || '').replace(/^Envío a\s*/i, '')}</span></div>}
                            {delivery?.date && <div className="r"><PlatIcon name="calendar" size={19} color="#6B7599" /><span>Entrega: {String(delivery.date).split('-').reverse().join('/')}</span></div>}
                            {(q.status === 'pending' || q.status === 'sent') && q.expires_at && <div className="r"><PlatIcon name="clock" size={19} color="#6B7599" /><span>Válida hasta el {mxDate(q.expires_at)}</span></div>}
                            <div className="r"><PlatIcon name="doc" size={19} color="#6B7599" /><span>Folio {q.id.substring(0, 8).toUpperCase()}</span></div>
                        </div>
                        <div className="mx-info">
                            <h3><PlatIcon name="box" size={20} color="#4F5BD5" /> Productos ({items.length}){!locked && <button type="button" className="mx-textbtn box act" onClick={() => onCompose({ mode: 'edit', quotation: q })}><PlatIcon name="plus" size={16} /> Agregar</button>}</h3>
                            {items.map((item, i) => (
                                <div className="mx-qitem" key={i}>
                                    {thumb(item, 'th')}
                                    <div className="mid">
                                        <b>{item.name}</b>
                                        {detailText(item) && <small>{detailText(item)}</small>}
                                        <small>{item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural}</small>
                                    </div>
                                    <span className="p">{mxMoney(Number(item.price) * Number(item.quantity))}</span>
                                    {!locked && <PbMenu items={[{ label: 'Cambiar cantidad', onClick: () => changeQuantity(item) }, { label: 'Quitar', danger: true, onClick: () => removeItem(item) }]} />}
                                </div>
                            ))}
                        </div>
                        <div className="mx-info mx-totals" style={{ padding: '10px 12px' }}>
                            <div className="r"><span>Subtotal</span><span>{mxMoney(subtotal)}</span></div>
                            <div className="r"><span>{shipping ? shipping.name : 'Envío (por cotizar)'}</span><span>{mxMoney(shipping ? shipping.price : 0)}</span></div>
                            <div className="tot"><span>Total</span><span>{mxMoney(total)}</span></div>
                        </div>
                        <div style={{ height: 70 }}></div>
                        {pickChat && (
                            <MxSheet title="Enviar la cotización a otro chat" onClose={() => setPickChat(false)}>
                                <p className="mx-hint">Elige el chat de WhatsApp, Instagram o Facebook donde quieres enviarla (con las fotos de los productos).</p>
                                <MxPickConv conversations={conversations} onPick={c => send(c)} actionLabel="Enviar" />
                            </MxSheet>
                        )}
                        <div className="mx-bottom">
                            <div className="mx-two" style={{ gridTemplateColumns: 'minmax(0, 1fr) auto' }}>
                                <button type="button" className="mx-cta green" style={{ background: channelInfo(phone).color }} onClick={() => send()} disabled={busy || locked}><PlatIcon name={channelInfo(phone).icon} size={22} color="#fff" /> {busy ? 'Un momento...' : 'Enviar por ' + channelInfo(phone).label}</button>
                                <button type="button" className="mx-cta ghost" style={{ width: 'auto', padding: '14px 16px' }} onClick={() => setPickChat(true)} disabled={busy || locked} aria-label="Enviar a otro chat" title="Enviar a otro chat"><MxIcon name="share" size={20} color="#2F3A8F" /></button>
                            </div>
                            <div className="mx-two">
                                <button type="button" className="mx-cta ghost" onClick={() => onCompose({ mode: 'edit', quotation: q })} disabled={busy || locked}><PlatIcon name="edit" size={19} color="#2F3A8F" /> Editar</button>
                                <button type="button" className="mx-cta" onClick={() => setStatus('accepted')} disabled={busy || locked || q.status === 'accepted'}>✓ {q.status === 'accepted' ? 'Aprobada' : 'Marcar como aprobada'}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const chips = [['all', 'Todas'], ['pending', 'Pendientes'], ['accepted', 'Aprobadas'], ['sent', 'Enviadas'], ['expired', 'Vencidas']];
            if (quotations.length === 0) {
                return (
                    <div className="mx-page">
                        <div className="mx-head"><div className="grow"><h1>Cotizaciones</h1><p>Aquí verás todas las cotizaciones que el bot registra automáticamente.</p></div></div>
                        <MxRobotArt />
                        <div className="mx-empty">
                            <h2>Aún no tienes cotizaciones</h2>
                            <p>Se anotan solas cada vez que el bot le da a una clienta el valor total de su pedido, y te llega un aviso por WhatsApp.</p>
                            {canEdit && <button type="button" className="mx-cta" onClick={() => onCompose({ mode: 'quote' })}><PlatIcon name="plus" size={20} color="#fff" /> Nueva cotización</button>}
                            <button type="button" className="mx-cta ghost" onClick={() => setExample(true)}><PlatIcon name="doc" size={20} color="#2F3A8F" /> Ver ejemplo</button>
                        </div>
                        <div className="mx-how">
                            <div style={{ flex: 1 }}>
                                <b><PlatIcon name="bulb" size={20} color="#F5A524" /> ¿Cómo funciona?</b>
                                <p>Cuando el bot comparte un precio total por WhatsApp, la cotización aparecerá aquí automáticamente. También puedes crearla tú desde un chat con "Responder con cotización".</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="mx-page">
                    <div className="mx-head">
                        <div className="grow"><h1>Cotizaciones</h1><p>Gestiona y consulta todas tus cotizaciones</p></div>
                        {canEdit && <button type="button" className="mx-headbtn act" onClick={() => onCompose({ mode: 'quote' })}><PlatIcon name="plus" size={18} color="#fff" /> Nueva</button>}
                    </div>
                    <div className="mx-sum">
                        <div><span className="ic" style={{ background: '#FFF1DA' }}><PlatIcon name="doc" size={18} color="#E08A00" /></span><div><b>{pendingCount}</b><small>Pendientes</small></div></div>
                        <div><span className="ic" style={{ background: '#E3F6EA' }}><PlatIcon name="check" size={18} /></span><div><b>{acceptedCount}</b><small>Aprobadas</small></div></div>
                        <div><span className="ic" style={{ background: '#EEF0FF' }}><PlatIcon name="chart" size={18} color="#4F5BD5" /></span><div><b>{mxMoney(totalQuoted).replace(/\.00$/, '')}</b><small>Total cotizado</small></div></div>
                    </div>
                    <div className="mx-search-row" style={{ marginTop: 12 }}>
                        <div className="mx-search"><PlatIcon name="search" size={20} color="#7A84AE" /><input type="text" placeholder="Buscar por cliente, producto o folio..." value={search} onChange={e => setSearch(e.target.value)} /></div>
                        <button type="button" className={'mx-square' + (tools ? ' on' : '')} aria-label="Ordenar" onClick={() => setTools(!tools)}><MxIcon name="funnel" size={21} color={tools ? '#fff' : '#3A4570'} /></button>
                    </div>
                    {tools && (
                        <div className="mx-sortrow">
                            <select value={sort} onChange={e => setSort(e.target.value)}>
                                <option value="recent">Más recientes</option>
                                <option value="high">Mayor monto</option>
                                <option value="low">Menor monto</option>
                            </select>
                        </div>
                    )}
                    <div className="mx-chipscroll">
                        {chips.map(([id, label]) => <button key={id} type="button" className={'mx-chip' + (filter === id ? ' on' : '')} onClick={() => setFilter(id)}>{label}</button>)}
                    </div>
                    {visible.length === 0 && <div className="mx-none">No hay cotizaciones con ese filtro.</div>}
                    {visible.map(item => (
                        <button key={item.id} type="button" className="mx-quote" onClick={() => setOpenId(item.id)}>
                            {thumb(mxItems(item).find(i => !i.type), 'th')}
                            <div className="mid">
                                <div className="top"><span className="nm">{mxQuoteName(item)}</span><span className={'mx-status ' + item.status}>{MX_QUOTE_STATUS[item.status] || item.status}</span></div>
                                <div className="sub">{subOf(item)}</div>
                                <div className="bot"><span className="date"><PlatIcon name="calendar" size={15} color="#6B7599" /> {mxDate(item.created_at)}</span><span className="amt">{mxMoney(item.total_amount)}</span></div>
                            </div>
                            <PbIcon name="next" size={20} color="#5C668F" />
                        </button>
                    ))}
                </div>
            );
        }

        // Armar a mano una cotización o un pedido (o cambiar una cotización): mismos precios, envíos y empaques que usa el asistente.
        function SaleComposer({ mode, conv, quotation, conversations, products, biz, onClose, onDone }) {
            const initial = quotation ? mxSaleOf(quotation) : null;
            const fixedConv = conv || (quotation ? { id: quotation.conversation_id, customer_name: mxQuoteName(quotation), phone_number: quotation.conversations?.phone_number || quotation.customer_phone } : null);
            const [pickedConv, setPickedConv] = useState(fixedConv);
            const [items, setItems] = useState(() => (initial ? initial.items : []));
            const [search, setSearch] = useState('');
            const [place, setPlace] = useState(initial?.place || '');
            const [date, setDate] = useState(initial?.deliveryDate || '');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const unit = biz?.sales?.unitSingular || 'unidad';
            const unitPlural = biz?.sales?.unitPlural || 'unidades';
            const shippingOn = biz?.shipping?.mode !== 'none';
            const personalization = !!biz?.sales?.personalization;
            const title = mode === 'order' ? 'Crear pedido' : mode === 'edit' ? 'Editar cotización' : 'Nueva cotización';

            useEffect(() => {
                const before = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = before; };
            }, []);

            const qtyOf = name => items.find(i => i.name === name)?.quantity || 0;
            function setQty(name, quantity) {
                setError('');
                setItems(prev => {
                    if (quantity <= 0) return prev.filter(i => i.name !== name);
                    if (prev.some(i => i.name === name)) return prev.map(i => (i.name === name ? { ...i, quantity } : i));
                    return [...prev, { name, quantity, personalization: '', packaging: '' }];
                });
            }
            const needle = search.trim().toLowerCase();
            const list = products
                .filter(p => !needle || (p.name + ' ' + p.category).toLowerCase().includes(needle))
                .sort((a, b) => String(a.name).localeCompare(String(b.name), 'es'));
            const estimate = items.reduce((sum, i) => sum + (Number(mxProductByName(products, i.name)?.price) || 0) * i.quantity, 0);

            async function submit(sendNow) {
                if (!pickedConv) return setError('Elige el chat de la clienta');
                if (!items.length) return setError('Agrega al menos un producto con su cantidad');
                setBusy(true);
                setError('');
                const body = { conversationId: pickedConv.id, items, place: shippingOn ? place : '', deliveryDate: date };
                try {
                    if (mode === 'order') {
                        await api('/api/orders', { method: 'POST', body: JSON.stringify(body) });
                        onDone({ kind: 'order', conv: pickedConv });
                        return;
                    }
                    let saved = mode === 'edit'
                        ? await api('/api/quotations/' + quotation.id, { method: 'PUT', body: JSON.stringify(body) })
                        : await api('/api/quotations', { method: 'POST', body: JSON.stringify(body) });
                    let sendError = '';
                    // Ya quedó guardada: si falla el envío no se vuelve a crear, solo se avisa.
                    if (sendNow) {
                        try {
                            saved = (await api('/api/quotations/' + saved.id + '/send', { method: 'POST', body: JSON.stringify({}) })).quotation || saved;
                        } catch (err) {
                            sendError = err.message;
                        }
                    }
                    onDone({ kind: 'quote', quotation: saved, sent: !!sendNow && !sendError, sendError, edited: mode === 'edit', conv: pickedConv });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setBusy(false);
                }
            }

            const row = (name, p) => {
                const qty = qtyOf(name);
                const item = items.find(i => i.name === name);
                return (
                    <div key={name}>
                        <div className="mx-steprow">
                            {p?.image_url ? <img src={p.image_url} alt="" loading="lazy" /> : <div className="noimg"></div>}
                            <div className="mid">
                                <b>{name}</b>
                                <small>{p ? mxPrice(p.price) + ' por ' + ((biz?.sales?.perProductUnits && p.sale_unit) || unit) : 'Ya no está en el catálogo: quítalo'}</small>
                            </div>
                            <div className="mx-qty">
                                {qty > 0 && <button type="button" aria-label="Menos" onClick={() => setQty(name, qty - 1)}>−</button>}
                                {qty > 0 && <span>{qty}</span>}
                                {p && <button type="button" aria-label="Más" onClick={() => setQty(name, qty + 1)}>+</button>}
                            </div>
                        </div>
                        {qty > 0 && personalization && p && (
                            <input type="text" className="mx-small-in" maxLength={300} placeholder="Personalización (opcional): colores, nombres, frase..." value={item.personalization} onChange={e => setItems(prev => prev.map(i => (i.name === name ? { ...i, personalization: e.target.value } : i)))} />
                        )}
                    </div>
                );
            };

            return (
                <div className="mx-screen mx-compose">
                    <div className="mx-screen-h">
                        <button type="button" className="mx-backbtn" aria-label="Cerrar" onClick={onClose}><PbIcon name="back" size={22} color="#141C3A" /></button>
                        <div className="tt"><h2>{title}</h2><div className="sub">Mismos precios, envíos y empaques que usa el asistente</div></div>
                    </div>
                    {error && <div className="mx-notice err" style={{ marginTop: 10 }}>{error}</div>}
                    <div className="mx-ccard">
                        <div className="mx-ccard-h"><span className="ic"><PlatIcon name="user" size={21} color="#4F5BD5" /></span><div><b>Cliente</b><small>{fixedConv ? 'El chat de esta venta' : 'Elige el chat de la clienta'}</small></div></div>
                        {fixedConv
                            ? <div className="mx-steprow" style={{ borderBottom: 'none', padding: 0 }}><Avatar name={contactName(fixedConv)} size={40} /><div className="mid"><b><ChannelMark phone={fixedConv.phone_number} all />{contactName(fixedConv)}</b><small>{contactLine(fixedConv.phone_number)}</small></div></div>
                            : <MxPickConv conversations={conversations} value={pickedConv?.id} onPick={c => { setPickedConv(c); setError(''); }} />}
                    </div>
                    <div className="mx-ccard">
                        <div className="mx-ccard-h"><span className="ic"><PlatIcon name="box" size={21} color="#4F5BD5" /></span><div><b>Productos {items.length > 0 && '(' + items.length + ')'}</b><small>Toca + para agregar y elige la cantidad en {unitPlural}</small></div></div>
                        {items.length > 0 && <div className="mx-picked">{items.map(i => row(i.name, mxProductByName(products, i.name)))}</div>}
                        <div className="mx-search" style={{ height: 46 }}><PlatIcon name="search" size={18} color="#7A84AE" /><input type="text" placeholder="Buscar producto para agregar..." value={search} onChange={e => setSearch(e.target.value)} /></div>
                        <div className="mx-scroll">
                            {list.filter(p => !qtyOf(p.name)).map(p => row(p.name, p))}
                            {products.length === 0 && <div className="mx-none">Primero agrega productos en el Catálogo.</div>}
                        </div>
                    </div>
                    <div className="mx-ccard">
                        <div className="mx-ccard-h"><span className="ic"><PlatIcon name="truck" size={21} color="#4F5BD5" /></span><div><b>Envío y entrega</b><small>Opcional: el envío se calcula con tu tarifario</small></div></div>
                        {shippingOn && (
                            <>
                                <span className="l">Ciudad de envío</span>
                                <input type="text" placeholder="Ej: Quito, Pichincha" value={place} onChange={e => setPlace(e.target.value)} />
                                <span className="h2">Vacío = envío por cotizar (no se suma al total).</span>
                            </>
                        )}
                        <span className="l">Fecha de entrega</span>
                        <input type="date" className="mx-date" value={date} onChange={e => setDate(e.target.value)} />
                    </div>
                    <div style={{ height: mode === 'quote' ? 130 : 70 }}></div>
                    <div className="mx-bottom">
                        {items.length > 0 && <div className="mx-estimate"><span>{items.reduce((n, i) => n + i.quantity, 0)} {items.reduce((n, i) => n + i.quantity, 0) === 1 ? unit : unitPlural}</span><b>{mxMoney(estimate)}</b><small>{shippingOn && place.trim() ? '+ envío' : 'sin envío'}</small></div>}
                        {mode === 'quote' && <button type="button" className="mx-cta green" style={pickedConv ? { background: channelInfo(pickedConv.phone_number).color } : undefined} onClick={() => submit(true)} disabled={busy}><PlatIcon name={pickedConv ? channelInfo(pickedConv.phone_number).icon : 'send'} size={21} color="#fff" /> {busy ? 'Un momento...' : 'Guardar y enviar' + (pickedConv ? ' por ' + channelInfo(pickedConv.phone_number).label : '')}</button>}
                        <button type="button" className={'mx-cta' + (mode === 'quote' ? ' ghost' : '')} onClick={() => submit(false)} disabled={busy}>
                            {mode === 'order' ? <><PlatIcon name="bag" size={20} color="#fff" /> {busy ? 'Creando...' : 'Crear pedido'}</> : mode === 'edit' ? <><PlatIcon name="save" size={20} color="#fff" /> {busy ? 'Guardando...' : 'Guardar cambios'}</> : <><PlatIcon name="save" size={20} color="#2F3A8F" /> Solo guardar</>}
                        </button>
                    </div>
                </div>
            );
        }

        const MX_PURPOSES = {
            respuesta: { label: 'Respuestas', icon: 'chat', color: '#F4A08C', bg: '#FDECE7', ink: '#C2412F', what: 'respuestas automáticas' },
            foto: { label: 'Fotos', icon: 'image', color: '#8DB8EC', bg: '#E6F0FB', ink: '#2A62D8', what: 'la lectura de fotos' },
            audio: { label: 'Audio', icon: 'mic', color: '#86D3A3', bg: '#E3F4EA', ink: '#1C7A45', what: 'los audios' },
            seguimiento: { label: 'Seguimiento', icon: 'users', color: '#B7A7F5', bg: '#EFEAFF', ink: '#5B45D6', what: 'los seguimientos' },
            pedido: { label: 'Pedidos', icon: 'bag', color: '#F2C66B', bg: '#FDF3DC', ink: '#9C6A00', what: 'el registro de pedidos' },
            publicaciones: { label: 'Publicaciones', icon: 'sparkle', color: '#F59BC8', bg: '#FDE8F2', ink: '#C2417A', what: 'las publicaciones' },
            otro: { label: 'Otro', icon: 'layers', color: '#B8C0D8', bg: '#F1F3F9', ink: '#4A5582', what: 'otros usos' }
        };

        function ConsumptionMobile() {
            const [days, setDays] = useState(7);
            const [usage, setUsage] = useState(null);
            const [wide, setWide] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [view, setView] = useState('home');
            const [openDay, setOpenDay] = useState('');

            useEffect(() => {
                setLoading(true);
                setError('');
                Promise.all([api('/api/me/usage?days=' + days), api('/api/me/usage?days=' + days * 2)])
                    .then(([now, both]) => { setUsage(now); setWide(both); })
                    .catch(err => setError(err.message))
                    .finally(() => setLoading(false));
            }, [days]);
            useEffect(() => { window.scrollTo(0, 0); }, [view]);

            if (loading && !usage) return <div className="mx-page"><div className="mx-none">Cargando consumo...</div></div>;
            if (!usage) return <div className="mx-page"><div className="mx-notice err">No se pudo cargar el consumo{error ? ': ' + error : ''}</div></div>;

            const EMPTY = { calls: 0, input: 0, output: 0, cost: 0 };
            // Los días se cuentan como los guarda el servidor (fecha UTC de cada llamada).
            const keys = Array.from({ length: days }, (_, i) => new Date(Date.now() - (days - 1 - i) * 86400000).toISOString().slice(0, 10));
            const prevKeys = Array.from({ length: days }, (_, i) => new Date(Date.now() - (2 * days - 1 - i) * 86400000).toISOString().slice(0, 10));
            const dayOf = key => usage.byDay?.[key] || EMPTY;
            const sum = (list, from) => list.reduce((acc, key) => {
                const d = (from.byDay || {})[key] || EMPTY;
                return { calls: acc.calls + d.calls, input: acc.input + d.input, output: acc.output + d.output, cost: acc.cost + d.cost };
            }, { ...EMPTY });
            const total = sum(keys, usage);
            const prevCost = wide ? sum(prevKeys, wide).cost : 0;
            const change = prevCost > 0 ? Math.round((total.cost - prevCost) / prevCost * 100) : null;
            const measured = Object.keys(usage.byDay || {}).sort()[0];
            const periodLabel = 'Últimos ' + days + ' días';
            const ddmm = key => key.slice(8, 10) + '/' + key.slice(5, 7);
            const fit = text => ({ fontSize: text.length > 9 ? 17 : text.length > 7 ? 19.5 : 22 });
            const header = (title, icon) => (
                <div className="mx-head" style={{ alignItems: 'center' }}>
                    {view !== 'home' && <button type="button" className="mx-icon" aria-label="Volver" onClick={() => setView('home')}><PbIcon name="back" size={24} /></button>}
                    <div className="hic" style={{ background: 'none', width: 'auto', height: 'auto' }}>{icon}</div>
                    <div className="grow"><h1 style={{ fontSize: view === 'home' ? 28 : 22 }}>{title}</h1><p style={{ fontSize: 16 }}>{periodLabel}</p></div>
                </div>
            );

            if (view === 'tipo') {
                const entries = Object.entries(usage.byPurpose || {}).filter(([, d]) => d.calls > 0).sort((a, b) => b[1].calls - a[1].calls);
                const calls = entries.reduce((n, [, d]) => n + d.calls, 0);
                const cost = entries.reduce((n, [, d]) => n + d.cost, 0);
                const info = key => MX_PURPOSES[key] || { ...MX_PURPOSES.otro, label: mxPretty(key) };
                const top = [...entries].sort((a, b) => b[1].cost - a[1].cost)[0];
                const R = 52, C = 2 * Math.PI * R;
                let offset = 0;
                return (
                    <div className="mx-page">
                        {header('Desglose por tipo de uso', <MxIcon name="pie" size={30} color="#6366F1" />)}
                        {entries.length === 0 ? <div className="mx-none">Todavía no hay consumo en este período.</div> : (
                            <>
                                <div className="mx-ptiles">
                                    {entries.map(([key, d]) => {
                                        const it = info(key);
                                        return (
                                            <div key={key} className="mx-ptile" style={{ background: it.bg }}>
                                                <div className="top">
                                                    <span className="ic">{it.icon === 'mic' ? <MxIcon name="mic" size={21} color={it.ink} /> : <PlatIcon name={it.icon} size={21} color={it.ink} />}</span>
                                                    <div><div className="lab">{it.label}</div><div className="n">{mxInt(d.calls)}<small>llamadas</small></div></div>
                                                </div>
                                                <div className="c" style={{ color: it.ink }}>${d.cost.toFixed(2)}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="mx-card">
                                    <div className="mx-card-h">Distribución del consumo</div>
                                    <div className="mx-donut">
                                        <svg viewBox="0 0 150 150" role="img" aria-label="Distribución de llamadas por tipo">
                                            <circle cx="75" cy="75" r={R} fill="none" stroke="#EEF1F8" strokeWidth="26" />
                                            {entries.map(([key, d]) => {
                                                const len = calls ? d.calls / calls * C : 0;
                                                const seg = <circle key={key} cx="75" cy="75" r={R} fill="none" stroke={info(key).color} strokeWidth="26" strokeDasharray={len + ' ' + (C - len)} strokeDashoffset={-offset} transform="rotate(-90 75 75)" />;
                                                offset += len;
                                                return seg;
                                            })}
                                            <text x="75" y="74" textAnchor="middle" fontSize="22" fontWeight="800" fill="#141C3A">{mxInt(calls)}</text>
                                            <text x="75" y="92" textAnchor="middle" fontSize="11" fill="#5C668F">llamadas</text>
                                        </svg>
                                        <div className="mx-legend">
                                            {entries.map(([key, d]) => <div key={key}><i style={{ background: info(key).color }}></i><span>{info(key).label}</span><b>{calls ? (d.calls / calls * 100).toFixed(1) : '0'}%</b></div>)}
                                        </div>
                                    </div>
                                </div>
                                {top && cost > 0 && (
                                    <div className="mx-insight">
                                        <span className="ic"><PlatIcon name="bulb" size={22} color="#6366F1" /></span>
                                        <div><b>Dato</b><p>La mayor parte del gasto ({Math.round(top[1].cost / cost * 100)}%) proviene de {info(top[0]).what}.</p></div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                );
            }

            if (view === 'dia') {
                const list = keys.filter(k => dayOf(k).calls > 0).reverse();
                const maxKey = list.reduce((best, k) => (!best || dayOf(k).cost > dayOf(best).cost ? k : best), '');
                return (
                    <div className="mx-page">
                        {header('Desglose por día', <PlatIcon name="calendar" size={30} color="#4F5BD5" />)}
                        {list.length === 0 && <div className="mx-none">Todavía no hay consumo en este período.</div>}
                        {list.map(k => {
                            const d = dayOf(k);
                            const isTop = k === maxKey && list.length > 1;
                            return (
                                <button key={k} type="button" className={'mx-dayrow' + (isTop ? ' top' : '')} onClick={() => setOpenDay(openDay === k ? '' : k)} aria-expanded={openDay === k}>
                                    <div className="h">
                                        {isTop && <MxIcon name="crown" size={19} color="#4F5BD5" />}
                                        <span className="d">{k.split('-').reverse().join('/')}</span>
                                        {isTop && <span className="crown">Mayor consumo</span>}
                                        <span className="cost">${d.cost.toFixed(2)}</span>
                                    </div>
                                    <div className="g">
                                        <div><MxIcon name="phone" size={18} color="#6B7599" /><div><b>{mxInt(d.calls)}</b><small>llamadas</small></div></div>
                                        <div><MxIcon name="coins" size={18} color="#4F5BD5" /><div><small>Entrada</small><b>{mxInt(d.input)}</b></div></div>
                                        <div><MxIcon name="plane" size={18} color="#4F5BD5" /><div><small>Salida</small><b>{mxInt(d.output)}</b></div></div>
                                        <PbIcon name={openDay === k ? 'back' : 'next'} size={16} color="#7A84AE" />
                                    </div>
                                    {openDay === k && (
                                        <div className="more">
                                            Costo promedio por llamada: <b>${(d.cost / d.calls).toFixed(4)}</b><br />
                                            {total.cost > 0 ? <>Es el <b>{Math.round(d.cost / total.cost * 100)}%</b> del gasto de estos {days} días.</> : null}
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                );
            }

            const costs = keys.map(k => dayOf(k).cost);
            const maxCost = Math.max(...costs, 0);
            const step = maxCost <= 0.2 ? 0.05 : maxCost <= 1 ? 0.25 : maxCost <= 2 ? 0.5 : maxCost <= 5 ? 1 : Math.ceil(maxCost / 4);
            const top = Math.max(step * 4, Math.ceil(maxCost / step) * step);
            const ticks = [4, 3, 2, 1, 0].map(i => top / 4 * i);
            const peak = costs.indexOf(maxCost);
            const labelEvery = days <= 7 ? 1 : days <= 14 ? 2 : 5;
            return (
                <div className="mx-page">
                    {header('Consumo de IA', <MxIcon name="bars" size={40} />)}
                    {measured && measured > keys[0] && <p className="mx-hint">El CRM mide desde el {measured.split('-').reverse().join('/')}: lo gastado antes de esa fecha solo aparece en OpenAI.</p>}
                    {error && <div className="mx-notice err">{error}</div>}

                        <div className="mx-ctile c2"><span className="ic"><MxIcon name="coins" size={21} color="#2A62D8" /></span><div><div className="lab">Tokens (entrada)</div><div className="val" style={fit(mxInt(total.input))}>{mxInt(total.input)}</div></div></div>
                        <div className="mx-ctile c3"><span className="ic"><MxIcon name="plane" size={21} color="#1C7A45" /></span><div><div className="lab">Tokens (salida)</div><div className="val" style={fit(mxInt(total.output))}>{mxInt(total.output)}</div></div></div>
                        <div className="mx-ctile c4"><span className="ic"><MxIcon name="coins" size={21} color="#9C6A00" /></span><div><div className="lab">Costo USD</div><div className="val">${total.cost.toFixed(2)}</div></div></div>
                    </div>
                    <div className="mx-card">
                        <div className="mx-card-h trend">
                            <MxIcon name="trend" size={22} color="#4F5BD5" /> Tendencia de costo
                            <select value={days} onChange={e => setDays(Number(e.target.value))} aria-label="Período">
                                <option value={7}>Últimos 7 días</option>
                                <option value={14}>Últimos 14 días</option>
                                <option value={30}>Últimos 30 días</option>
                            </select>
                        </div>
                        <div className="mx-bars">
                            <div className="y">{ticks.map(t => <span key={t}>${t.toFixed(2)}</span>)}</div>
                            <div className="plot">
                                {costs.map((c, i) => <div key={keys[i]} className={'bar' + (i === peak && maxCost > 0 ? ' top' : '')} title={ddmm(keys[i]) + ': $' + c.toFixed(2)} style={{ height: (top ? c / top * 100 : 0) + '%', minHeight: c > 0 ? 3 : 0 }}></div>)}
                            </div>
                            <div className="x">{keys.map((k, i) => <span key={k}>{(days - 1 - i) % labelEvery === 0 ? ddmm(k) : ''}</span>)}</div>
                        </div>
                        <div className="mx-costtot">
                            <PlatIcon name="sparkle" size={24} color="#6366F1" />
                            <div className="tt"><small>Costo total en {days} días</small><b>${total.cost.toFixed(2)}</b></div>
                            {change !== null && <div className={'dl ' + (change > 0 ? 'up' : 'down')}><b>{change > 0 ? '↑ +' : '↓ '}{change}%</b><small>vs. {days} días anteriores</small></div>}
                        </div>
                    </div>
                    <button type="button" className="mx-row" onClick={() => setView('tipo')}>
                        <span className="ic" style={{ background: '#EEF0FF' }}><MxIcon name="pie" size={24} color="#6366F1" /></span>

            // Reduce la foto a un JPG de hasta 1600 px: así siempre cumple lo que exige WhatsApp (JPG o PNG, máx. 5 MB).
            function photoToJpeg(file) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(file);
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la foto')); };
                    img.src = url;
                });
            }

            // Nota de voz: graba con el micrófono y la envía al chat (el servidor la convierte al formato de WhatsApp).
            async function startVoice() {
                if (!selectedConv || recorderRef.current) return;
                if (!navigator.mediaDevices || !window.MediaRecorder) return alert('Este navegador no permite grabar audio');
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (err) {
                    return alert('Permite el uso del micrófono en el navegador para grabar notas de voz');
                }
                const conv = selectedConv;
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                const state = { recorder, cancelled: false, timer: null, started: Date.now() };
                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = async () => {
                    clearInterval(state.timer);
                    stream.getTracks().forEach(t => t.stop());
                    recorderRef.current = null;
                    setRecordingSeconds(null);
                    if (state.cancelled) return;
                    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                    try {
                        const audioBase64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                        await api('/api/send-audio', { method: 'POST', body: JSON.stringify({ conversationId: conv.id, phoneNumber: conv.phone_number, audioBase64 }) });
                    } catch (err) {
                        alert('Error enviando la nota de voz: ' + err.message);
                    }
                    loadMessages(conv.id);
                    loadConversations();
                };
                recorderRef.current = state;
                recorder.start();
                setRecordingSeconds(0);
                state.timer = setInterval(() => {
                    const seconds = Math.round((Date.now() - state.started) / 1000);
                    setRecordingSeconds(seconds);
                    if (seconds >= 300) recorder.stop();
                }, 500);
            }

            function stopVoice(cancel) {
                const state = recorderRef.current;
                if (!state) return;
                state.cancelled = !!cancel;
                if (state.recorder.state !== 'inactive') state.recorder.stop();
            }

            // Envía al chat las fotos elegidas, pegadas (Ctrl+V) o arrastradas, de una en una y mostrando el avance.
            async function sendPhotoFiles(conv, list) {
                const all = Array.from(list || []);
                const heic = all.filter(f => /hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name || ''));
                const files = all.filter(f => f.type.startsWith('image/') && !heic.includes(f)).slice(0, 10);
                if (heic.length && !files.length) return alert('Esa foto está en formato HEIC (iPhone) y el navegador no la puede abrir. Guárdala como JPG o PNG y vuelve a intentar.');
                if (!files.length) return alert('Solo se pueden enviar fotos (JPG, PNG o WEBP).');
                const caption = prompt('Texto para acompañar la foto (opcional):');
                if (caption === null) return;
                try {
                    for (let i = 0; i < files.length; i++) {
                        setPhotoStatus(files.length > 1 ? 'Enviando foto ' + (i + 1) + ' de ' + files.length + '...' : 'Enviando foto...');
                        let imageBase64;
                        try {
                            imageBase64 = await photoToJpeg(files[i]);
                        } catch {
                            throw new Error('No se pudo abrir "' + (files[i].name || 'la foto') + '". Guárdala como JPG o PNG y vuelve a intentar.');
                        }
                        await api('/api/send-image', {
                            method: 'POST',
                            body: JSON.stringify({ conversationId: conv.id, phoneNumber: conv.phone_number, imageBase64, caption: i === 0 ? caption : '' })
                        });
                    }
                    if (heic.length) alert(heic.length + ' foto(s) en formato HEIC no se enviaron: guárdalas como JPG o PNG.');
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                } finally {
                    setPhotoStatus('');
                }
                loadMessages(conv.id);
                loadConversations();
            }

            // Abre la galería o los archivos para elegir una o varias fotos.
            function sendPhoto() {

                const conv = selectedConv;
                setPhotoPicker(false);
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*,.heic,.heif';
                input.multiple = true;
                input.onchange = () => sendPhotoFiles(conv, input.files);
                input.click();
            }

            // Fotos pegadas con Ctrl+V o arrastradas al chat desde el computador.
            function photosFrom(transfer) {
                return Array.from(transfer?.files || []).filter(f => f.type.startsWith('image/') || /\.hei[cf]$/i.test(f.name || ''));
            }

            // La lista se refresca cada 5 s, así la pausa que active el bot (reclamo, pago...)
            // se refleja sola sin volver a abrir el chat.
            const currentConv = conversations.find(c => c.id === selectedConv?.id) || selectedConv;
            const botPausedInChat = isBotPausedIn(currentConv);

            const clientSet = new Set(listOverview.clientIds || []);
            const dayAgoMs = Date.now() - 24 * 60 * 60 * 1000;
            const isRecent = c => { const t = parseTs(c.last_message_time); return !!t && t.getTime() > dayAgoMs; };
            const isClosedConv = c => c.status === 'closed';
            const unreadMap = listOverview.unread || {};
            const hasReadTracking = conversations.length > 0 && 'last_read_at' in conversations[0];
            const openConversations = conversations.filter(c => !isClosedConv(c));
            // Cada red por separado: los filtros de abajo (no leídas, te necesitan...) cuentan solo la red elegida.
            const channelOf = c => socialChannel(c.phone_number) || 'whatsapp';
            const inChannel = c => channelFilter === 'all' || channelOf(c) === channelFilter;
            const channelStats = CHANNELS.map(ch => {
                const open = openConversations.filter(c => ch.id === 'all' || channelOf(c) === ch.id);
                return { ...ch, count: open.length, unread: open.filter(c => unreadMap[c.id]).length };
            });
            const showChannels = channelFilter !== 'all' || openConversations.some(c => channelOf(c) !== 'whatsapp');
            const unreadCount = openConversations.filter(c => inChannel(c) && unreadMap[c.id]).length;
            const needsCount = openConversations.filter(c => inChannel(c) && isBotPausedIn(c)).length;
            const searchText = search.trim().toLowerCase();
            const visibleConversations = conversations.filter(c => {
                if (!inChannel(c)) return false;
                if (searchText && !((c.customer_name || '').toLowerCase().includes(searchText) || (c.phone_number || '').includes(searchText))) return false;
                if (listFilter === 'closed') return isClosedConv(c);
                if (isClosedConv(c)) return false;
                if (listFilter === 'unread') return !!unreadMap[c.id];
                if (listFilter === 'needs') return isBotPausedIn(c);
                if (listFilter === 'clients') return clientSet.has(c.id);
                if (listFilter === 'recent') return isRecent(c);
                return true;
            });
            const timeline = [
                ...messages.map(m => ({ kind: 'msg', key: 'm' + m.id, ts: m.timestamp, data: m })),
                ...((summary && summary.phase2 ? summary.notes : []).map(n => ({ kind: 'note', key: 'n' + n.id, ts: n.created_at, data: n })))
            ].sort((a, b) => parseTs(a.ts) - parseTs(b.ts));

            async function loadQuotations() {

                    console.error('Error cargando cotizaciones:', err);
                }
            }

            async function loadOrders() {
                try {

                    setOrders(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando pedidos:', err);
                }
            }

                try {
                    await api(`/api/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });

                    alert('Error cambiando estado del pedido: ' + err.message);

            function openChatFromQuotation(conversationId) {

                setActiveTab('conversaciones');

            async function deleteChat() {
                if (!currentConv) return;
                const name = contactName(currentConv);
                const ok = confirm(`¿Eliminar el chat de ${name}?\n\nSe borrarán para siempre todos sus mensajes, fotos, audios, cotizaciones y pedidos. No se puede deshacer.`);
                if (!ok) return;

                setDeletingChat(true);
                try {
                    await api(`/api/conversations/${currentConv.id}`, { method: 'DELETE' });
                    setSelectedConv(null);
                    setMessages([]);
                    await Promise.all([loadConversations(), loadStats(), loadQuotations()]);
                } catch (err) {
                    alert('Error eliminando chat: ' + err.message);
                } finally {
                    setDeletingChat(false);
                }
            }

            async function pauseOrResumeBot() {
                if (!currentConv) return;
                setPausingBot(true);
                try {
                    const endpoint = botPausedInChat ? 'resume' : 'pause';
                    await api(`/api/conversations/${currentConv.id}/${endpoint}`, { method: 'POST', body: JSON.stringify({}) });
                    await loadConversations();
                } catch (err) {
                    alert(`Error ${botPausedInChat ? 'reactivando' : 'pausando'} el bot: ${err.message}`);
                } finally {
                    setPausingBot(false);
                }
            }

            function keepAtBottom() {
                const el = messagesRef.current;
                if (el && stickToBottom.current) el.scrollTop = el.scrollHeight;
            }

            function handleMessagesScroll() {
                const el = messagesRef.current;
                if (el) stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
            }

            useEffect(keepAtBottom, [messages]);

            useEffect(() => {
                // Al abrir otro chat no se muestran por un instante los mensajes del anterior.
                stickToBottom.current = true;
                setMessages([]);
                openChatId.current = selectedConv ? selectedConv.id : null;
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

                    console.error('Error cargando conversaciones:', err);

                    setLoading(false);

                setSending(true);
                try {
                    // El servidor pausa el bot en este chat al enviar un mensaje manual.
                    await api('/api/send-message', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,

            if (loading) return <NexlyLoading text="Cargando tu empresa…" />;
