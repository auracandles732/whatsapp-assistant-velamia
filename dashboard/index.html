<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELAMIA - CRM WhatsApp Assistant</title>

    <!-- Instalable como app (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B96B4F">

    <!-- iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VELAMIA CRM">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --terracota: #B96B4F;
            --terracota-dark: #9C5740;
            --rosa-palo: #E3B7AC;
            --rosa-palo-suave: #F0DAD3;
            --beige: #F7EFEA;
            --beige-claro: #FCF8F5;
            --crema: #FDFAF7;
            --texto: #4A3B35;
            --texto-suave: #9C8880;
            --azul-suave: #A8C5D6;
            --verde-suave: #A8D5BA;
            --amarillo-suave: #E8C88A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--beige);
            color: var(--texto);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            color: var(--texto);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand img {
            height: 42px;
            width: auto;
            display: block;
        }

        .header-brand .subtitle {
            font-size: 12px;
            color: var(--texto-suave);
            letter-spacing: 0.5px;
        }

        .toggle-bot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
        }

        .toggle-bot.active {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .toggle-bot.inactive {
            background: #e39a9a;
            color: #6b2c2c;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            padding: 0 28px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
        }

        .nav-tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-suave);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--terracota);
        }

        .nav-tab.active {
            color: var(--terracota);
            border-bottom-color: var(--terracota);
        }

        .catalog-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .catalog-form {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 140px 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-field input, .form-field select {
            padding: 10px 12px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .photo-upload {
            width: 90px;
            height: 90px;
            border: 2px dashed var(--rosa-palo);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: var(--beige-claro);
            font-size: 22px;
            color: var(--rosa-palo);
        }

        .photo-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-add-product {
            background: var(--terracota);
            color: white;
            padding: 11px 22px;
            height: fit-content;
        }

        .btn-add-product:hover {
            background: var(--terracota-dark);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 16px rgba(185, 107, 79, 0.15);
        }

        .product-card .photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--rosa-palo-suave);
        }

        .product-card .info {
            padding: 14px;
        }

        .product-card .category-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: var(--terracota);
            background: var(--rosa-palo-suave);
            padding: 3px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .product-card .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--terracota);
        }

        .product-card .price small {
            font-size: 11px;
            font-weight: 400;
            color: var(--texto-suave);
        }

        .btn-delete-product {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #e39a9a;
            color: #b45050;
            padding: 6px;
            font-size: 12px;
        }

        .btn-delete-product:hover {
            background: #f5dcdc;
        }

        .empty-catalog {
            text-align: center;
            padding: 60px 20px;
            color: var(--texto-suave);
        }

        .settings-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .settings-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 24px;
            max-width: 700px;
        }

        .settings-card h3 {
            font-size: 15px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .settings-card p.hint {
            font-size: 12px;
            color: var(--texto-suave);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 320px;
            padding: 14px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            background: var(--beige-claro);
            color: var(--texto);
            resize: vertical;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .settings-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .btn-save-prompt {
            background: var(--terracota);
            color: white;
        }

        .btn-save-prompt:hover {
            background: var(--terracota-dark);
        }

        .save-status {
            font-size: 12px;
            color: var(--verde-suave);
            font-weight: 600;
        }

        .stats-container {
            background: var(--beige);
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .stats-toggle {
            padding: 12px 28px;
            cursor: pointer;
            font-weight: 600;
            color: var(--texto);
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: background 0.2s;
            background: var(--beige);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .stats-toggle:hover {
            background: rgba(0,0,0,0.02);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 20px 28px;
            background: var(--beige);
        }

        .stat-card {
            padding: 18px;
            border-radius: 14px;
            color: white;
            box-shadow: 0 2px 10px rgba(185, 107, 79, 0.12);
        }

        .stat-card:nth-child(1) { background: linear-gradient(135deg, var(--terracota), var(--terracota-dark)); }
        .stat-card:nth-child(2) { background: linear-gradient(135deg, var(--azul-suave), #8ba9bb); }
        .stat-card:nth-child(3) { background: linear-gradient(135deg, var(--amarillo-suave), #d1ac6a); }
        .stat-card:nth-child(4) { background: linear-gradient(135deg, var(--verde-suave), #85b89b); }

        .stat-card h4 {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .conversations-list {
            width: 300px;
            background: var(--crema);
            border-right: 1px solid var(--rosa-palo-suave);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversations-list-header {
            padding: 16px 18px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversation-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--beige);
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: var(--rosa-palo-suave);
        }

        .conversation-item.active {
            background: var(--rosa-palo-suave);
            border-left: 4px solid var(--terracota);
        }

        .conversation-item h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--texto);
        }

        .conversation-item p {
            font-size: 12px;
            color: var(--texto-suave);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--beige-claro);
            min-width: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 14px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.customer .message-bubble {
            background: var(--terracota);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: var(--rosa-palo-suave);
            color: var(--texto);
            border-bottom-left-radius: 4px;
        }

        .message-bubble img {
            max-width: 220px;
            border-radius: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .message-time {
            font-size: 11px;
            color: var(--texto-suave);
            margin-top: 4px;
        }

        .input-area {
            padding: 8px 12px;
            border-top: 1px solid var(--rosa-palo-suave);
            display: flex;
            gap: 6px;
            background: var(--crema);
            flex-shrink: 0;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.4;
            min-height: 36px;
            max-height: 72px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 4px;
            order: 2;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-send {
            background: var(--terracota);
            color: white;
        }

        .btn-send:hover {
            background: var(--terracota-dark);
        }

        .btn-photo {
            background: var(--rosa-palo);
            color: var(--texto);
        }

        .btn-photo:hover {
            background: var(--rosa-palo-suave);
        }

        .btn-bot-control {
            background: var(--gris-claro);
            color: var(--texto);
            font-size: 12px;
        }

        .btn-bot-control.active {
            background: #ffd700;
            color: var(--texto);
        }

        .btn-bot-control.paused {
            background: #ff6b6b;
            color: white;
        }

        .btn-bot-control:hover {
            opacity: 0.9;
        }

        .btn-bot-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--texto-suave);
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
        }

        .spinner {
            border: 3px solid var(--rosa-palo-suave);
            border-top: 3px solid var(--terracota);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--beige);
            padding: 20px;
        }

        .login-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 18px;
            padding: 40px 34px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 6px 30px rgba(185, 107, 79, 0.1);
        }

        .login-card img {
            height: 54px;
            margin-bottom: 26px;
        }

        .login-card input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            background: var(--beige-claro);
            color: var(--texto);
            text-align: center;
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .login-card button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            background: var(--terracota);
            color: white;
            font-size: 14px;
        }

        .login-card button:hover {
            background: var(--terracota-dark);
        }

        .login-error {
            color: #b45050;
            font-size: 13px;
            margin-top: 14px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--rosa-palo);
            color: var(--texto-suave);
            padding: 9px 14px;
            font-size: 12px;
            margin-left: 10px;
        }

        .btn-logout:hover {
            background: var(--rosa-palo-suave);
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        @media (max-width: 700px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .conversations-list { width: 220px; }
            .header-brand img { height: 32px; }
            .catalog-form { grid-template-columns: 1fr; }
            .photo-upload { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://whatsapp-assistant-velamia.onrender.com';
        const TOKEN_KEY = 'velamia_crm_token';

        let onSessionExpired = () => {};

        // Algunos navegadores bloquean el almacenamiento (modo privado, restricciones):
        // en ese caso la sesión dura lo que dure la pestaña en lugar de romper la app.
        let memoryToken = null;

        function getToken() {
            try {
                return localStorage.getItem(TOKEN_KEY) || memoryToken;
            } catch {
                return memoryToken;
            }
        }

        function setToken(value) {
            memoryToken = value;
            try {
                if (value === null) localStorage.removeItem(TOKEN_KEY);
                else localStorage.setItem(TOKEN_KEY, value);
            } catch {
                // sesión solo en memoria
            }
        }

        // Todas las peticiones pasan por el backend autenticado: el navegador
        // nunca maneja claves de Supabase ni de WhatsApp.
        async function api(path, options = {}) {
            const token = getToken();
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            if (res.status === 401) {
                setToken(null);
                onSessionExpired();
                throw new Error('Sesión expirada, vuelve a entrar');
            }

            const data = await res.json();
            if (data && data.error) throw new Error(data.error);
            return data;
        }

        function LoginScreen({ onLogin }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [checking, setChecking] = useState(false);

            async function submit() {
                if (!password) return;
                setChecking(true);
                setError('');
                try {
                    const res = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'No se pudo entrar');
                    setToken(data.token);
                    onLogin();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setChecking(false);
                }
            }

            return (
                <div className="login-screen">
                    <div className="login-card">
                        <img src="logo.png" alt="VELAMIA" />
                        <input
                            type="password"
                            placeholder="Contraseña"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && submit()}
                            autoFocus
                        />
                        <button onClick={submit} disabled={checking}>
                            {checking ? 'Entrando...' : 'Entrar al CRM'}
                        </button>
                        {error && <div className="login-error">{error}</div>}
                    </div>
                </div>
            );
        }

        function App({ onLogout }) {
            const [conversations, setConversations] = useState([]);
            const [selectedConv, setSelectedConv] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [botEnabled, setBotEnabled] = useState(true);
            const [stats, setStats] = useState({ total: 0, active: 0, orders: 0, revenue: 0 });
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('conversaciones');
            const [products, setProducts] = useState([]);
            const [newProduct, setNewProduct] = useState({ name: '', price: '', category: '', photoBase64: '', photoPreview: '' });
            const [savingProduct, setSavingProduct] = useState(false);
            const [systemPrompt, setSystemPrompt] = useState('');
            const [savingPrompt, setSavingPrompt] = useState(false);
            const [promptSaved, setPromptSaved] = useState(false);
            const [botPausedInChat, setBotPausedInChat] = useState(false);
            const [pausingBot, setPausingBot] = useState(false);
            const [statsExpanded, setStatsExpanded] = useState(false);

            useEffect(() => {
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                loadSystemPrompt();
                const interval = setInterval(() => {
                    loadConversations();
                    loadStats();
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            async function loadSystemPrompt() {
                try {
                    const data = await api('/api/system-prompt');
                    setSystemPrompt(data.prompt || '');
                } catch (err) {
                    console.error('Error cargando system prompt:', err);
                }
            }

            async function saveSystemPrompt() {
                setSavingPrompt(true);
                try {
                    await api('/api/system-prompt', {
                        method: 'POST',
                        body: JSON.stringify({ prompt: systemPrompt })
                    });
                    setPromptSaved(true);
                    setTimeout(() => setPromptSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando instrucciones: ' + err.message);
                } finally {
                    setSavingPrompt(false);
                }
            }

            async function loadProducts() {
                try {
                    const data = await api('/api/products');
                    setProducts(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando catálogo:', err);
                }
            }

            function handlePhotoSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    setNewProduct(prev => ({ ...prev, photoBase64: reader.result, photoPreview: reader.result }));
                };
                reader.readAsDataURL(file);
            }

            async function addProduct() {
                if (!newProduct.name.trim() || !newProduct.price || !newProduct.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSavingProduct(true);
                try {
                    let imageUrl = '';
                    if (newProduct.photoBase64) {
                        const uploadData = await api('/api/upload-image', {
                            method: 'POST',
                            body: JSON.stringify({ imageBase64: newProduct.photoBase64 })
                        });
                        imageUrl = uploadData.url;
                    }

                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: newProduct.name,
                            price: parseFloat(newProduct.price),
                            category: newProduct.category,
                            image_url: imageUrl
                        })
                    });

                    setNewProduct({ name: '', price: '', category: '', photoBase64: '', photoPreview: '' });
                    loadProducts();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSavingProduct(false);
                }
            }

            async function removeProduct(id) {
                if (!confirm('¿Eliminar este producto del catálogo?')) return;
                try {
                    await api(`/api/products/${id}`, { method: 'DELETE' });
                    loadProducts();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                }
            }

            async function loadBotStatus() {
                try {
                    const data = await api('/api/bot-status');
                    setBotEnabled(data.enabled);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function toggleBotStatus() {
                const newValue = !botEnabled;
                setBotEnabled(newValue);
                try {
                    await api('/api/bot-status', {
                        method: 'POST',
                        body: JSON.stringify({ enabled: newValue })
                    });
                } catch (err) {
                    alert('Error cambiando estado del bot: ' + err.message);
                    setBotEnabled(!newValue);
                }
            }

            async function sendPhoto() {
                if (!selectedConv) return;
                const imageUrl = prompt('Pega la URL de la foto a enviar:');
                if (!imageUrl) return;
                const caption = prompt('Descripción (opcional):') || '';

                try {
                    await api('/api/send-image', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            imageUrl,
                            caption
                        })
                    });
                    loadMessages(selectedConv.id);
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                }
            }

            async function loadBotPauseStatus(convId) {
                try {
                    const data = await api(`/api/conversations/${convId}/bot-status`);
                    setBotPausedInChat(data.bot_paused);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function pauseOrResumeBot() {
                if (!selectedConv) return;
                setPausingBot(true);
                try {
                    const endpoint = botPausedInChat ? 'resume' : 'pause';
                    await api(`/api/conversations/${selectedConv.id}/${endpoint}`, { method: 'POST', body: JSON.stringify({}) });
                    setBotPausedInChat(!botPausedInChat);
                } catch (err) {
                    alert(`Error ${botPausedInChat ? 'reanudando' : 'pausando'} el bot: ${err.message}`);
                } finally {
                    setPausingBot(false);
                }
            }

            useEffect(() => {
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    loadBotPauseStatus(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

            async function loadConversations() {
                try {
                    const data = await api('/api/conversations');
                    setConversations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando conversaciones:', err);
                } finally {
                    setLoading(false);
                }
            }

            async function loadMessages(convId) {
                try {
                    const data = await api(`/api/conversations/${convId}/messages`);
                    setMessages(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando mensajes:', err);
                }
            }

            async function loadStats() {
                try {
                    setStats(await api('/api/stats'));
                } catch (err) {
                    console.error('Error cargando stats:', err);
                }
            }

            async function sendMessage() {
                if (!inputText.trim() || !selectedConv) return;

                try {
                    // PUNTO 1: Pausar automáticamente el bot cuando el usuario escribe manualmente
                    if (!botPausedInChat) {
                        await api(`/api/conversations/${selectedConv.id}/pause`, {
                            method: 'POST',
                            body: JSON.stringify({ minutes: 10 })
                        });
                        setBotPausedInChat(true);
                    }

                    await api('/api/send-message', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            text: inputText
                        })
                    });

                    setInputText('');
                    loadMessages(selectedConv.id);
                } catch (err) {
                    alert('Error enviando mensaje: ' + err.message);
                }
            }

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--beige)' }}>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando CRM...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="main">
                        <div className="header">
                            <div className="header-brand">
                                <img src="logo.png" alt="VELAMIA" />
                                <div>
                                    <div className="subtitle">CRM · Asistente WhatsApp</div>
                                </div>
                            </div>
                            <div className="header-actions">
                                <div className={`toggle-bot ${botEnabled ? 'active' : 'inactive'}`} onClick={toggleBotStatus}>
                                    <span>{botEnabled ? '🤖 Bot Activo' : '🚫 Bot Inactivo'}</span>
                                </div>
                                <button className="btn-logout" onClick={onLogout}>Salir</button>
                            </div>
                        </div>

                        <div className="nav-tabs">
                            <div className={`nav-tab ${activeTab === 'conversaciones' ? 'active' : ''}`} onClick={() => setActiveTab('conversaciones')}>💬 Conversaciones</div>
                            <div className={`nav-tab ${activeTab === 'catalogo' ? 'active' : ''}`} onClick={() => setActiveTab('catalogo')}>🕯️ Catálogo</div>
                            <div className={`nav-tab ${activeTab === 'configuracion' ? 'active' : ''}`} onClick={() => setActiveTab('configuracion')}>⚙️ Configuración</div>
                        </div>

                        <div className="stats-container">
                            <div className="stats-toggle" onClick={() => setStatsExpanded(!statsExpanded)}>
                                <span>{statsExpanded ? '▼' : '▶'} Estadísticas</span>
                            </div>
                            {statsExpanded && (
                            <div className="stats">
                                <div className="stat-card">
                                    <h4>Total Clientes</h4>
                                    <div className="number">{stats.total}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Conversaciones Activas</h4>
                                    <div className="number">{stats.active}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Pedidos</h4>
                                    <div className="number">{stats.orders}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Ingresos</h4>
                                    <div className="number">${stats.revenue.toFixed(2)}</div>
                                </div>
                            </div>
                            )}
                        </div>

                        {activeTab === 'conversaciones' && (
                        <div className="content">
                            <div className="conversations-list">
                                <div className="conversations-list-header">Conversaciones</div>
                                {conversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        className={`conversation-item ${selectedConv?.id === conv.id ? 'active' : ''}`}
                                        onClick={() => setSelectedConv(conv)}
                                    >
                                        <h3>📱 {conv.customer_name || conv.phone_number}</h3>
                                        <p>{new Date(conv.last_message_time).toLocaleString('es-EC')}</p>
                                    </div>
                                ))}
                            </div>

                            {selectedConv ? (
                                <div className="chat-area">
                                    <div className="messages-container">
                                        {messages.map((msg, idx) => {
                                            const urlMatch = msg.content.match(/^https?:\/\/\S+/);
                                            const mediaUrl = urlMatch ? urlMatch[0] : null;
                                            const textPart = mediaUrl ? msg.content.replace(mediaUrl, '').replace(/^\n/, '') : msg.content;
                                            return (
                                                <div key={idx} className={`message ${msg.sender}`}>
                                                    <div>
                                                        <div className="message-bubble">
                                                            {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                            {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '220px', marginBottom: '6px', display: 'block' }} /> : null}
                                                            {textPart}
                                                        </div>
                                                        <div className="message-time">{new Date(msg.timestamp).toLocaleTimeString('es-EC')}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="input-area">
                                        <textarea
                                            placeholder="Escribe tu respuesta aquí..."
                                            value={inputText}
                                            onChange={e => setInputText(e.target.value)}
                                            onKeyPress={e => e.key === 'Enter' && !e.shiftKey && sendMessage()}
                                        ></textarea>
                                        <div className="button-group">
                                            <button className="btn-send" onClick={sendMessage}>📤 Enviar</button>
                                            <button className="btn-photo" onClick={sendPhoto}>📷 Foto</button>
                                            <button
                                                className={`btn-bot-control ${botPausedInChat ? 'paused' : 'active'}`}
                                                onClick={pauseOrResumeBot}
                                                disabled={pausingBot}
                                                title={botPausedInChat ? 'Reanudar bot' : 'Pausar bot en este chat'}
                                            >
                                                {botPausedInChat ? '⏸️ Reanuda' : '▶️ Pausa'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <p>Selecciona una conversación</p>
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'catalogo' && (
                        <div className="catalog-container">
                            <div className="catalog-form">
                                <div className="form-field">
                                    <label>Foto</label>
                                    <label className="photo-upload">
                                        {newProduct.photoPreview ? <img src={newProduct.photoPreview} /> : '📷'}
                                        <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhotoSelect} />
                                    </label>
                                </div>
                                <div className="form-field">
                                    <label>Nombre del producto</label>
                                    <input type="text" placeholder="Ej: Vela Aromática Lavanda" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Precio por docena ($)</label>
                                    <input type="number" step="0.01" placeholder="Ej: 25.00" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Categoría / Evento</label>
                                    <input type="text" placeholder="Ej: Bautizo, Cumpleaños, XV años" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} />
                                </div>
                                <button className="btn-add-product" onClick={addProduct} disabled={savingProduct}>
                                    {savingProduct ? 'Guardando...' : '+ Agregar'}
                                </button>
                            </div>

                            {products.length === 0 ? (
                                <div className="empty-catalog">
                                    <p>Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo 🕯️</p>
                                </div>
                            ) : (
                                <div className="catalog-grid">
                                    {products.map(product => (
                                        <div key={product.id} className="product-card">
                                            <img className="photo" src={product.image_url || 'logo.png'} />
                                            <div className="info">
                                                <span className="category-tag">{product.category}</span>
                                                <h4>{product.name}</h4>
                                                <div className="price">${product.price} <small>por docena</small></div>
                                                <button className="btn-delete-product" onClick={() => removeProduct(product.id)}>🗑️ Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'configuracion' && (
                        <div className="settings-container">
                            <div className="settings-card">
                                <h3>🧠 Instrucciones del asistente (System Prompt)</h3>
                                <p className="hint">Aquí defines cómo debe comportarse el bot: su tono, reglas, políticas de entrega/pago, y cualquier detalle de tu negocio. Se aplica a todas las conversaciones nuevas. Deja vacío para usar el comportamiento por defecto.</p>
                                <textarea
                                    className="prompt-textarea"
                                    placeholder="Ej: Eres el asistente de ventas de VELAMIA. Responde siempre en español, de forma cálida y cercana. Los pagos son por transferencia o contra entrega. Los envíos son solo dentro de Guayaquil..."
                                    value={systemPrompt}
                                    onChange={e => setSystemPrompt(e.target.value)}
                                ></textarea>
                                <div className="settings-actions">
                                    <span className="save-status">{promptSaved ? '✅ Guardado' : ''}</span>
                                    <button className="btn-save-prompt" onClick={saveSystemPrompt} disabled={savingPrompt}>
                                        {savingPrompt ? 'Guardando...' : '💾 Guardar instrucciones'}
                                    </button>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());

            useEffect(() => {
                onSessionExpired = () => setAuthenticated(false);
            }, []);

            if (!authenticated) {
                return <LoginScreen onLogin={() => setAuthenticated(true)} />;
            }

            return <App onLogout={() => {
                setToken(null);
                setAuthenticated(false);
            }} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
