<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexly</title>

    <!-- Instalable como app (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B96B4F">

    <!-- iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CRM">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <!-- Versiones fijas: una actualización externa de estas librerías no puede romper el CRM. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        :root {
            --terracota: #B96B4F;
            --terracota-dark: #9C5740;
            --rosa-palo: #E3B7AC;
            --rosa-palo-suave: #F0DAD3;
            --beige: #F7EFEA;
            --beige-claro: #FCF8F5;
            --crema: #FDFAF7;
            --texto: #4A3B35;
            --texto-suave: #9C8880;
            --azul-suave: #A8C5D6;
            --verde-suave: #A8D5BA;
            --amarillo-suave: #E8C88A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--beige);
            color: var(--texto);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            color: var(--texto);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand img {
            height: 34px;
            width: auto;
            display: block;
        }

        .header-brand .subtitle {
            font-size: 12px;
            color: var(--texto-suave);
            letter-spacing: 0.5px;
        }

        .toggle-bot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
        }

        .toggle-bot.active {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .toggle-bot.inactive {
            background: #e39a9a;
            color: #6b2c2c;
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 20px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            flex-shrink: 0;
            /* En el celular las pestañas se deslizan de lado en vez de ensanchar la página. */
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-tab {
            flex-shrink: 0;
            white-space: nowrap;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-suave);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--terracota);
        }

        .nav-tab.active {
            color: var(--terracota);
            border-bottom-color: var(--terracota);
        }

        .catalog-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .catalog-form {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 140px 1fr 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-field input, .form-field select {
            padding: 10px 12px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .photo-upload {
            width: 90px;
            height: 90px;
            border: 2px dashed var(--rosa-palo);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: var(--beige-claro);
            font-size: 22px;
            color: var(--rosa-palo);
        }

        .photo-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-add-product {
            background: var(--terracota);
            color: white;
            padding: 11px 22px;
            height: fit-content;
        }

        .btn-add-product:hover {
            background: var(--terracota-dark);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 16px rgba(185, 107, 79, 0.15);
        }

        .product-card .photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--rosa-palo-suave);
        }

        .product-card .info {
            padding: 14px;
        }

        .product-card .category-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: var(--terracota);
            background: var(--rosa-palo-suave);
            padding: 3px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .product-card .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--terracota);
        }

        .packaging-select {
            width: 100%;
            margin: 6px 0;
            padding: 6px 8px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .product-card .price small {
            font-size: 11px;
            font-weight: 400;
            color: var(--texto-suave);
        }

        .btn-delete-product {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #e39a9a;
            color: #b45050;
            padding: 6px;
            font-size: 12px;
        }

        .btn-delete-product:hover {
            background: #f5dcdc;
        }

        .empty-catalog {
            text-align: center;
            padding: 60px 20px;
            color: var(--texto-suave);
        }

        .settings-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .settings-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 24px;
            max-width: 700px;
        }

        .settings-card h3 {
            font-size: 15px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .settings-card p.hint {
            font-size: 12px;
            color: var(--texto-suave);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 320px;
            padding: 14px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            background: var(--beige-claro);
            color: var(--texto);
            resize: vertical;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .settings-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .btn-save-prompt {
            background: var(--terracota);
            color: white;
        }

        .btn-save-prompt:hover {
            background: var(--terracota-dark);
        }

        .save-status {
            font-size: 12px;
            color: var(--verde-suave);
            font-weight: 600;
        }

        /* Botón de estadísticas dentro de la fila de pestañas: no ocupa una franja propia. */
        .stats-toggle {
            flex-shrink: 0;
            margin-left: auto;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-suave);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            user-select: none;
            white-space: nowrap;
        }

        .stats-toggle:hover,
        .stats-toggle.open {
            color: var(--terracota);
            border-color: var(--terracota);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 12px 20px;
            background: var(--beige);
            flex-shrink: 0;
        }

        .stat-card {
            padding: 12px 16px;
            border-radius: 14px;
            color: white;
            box-shadow: 0 2px 10px rgba(185, 107, 79, 0.12);
        }

        .stat-card:nth-child(1) { background: linear-gradient(135deg, var(--terracota), var(--terracota-dark)); }
        .stat-card:nth-child(2) { background: linear-gradient(135deg, var(--azul-suave), #8ba9bb); }
        .stat-card:nth-child(3) { background: linear-gradient(135deg, var(--amarillo-suave), #d1ac6a); }
        .stat-card:nth-child(4) { background: linear-gradient(135deg, var(--verde-suave), #85b89b); }

        .stat-card h4 {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 22px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .conversations-list {
            width: 230px;
            background: var(--crema);
            border-right: 1px solid var(--rosa-palo-suave);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversations-list-header {
            padding: 16px 18px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversation-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--beige);
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: var(--rosa-palo-suave);
        }

        .conversation-item.active {
            background: var(--rosa-palo-suave);
            border-left: 4px solid var(--terracota);
        }

        .conversation-item h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--texto);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .paused-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: #fde2e2;
            color: #a33b3b;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 16px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-header.paused {
            background: #fde2e2;
            color: #a33b3b;
        }

        .chat-header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-delete-chat {
            background: transparent;
            color: #a33b3b;
            border: 1px solid #e8b4b4;
        }

        .btn-delete-chat:hover {
            background: #fde2e2;
        }

        .quotes-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            min-height: 0;
        }

        .quotes-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--texto-suave);
        }

        .quotes-toolbar select {
            padding: 6px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            background: var(--crema);
            color: var(--texto);
            font-size: 13px;
        }

        .quote-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }

        .quote-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quote-customer {
            font-weight: 700;
            font-size: 14px;
        }

        .quote-meta {
            font-size: 12px;
            color: var(--texto-suave);
            margin-top: 2px;
        }

        .quote-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--terracota);
        }

        .quote-items {
            margin: 8px 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .quote-items small {
            color: var(--texto-suave);
        }

        .quote-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quote-status {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .quote-status.pending { background: #fbeed3; color: #8a6420; }
        .quote-status.accepted { background: #dcefe3; color: #2f5540; }
        .quote-status.expired { background: #ece6e3; color: #7b6d68; }
        .quote-status.confirmed { background: #dde9f6; color: #2d4d6e; }
        .quote-status.shipped { background: #e9e1f3; color: #4f3b6b; }
        .quote-status.delivered { background: #dcefe3; color: #2f5540; }
        .quote-status.cancelled { background: #f6dede; color: #7a3232; }

        .quote-actions select {
            padding: 5px 8px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            background: var(--beige-claro);
            font-size: 12px;
        }

        .chat-header .chat-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-item p {
            font-size: 12px;
            color: var(--texto-suave);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--beige-claro);
            min-width: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 14px;
            word-wrap: break-word;
            /* Respeta los saltos de línea: sin esto las listas y los datos bancarios se ven como un solo bloque. */
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.customer .message-bubble {
            background: var(--terracota);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: var(--rosa-palo-suave);
            color: var(--texto);
            border-bottom-left-radius: 4px;
        }

        .message-bubble img {
            max-width: 220px;
            border-radius: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .message-time {
            font-size: 11px;
            color: var(--texto-suave);
            margin-top: 4px;
        }

        .input-area {
            padding: 8px 12px;
            border-top: 1px solid var(--rosa-palo-suave);
            display: flex;
            gap: 6px;
            background: var(--crema);
            flex-shrink: 0;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.4;
            min-height: 36px;
            max-height: 72px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 4px;
            order: 2;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-send {
            background: var(--terracota);
            color: white;
        }

        .btn-send:hover {
            background: var(--terracota-dark);
        }

        .btn-photo {
            background: var(--rosa-palo);
            color: var(--texto);
        }

        .btn-photo:hover {
            background: var(--rosa-palo-suave);
        }

        .btn-bot-control {
            font-size: 12px;
        }

        .btn-back {
            display: none;
            margin-right: 6px;
            padding: 4px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            background: var(--beige-claro);
            color: var(--texto);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-bot-control.active {
            background: var(--amarillo-suave);
            color: var(--texto);
        }

        .btn-bot-control.paused {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .btn-bot-control:hover {
            opacity: 0.9;
        }

        .btn-bot-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--texto-suave);
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
        }

        .spinner {
            border: 3px solid var(--rosa-palo-suave);
            border-top: 3px solid var(--terracota);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            color: #fff;
            background:
                linear-gradient(rgba(10, 15, 70, 0.10), rgba(10, 15, 70, 0.10)),
                url('fondo.png') center / cover no-repeat,
                linear-gradient(135deg, #1E2A9A 0%, #5B6CF0 55%, #A99BF5 100%);
        }

        .login-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        .login-hero {
            flex: 0 1 400px;
            position: relative;
        }

        .login-hero::before {
            content: '';
            position: absolute;
            inset: -50px -60px -50px -90px;
            background: radial-gradient(ellipse at center, rgba(18, 26, 110, 0.6), rgba(18, 26, 110, 0) 70%);
            z-index: -1;
        }

        .login-hero h1 {
            font-size: clamp(34px, 4vw, 52px);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 16px;
            color: #fff;
        }

        .login-grad {
            background: linear-gradient(90deg, #4FD8FF, #B08CFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .login-hero p {
            font-size: 16px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.88);
            margin: 0 0 30px;
            max-width: 340px;
        }

        .login-features {
            display: flex;
        }

        .login-feature {
            flex: 1;
            text-align: center;
            font-size: 12px;
            line-height: 1.3;
            color: rgba(255, 255, 255, 0.88);
            padding: 0 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.22);
        }

        .login-feature:first-child {
            border-left: none;
            padding-left: 0;
        }

        .login-feature .ico {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1.5px solid rgba(160, 180, 255, 0.75);

        .nx-who .nm { font-size: 16px; font-weight: 800; color: #141C3A; }
        .nx-who .ph { font-size: 14px; color: #5C668F; }
        .nx-line { display: flex; align-items: flex-start; gap: 12px; padding: 7px 0; font-size: 14px; color: #2A3766; }
        .nx-line .ic { display: flex; flex-shrink: 0; margin-top: 1px; }
        .nx-prod { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #F0F2FA; }
        .nx-prod:first-of-type { border-top: none; }
        .nx-prod img, .nx-prod .noimg { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #EEF1F9; }
        .nx-prod .noimg { display: flex; align-items: center; justify-content: center; }
        .nx-prod .info { flex: 1; min-width: 0; }
        .nx-prod .pn { font-size: 14px; font-weight: 700; color: #141C3A; }
        .nx-prod .pu { font-size: 13px; color: #5C668F; margin-top: 1px; }
        .nx-prod .pp { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 14px; font-weight: 700; color: #141C3A; }
        .nx-prod .times { padding: 3px 10px; border-radius: 999px; background: #E8EEFF; color: #3B4FD8; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .nx-soft { font-size: 14px; color: #7A84AE; }

        @media (max-width: 1250px) {
            .nx-content { grid-template-columns: 320px minmax(0, 1fr); }
            .nx-side { display: none; }
        }

        @media (max-width: 900px) {
            .nx-tab .lbl { display: none; }
            .nx-tab { padding: 0 14px; }
            .nx-brand .s { display: none; }
        }

        @media (max-width: 700px) {
            .nx-top { flex-wrap: wrap; height: auto; padding: 8px 12px 0; gap: 8px; }
            .nx-tabs { order: 3; flex: 0 0 100%; height: 46px; }
            .nx-tab .lbl { display: inline; }
            .nx-actions { margin-left: auto; gap: 6px; }
            .nx-pill { padding: 8px 10px; font-size: 13px; }
            .nx-pill .lbl-hide { display: none; }
            .nx-content { grid-template-columns: 1fr; padding: 0; gap: 0; }
            .nx-panel { border-radius: 0; border: none; box-shadow: none; }
            .nx-content.chat-open .nx-list { display: none; }
            .nx-content:not(.chat-open) .nx-chat { display: none; }
            .nx-back { display: inline-flex; }
            .nx-head-actions .lbl-hide { display: none; }
            .nx-head-actions { margin-left: auto; }
            .nx-chat-head { padding: 10px 12px; gap: 8px 10px; }
            .nx-page:has(.nx-content.chat-open) .nx-top { display: none; }
            .nx-bubble { max-width: 84%; }
            .nx-send { padding: 13px 16px; }
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--rosa-palo);
            color: var(--texto-suave);
            padding: 9px 14px;
            font-size: 12px;
            margin-left: 10px;
        }

        .btn-logout:hover {
            background: var(--rosa-palo-suave);
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .settings-card + .settings-card { margin-top: 18px; }

        .profile-section {
            border-top: 1px solid var(--rosa-palo-suave);
            padding-top: 16px;
            margin-top: 16px;
        }

        .profile-section h4 {
            font-size: 13px;
            color: var(--texto);
            margin-bottom: 10px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .profile-grid .wide { grid-column: 1 / -1; }

        .field-hint {
            font-size: 11px;
            color: var(--texto-suave);
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--texto);
            cursor: pointer;
        }

        .step-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 70px auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .step-row input {
            padding: 8px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            background: var(--beige-claro);
            color: var(--texto);
            min-width: 0;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--terracota);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 0;
        }

        .logo-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-preview img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 8px;
            background: var(--beige-claro);
        }

        @media (max-width: 700px) {
            .header { padding: 8px 12px; }
            .nav-tabs { padding: 0 8px; }
            .nav-tab { padding: 9px 10px; }
            .profile-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            /* En el celular se ve la lista o el chat abierto, cada uno a pantalla completa. */
            .conversations-list { width: 100%; border-right: none; }
            .content.chat-open .conversations-list { display: none; }
            .content:not(.chat-open) .empty-state { display: none; }
            .btn-back { display: inline-block; }
            .chat-header { flex-wrap: wrap; padding: 6px 10px; }
            .header-brand img { height: 32px; }
            .catalog-form { grid-template-columns: 1fr; }
            .photo-upload { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // El CRM lo sirve el mismo servidor: se usa su propio origen (sirve igual en otro dominio).
        const API_URL = /^https?:$/.test(window.location.protocol)
            ? window.location.origin
            : 'https://whatsapp-assistant-velamia.onrender.com';
        const TOKEN_KEY = 'velamia_crm_token';

        let onSessionExpired = () => {};

        // Algunos navegadores bloquean el almacenamiento (modo privado, restricciones):
        // en ese caso la sesión dura lo que dure la pestaña en lugar de romper la app.
        let memoryToken = null;

        function getToken() {
            try {
                return localStorage.getItem(TOKEN_KEY) || memoryToken;
            } catch {
                return memoryToken;
            }
        }

        function setToken(value) {
            memoryToken = value;
            try {
                if (value === null) localStorage.removeItem(TOKEN_KEY);
                else localStorage.setItem(TOKEN_KEY, value);
            } catch {
                // sesión solo en memoria
            }
        }

        // Todas las peticiones pasan por el backend autenticado: el navegador
        // nunca maneja claves de Supabase ni de WhatsApp.
        const BUSINESS_KEY = 'currentBusinessId';

        function getCurrentBusinessId() {
            try {
                return localStorage.getItem(BUSINESS_KEY) || '';
            } catch {
                return '';
            }
        }

        function setCurrentBusinessId(value) {
            try {
                if (value) localStorage.setItem(BUSINESS_KEY, value);
                else localStorage.removeItem(BUSINESS_KEY);
            } catch {
                // sin almacenamiento: se trabaja en VELAMIA
            }
        }

        async function api(path, options = {}) {
            const token = getToken();
            const businessId = getCurrentBusinessId();
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(businessId ? { 'X-Business-Id': businessId } : {}),
                    ...(options.headers || {})
                }
            });

            if (res.status === 401) {
                setToken(null);
                onSessionExpired();
                throw new Error('Sesión expirada, vuelve a entrar');
            }

            // Durante un despliegue Render puede responder una página HTML en lugar de JSON.
            let data;
            try {
                data = await res.json();
            } catch {
                throw new Error('El servidor no está disponible en este momento, intenta en unos segundos');
            }
            if (!res.ok || (data && data.error)) throw new Error(data?.error || `Error ${res.status}`);
            return data;
        }

        // Tipos cuyo contenido guardado empieza con la URL del archivo.
        const MEDIA_TYPES = ['image', 'audio', 'document'];

        // La base guarda las fechas en UTC sin zona horaria; sin la "Z" el navegador
        // las toma como hora local y en Ecuador aparecen 5 horas adelantadas.
        let BUSINESS_TZ = 'America/Guayaquil';

        // Nombre, color, logo y zona horaria del negocio (perfil del negocio).
        function applyBranding(branding) {
            if (!branding) return;
            if (branding.name) document.title = `${branding.name} · CRM`;
            if (/^#[0-9a-f]{6}$/i.test(branding.primaryColor || '')) {
                document.documentElement.style.setProperty('--terracota', branding.primaryColor);
            }
            if (branding.timezone) BUSINESS_TZ = branding.timezone;
        }

        const logoOf = branding => (branding && branding.logoUrl) || 'logo.png';

        function parseTs(value) {
            if (!value) return null;
            return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(value) ? value : `${value}Z`);
        }

        function formatDateTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
        }

        function formatTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleTimeString('es-EC', { timeZone: BUSINESS_TZ, hour: 'numeric', minute: '2-digit' }) : '';
        }

        function isBotPausedIn(conv) {
            const until = parseTs(conv?.bot_paused_until);
            return !!until && until > new Date();
        }

        // ---------- Administración de negocios (solo con la contraseña maestra) ----------
        const EMPTY_BUSINESS_FORM = { name: '', preset: 'tienda', displayPhoneNumber: '', phoneNumberId: '', wabaId: '', metaAccessToken: '', openaiApiKey: '' };
        const fieldStyle = { width: '100%', padding: '8px', border: '1px solid var(--rosa-palo-suave)', borderRadius: '4px', boxSizing: 'border-box' };
        const labelStyle = { display: 'block', fontSize: '13px', marginBottom: '5px', fontWeight: '600' };
        const buttonStyle = { padding: '8px 14px', background: 'var(--terracota)', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' };
        const secondaryButtonStyle = { ...buttonStyle, background: 'var(--rosa-palo-suave)', color: 'var(--texto)' };

        /** Avisa antes de guardar algo que Meta u OpenAI van a rechazar (típico: el navegador rellenó el campo). */
        function credentialProblem(form) {
            const token = (form.metaAccessToken || '').trim();
            const key = (form.openaiApiKey || '').trim();
            if (token && !(token.startsWith('EAA') && token.length > 100)) {
                return `El token de Meta se ve incorrecto: los de Meta empiezan con "EAA" y son muy largos, y este empieza con "${token.slice(0, 3)}" y tiene ${token.length} caracteres.\n\nSuele pasar cuando el navegador rellena el campo con una contraseña guardada: borra el campo, pégalo de nuevo y revisa que quede completo.\n\n¿Guardar de todos modos?`;
            }
            if (key && !(key.startsWith('sk-') && key.length > 20)) {
                return `La clave de OpenAI se ve incorrecta: empiezan con "sk-" y esta empieza con "${key.slice(0, 3)}".\n\n¿Guardar de todos modos?`;
            }
            return null;
        }

        function CredentialFields({ form, setForm, business }) {
            const field = (key, label, placeholder, secret, hint) => (
                <div style={{ marginBottom: '12px' }}>
                    <label style={labelStyle}>{label}</label>
                    <input
                        type="text"
                        name={`campo-${key}`}
                        autoComplete="off"
                        data-lpignore="true"
                        spellCheck={false}
                        style={secret ? { ...fieldStyle, WebkitTextSecurity: 'disc' } : fieldStyle}
                        value={form[key]}
                        onChange={e => setForm({ ...form, [key]: e.target.value })}
                        placeholder={hint ? `Guardado ${hint} · déjalo vacío para conservarlo` : placeholder}
                    />
                    {secret && form[key] && (
                        <div style={{ fontSize: '11px', color: 'var(--texto-suave)', marginTop: '2px' }}>
                            Pegado: {form[key].trim().length} caracteres, empieza con "{form[key].trim().slice(0, 3)}"
                        </div>
                    )}
                </div>
            );
            return (
                <div>
                    {field('displayPhoneNumber', 'Número de WhatsApp del negocio', business?.meta_phone_number || 'Ej: +593 99 123 4567')}
                    {field('phoneNumberId', 'Phone Number ID (Meta)', business?.meta_phone_number_id || 'Ej: 123456789012345')}
                    {field('wabaId', 'WhatsApp Business Account ID (Meta)', business?.meta_business_account_id || 'Ej: 109876543210987')}
                    {field('metaAccessToken', 'Token de acceso de Meta', 'Token permanente del usuario del sistema', true, business?.meta_access_token_hint)}
                    {field('openaiApiKey', 'Clave de OpenAI (API key)', 'sk-...', true, business?.openai_api_key_hint)}
                    <div style={{ fontSize: '11px', color: 'var(--texto-suave)', marginBottom: '8px' }}>Panel de claves v3</div>
                </div>
            );
        }

        const ROLE_LABELS = { owner: 'Dueño (todo)', manager: 'Encargado (atiende y edita, sin configuración)', staff: 'Solo consulta' };
        const EMPTY_USER_FORM = { fullName: '', email: '', role: 'owner', password: '' };

        /** Usuarios con que una empresa entra al CRM (correo y contraseña). */
        function CompanyUsers({ company }) {
            const [users, setUsers] = useState([]);
            const [form, setForm] = useState(EMPTY_USER_FORM);
            const [busy, setBusy] = useState(false);
            const base = `/api/businesses/${company.id}/users`;

            async function load() {
                try {
                    setUsers(await api(base));
                } catch (err) {
                    alert('Error cargando usuarios: ' + err.message);
                }
            }

            useEffect(() => { load(); }, [company.id]);

            async function create() {
                if (!form.fullName.trim() || !form.email.trim()) return alert('Escribe el nombre y el correo');
                if (form.password.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                setBusy(true);
                try {
                    await api(base, { method: 'POST', body: JSON.stringify(form) });
                    alert(`Usuario creado.\n\nUsuario: ${form.email.trim().toLowerCase()}\nContraseña: la que escribiste`);
                    setForm(EMPTY_USER_FORM);
                    load();
                } catch (err) {
                    alert('Error creando usuario: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            async function update(user, changes, done) {
                try {
                    await api(`${base}/${user.id}`, { method: 'PATCH', body: JSON.stringify(changes) });
                    if (done) alert(done);
                    load();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            function changePassword(user) {
                const password = prompt(`Nueva contraseña para ${user.email} (mínimo 8 caracteres):`);
                if (password === null) return;
                if (password.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                update(user, { password }, 'Contraseña cambiada');
            }

            function toggle(user) {
                if (user.active && !confirm(`¿Desactivar a ${user.email}? Ya no podrá entrar al CRM.`)) return;
                update(user, { active: !user.active });
            }

            return (
                <div style={{ marginTop: '14px', background: 'var(--beige-claro)', padding: '12px', borderRadius: '6px', fontSize: '13px' }}>
                    <p style={{ marginBottom: '10px' }}>Cada usuario entra al CRM con su correo y su contraseña, y solo ve {company.name}.</p>

                    {users.length === 0 ? <p style={{ color: 'var(--texto-suave)', marginBottom: '10px' }}>Todavía no hay usuarios.</p> : users.map(u => (
                        <div key={u.id} style={{ padding: '8px 0', borderBottom: '1px solid var(--rosa-palo-suave)', opacity: u.active ? 1 : 0.6 }}>
                            <div><strong>{u.full_name}</strong> {u.active ? '' : '(desactivado)'}</div>
                            <div style={{ color: 'var(--texto-suave)' }}>{u.email}</div>
                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px', alignItems: 'center' }}>
                                <select value={u.role} onChange={e => update(u, { role: e.target.value })} style={{ padding: '5px', fontSize: '12px' }}>
                                    {Object.entries(ROLE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                </select>
                                <button style={secondaryButtonStyle} onClick={() => changePassword(u)}>Cambiar contraseña</button>
                                <button style={secondaryButtonStyle} onClick={() => toggle(u)}>{u.active ? 'Desactivar' : 'Activar'}</button>
                            </div>
                        </div>
                    ))}

                    <div style={{ marginTop: '14px' }}>
                        <strong>Nuevo usuario</strong>
                        <input style={{ ...fieldStyle, marginTop: '8px' }} placeholder="Nombre" value={form.fullName} onChange={e => setForm({ ...form, fullName: e.target.value })} />
                        <input style={{ ...fieldStyle, marginTop: '8px' }} placeholder="Correo (será su usuario)" autoComplete="off" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
                        <input style={{ ...fieldStyle, marginTop: '8px' }} type="password" autoComplete="new-password" placeholder="Contraseña (mínimo 8 caracteres)" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
                        <select style={{ ...fieldStyle, marginTop: '8px' }} value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
                            {Object.entries(ROLE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                        </select>
                        <button style={{ ...buttonStyle, marginTop: '10px' }} disabled={busy} onClick={create}>{busy ? 'Creando...' : '+ Crear usuario'}</button>
                    </div>
                </div>
            );
        }

        /** ¿El bot de la empresa atiende? Obligatorios en rojo, recomendados en naranja. */
        function ReadinessList({ readiness }) {
            if (!readiness) return null;
            return (
                <div style={{ margin: '8px 0', fontSize: '12px' }}>
                    <div style={{
                        fontWeight: 600, padding: '6px 8px', borderRadius: '4px', marginBottom: '6px',
                        background: readiness.botReady ? '#e8f5e9' : '#fdecea', color: readiness.botReady ? '#2e7d32' : '#c62828'
                    }}>
                        {readiness.botReady ? '🤖 ' : '⛔ '}{readiness.summary}
                    </div>
                    {readiness.items.map(item => (
                        <div key={item.key} title={item.ok ? '' : item.hint} style={{ color: item.ok ? '#2e7d32' : item.required ? '#c62828' : '#b26a00', marginBottom: '2px' }}>
                            {item.ok ? '✅' : item.required ? '🔴' : '⚠️'} {item.label}{item.key === 'catalog' && item.ok ? ` (${readiness.products})` : ''}
                            {!item.ok && <div style={{ color: 'var(--texto-suave)', marginLeft: '20px' }}>{item.hint}</div>}
                        </div>
                    ))}
                </div>
            );
        }

        function ConnectResult({ result }) {
            if (!result) return null;
            return (
                <div style={{ marginTop: '10px', fontSize: '12px' }}>
                    {result.steps.map((step, i) => (
                        <div key={i} style={{ color: step.ok ? '#2e7d32' : '#c62828' }}>{step.ok ? '✅' : '⚠️'} {step.detail}</div>
                    ))}
                </div>
            );
        }

        function PlatIcon({ name, size = 18, color = 'currentColor' }) {
            const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true };
            switch (name) {
                case 'check': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#22A559" /><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" /></svg>;
                case 'cross': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E5484D" /><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" /></svg>;
                case 'warn': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z" fill="#F5A524" stroke="#F5A524" strokeWidth="2" strokeLinejoin="round" /><path d="M12 9.5v4.5M12 17h.01" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" /></svg>;
                case 'building': return <svg {...p}><path d="M4 21V5.5A1.5 1.5 0 0 1 5.5 4h8A1.5 1.5 0 0 1 15 5.5V21M15 9h3.5a1.5 1.5 0 0 1 1.5 1.5V21M2.5 21h19M8 8h3M8 12h3M8 16h3" /></svg>;
                case 'whatsapp': return <svg {...p}><path d="M20 12a8 8 0 0 1-11.8 7L4 20l1.100-4.1A8 8 0 1 1 20 12z" /><path d="M9.2 8.8c0 3 2 5.2 5 5.8l1.200-1.400-1.800-.9-.8.7a4.2 4.2 0 0 1-1.800-1.8l.7-.8-.9-1.8z" /></svg>;
                case 'key': return <svg {...p}><circle cx="8" cy="15" r="4" /><path d="M11 12l9-9M16 7l3 3M14 9l2 2" /></svg>;
                case 'chat': return <svg {...p}><path d="M4 5h16v11H9.5L5 20v-4H4z" /><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" /></svg>;
                case 'chevron': return <svg {...p}><path d="M9 6l6 6-6 6" /></svg>;
                case 'robot': return <svg {...p}><rect x="4.5" y="8" width="15" height="11" rx="3" /><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5M2.5 13v2M21.5 13v2" /></svg>;
                case 'users': return <svg {...p}><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><circle cx="17" cy="9" r="2.5" /><path d="M17.5 14.5a5 5 0 0 1 4 5" /></svg>;
                case 'pause': return <svg {...p}><rect x="5" y="4" width="14" height="16" rx="3" /><path d="M10 9v6M14 9v6" /></svg>;
                case 'play': return <svg {...p}><path d="M7 4.5l12 7.500-12 7.5z" /></svg>;
                case 'trash': return <svg {...p}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" /></svg>;
                case 'plus': return <svg {...p}><path d="M12 5v14M5 12h14" /></svg>;
                case 'refresh': return <svg {...p}><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5" /></svg>;
                case 'enter': return <svg {...p}><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M4 12h11M11 8l4 4-4 4" /></svg>;

                case 'gear': return <svg {...p}><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" /></svg>;
                case 'doc': return <svg {...p}><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" /></svg>;
                case 'bag': return <svg {...p}><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2" /></svg>;
                case 'box': return <svg {...p}><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" /></svg>;
                case 'search': return <svg {...p}><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>;
                case 'send': return <svg {...p}><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z" /></svg>;
                case 'camera': return <svg {...p}><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>;
                case 'user': return <svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>;
                case 'pin': return <svg {...p}><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></svg>;
                case 'tag': return <svg {...p}><path d="M3 12V4h8l10 10-8 8z" /><circle cx="7.5" cy="8.5" r="1.2" /></svg>;
                case 'cart': return <svg {...p}><path d="M3 4h3l2.5 11h10L21 7H7" /><circle cx="9" cy="19" r="1.5" /><circle cx="17" cy="19" r="1.5" /></svg>;
                case 'clock': return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>;
                case 'calendar': return <svg {...p}><rect x="3.5" y="5" width="17" height="15" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>;
                case 'chart': return <svg {...p}><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-8" /></svg>;

        function PlatRow({ icon, children, hint, sub, onClick, muted, summary, action }) {
            const color = icon === 'robot' ? '#6C5CE7' : '#7B86B0';
            const inner = (
                <>
                    <PlatIcon name={icon} size={22} color={color} />
                    <span className="txt">{children}{hint && <span className="hint">{hint}</span>}{sub && <span className="sub">{sub}</span>}</span>
                    {action && <span className="cfg"><PlatIcon name="gear" size={15} color="#2563EB" /> {action}</span>}
                    {onClick && <span className="chev"><PlatIcon name="chevron" size={16} /></span>}
                </>
            );
            const cls = 'pl-row' + (muted ? ' muted' : '') + (summary ? ' summary' : '');
            return onClick ? <button type="button" className={cls} onClick={onClick}>{inner}</button> : <div className={cls}>{inner}</div>;
        }

        function BusinessCard({ business, selected, onSelect, onChanged, usage }) {

            async function saveKeys() {
                const problem = credentialProblem(form);

                setBusy(true);

                    await api(`/api/businesses/${business.id}/credentials`, { method: 'PUT', body: JSON.stringify(form) });

                    setMode(null);
                    onChanged();

                    alert('Error guardando claves: ' + err.message);

                    setBusy(false);

                setBusy(true);
                setTestResult(null);
                try {
                    setTestResult(await api(`/api/businesses/${business.id}/test-credentials`, { method: 'POST' }));

                    alert('Error probando claves: ' + err.message);
                } finally {
                    setBusy(false);

            async function toggleActive() {
                const message = business.active
                    ? `¿Suspender ${business.name}?\n\n• El bot deja de responder en su número de WhatsApp.\n• Se detienen sus seguimientos automáticos.\n• Sus usuarios no pueden entrar al CRM.\n\nNo se borra nada: al reactivarla vuelve todo como estaba.`
                    : `¿Reactivar ${business.name}? El bot vuelve a responder y sus usuarios pueden entrar de nuevo.`;
                if (!confirm(message)) return;
                try {
                    await api(`/api/businesses/${business.id}`, { method: 'PATCH', body: JSON.stringify({ active: !business.active }) });

                } catch (err) {
                    alert('Error: ' + err.message);

            async function deleteCompany() {
                if (business.active) {
                    return alert(`Para eliminar ${business.name}, primero suspéndela.`);

                const typed = prompt(
                    `⚠️ ELIMINAR ${business.name} PARA SIEMPRE\n\n` +
                    'Se borrarán todos sus chats, mensajes, cotizaciones, pedidos, catálogo, fotos, archivos, usuarios, configuración y claves. No se puede deshacer.\n\n' +
                    `Para confirmar, escribe el nombre exacto de la empresa: ${business.name}`

                setBusy(true);
                try {
                    const result = await api(`/api/businesses/${business.id}`, { method: 'DELETE', body: JSON.stringify({ confirmName: typed.trim() }) });

                    const files = (s['archivos_product-images'] || 0) + (s['archivos_chat-media'] || 0);
                    alert(`${business.name} fue eliminada por completo.\n\nChats: ${s.conversations || 0} · Mensajes: ${s.messages || 0} · Pedidos: ${s.orders || 0} · Cotizaciones: ${s.quotations || 0} · Productos: ${s.products || 0} · Usuarios: ${s.business_users || 0} · Archivos: ${files}`);

            if (!business.active) pill = { cls: 'off', text: 'Suspendida' };
            else if (business.legacy) pill = business.whatsapp_configured && business.openai_configured ? { cls: 'ok', text: 'Lista para usar' } : { cls: 'bad', text: 'Falta configurar' };
            else if (!readiness) pill = { cls: 'off', text: 'Sin revisar' };
            else if (!readiness.botReady) pill = { cls: 'bad', text: 'El bot no atiende' };
            else if (items.some(i => !i.ok)) pill = { cls: 'warn', text: 'Configuración pendiente' };

            const keysItems = ['whatsapp', 'webhook', 'openai'];

                                <PlatRow icon={business.openai_configured ? 'check' : 'cross'}>{business.openai_configured ? 'OpenAI configurado' : 'Falta la clave de OpenAI'}</PlatRow>
                            </>

                            <>
                                <PlatRow icon="robot" summary>{readiness.summary}</PlatRow>
                                {items.map(item => (
                                    <PlatRow
                                        key={item.key}
                                        icon={item.ok ? 'check' : item.required ? 'cross' : 'warn'}
                                        hint={item.ok ? undefined : item.hint}
                                        action={item.ok ? undefined : 'Configurar'}
                                        onClick={keysItems.includes(item.key) ? openKeys : goCompany}

                        <button className="pl-btn" onClick={() => setMode(mode === 'access' ? null : 'access')}><PlatIcon name="users" size={19} color="#4F7BF0" /> Usuarios</button>

                    </div>

                    {mode === 'keys' && (

                            <CredentialFields form={form} setForm={setForm} business={business} />

                                        onChanged();

                                        alert('Error conectando: ' + err.message);
                                    } finally {
                                        setBusy(false);
                                    }
                                }}>📲 Conectar WhatsApp</button>
                            </div>
                            {testResult && (
                                <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    {status(testResult.whatsapp.ok, `WhatsApp: ${testResult.whatsapp.detail}`)}
                                    {status(testResult.openai.ok, `OpenAI: ${testResult.openai.detail}`)}

                    {mode === 'access' && <CompanyUsers company={business} />}
                </div>
            );

        /** Tokens en miles: 1.234.567 → "1,2 M". */
        function shortTokens(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.', ',') + ' M';
            if (n >= 1000) return Math.round(n / 1000) + ' mil';
            return String(n);
        }

        /** Montos chicos: $0,0043 se lee mejor que $0,00. */
        function money(value) {
            if (!value) return '$0';
            const decimals = value < 0.01 ? 4 : 2;
            return '$' + value.toFixed(decimals).replace('.', ',');
        }

        function UsageRow({ usage }) {
            if (!usage || !usage.month?.calls) return <PlatRow icon="chat" muted>Sin consumo de IA registrado</PlatRow>;
            const { today, week, month } = usage;
            const cachePct = month.input ? Math.round(month.cached * 100 / month.input) : 0;
            return (
                <PlatRow icon="chat" muted sub={month.calls + ' respuestas en 30 días · ' + shortTokens(month.input) + ' de entrada (' + cachePct + '% en caché) · ' + shortTokens(month.output) + ' de salida'}>
                    Gasto de IA: hoy <b>{money(today.cost)}</b> · 7 días <b>{money(week.cost)}</b> · 30 días <b>{money(month.cost)}</b>
                </PlatRow>
            );
        }

        function LoginScreen({ onLogin, branding }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [checking, setChecking] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            const [remember, setRemember] = useState(true);

            async function submit() {
                if (!username.trim() || !password) {
                    setError('Escribe tu usuario y tu contraseña');
                    return;
                }
                setChecking(true);
                setError('');
                try {
                    const res = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username.trim(), password })
                    });
                    const data = await res.json().catch(() => ({ error: 'El servidor no está disponible, intenta en unos segundos' }));
                    if (!res.ok) throw new Error(data.error || 'No se pudo entrar');
                    setToken(data.token);
                    // Sin "Recordarme" la sesión vive solo mientras la pestaña esté abierta.
                    if (!remember) { try { localStorage.removeItem(TOKEN_KEY); } catch { /* solo memoria */ } }
                    // Un usuario entra siempre a su empresa; la administradora empieza en la pantalla de empresas.

        const TIMEZONES = ['America/Guayaquil', 'America/Bogota', 'America/Lima', 'America/Caracas', 'America/Panama', 'America/Mexico_City', 'America/Santiago', 'America/Argentina/Buenos_Aires', 'America/La_Paz', 'America/Asuncion', 'America/Montevideo', 'America/New_York', 'Europe/Madrid'];

        function setIn(obj, path, value) {
            const copy = JSON.parse(JSON.stringify(obj));
            const keys = path.split('.');
            let target = copy;
            for (const key of keys.slice(0, -1)) target = target[key];
            target[keys[keys.length - 1]] = value;
            return copy;
        }

        const getIn = (obj, path) => path.split('.').reduce((o, key) => (o == null ? undefined : o[key]), obj);

        function BusinessProfileForm({ onSaved }) {
