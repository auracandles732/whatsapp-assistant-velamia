                                        const label = conv.customer_name || conv.phone_number;
                                        return (
                                            <div key={conv.id} className={'nx-item' + (selectedConv?.id === conv.id ? ' active' : '') + (unreadMap[conv.id] ? ' unread' : '')} onClick={() => setSelectedConv(conv)}>
                                                <Avatar name={label} size={44} />
                                                <div className="body">
                                                    <div className="row">
                                                        <span className="name">{label}</span>
                                                        <span className="time">{listTime(conv.last_message_time)}</span>
                                                    </div>
                                                    {preview && preview.text && <div className="prev">{preview.sender === 'customer' ? '' : 'Tú: '}{preview.text}</div>}
                                                    <div className="foot">
                                                        <span className={'nx-dot' + (isRecent(conv) ? ' live' : '')}></span>
                                                        {isBotPausedIn(conv) && <span className="nx-need">Te necesita</span>}
                                                        {unreadMap[conv.id] > 0 && <span className="nx-unread">{unreadMap[conv.id]}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {selectedConv ? (
                                <div className="nx-panel nx-chat">
                                    <div className="nx-chat-head">
                                        <button type="button" className="nx-icon-btn nx-back" onClick={() => setSelectedConv(null)}>← Chats</button>
                                        <Avatar name={currentConv.customer_name || currentConv.phone_number} size={48} />
                                        <div className="who">
                                            <div className="nm">
                                                {currentConv.customer_name || currentConv.phone_number}
                                                {summary && summary.badges.map(b => <span key={b} className={'nx-badge ' + (b === 'Cliente' ? 'green' : b === 'Interesado' ? 'violet' : 'gray')}>{b}</span>)}
                                                <span className={'nx-badge ' + (botPausedInChat ? 'red' : 'gray')}>{botPausedInChat ? 'Bot pausado: atiendes tú' : 'El bot atiende'}</span>
                                                {isClosedConv(currentConv) && <span className="nx-badge gray">Cerrada</span>}
                                            </div>
                                            <div className="ph">{'+' + currentConv.phone_number}</div>
                                            {summary && summary.phase2 && <TagBar tags={summary.tags || []} onChange={saveTags} readOnly={!canEdit} />}
                                        </div>
                                        <div className="nx-head-actions">
                                            {canEdit && (
                                                <>
                                                    <button type="button" className="nx-icon-btn" onClick={toggleClosed}>
                                                        <PlatIcon name={isClosedConv(currentConv) ? 'refresh' : 'check'} size={18} color="#4F5BD5" /> <span className="lbl-hide">{isClosedConv(currentConv) ? 'Reabrir' : 'Cerrar'}</span>
                                                    </button>
                                                    <button type="button" className="nx-icon-btn" onClick={pauseOrResumeBot} disabled={pausingBot}>
                                                        <PlatIcon name={botPausedInChat ? 'play' : 'pause'} size={18} color="#4F5BD5" /> <span className="lbl-hide">{botPausedInChat ? 'Reactivar bot' : 'Pausar bot'}</span>
                                                    </button>
                                                </>
                                            )}
                                            {canConfigure && (
                                                <button type="button" className="nx-icon-btn danger" onClick={deleteChat} disabled={deletingChat}>
                                                    <PlatIcon name="trash" size={18} color="#C33636" /> <span className="lbl-hide">{deletingChat ? 'Eliminando...' : 'Eliminar'}</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    <div className="nx-msgs" ref={messagesRef} onScroll={handleMessagesScroll}>
                                        {timeline.map((item, index) => {
                                            const newDay = index === 0 || dayKey(timeline[index - 1].ts) !== dayKey(item.ts);
                                            const dayPill = newDay ? <div className="nx-day">{dayLabel(item.ts)}</div> : null;
                                            if (item.kind === 'note') {
                                                const note = item.data;
                                                return (
                                                    <React.Fragment key={item.key}>
                                                        {dayPill}
                                                        <div className="nx-note">
                                                            <div className="meta"><span>📝 Nota interna · {note.author || 'Equipo'} · {formatTime(note.created_at)}</span>{canEdit && <button type="button" title="Borrar nota" onClick={() => removeNote(note)}>×</button>}</div>
                                                            {note.content}
                                                        </div>
                                                    </React.Fragment>
                                                );
                                            }
                                            const msg = item.data;
                                            const content = msg.content || '';
                                            // Solo en fotos, audios y documentos la primera línea es la URL del archivo;
                                            // un enlace que escribe la clienta se muestra tal cual.
                                            const urlMatch = MEDIA_TYPES.includes(msg.type) ? content.match(/^https?:\/\/\S+/) : null;
                                            const mediaUrl = urlMatch ? urlMatch[0] : null;
                                            const textPart = mediaUrl ? content.slice(mediaUrl.length).replace(/^\n/, '') : content;
                                            return (
                                                <React.Fragment key={item.key}>
                                                    {dayPill}
                                                    <div className={'nx-msg ' + msg.sender}>
                                                        <div className="nx-bubble">
                                                            {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} onLoad={keepAtBottom} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                            {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '220px', marginBottom: '6px', display: 'block' }} /> : null}
                                                            {msg.type === 'document' && mediaUrl ? <a href={mediaUrl} target="_blank" rel="noopener noreferrer" style={{ display: 'block', marginBottom: '6px', fontWeight: 600 }}>📎 Abrir documento</a> : null}
                                                            {renderWa(textPart)}
                                                            <div className="nx-time">{formatTime(msg.timestamp)}</div>
                                                        </div>
                                                    </div>
                                                </React.Fragment>
                                            );
                                        })}
                                    </div>

                                    {photoPicker && (
                                        <div className="cat-modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) setPhotoPicker(false); }}>
                                            <div className="cat-modal">
                                                <h2>Enviar foto</h2>
                                                <button type="button" onClick={sendPhoto} style={{ width: '100%', padding: '14px', borderRadius: '12px', border: '1px solid #DCE2F5', color: '#2563EB', fontWeight: 700, fontSize: '15px', marginBottom: '16px', background: '#F5F8FF', cursor: 'pointer' }}>📷 Subir desde este equipo (computador o celular)</button>
                                                <div style={{ fontWeight: 700, color: '#141C3A', marginBottom: '10px' }}>O elige una del catálogo</div>
                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))', gap: '10px' }}>
                                                    {products.filter(p => p.image_url).map(p => (
                                                        <button type="button" key={p.id || p.name} onClick={() => sendCatalogPhoto(p)} style={{ textAlign: 'left', background: '#fff', border: '1px solid #EEF1F9', borderRadius: '12px', padding: '6px', cursor: 'pointer' }}>
                                                            <img src={p.image_url} style={{ width: '100%', aspectRatio: '1 / 1', objectFit: 'cover', borderRadius: '8px' }} />
                                                            <div style={{ fontSize: '12px', fontWeight: 600, color: '#1E2A4A', marginTop: '4px' }}>{p.name}</div>
                                                        </button>
                                                    ))}
                                                </div>
                                                {products.filter(p => p.image_url).length === 0 && <div className="cat-empty">Aún no hay productos con foto en el catálogo.</div>}
                                                <div className="foot"><button type="button" className="cancel" onClick={() => setPhotoPicker(false)}>Cancelar</button></div>
                                            </div>
                                        </div>
                                    )}

                                    {!canEdit && <div className="nx-readonly"><PlatIcon name="user" size={18} color="#6B7599" /> Tu usuario es solo de consulta: puedes ver los chats, pero no responder.</div>}
                                    {canEdit && <div className={'nx-input' + (noteMode ? ' note' : '')}>
                                        <button type="button" className="nx-round" onClick={() => setPhotoPicker(true)} title="Enviar foto"><PlatIcon name="camera" size={22} color="#4F5BD5" /></button>
                                        <textarea
                                            placeholder={noteMode ? 'Nota interna: el cliente no la ve...' : 'Escribe un mensaje...'}
                                            value={noteMode ? noteText : inputText}
                                            onChange={e => (noteMode ? setNoteText(e.target.value) : setInputText(e.target.value))}
                                            onKeyPress={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    if (noteMode) saveNote(); else sendMessage();
                                                }
                                            }}
                                        ></textarea>
                                        {summary && summary.phase2 && (
                                            <button type="button" className={'nx-note-btn' + (noteMode ? ' on' : '')} onClick={() => setNoteMode(!noteMode)} title="Nota interna (el cliente no la ve)">
                                                <PlatIcon name="note" size={18} color={noteMode ? '#7A5F00' : '#4F5BD5'} /> <span className="lbl-hide">Nota</span>
                                            </button>
                                        )}
                                        {noteMode
                                            ? <button type="button" className="nx-send" onClick={saveNote}><PlatIcon name="note" size={19} color="#fff" /> Guardar nota</button>
                                            : <button type="button" className="nx-send" onClick={sendMessage} disabled={sending}><PlatIcon name="send" size={19} color="#fff" /> {sending ? 'Enviando...' : 'Enviar'}</button>}
                                    </div>}
                                </div>
                            ) : (
                                <div className="nx-panel nx-chat">
                                    <div className="nx-empty">
                                        <PlatIcon name="chat" size={44} color="#B6BEE0" />
                                        <span>Selecciona una conversación</span>
                                    </div>
                                </div>
                            )}

                            <div className="nx-side">
                                <TodayCard data={today} />
                                {selectedConv && <ClientCard summary={summary} conv={currentConv} />}
                                {selectedConv && <ProductsCard summary={summary} onCatalog={() => setActiveTab('catalogo')} />}
                                {selectedConv && summary && summary.phase2 && <TasksCard tasks={summary.tasks} onAdd={addTask} onToggle={setTaskDone} onRemove={removeTask} readOnly={!canEdit} />}
                                {selectedConv && <AlertsCard alerts={summary ? summary.alerts : []} loading={!summary} />}
                            </div>
                        </div>
                        )}
                        {activeTab === 'catalogo' && <CatalogView products={products} biz={biz} legacy={!!session?.business?.legacy} reload={loadProducts} readOnly={!canEdit} />}
                        {activeTab === 'cotizaciones' && (() => {
                            const statusLabels = { pending: 'Pendiente', accepted: 'Aceptada', expired: 'Vencida' };
                            const visible = quoteFilter === 'all' ? quotations : quotations.filter(q => q.status === quoteFilter);
                            const total = visible.reduce((sum, q) => sum + Number(q.total_amount || 0), 0);
                            return (
                            <div className="quotes-container">
                                <div className="quotes-toolbar">
                                    <select value={quoteFilter} onChange={e => setQuoteFilter(e.target.value)}>
                                        <option value="all">Todas</option>
                                        <option value="pending">Pendientes</option>
                                        <option value="accepted">Aceptadas</option>
                                        <option value="expired">Vencidas</option>
                                    </select>
                                    <span>{visible.length} cotización(es) · ${total.toFixed(2)}</span>
                                </div>
                                {visible.length === 0 ? (
                                    <div className="empty-catalog"><p>Aún no hay cotizaciones. Se anotan solas cada vez que el bot le da a una clienta el valor total de su pedido, y te llega un aviso por WhatsApp 🧾</p></div>
                                ) : visible.map(q => {
                                    let items = [];
                                    try { items = typeof q.products === 'string' ? JSON.parse(q.products) : (q.products || []); } catch { items = []; }
                                    const customer = q.conversations?.customer_name || q.conversations?.phone_number || q.customer_phone;
                                    return (
                                        <div key={q.id} className="quote-card">
                                            <div className="quote-head">
                                                <div>
                                                    <div className="quote-customer">📱 {customer}</div>
                                                    <div className="quote-meta">
                                                        {formatDateTime(q.created_at)} · Código {q.id.substring(0, 8).toUpperCase()} · Válida hasta {formatDateTime(q.expires_at)}
                                                    </div>
                                                </div>
                                                <div className="quote-total">${Number(q.total_amount || 0).toFixed(2)}</div>
                                            </div>
                                            <ul className="quote-items">
                                                {items.map((item, i) => item.type === 'delivery' ? (
                                                    <li key={i}>📅 Entrega: {String(item.date || '').split('-').reverse().join('/')}</li>
                                                ) : item.type === 'shipping' ? (
                                                    <li key={i}>🚚 {item.name} — ${Number(item.price).toFixed(2)}</li>
                                                ) : (
                                                    <li key={i}>
                                                        {item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural} × {item.name} — ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                                        {item.personalization ? <><br /><small>🎨 {item.personalization}</small></> : null}
                                                        {item.packaging ? <><br /><small>🎁 Empaque {item.packaging}{item.packagingChanged ? ' (cambiado por la clienta)' : ''}</small></> : null}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="quote-actions">
                                                <span className={`quote-status ${q.status}`}>{statusLabels[q.status] || q.status}</span>
                                                <select value={q.status} disabled={!canEdit} onChange={e => changeQuotationStatus(q.id, e.target.value)}>
                                                    <option value="pending">Pendiente</option>
                                                    <option value="accepted">Aceptada</option>
                                                    <option value="expired">Vencida</option>
                                                </select>
                                                <button className="btn-photo" onClick={() => openChatFromQuotation(q.conversation_id)}>💬 Ver chat</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            );
                        })()}
                        {activeTab === 'pedidos' && (() => {
                            const orderLabels = { pending: 'Pendiente de pago', confirmed: 'Pagado · en preparación', shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado' };
                            const visible = orderFilter === 'all' ? orders : orders.filter(o => o.status === orderFilter);
                            const total = visible.filter(o => o.status !== 'cancelled').reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
                            return (
                            <div className="quotes-container">
                                <div className="quotes-toolbar">
                                    <select value={orderFilter} onChange={e => setOrderFilter(e.target.value)}>
                                        <option value="all">Todos</option>
                                        {Object.entries(orderLabels).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                    </select>
                                    <span>{visible.length} pedido(s) · ${total.toFixed(2)}</span>
                                </div>
                                <p className="hint" style={{ margin: '0 0 12px', fontSize: '12px', color: 'var(--texto-suave)' }}>Marca el avance de cada pedido: el asistente usa este estado cuando la clienta pregunta cómo va su pedido.</p>
                                {visible.length === 0 ? (
                                    <div className="empty-catalog"><p>Aún no hay pedidos. Se registran solos cuando una clienta confirma su compra o elige cómo pagar 🛍️</p></div>
                                ) : visible.map(o => {
                                    let items = [];
                                    try { items = typeof o.products === 'string' ? JSON.parse(o.products) : (o.products || []); } catch { items = []; }
                                    const customer = o.customer_name || o.conversations?.customer_name || o.conversations?.phone_number || o.customer_phone;
                                    return (
                                        <div key={o.id} className="quote-card">
                                            <div className="quote-head">
                                                <div>
                                                    <div className="quote-customer">📱 {customer}</div>
                                                    <div className="quote-meta">
                                                        {formatDateTime(o.created_at)} · Código {o.id.substring(0, 8).toUpperCase()}
                                                        {o.delivery_date ? ` · Entrega ${String(o.delivery_date).slice(0, 10).split('-').reverse().join('/')}` : ''}
                                                    </div>
                                                </div>
                                                <div className="quote-total">${Number(o.total_amount || 0).toFixed(2)}</div>
                                            </div>
                                            <ul className="quote-items">
                                                {items.map((item, i) => item.type === 'delivery' ? null : item.type === 'shipping' ? (
                                                    <li key={i}>🚚 {item.name} — ${Number(item.price).toFixed(2)}</li>
                                                ) : (
                                                    <li key={i}>
                                                        {item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural} × {item.name} — ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                                        {item.personalization ? <><br /><small>🎨 {item.personalization}</small></> : null}
                                                        {item.packaging ? <><br /><small>🎁 Empaque {item.packaging}{item.packagingChanged ? ' (cambiado por la clienta)' : ''}</small></> : null}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="quote-actions">
                                                <span className={`quote-status ${o.status}`}>{orderLabels[o.status] || o.status}</span>
                                                <select value={o.status} disabled={!canEdit} onChange={e => changeOrderStatus(o.id, e.target.value)}>
                                                    {Object.entries(orderLabels).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                                </select>
                                                <button className="btn-photo" onClick={() => openChatFromQuotation(o.conversation_id)}>💬 Ver chat</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            );
                        })()}
                        {activeTab === 'configuracion' && (
                        <div className="settings-container nx-cfg-page">
                            <BusinessProfileForm
                                legacy={!!session?.business?.legacy}
                                readOnly={!canConfigure}
                                canTest={canEdit}
                                onSaved={saved => {
                                    setBiz(saved);
                                    onBrandingChange({ name: saved.business.name, primaryColor: saved.branding.primaryColor, logoUrl: saved.branding.logoUrl, timezone: saved.business.timezone });
                                }}
                                extras={[
                                    {
                                        id: 'transferencia', icon: 'building', label: 'Datos de transferencia', title: 'Datos para transferencia',
                                        subtitle: 'Lo que el bot envía cuando la clienta paga por transferencia',
                                        node: (
                                            <>
                                                <p className="hint">Cuando una clienta elige pagar por transferencia, el bot le indica {biz && biz.payments.depositPercent < 100 ? 'el anticipo del ' + biz.payments.depositPercent + '%' : 'el total a pagar'} y le envía este texto exactamente como lo escribas.{biz?.payments.cardEnabled ? ' Con tarjeta, el bot indica el pago del total, se pausa y te avisa para que envíes el link de pago.' : ''}</p>
                                                <textarea
                                                    className="prompt-textarea"
                                                    style={{ minHeight: '140px' }}
                                                    placeholder={'Banco:\nTipo de cuenta:\nNúmero de cuenta:\nTitular:\nCédula / RUC:\n\nEnvíanos el comprobante por este chat 🤍'}
                                                    value={transferInfo}
                                                    onChange={e => setTransferInfo(e.target.value)}
                                                ></textarea>
                                                <div className="settings-actions">
                                                    <span className="save-status">{transferSaved ? '✅ Guardado' : (transferInfo.trim() ? '' : '⚠️ Sin datos: el bot te avisará cuando una clienta elija transferencia')}</span>
                                                    <button type="button" className="btn-save-prompt" onClick={savePaymentInfo} disabled={savingTransfer || !canConfigure}>
                                                        {savingTransfer ? 'Guardando...' : '💾 Guardar datos de pago'}
                                                    </button>
                                                </div>
                                            </>
                                        )
                                    },
                                    {
                                        id: 'instrucciones', icon: 'sparkle', label: 'Instrucciones', title: 'Instrucciones del asistente',
                                        subtitle: 'El tono y los detalles de tu negocio que no están en el perfil',
                                        node: (
                                            <>
                                                <p className="hint">Aquí defines el tono del asistente y detalles de tu negocio que no están en el perfil (horarios, políticas, preguntas frecuentes). Se aplica de inmediato en todos los chats. Precios, pagos, envíos y fechas vienen del Perfil del negocio y mandan sobre lo que escribas aquí.</p>
                                                <textarea
                                                    className="prompt-textarea"
                                                    style={{ minHeight: '260px' }}
                                                    placeholder={'Ej: Eres parte del equipo de ' + (branding.name || 'mi negocio') + '. Responde siempre en español, de forma cálida y cercana, con mensajes cortos y algún emoji.'}
                                                    value={systemPrompt}
                                                    onChange={e => setSystemPrompt(e.target.value)}
                                                ></textarea>
                                                <div className="settings-actions">
                                                    <span className="save-status">{promptSaved ? '✅ Guardado' : ''}</span>
                                                    <button type="button" className="btn-save-prompt" onClick={saveSystemPrompt} disabled={savingPrompt || !canConfigure}>
                                                        {savingPrompt ? 'Guardando...' : '💾 Guardar instrucciones'}
                                                    </button>
                                                </div>
                                            </>
                                        )
                                    }
                                ]}
                            />
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        // Plataforma general: la marca de cada empresa se aplica recién al entrar en ella.
        const PLATFORM_BRANDING = { name: '', primaryColor: '', logoUrl: '', timezone: '' };

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());
            const [role, setRole] = useState(null);
            const [branding, setBranding] = useState(PLATFORM_BRANDING);

            useEffect(() => {
                onSessionExpired = () => { setRole(null); setAuthenticated(false); };
                document.title = 'Nexly';
            }, []);

            // Quién entró: la administradora sin empresa elegida ve la pantalla general de empresas.
            useEffect(() => {
                if (!authenticated) return;
                api('/api/session')
                    .then(data => setRole(data.role))
                    .catch(() => {
                        // La empresa elegida ya no existe o está desactivada: se vuelve a la pantalla general.
                        if (getCurrentBusinessId()) {
                            setCurrentBusinessId('');
                            window.location.reload();
                        }
                    });
            }, [authenticated]);

            const changeBranding = data => {
                applyBranding(data);
                setBranding(data);
            };

            const logout = () => {
                setToken(null);
                setCurrentBusinessId('');
                setRole(null);
                setAuthenticated(false);
            };

            if (!authenticated) {
                return <LoginScreen branding={PLATFORM_BRANDING} onLogin={() => setAuthenticated(true)} />;
            }
            if (!role) return <NexlyLoading />;
            if (role === 'admin' && !getCurrentBusinessId()) {
                return <CompanyHome onLogout={logout} />;
            }

            return <App branding={branding} onBrandingChange={changeBranding} onLogout={logout} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
