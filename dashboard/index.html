            );
        }

        function ProductsCard({ summary, onCatalog }) {
            const list = summary?.products || [];
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="box" size={20} color="#4F5BD5" /> Productos consultados</h3>
                        <button type="button" className="link" onClick={onCatalog}>Ver catálogo</button>
                    </div>
                    {!summary ? <div className="nx-soft">Cargando...</div> : list.length === 0 ? <div className="nx-soft">Todavía no se le han mostrado productos.</div> : list.slice(0, 5).map(item => (
                        <div className="nx-prod" key={item.name}>
                            {item.image_url ? <img src={item.image_url} alt="" /> : <div className="noimg"><PlatIcon name="box" size={26} color="#9AA3C7" /></div>}
                            <div className="info">
                                <div className="pn">{item.name}</div>
                                <div className="pu">{[item.unit, item.measure].filter(Boolean).join(' · ')}</div>
                                <div className="pp">
                                    <span>{item.price !== null ? '$' + item.price.toFixed(2) : ''}</span>
                                    <span className="times">Consultado {item.times} {item.times === 1 ? 'vez' : 'veces'}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        const TAG_SUGGESTIONS = ['VIP', 'Mayorista', 'Seguimiento', 'Urgente', 'Pago pendiente'];

        function TagBar({ tags, onChange, readOnly = false }) {
            const [adding, setAdding] = useState(false);
            const [value, setValue] = useState('');
            function commit() {
                const tag = value.trim();
                setAdding(false);
                setValue('');
                if (tag && !tags.some(t => t.toLowerCase() === tag.toLowerCase())) onChange([...tags, tag]);
            }
            return (
                <div className="nx-tags">
                    {tags.map(tag => (
                        <span className="nx-tag" key={tag}>{tag}{!readOnly && <button type="button" title="Quitar etiqueta" onClick={() => onChange(tags.filter(t => t !== tag))}>×</button>}</span>
                    ))}
                    {adding ? (
                        <>
                            <input
                                className="nx-tag-input"
                                autoFocus
                                list="nx-tag-suggestions"
                                maxLength={24}
                                placeholder="Nueva etiqueta"
                                value={value}
                                onChange={e => setValue(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setAdding(false); setValue(''); } }}
                                onBlur={commit}
                            />
                            <datalist id="nx-tag-suggestions">{TAG_SUGGESTIONS.filter(t => !tags.includes(t)).map(t => <option key={t} value={t} />)}</datalist>
                        </>
                    ) : !readOnly && tags.length < 8 && <button type="button" className="nx-tag-add" title="Agregar etiqueta" onClick={() => setAdding(true)}>+</button>}
                </div>
            );
        }

        function taskDueInfo(task) {
            if (!task.due_date) return { label: 'Sin fecha', cls: 'pend', text: 'Pendiente' };
            const todayKey = new Date().toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ });
            const date = new Date(task.due_date + 'T12:00:00');
            const pretty = date.toLocaleDateString('es-EC', { day: 'numeric', month: 'long' });
            if (task.due_date < todayKey) return { label: pretty, cls: 'late', text: 'Atrasada' };
            if (task.due_date === todayKey) return { label: 'Hoy, ' + pretty, cls: 'today', text: 'Hoy' };
            return { label: pretty, cls: 'pend', text: 'Pendiente' };
        }

        function TasksCard({ tasks, onAdd, onToggle, onRemove, readOnly = false }) {
            const [open, setOpen] = useState(false);
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const pending = tasks.filter(t => !t.done).sort((a, b) => (a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1);
            async function save() {
                if (!title.trim()) return;
                await onAdd(title.trim(), date);
                setTitle('');
                setDate('');
                setOpen(false);
            }
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="check" size={20} /> Próxima acción</h3>
                        {!readOnly && pending.length > 0 && <button type="button" className="link" onClick={() => onToggle(pending[0], true)}>Marcar como completada</button>}
                    </div>
                    {pending.length === 0 && !open && <div className="nx-soft">No hay acciones pendientes.</div>}
                    {pending.map(task => {
                        const info = taskDueInfo(task);
                        return (
                            <div className="nx-task" key={task.id}>
                                {readOnly ? <span className="nx-check off"></span> : <button type="button" className="nx-check" title="Marcar como hecha" onClick={() => onToggle(task, true)}></button>}
                                <div className="info">
                                    <div className="tt">{task.title}</div>
                                    <div className="dd">{info.label}</div>
                                </div>
                                <span className={'nx-status ' + info.cls}>{info.text}</span>
                                {!readOnly && <button type="button" className="x" title="Borrar" onClick={() => onRemove(task)}>×</button>}
                            </div>
                        );
                    })}
                    {open ? (
                        <div className="nx-form">
                            <input type="text" autoFocus maxLength={160} placeholder="Ej: enviar confirmación de pedido" value={title} onChange={e => setTitle(e.target.value)} onKeyDown={e => e.key === 'Enter' && save()} />
                            <input type="date" value={date} onChange={e => setDate(e.target.value)} />
                            <div className="row">
                                <button type="button" className="save" onClick={save}>Guardar</button>
                                <button type="button" className="cancel" onClick={() => { setOpen(false); setTitle(''); setDate(''); }}>Cancelar</button>
                            </div>
                        </div>
                    ) : !readOnly && <button type="button" className="nx-add-link" onClick={() => setOpen(true)}>+ Agregar acción</button>}
                </div>
            );
        }

        function AlertsCard({ alerts, loading }) {
            return (
                <div className="nx-card">
                    <div className="nx-card-h"><h3><PlatIcon name="sparkle" size={20} color="#7C5CF0" /> Alertas</h3></div>
                    {loading ? <div className="nx-soft">Cargando...</div> : alerts.length === 0 ? <div className="nx-soft">Sin alertas por ahora.</div> : alerts.map(alert => (
                        <div className={'nx-alert ' + alert.level} key={alert.title}>
                            <PlatIcon name={alert.level === 'warn' ? 'clock' : 'bulb'} size={22} color={alert.level === 'warn' ? '#B36B00' : '#7C5CF0'} />
                            <div>
                                <div className="at">{alert.title}</div>
                                <div className="ax">{alert.text}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function readPhoto(file, done) {
            if (!file) return;
            // WhatsApp solo envía fotos JPG o PNG de hasta 5 MB.
            if (!['image/jpeg', 'image/png'].includes(file.type)) {
                alert('La foto debe ser JPG o PNG. WhatsApp no puede enviar otros formatos.');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('La foto pesa más de 5 MB. Usa una foto más liviana para que WhatsApp la pueda enviar.');
                return;
            }
            const reader = new FileReader();
            reader.onload = () => done(reader.result);
            reader.readAsDataURL(file);
        }

        function CatField({ icon, label, wide, children }) {
            return (
                <div className={'cat-f' + (wide ? ' wide' : '')}>
                    <label>{label}</label>
                    <div className="cat-in"><span className="ic"><PlatIcon name={icon} size={18} color="#6B7599" /></span>{children}</div>
                </div>
            );
        }

        /** Campos de un producto (los usa el formulario de agregar y la ventana de editar). Unidad y medida solo si el negocio las usa. */
        function ProductFields({ value, onChange, biz, categories, listId }) {
            const perProductUnits = !!biz?.sales?.perProductUnits;
            const genderTagging = !!biz?.sales?.genderTagging;
            const unit = biz?.sales?.unitSingular || 'unidad';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const categoryLabel = biz?.dates?.enabled ? 'Categoría / ' + biz.dates.eventLabel : 'Categoría';
            const set = (key, v) => onChange({ ...value, [key]: v });
            return (
                <>
                    <CatField icon="tag" label="Nombre del producto">
                        <input type="text" placeholder="Ej: nombre de tu producto" value={value.name} onChange={e => set('name', e.target.value)} />
                    </CatField>
                    <CatField icon="dollar" label={'Precio por ' + unit + ' ($)'}>
                        <input type="number" min="0" step="0.01" placeholder="Ej: 25.00" value={value.price} onChange={e => set('price', e.target.value)} />
                    </CatField>
                    <CatField icon="bag" label={categoryLabel}>
                        <input type="text" list={listId} placeholder="Ej: la categoría del producto" value={value.category} onChange={e => set('category', e.target.value)} />
                        <datalist id={listId}>{categories.map(c => <option key={c} value={c} />)}</datalist>
                    </CatField>
                    {perProductUnits && (
                        <>
                            <CatField icon="box" label={<>Unidad de venta <i>(opcional)</i></>}>
                                <input type="text" placeholder="Ej: caja de 10, tubo, metro" value={value.sale_unit} onChange={e => set('sale_unit', e.target.value)} />
                            </CatField>
                            <CatField icon="ruler" label={<>Medida <i>(opcional)</i></>}>
                                <input type="text" placeholder="Ej: 2,95 m x 0,17 m" value={value.measure} onChange={e => set('measure', e.target.value)} />
                            </CatField>
                            <CatField icon="layers" label={<>Unidades que trae <i>(opcional)</i></>}>
                                <input type="number" min="2" step="1" placeholder="Ej: 10 si la caja trae 10" value={value.pieces_per_unit} onChange={e => set('pieces_per_unit', e.target.value)} />
                            </CatField>
                        </>
                    )}
                    {genderTagging && (
                        <CatField icon="user" label="Es para">
                            <select value={value.gender || ''} onChange={e => set('gender', e.target.value)}>
                                <option value="">Neutro (para ambos)</option>
                                <option value="niño">Niño</option>
                                <option value="niña">Niña</option>
                            </select>
                        </CatField>
                    )}
                    {packagingTypes.length > 0 && (
                        <CatField icon="gift" label="Empaque incluido">
                            <select value={value.packaging} onChange={e => set('packaging', e.target.value)}>
                                <option value="">Sin definir</option>
                                {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                            </select>
                        </CatField>
                    )}
                </>
            );
        }

        const EMPTY_PRODUCT = { name: '', price: '', category: '', packaging: '', sale_unit: '', measure: '', pieces_per_unit: '', gender: '', photoBase64: '', photoPreview: '' };
        const SORTS = { recent: 'Más recientes', name: 'Nombre (A-Z)', low: 'Precio: menor a mayor', high: 'Precio: mayor a menor' };

        function CatalogView({ products, biz, legacy, reload, readOnly = false }) {
            const perProductUnits = !!biz?.sales?.perProductUnits;
            const genderTagging = !!biz?.sales?.genderTagging;
            const unit = biz?.sales?.unitSingular || 'unidad';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const [form, setForm] = useState(EMPTY_PRODUCT);
            const [saving, setSaving] = useState(false);
            const [drag, setDrag] = useState(false);
            const [search, setSearch] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('');
            const [sort, setSort] = useState('recent');
            const [view, setView] = useState('grid');
            const [editing, setEditing] = useState(null);
            const [busyId, setBusyId] = useState('');

            const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
            const total = products.length;
            const average = total ? products.reduce((sum, p) => sum + Number(p.price || 0), 0) / total : 0;
            const monthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const before = products.filter(p => { const t = parseTs(p.created_at); return t && t.getTime() <= monthAgo; }).length;
            const growth = before > 0 ? Math.round((total - before) / before * 100) : null;
            const pretty = text => (text ? text.charAt(0).toUpperCase() + text.slice(1).toLowerCase() : text);
            const categoryNames = categories.slice(0, 2).map(pretty).join(', ') + (categories.length > 2 ? '…' : '');

            const needle = search.trim().toLowerCase();
            const visible = products
                .filter(p => (!categoryFilter || p.category === categoryFilter) && (!needle || (p.name + ' ' + p.category).toLowerCase().includes(needle)))
                .sort((a, b) => {
                    if (sort === 'name') return String(a.name).localeCompare(String(b.name), 'es');
                    if (sort === 'low') return Number(a.price) - Number(b.price);
                    if (sort === 'high') return Number(b.price) - Number(a.price);
                    return (parseTs(b.created_at)?.getTime() || 0) - (parseTs(a.created_at)?.getTime() || 0);
                });

            const uploadPhoto = async base64 => (await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: base64 }) })).url;

            async function addProduct() {
                if (!form.name.trim() || !form.price || !form.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSaving(true);
                try {
                    const imageUrl = form.photoBase64 ? await uploadPhoto(form.photoBase64) : '';
                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: form.name, price: parseFloat(form.price), category: form.category, packaging: form.packaging,
                            sale_unit: form.sale_unit, measure: form.measure, pieces_per_unit: form.pieces_per_unit, gender: form.gender,
                            image_url: imageUrl
                        })
                    });
                    setForm(EMPTY_PRODUCT);
                    reload();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            function startEdit(p) {
                setEditing({
                    id: p.id, name: p.name || '', price: String(p.price ?? ''), category: p.category || '',
                    packaging: p.description || '', sale_unit: p.sale_unit || '', measure: p.measure || '',
                    pieces_per_unit: p.pieces_per_unit ? String(p.pieces_per_unit) : '', gender: p.gender || '',
                    image_url: p.image_url || '', photoBase64: '', photoPreview: ''
                });
            }

            async function saveEdit() {
                const e = editing;
                if (!e.name.trim() || !e.price || !e.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setBusyId(e.id);
                try {
                    const body = { name: e.name, price: parseFloat(e.price), category: e.category };
                    if (perProductUnits) Object.assign(body, { sale_unit: e.sale_unit, measure: e.measure, pieces_per_unit: e.pieces_per_unit });
                    if (genderTagging) body.gender = e.gender;
                    if (packagingTypes.length > 0) body.packaging = e.packaging;
                    if (e.photoBase64) body.image_url = await uploadPhoto(e.photoBase64);
                    await api('/api/products/' + e.id, { method: 'PUT', body: JSON.stringify(body) });
                    setEditing(null);
                    reload();
                } catch (err) {
                    alert('Error guardando el producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function duplicate(p) {
                setBusyId(p.id);
                try {
                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: p.name + ' (copia)', price: Number(p.price), category: p.category,
                            packaging: packagingTypes.some(t => t.name === p.description) ? p.description : '',
                            sale_unit: p.sale_unit || '', measure: p.measure || '', pieces_per_unit: p.pieces_per_unit || '',
                            gender: p.gender || '', image_url: p.image_url || ''
                        })
                    });
                    reload();
                } catch (err) {
                    alert('Error duplicando el producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function remove(p) {
                if (!confirm('¿Eliminar "' + p.name + '" del catálogo?')) return;
                setBusyId(p.id);
                try {
                    await api('/api/products/' + p.id, { method: 'DELETE' });
                    reload();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            const photo = (p, cls) => (p.image_url || legacy
                ? <img className={cls} src={p.image_url || 'logo.png'} alt="" loading="lazy" />
                : <div className={cls}><PlatIcon name="image" size={34} color="#9AA3C7" /></div>);
            const priceText = p => <>${Number(p.price).toFixed(2).replace(/\.00$/, '')} <small>por {(perProductUnits && p.sale_unit) || unit}</small></>;
            const detailLines = p => {
                const lines = [];
                if (perProductUnits) {
                    if (p.sale_unit) lines.push(['box', 'Unidad de venta: ' + p.sale_unit]);
                    if (p.measure) lines.push(['ruler', 'Medida: ' + p.measure]);
                    if (p.pieces_per_unit) lines.push(['layers', 'Unidades que trae: ' + p.pieces_per_unit]);
                }
                if (genderTagging && (p.gender === 'niño' || p.gender === 'niña')) lines.push(['user', 'Es para: ' + p.gender]);
                if (biz?.packaging?.enabled) lines.push(['gift', 'Empaque: ' + (p.description || 'Sin definir')]);
                return lines;
            };
            const actions = p => readOnly ? null : (
                <div className="cat-actions">
                    <button type="button" className="cat-btn" disabled={busyId === p.id} onClick={() => startEdit(p)}><PlatIcon name="edit" size={16} color="#2563EB" /><span className="lb">Editar</span></button>
                    <button type="button" className="cat-btn copy" disabled={busyId === p.id} onClick={() => duplicate(p)}><PlatIcon name="copy" size={16} color="#2A3766" /><span className="lb">Duplicar</span></button>
                    <button type="button" className="cat-btn del" disabled={busyId === p.id} title="Eliminar" onClick={() => remove(p)}><PlatIcon name="trash" size={16} color="#D03535" /></button>
                </div>
            );

            return (
                <div className="cat-page">
                    <div className="cat-wrap">
                        <div className="cat-head">
                            <div className="cat-title">
                                <div className="tile"><PlatIcon name="bag" size={28} color="#4F5BD5" /></div>
                                <div><h1>Catálogo de productos</h1><p>Gestiona los productos que compartes por WhatsApp</p></div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="box" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Productos activos</div>
                                    <div className="val">{total}{growth !== null && <span className={growth >= 0 ? 'up' : 'down'}>{growth >= 0 ? '↑ +' : '↓ '}{growth}%</span>}</div>
                                    {growth !== null && <div className="sub">vs. mes anterior</div>}
                                </div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="tag" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Categorías</div>
                                    <div className="val">{categories.length}</div>
                                    {categories.length > 0 && <div className="sub">{categoryNames}</div>}
                                </div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="chart" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Precio promedio</div>
                                    <div className="val">${average.toFixed(2).replace(/\.00$/, '')}</div>
                                    <div className="sub">{perProductUnits ? 'por unidad de venta' : 'por ' + unit}</div>
                                </div>
                            </div>
                        </div>

                        {!readOnly && <div className="cat-card">
                            <div className="cat-add-h">
                                <div className="plus"><PlatIcon name="plus" size={24} color="#fff" /></div>
                                <div><h2>Agregar producto al catálogo</h2><p>Completa la información del producto. Luego podrás editarlo o compartirlo por WhatsApp.</p></div>
                            </div>
                            <div className="cat-add">
                                <div className="cat-f">
                                    <label>Foto del producto</label>
                                    <label
                                        className={'cat-drop' + (drag ? ' over' : '')}
                                        onDragOver={e => { e.preventDefault(); setDrag(true); }}
                                        onDragLeave={() => setDrag(false)}
                                        onDrop={e => { e.preventDefault(); setDrag(false); readPhoto(e.dataTransfer.files[0], data => setForm(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); }}
                                    >
                                        {form.photoPreview
                                            ? <img src={form.photoPreview} alt="" />
                                            : <><PlatIcon name="image" size={38} color="#6C7CF0" /><span>Haz clic para subir una imagen o arrástrala aquí</span><small>JPG, PNG (máx. 5 MB)</small></>}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={e => { readPhoto(e.target.files[0], data => setForm(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); e.target.value = ''; }} />
                                    </label>
                                </div>
                                <div className="cat-fields">
                                    <ProductFields value={form} onChange={setForm} biz={biz} categories={categories} listId="cat-list-new" />
                                    <button type="button" className="cat-submit" onClick={addProduct} disabled={saving}><PlatIcon name="plus" size={18} color="#fff" /> {saving ? 'Guardando...' : 'Agregar producto'}</button>
                                </div>
                            </div>
                        </div>}

                        <div className="cat-card">
                            <div className="cat-list-h">
                                <div className="ttl">
                                    <div className="tile"><PlatIcon name="grid" size={22} color="#4F5BD5" /></div>
                                    <div><h2>Tus productos</h2><p>Administra, edita o elimina los productos de tu catálogo</p></div>
                                </div>
                                <div className="cat-tools">
                                    <div className="cat-in"><span className="ic"><PlatIcon name="search" size={18} color="#6B7599" /></span><input type="text" placeholder="Buscar productos..." value={search} onChange={e => setSearch(e.target.value)} /></div>
                                    <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
                                        <option value="">Todas las categorías</option>
                                        {categories.map(c => <option key={c} value={c}>{pretty(c)}</option>)}
                                    </select>
                                    <select value={sort} onChange={e => setSort(e.target.value)}>
                                        {Object.entries(SORTS).map(([key, label]) => <option key={key} value={key}>Ordenar por: {label}</option>)}
                                    </select>
                                    <div className="cat-toggle">
                                        <button type="button" className={view === 'grid' ? 'on' : ''} title="Tarjetas" onClick={() => setView('grid')}><PlatIcon name="grid" size={19} color={view === 'grid' ? '#fff' : '#6B7599'} /></button>
                                        <button type="button" className={view === 'list' ? 'on' : ''} title="Lista" onClick={() => setView('list')}><PlatIcon name="list" size={19} color={view === 'list' ? '#fff' : '#6B7599'} /></button>
                                    </div>
                                </div>
                            </div>

                            {total === 0 ? (
                                <div className="cat-empty">Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo {biz?.business?.productEmoji || ''}</div>
                            ) : visible.length === 0 ? (
                                <div className="cat-empty">Ningún producto coincide con la búsqueda.</div>
                            ) : view === 'grid' ? (
                                <div className="cat-grid">
                                    {visible.map(p => (
                                        <div className="cat-item" key={p.id}>
                                            {photo(p, 'ph')}
                                            <div className="body">
                                                <span className="cat-tag">{p.category}</span>
                                                <h3>{p.name}</h3>
                                                <div className="cat-price">{priceText(p)}</div>
                                                <div className="cat-lines">{detailLines(p).map(([icon, text]) => <div key={icon}><PlatIcon name={icon} size={16} color="#8A93B5" /><span>{text}</span></div>)}</div>
                                                {actions(p)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="cat-rows">
                                    {visible.map(p => (
                                        <div className="cat-row" key={p.id}>
                                            {photo(p, 'th')}
                                            <div className="mid">
                                                <span className="cat-tag">{p.category}</span>
                                                <h3>{p.name}</h3>
                                                <div className="meta">{detailLines(p).map(([, text]) => text).join(' · ')}</div>
                                            </div>
                                            <div className="cat-price">{priceText(p)}</div>
                                            {actions(p)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {editing && (
                        <div className="cat-modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) setEditing(null); }}>
                            <div className="cat-modal">
                                <h2>Editar producto</h2>
                                <div className="edit-photo">
                                    {editing.photoPreview || editing.image_url ? <img src={editing.photoPreview || editing.image_url} alt="" /> : <div className="noimg"><PlatIcon name="image" size={30} color="#9AA3C7" /></div>}
                                    <label className="pick">Cambiar foto<input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={e => { readPhoto(e.target.files[0], data => setEditing(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); e.target.value = ''; }} /></label>
                                </div>
                                <div className="cat-fields">
                                    <ProductFields value={editing} onChange={setEditing} biz={biz} categories={categories} listId="cat-list-edit" />
                                </div>
                                <div className="foot">
                                    <button type="button" className="cancel" onClick={() => setEditing(null)}>Cancelar</button>
                                    <button type="button" className="cat-submit" onClick={saveEdit} disabled={busyId === editing.id}>{busyId === editing.id ? 'Guardando...' : 'Guardar cambios'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ---------- Celular: barra de arriba, barra de abajo y pantallas propias (la computadora no cambia) ----------
        const MX_EMOJIS = ['😊', '🙏', '👍', '❤️', '😍', '🥰', '✨', '🎉', '🤍', '😉', '🙌', '👋', '📦', '🚚', '💳', '📸', '🎁', '💐'];
        // Secciones que ocupan el segundo lugar de la barra de abajo cuando están abiertas.
        const MX_SECTIONS = {
            cotizaciones: ['doc', 'Cotizaciones'], catalogo: ['box', 'Catálogo'], estadisticas: ['chart', 'Estadísticas'],
            publicaciones: ['image', 'Publicaciones'], configuracion: ['gear', 'Configuración'], consumo: ['chart', 'Consumo'], claves: ['key', 'Claves']
        };
        const MX_QUOTE_STATUS = { pending: 'Pendiente', sent: 'Enviada', accepted: 'Aprobada', expired: 'Vencida' };

        function MxIcon({ name, size = 20, color = 'currentColor' }) {
            const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true };
            switch (name) {
                case 'phone': return <svg {...p}><path d="M21 16.5v3a2 2 0 0 1-2.2 2 19.5 19.5 0 0 1-8.5-3 19.2 19.2 0 0 1-6-6 19.5 19.5 0 0 1-3-8.6A2 2 0 0 1 3.3 1.8h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L7.3 9.5a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z" /></svg>;
                case 'clip': return <svg {...p}><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9" /></svg>;
                case 'smile': return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9.5h.01M15 9.5h.01" /></svg>;
                case 'mic': return <svg {...p}><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>;
                case 'sliders': return <svg {...p}><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>;
                case 'funnel': return <svg {...p}><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z" /></svg>;
                case 'crown': return <svg {...p}><path d="M3.5 8l4 3.5L12 5l4.5 6.5 4-3.5-1.8 10H5.3z" /></svg>;
                case 'heart': return <svg {...p}><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" /></svg>;
                case 'upload': return <svg {...p}><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" /></svg>;
                case 'eye': return <svg {...p}><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" /><circle cx="12" cy="12" r="3" /></svg>;
                case 'palette': return <svg {...p}><path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.7 1.6-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.4 1.5-1.4h1.8a5 5 0 0 0 5-5C21 6.6 17 3 12 3z" /><circle cx="7.5" cy="11.5" r="1" /><circle cx="10" cy="7.5" r="1" /><circle cx="14.5" cy="7.5" r="1" /></svg>;
                case 'trend': return <svg {...p}><path d="M3 17l5.5-5.5 4 4L21 7M15 7h6v6" /></svg>;
                case 'pie': return <svg {...p}><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5v10z" /><path d="M14 3.2a8.5 8.5 0 0 1 6.8 6.8H14z" /></svg>;
                case 'coins': return <svg {...p}><ellipse cx="12" cy="6" rx="7" ry="2.8" /><path d="M5 6v4c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 10v4c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-4M5 14v4c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-4" /></svg>;
                case 'plane': return <svg {...p}><path d="M21 3L10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z" /></svg>;
                case 'external': return <svg {...p}><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>;
                case 'share': return <svg {...p}><circle cx="18" cy="5.5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="18.5" r="2.5" /><path d="M8.3 13.2l7.4 4.1M15.7 6.7l-7.4 4.1" /></svg>;
                case 'book': return <svg {...p}><path d="M12 6.5C10.3 5 7.8 4.5 4 4.5v13c3.8 0 6.3.5 8 2 1.7-1.5 4.2-2 8-2v-13c-3.8 0-6.3.5-8 2zM12 6.5v13" /></svg>;
                case 'more': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill={color} /><circle cx="12" cy="12" r="2" fill={color} /><circle cx="19" cy="12" r="2" fill={color} /></svg>;
                case 'bars': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="5" height="10" rx="2" fill="#F87171" /><rect x="9.5" y="3" width="5" height="18" rx="2" fill="#818CF8" /><rect x="16" y="7" width="5" height="14" rx="2" fill="#4ADE80" /></svg>;
                default: return null;
            }
        }

        function MxCatIcon({ cat, color }) {
            const c = String(cat || '').toLowerCase();
            if (/quince|xv\b|princes/.test(c)) return <MxIcon name="crown" size={17} color={color} />;
            if (/boda|matrimon|amor|novi|aniversario/.test(c)) return <MxIcon name="heart" size={17} color={color} />;
            if (/cumple|regalo|navidad|fiesta/.test(c)) return <PlatIcon name="gift" size={17} color={color} />;
            if (/bautiz|baby|beb|comuni|shower/.test(c)) return <PlatIcon name="sparkle" size={17} color={color} />;
            return <PlatIcon name="tag" size={17} color={color} />;
        }

        function mxItems(record) {
            let items = [];
            try { items = typeof record?.products === 'string' ? JSON.parse(record.products) : (record?.products || []); } catch { items = []; }
            return Array.isArray(items) ? items : [];
        }
        const mxPretty = text => (text ? text.charAt(0).toUpperCase() + text.slice(1).toLowerCase() : text);
        const mxMoney = value => '$' + Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const mxPrice = value => '$' + Number(value || 0).toFixed(2).replace(/\.00$/, '');
        const mxInt = value => Number(value || 0).toLocaleString('es-EC');
        function mxDate(value) {
            const date = parseTs(value);
            return date ? date.toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '').replace(/ de /g, ' ') : '';
        }
        function mxProductByName(products, name) {
            const key = String(name || '').trim().toLowerCase();
            return key ? products.find(p => String(p.name || '').trim().toLowerCase() === key) || null : null;
        }
        const mxQuoteName = q => q.customer_name || contactName({ customer_name: q.conversations?.customer_name, phone_number: q.conversations?.phone_number || q.customer_phone });

        // Lo que se le vuelve a mandar al servidor para recalcular una cotización (mismo formato que usa el asistente).
        function mxSaleOf(q) {
            const all = mxItems(q);
            const shipping = all.find(i => i.type === 'shipping');
            const delivery = all.find(i => i.type === 'delivery');
            return {
                items: all.filter(i => !i.type).map(i => ({ name: i.name, quantity: Number(i.quantity) || 1, personalization: i.personalization || '', packaging: i.packagingChanged ? (i.packaging || '') : '' })),
                place: shipping ? String(shipping.name || '').replace(/^Envío a\s*/i, '') : '',
                deliveryDate: delivery?.date || ''
            };
        }

        // Foto de un producto del catálogo enviada al chat (por el bot o desde el CRM): se muestra como tarjeta del producto.
        function mxCatalogProductOf(msg, products) {
            if (msg.type !== 'image') return null;
            const match = String(msg.content || '').match(/\*([^*\n]{2,90})\*/);
            return match ? mxProductByName(products, match[1]) : null;
        }

        function MxTop({ branding, session, botEnabled, canConfigure, onToggleBot, alert, onBell }) {
            const name = branding.name || session?.business?.name || 'Mi empresa';
            return (
                <div className="mx-top">
                    <div className="logo">{branding.logoUrl || session?.business?.legacy ? <img src={logoOf(branding)} alt="" /> : <Avatar name={name} size={42} />}</div>
                    <div className="who">
                        <div className="t">{name}</div>
                        <div className="s">Asistente WhatsApp · <span className="nx-by"><NexlyMark size={11} id="mx-by" /> NEXLY</span></div>
                    </div>
                    <button type="button" className={'mx-bot' + (botEnabled ? '' : ' off')} onClick={onToggleBot} disabled={!canConfigure} title={canConfigure ? '' : 'Solo el dueño puede encender o apagar el bot'}>{botEnabled ? 'Bot Activo' : 'Bot Inactivo'}</button>
                    <button type="button" className="mx-bell" aria-label="Chats que te necesitan" onClick={onBell}><PlatIcon name="bell" size={23} color="#1E2A4A" />{alert && <span className="dot"></span>}</button>
                </div>
            );
        }

        function MxNav({ tab, lastOther, onTab, onMore, moreOpen }) {
            const second = MX_SECTIONS[tab] ? tab : (MX_SECTIONS[lastOther] ? lastOther : 'cotizaciones');
            const items = [['conversaciones', 'chat', 'Conversaciones'], [second, ...MX_SECTIONS[second]], ['pedidos', 'bag', 'Pedidos']];
            return (
                <nav className="mx-nav" aria-label="Secciones">
                    {items.map(([id, icon, label]) => (
                        <button key={id} type="button" className={'mx-nav-item' + (tab === id && !moreOpen ? ' on' : '')} onClick={() => onTab(id)}><PlatIcon name={icon} size={23} /><span>{label}</span></button>
                    ))}
                    <button type="button" className={'mx-nav-item' + (moreOpen ? ' on' : '')} onClick={onMore}><MxIcon name="more" size={23} /><span>Más</span></button>
                </nav>
            );
        }

        function MxSheet({ title, onClose, children }) {
            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, []);
            return (
                <div className="mx-sheet-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="mx-sheet" role="dialog" aria-modal="true" aria-label={title}>
                        <div className="grab"></div>
                        {title && <h3>{title}</h3>}
                        {children}
                    </div>
                </div>
            );
        }

        // Elegir un chat (para compartir un producto o armar una cotización): los más recientes primero.
        function MxPickConv({ conversations, value, onPick, actionLabel }) {
            const [q, setQ] = useState('');
            const needle = q.trim().toLowerCase();
            const list = conversations
                .filter(c => !needle || (contactName(c) || '').toLowerCase().includes(needle) || (c.phone_number || '').includes(needle))
                .sort((a, b) => (parseTs(b.last_message_time)?.getTime() || 0) - (parseTs(a.last_message_time)?.getTime() || 0))
                .slice(0, 60);
            return (
                <>
                    <div className="mx-search" style={{ height: 46, marginBottom: 8 }}><PlatIcon name="search" size={18} color="#7A84AE" /><input type="text" placeholder="Buscar chat por nombre o número..." value={q} onChange={e => setQ(e.target.value)} /></div>
                    <div className="mx-pickconv">
                        {list.length === 0 && <div className="mx-none">No hay chats con ese nombre.</div>}
                        {list.map(c => (
                            <button key={c.id} type="button" className={value === c.id ? 'on' : ''} onClick={() => onPick(c)}>
                                <Avatar name={contactName(c)} size={34} />
                                <span style={{ flex: 1, minWidth: 0 }}><ChannelMark phone={c.phone_number} all />{contactName(c)}</span>
                                {actionLabel ? <span style={{ color: '#2F4BD8', fontWeight: 700, fontSize: 13 }}>{actionLabel}</span> : value === c.id && <PlatIcon name="check" size={20} />}
                            </button>
                        ))}
                    </div>
                </>
            );
        }

        function CatalogMobile({ products, biz, legacy, reload, readOnly, conversations, focus, onFocusDone }) {
            const perProductUnits = !!biz?.sales?.perProductUnits;
            const genderTagging = !!biz?.sales?.genderTagging;
            const unit = biz?.sales?.unitSingular || 'unidad';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const categoryLabel = biz?.dates?.enabled ? 'Categoría / ' + biz.dates.eventLabel : 'Categoría';
            const emoji = biz?.business?.productEmoji || '🛍️';
            const [search, setSearch] = useState('');
            const [cat, setCat] = useState('');
            const [sort, setSort] = useState('recent');
            const [view, setView] = useState('grid');
            const [tools, setTools] = useState(false);
            const [detailId, setDetailId] = useState(null);
            const [form, setForm] = useState(null);
            const [step, setStep] = useState(1);
            const [saving, setSaving] = useState(false);
            const [busyId, setBusyId] = useState('');
            const [share, setShare] = useState(null);
            const [notice, setNotice] = useState('');

            useEffect(() => { if (focus) setDetailId(focus); }, [focus]);
            useEffect(() => {
                if (!notice) return;
                const t = setTimeout(() => setNotice(''), 4000);
                return () => clearTimeout(t);
            }, [notice]);

            const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
            const needle = search.trim().toLowerCase();
            const visible = products
                .filter(p => (!cat || p.category === cat) && (!needle || (p.name + ' ' + p.category).toLowerCase().includes(needle)))
                .sort((a, b) => {
                    if (sort === 'name') return String(a.name).localeCompare(String(b.name), 'es');
                    if (sort === 'low') return Number(a.price) - Number(b.price);
                    if (sort === 'high') return Number(b.price) - Number(a.price);
                    return (parseTs(b.created_at)?.getTime() || 0) - (parseTs(a.created_at)?.getTime() || 0);
                });
            const detail = detailId ? products.find(p => p.id === detailId) : null;
            const unitOf = p => (perProductUnits && p.sale_unit) || unit;
            const priceLine = p => <div className="mx-price">{mxPrice(p.price)}<small>por {unitOf(p)}</small></div>;
            const photoOf = (p, big) => (p.image_url || legacy
                ? <img className={big ? 'mx-hero-img' : ''} src={p.image_url || 'logo.png'} alt="" loading="lazy" />
                : big ? <div className="mx-hero-img" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}><PlatIcon name="image" size={48} color="#9AA3C7" /></div> : <div className="noimg"><PlatIcon name="image" size={34} color="#9AA3C7" /></div>);
            const caption = p => emoji + ' *' + p.name + '*\n💰 $' + Number(p.price).toFixed(2) + (biz?.sales?.priceSuffix ? ' ' + biz.sales.priceSuffix : '');

            function closeDetail() {
                setDetailId(null);
                if (focus) onFocusDone();
            }

            function startAdd() {
                setForm({ ...EMPTY_PRODUCT });
                setStep(1);
            }

            function startEdit(p) {
                setForm({
                    id: p.id, name: p.name || '', price: String(p.price ?? ''), category: p.category || '',
                    packaging: p.description || '', sale_unit: p.sale_unit || '', measure: p.measure || '',
                    pieces_per_unit: p.pieces_per_unit ? String(p.pieces_per_unit) : '', gender: p.gender || '',
                    image_url: p.image_url || '', photoBase64: '', photoPreview: ''
                });
                setStep(1);
            }

            async function save() {
                const f = form;
                if (!f.name.trim() || !f.price || !f.category.trim()) {
                    setStep(1);
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSaving(true);
                try {
                    const imageUrl = f.photoBase64 ? (await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: f.photoBase64 }) })).url : '';
                    if (f.id) {
                        const body = { name: f.name, price: parseFloat(f.price), category: f.category };
                        if (perProductUnits) Object.assign(body, { sale_unit: f.sale_unit, measure: f.measure, pieces_per_unit: f.pieces_per_unit });
                        if (genderTagging) body.gender = f.gender;
                        if (packagingTypes.length > 0) body.packaging = f.packaging;
                        if (imageUrl) body.image_url = imageUrl;
                        await api('/api/products/' + f.id, { method: 'PUT', body: JSON.stringify(body) });
                        setNotice('Producto guardado');
                    } else {
                        await api('/api/products', {
                            method: 'POST',
                            body: JSON.stringify({
                                name: f.name, price: parseFloat(f.price), category: f.category, packaging: f.packaging,
                                sale_unit: f.sale_unit, measure: f.measure, pieces_per_unit: f.pieces_per_unit, gender: f.gender,
                                image_url: imageUrl
                            })
                        });
                        setNotice('Producto agregado al catálogo');
                    }
                    setForm(null);
                    reload();
                } catch (err) {
                    alert('Error guardando el producto: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            async function duplicate(p) {
                setBusyId(p.id);
                try {
                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: p.name + ' (copia)', price: Number(p.price), category: p.category,
                            packaging: packagingTypes.some(t => t.name === p.description) ? p.description : '',
                            sale_unit: p.sale_unit || '', measure: p.measure || '', pieces_per_unit: p.pieces_per_unit || '',
                            gender: p.gender || '', image_url: p.image_url || ''
                        })
                    });
                    setNotice('Producto duplicado');
                    reload();
                } catch (err) {
                    alert('Error duplicando el producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function remove(p) {
                if (!confirm('¿Eliminar "' + p.name + '" del catálogo?')) return;
                setBusyId(p.id);
                try {
                    await api('/api/products/' + p.id, { method: 'DELETE' });
                    if (detailId === p.id) closeDetail();
                    setNotice('Producto eliminado');
                    reload();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function sendToChat(conv, p) {
                setShare(null);
                try {
                    await api('/api/send-image', { method: 'POST', body: JSON.stringify({ conversationId: conv.id, phoneNumber: conv.phone_number, imageUrl: p.image_url, caption: caption(p) }) });
                    setNotice('Foto enviada a ' + contactName(conv) + '. El bot quedó pausado en ese chat.');
                } catch (err) {
                    alert('Error enviando la foto: ' + err.message);
                }
            }

            async function shareOutside(p) {
                const text = caption(p) + (p.image_url ? '\n' + p.image_url : '');
                setShare(null);
                if (navigator.share) {
                    try { await navigator.share({ title: p.name, text }); } catch { /* la persona cerró el menú de compartir */ }
                    return;
                }
                window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
            }

            const menuFor = p => [
                !readOnly && { label: 'Editar', onClick: () => startEdit(p) },
                !readOnly && { label: 'Duplicar', onClick: () => duplicate(p) },
                { label: 'Compartir por WhatsApp', onClick: () => setShare(p) },
                !readOnly && { label: 'Eliminar', danger: true, onClick: () => remove(p) }
            ];

            const shareSheet = share && (
                <MxSheet title={'Compartir ' + share.name} onClose={() => setShare(null)}>
                    <button type="button" className="mx-sheet-item" onClick={() => shareOutside(share)}>
                        <span className="ic"><MxIcon name="share" size={20} color="#4F5BD5" /></span>
                        <span>Compartir por WhatsApp u otra app<br /><small style={{ fontWeight: 500, color: '#6B7599' }}>Se abre el menú de compartir de tu celular</small></span>
                    </button>
                    {!readOnly && share.image_url && (
                        <>
                            <div style={{ fontWeight: 700, color: '#141C3A', margin: '10px 8px 8px' }}>O envíala a un chat del asistente</div>
                            <MxPickConv conversations={conversations} onPick={c => sendToChat(c, share)} actionLabel="Enviar" />
                        </>
                    )}
                    {!readOnly && !share.image_url && <p className="mx-hint">Agrega una foto al producto para poder enviarlo a un chat.</p>}
                </MxSheet>
            );

            if (form) {
                const f = form;
                const set = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
                const field = (icon, label, required, input, select) => (
                    <div className="mx-f">
                        <label>{label}{required && <i> *</i>}</label>
                        <div className={'mx-in' + (select ? ' sel' : '')}><span className="ic"><PlatIcon name={icon} size={19} color="#6B7599" /></span>{input}</div>
                    </div>
                );
                const pickPhoto = file => readPhoto(file, data => setForm(prev => ({ ...prev, photoBase64: data, photoPreview: data })));
                const preview = f.photoPreview || f.image_url;
                const ready = { foto: !!preview, nombre: !!f.name.trim(), precio: !!f.price, categoria: !!f.category.trim() };
                const steps = [[1, 'Información'], [2, 'Detalles'], [3, 'Guardar']];
                return (
                    <div className="mx-screen">
                        <div className="mx-screen-h"><button type="button" className="mx-backbtn" aria-label="Volver" onClick={() => setForm(null)}><PbIcon name="back" size={22} color="#141C3A" /></button></div>
                        <div className="mx-head" style={{ marginTop: 6 }}>
                            <div className="grow"><h1 style={{ fontSize: 25 }}>{f.id ? 'Editar producto' : 'Agregar producto'}</h1><p>Completa la información del producto. Luego podrás editarlo o compartirlo por WhatsApp.</p></div>
                        </div>
                        <div className="mx-steps">
                            <div className="line"><i style={{ width: (step - 1) * 50 + '%' }}></i></div>
                            {steps.map(([n, label]) => (
                                <button key={n} type="button" className={'mx-step' + (step === n ? ' on' : '') + (step > n ? ' done' : '')} onClick={() => setStep(n)}>
                                    <span className="n">{step > n ? '✓' : n}</span>{label}
                                </button>
                            ))}
                        </div>
                        <div className="mx-formcard">
                            {step === 1 && (
                                <>
                                    <label className="mx-drop" onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); pickPhoto(e.dataTransfer.files[0]); }}>
                                        {preview
                                            ? <><img src={preview} alt="" /><small>Toca para cambiar la foto</small></>
                                            : <><PlatIcon name="image" size={40} color="#4F5BD5" /><b>Agregar foto del producto</b><small>Toca para subir una imagen</small><small>JPG, PNG (máx. 5 MB)</small></>}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={e => { pickPhoto(e.target.files[0]); e.target.value = ''; }} />
                                    </label>
                                    {field('tag', 'Nombre del producto', true, <input type="text" placeholder="Ej: nombre de tu producto" value={f.name} onChange={e => set('name', e.target.value)} />)}
                                    {field('dollar', 'Precio por ' + unit + ' ($)', true, <input type="number" inputMode="decimal" min="0" step="0.01" placeholder="Ej: 25.00" value={f.price} onChange={e => set('price', e.target.value)} />)}
                                    {field('bag', categoryLabel, true, <><input type="text" list="mx-cat-list" placeholder="Ej: la categoría del producto" value={f.category} onChange={e => set('category', e.target.value)} /><datalist id="mx-cat-list">{categories.map(c => <option key={c} value={c} />)}</datalist></>, categories.length > 0)}
                                    {genderTagging && field('user', 'Es para', false, (
                                        <select value={f.gender || ''} onChange={e => set('gender', e.target.value)}>
                                            <option value="">Neutro (para ambos)</option>
                                            <option value="niño">Niño</option>
                                            <option value="niña">Niña</option>
                                        </select>
                                    ), true)}
                                    {packagingTypes.length > 0 && field('gift', 'Empaque incluido', false, (
                                        <select value={f.packaging} onChange={e => set('packaging', e.target.value)}>
                                            <option value="">Sin definir</option>
                                            {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                                        </select>
                                    ), true)}
                                </>
                            )}
                            {step === 2 && (
                                <>
                                    {perProductUnits ? (
                                        <>
                                            {field('box', 'Unidad de venta (opcional)', false, <input type="text" placeholder="Ej: caja de 10, tubo, metro" value={f.sale_unit} onChange={e => set('sale_unit', e.target.value)} />)}
                                            {field('ruler', 'Medida (opcional)', false, <input type="text" placeholder="Ej: 2,95 m x 0,17 m" value={f.measure} onChange={e => set('measure', e.target.value)} />)}
                                            {field('layers', 'Unidades que trae (opcional)', false, <input type="number" inputMode="numeric" min="2" step="1" placeholder="Ej: 10 si la caja trae 10" value={f.pieces_per_unit} onChange={e => set('pieces_per_unit', e.target.value)} />)}
                                        </>
                                    ) : (
                                        <p className="mx-hint">Este producto se vende por {unit}, como todo tu catálogo. Si vendes en cajas, tubos o metros, actívalo en Configuración → Ventas.</p>
                                    )}
                                    <div className="mx-f">
                                        <label>Así lo enviará el asistente</label>
                                        <div className="mx-bubble" style={{ background: '#E7F8EC', maxWidth: '100%', boxShadow: 'none' }}>{renderWa(caption({ name: f.name || 'Nombre del producto', price: f.price || 0 }))}</div>
                                    </div>
                                </>
                            )}
                            {step === 3 && (
                                <>
                                    <div className="mx-share" style={{ marginTop: 0 }}>
                                        {preview ? <img src={preview} alt="" /> : <div style={{ width: 64, height: 64, borderRadius: 12, background: '#F1F4FC', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><PlatIcon name="image" size={26} color="#9AA3C7" /></div>}
                                        <div style={{ minWidth: 0 }}>
                                            <b style={{ display: 'block', color: '#141C3A' }}>{f.name || 'Nombre del producto'}</b>
                                            <div className="mx-price">{mxPrice(f.price)}<small>por {(perProductUnits && f.sale_unit) || unit}</small></div>
                                        </div>
                                    </div>
                                    {[['foto', 'Foto del producto'], ['nombre', 'Nombre'], ['precio', 'Precio'], ['categoria', categoryLabel]].map(([key, label]) => (
                                        <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 2px', fontSize: 14, color: '#1E2A4A' }}>
                                            <PlatIcon name={ready[key] ? 'check' : key === 'foto' ? 'warn' : 'cross'} size={20} />
                                            {label}{!ready[key] && <span style={{ color: '#6B7599' }}>{key === 'foto' ? ' (recomendada)' : ' (falta)'}</span>}
                                        </div>
                                    ))}
                                </>
                            )}
                        </div>
                        {step < 3 && <button type="button" className="mx-textbtn" style={{ margin: '12px auto 0', display: 'flex' }} onClick={() => setStep(step + 1)}>Siguiente: {steps[step][1]} <PbIcon name="next" size={16} /></button>}
                        <div className="mx-bottom">
                            <button type="button" className="mx-cta" onClick={save} disabled={saving}><PlatIcon name="box" size={21} color="#fff" /> {saving ? 'Guardando...' : f.id ? 'Guardar cambios' : 'Guardar producto'}</button>
                        </div>
                    </div>
                );
            }

            if (detail) {
                const p = detail;
                const rows = [['tag', categoryLabel, mxPretty(p.category) || '—']];
                if (genderTagging) rows.push(['user', 'Es para', p.gender === 'niño' ? 'Niño' : p.gender === 'niña' ? 'Niña' : 'Neutro (para ambos)']);
                if (biz?.packaging?.enabled) rows.push(['gift', 'Empaque incluido', p.description || 'Sin definir']);
                if (perProductUnits) {
                    if (p.sale_unit) rows.push(['box', 'Unidad de venta', p.sale_unit]);
                    if (p.measure) rows.push(['ruler', 'Medida', p.measure]);
                    if (p.pieces_per_unit) rows.push(['layers', 'Unidades que trae', p.pieces_per_unit]);
                }
                return (
                    <div className="mx-screen">
                        <div className="mx-screen-h">
                            <button type="button" className="mx-backbtn" aria-label="Volver" onClick={closeDetail}><PbIcon name="back" size={22} color="#141C3A" /></button>
                            {!readOnly && <PbMenu items={[{ label: 'Duplicar', onClick: () => duplicate(p) }, { label: 'Eliminar', danger: true, onClick: () => remove(p) }]} />}
                        </div>
                        {notice && <div className="mx-notice" style={{ marginTop: 8 }}>{notice}</div>}
                        {photoOf(p, true)}
                        <div className="mx-detail-h">
                            <div className="tt">
                                <span className="mx-pill">{p.category}</span>
                                <h1>{p.name}</h1>
                                {priceLine(p)}
                            </div>
                        </div>
                        <div className="mx-actions3" style={readOnly ? { gridTemplateColumns: '1fr' } : undefined}>
                            {!readOnly && <button type="button" className="edit" onClick={() => startEdit(p)}><PlatIcon name="edit" size={24} color="#2F4BD8" />Editar</button>}
                            <button type="button" className="share" onClick={() => setShare(p)}><PlatIcon name="whatsapp" size={24} color="#1E8A4A" />Compartir por WhatsApp</button>
                            {!readOnly && <button type="button" className="del" disabled={busyId === p.id} onClick={() => remove(p)}><PlatIcon name="trash" size={24} color="#D03535" />Eliminar</button>}
                        </div>
                        <div className="mx-info">
                            <h3>Información del producto</h3>
                            {rows.map(([icon, label, value]) => (
                                <div key={label} className="r" onClick={readOnly ? undefined : () => startEdit(p)} style={readOnly ? undefined : { cursor: 'pointer' }}>
                                    <PlatIcon name={icon} size={20} color="#3A4570" /><span>{label}</span><span className="v">{value}</span>{!readOnly && <PbIcon name="next" size={16} color="#7A84AE" />}
                                </div>
                            ))}
                        </div>
                        <div className="mx-info">
                            <h3><PlatIcon name="image" size={20} color="#4F5BD5" /> Vista previa para compartir</h3>
                            <div className="mx-share">
                                {p.image_url || legacy ? <img src={p.image_url || 'logo.png'} alt="" /> : <div style={{ width: 64, height: 64, borderRadius: 12, background: '#F1F4FC' }}></div>}
                                <div style={{ minWidth: 0 }}><b style={{ display: 'block', color: '#141C3A' }}>{p.name}</b>{priceLine(p)}</div>
                                <button type="button" className="mx-wa" aria-label="Compartir por WhatsApp" onClick={() => setShare(p)}><PlatIcon name="whatsapp" size={24} color="#fff" /></button>
                            </div>
                        </div>
                        {shareSheet}
                    </div>
                );
            }

            return (
                <div className="mx-page">
                    <div className="mx-head">
                        <div className="hic"><PlatIcon name="box" size={26} color="#4F5BD5" /></div>
                        <div className="grow"><h1>Catálogo</h1><p>Administra los productos de tu catálogo. Edita, agrega o compártelos por WhatsApp.</p></div>
                    </div>
                    {notice && <div className="mx-notice">{notice}</div>}
                    {!readOnly && (
                        <button type="button" className="mx-addcard" onClick={startAdd}>
                            <span className="plus"><PlatIcon name="plus" size={26} color="#fff" /></span>
                            <span className="tt"><b>Agregar producto</b><small>Crea un nuevo producto para tu catálogo</small></span>
                            <PbIcon name="next" size={20} color="#5C668F" />
                        </button>
                    )}
                    <div className="mx-search-row" style={{ marginTop: 12 }}>
                        <div className="mx-search"><PlatIcon name="search" size={20} color="#7A84AE" /><input type="text" placeholder="Buscar productos..." value={search} onChange={e => setSearch(e.target.value)} /></div>
                        <button type="button" className={'mx-square' + (tools ? ' on' : '')} aria-label="Ordenar y cambiar vista" onClick={() => setTools(!tools)}><MxIcon name="sliders" size={22} color={tools ? '#fff' : '#3A4570'} /></button>
                    </div>
                    {tools && (
                        <div className="mx-sortrow">
                            <select value={sort} onChange={e => setSort(e.target.value)}>
                                {Object.entries(SORTS).map(([key, label]) => <option key={key} value={key}>{label}</option>)}
                            </select>
                            <button type="button" className={'mx-square' + (view === 'grid' ? ' on' : '')} style={{ width: 46, height: 46 }} aria-label="Tarjetas" onClick={() => setView('grid')}><PlatIcon name="grid" size={20} color={view === 'grid' ? '#fff' : '#3A4570'} /></button>
                            <button type="button" className={'mx-square' + (view === 'list' ? ' on' : '')} style={{ width: 46, height: 46 }} aria-label="Lista" onClick={() => setView('list')}><PlatIcon name="list" size={20} color={view === 'list' ? '#fff' : '#3A4570'} /></button>
                        </div>
                    )}
                    {categories.length > 0 && (
                        <div className="mx-cats">
                            <button type="button" className={'mx-cat' + (!cat ? ' on' : '')} onClick={() => setCat('')}><PlatIcon name="grid" size={17} color={!cat ? '#fff' : '#4F5BD5'} /> Todos</button>
                            {categories.map(c => <button key={c} type="button" className={'mx-cat' + (cat === c ? ' on' : '')} onClick={() => setCat(c)}><MxCatIcon cat={c} color={cat === c ? '#fff' : '#D6457B'} /> {mxPretty(c)}</button>)}
                        </div>
                    )}
                    {products.length === 0 ? (
                        <div className="mx-none">Aún no has agregado productos. Toca "Agregar producto" para empezar tu catálogo {emoji}</div>
                    ) : visible.length === 0 ? (
                        <div className="mx-none">Ningún producto coincide con la búsqueda.</div>
                    ) : view === 'grid' ? (
                        <div className="mx-grid">
                            {visible.map(p => (
                                <div className="mx-prod" key={p.id}>
                                    <button type="button" className="ph" onClick={() => setDetailId(p.id)}>{photoOf(p)}</button>
                                    <div className="dots"><PbMenu items={menuFor(p)} /></div>
                                    <div className="body" onClick={() => setDetailId(p.id)}>
                                        <span className="mx-pill">{p.category}</span>
                                        <div className="nm">{p.name}</div>
                                        {priceLine(p)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div>
                            {visible.map(p => (
                                <div className="mx-quote" key={p.id} role="button" tabIndex={0} onClick={() => setDetailId(p.id)}>
                                    {p.image_url || legacy ? <img className="th" src={p.image_url || 'logo.png'} alt="" loading="lazy" /> : <div className="th"><PlatIcon name="image" size={26} color="#9AA3C7" /></div>}
                                    <div className="mid">
                                        <span className="mx-pill">{p.category}</span>
                                        <div className="nm" style={{ whiteSpace: 'normal', marginTop: 4 }}>{p.name}</div>
                                        {priceLine(p)}
                                    </div>
                                    <div onClick={e => e.stopPropagation()}><PbMenu items={menuFor(p)} /></div>
                                </div>
                            ))}
                        </div>
                    )}
                    {shareSheet}
                </div>
            );
        }

        // Dibujo de la pantalla vacía de Cotizaciones.
        function MxRobotArt() {
