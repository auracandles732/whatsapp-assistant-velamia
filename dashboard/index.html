        const TIMEZONES = ['America/Guayaquil', 'America/Bogota', 'America/Lima', 'America/Caracas', 'America/Panama', 'America/Mexico_City', 'America/Santiago', 'America/Argentina/Buenos_Aires', 'America/La_Paz', 'America/Asuncion', 'America/Montevideo', 'America/New_York', 'Europe/Madrid'];

        function setIn(obj, path, value) {
            const copy = JSON.parse(JSON.stringify(obj));
            const keys = path.split('.');
            let target = copy;
            for (const key of keys.slice(0, -1)) target = target[key];
            target[keys[keys.length - 1]] = value;
            return copy;
        }

        const getIn = (obj, path) => path.split('.').reduce((o, key) => (o == null ? undefined : o[key]), obj);

        function CfgCard({ id, icon, title, subtitle, right, children }) {
            return (
                <section className="nx-cfg" id={'cfg-' + id}>
                    <div className="nx-cfg-h">
                        <div className="tile"><PlatIcon name={icon} size={24} color="#4F5BD5" /></div>
                        <div className="tt"><h3>{title}</h3><p>{subtitle}</p></div>
                        {right && <div className="right">{right}</div>}
                    </div>
                    {children}
                </section>
            );
        }

        const HANDOFF_TEXT = {
            card_payment: 'el cliente eligió pagar con tarjeta',
            payment_proof: 'el cliente envió un comprobante de pago',
            complaint: 'el cliente tiene un reclamo'
        };

        function AssistantPreview({ form }) {
            const [message, setMessage] = useState('Hola');
            const [busy, setBusy] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const formKey = JSON.stringify(form);

            async function run(text) {
                const sent = (text ?? message).trim() || 'Hola';
                setMessage(sent);
                setBusy(true);
                setError('');
                try {
                    const data = await api('/api/business-profile/preview', { method: 'POST', body: JSON.stringify({ message: sent, profile: form }) });
                    setResult({ ...data, message: sent, at: new Date(), formKey });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setBusy(false);
                }
            }

            const time = result ? result.at.toLocaleTimeString('es-EC', { timeZone: BUSINESS_TZ, hour: '2-digit', minute: '2-digit', hour12: false }) : '';
            const extras = [];
            if (result) {
                if (result.photos && result.photos.length) extras.push({ text: 'Enviaría fotos de: ' + result.photos.join(', ') });
                if (result.sendBankDetails) extras.push({ text: 'Enviaría tus datos de transferencia.' });
                if (result.handoff && result.handoff !== 'none') extras.push({ text: 'Se pausaría y te avisaría: ' + (HANDOFF_TEXT[result.handoff] || result.handoff) + '.', warn: true });
                if (result.ownerQuestion) extras.push({ text: 'Te avisaría esta duda: ' + result.ownerQuestion, warn: true });
            }

            return (
                <div className="nx-pcard">
                    <h4>Vista previa del asistente<span className="nx-real">Respuesta real de la IA</span></h4>
                    <div className="nx-try">
                        <input type="text" maxLength={300} value={message} placeholder="Mensaje de un cliente" onChange={e => setMessage(e.target.value)} onKeyDown={e => e.key === 'Enter' && !busy && run()} />
                        <button type="button" onClick={() => run()} disabled={busy}><PlatIcon name="send" size={17} color="#fff" /> {busy ? 'Probando...' : 'Probar'}</button>
                    </div>
                    <div className="nx-quick">
                        {['Hola', '¿Cuánto cuesta?', '¿Hacen envíos?'].map(q => <button key={q} type="button" disabled={busy} onClick={() => run(q)}>{q}</button>)}
                    </div>
                    <div className="nx-wa">
                        {busy && <div className="thinking"><div className="spinner" style={{ width: 18, height: 18, borderWidth: 2 }}></div> El asistente está escribiendo...</div>}
                        {!busy && !result && <div className="empty">Escribe un mensaje de cliente y pulsa <b>Probar</b> para ver cómo respondería el asistente ahora mismo, con tu perfil, tus instrucciones y tu catálogo.</div>}
                        {!busy && result && (
                            <>
                                <div className="bubble me"><p>{result.message}</p><div className="tm">{time}</div></div>
                                <div className="bubble bot">{result.reply ? <p>{result.reply}</p> : <p><i>No enviaría texto.</i></p>}<div className="tm">{time}</div></div>
                            </>
                        )}
                    </div>
                    {result && !busy && extras.length > 0 && <div className="nx-extra">{extras.map((x, i) => <div key={i} className={x.warn ? 'warn' : ''}>{x.text}</div>)}</div>}
                    {result && !busy && result.formKey !== formKey && <div className="nx-stale">Cambiaste el perfil después de esta prueba: pulsa Probar otra vez para ver la respuesta actualizada.</div>}
                    {error && <div className="nx-err">{error}</div>}
                    <div className="nx-note-line"><PlatIcon name="bulb" size={18} color="#4F5BD5" /><span>Es una respuesta real: usa el perfil que tienes en pantalla (aunque no lo hayas guardado) y la IA de este negocio, así que cada prueba gasta unos centavos.</span></div>
                </div>
            );
        }

        function ProfilePreview({ form, readiness, legacy, canTest = true }) {
            const b = form.business, sa = form.sales, pay = form.payments, sh = form.shipping, dt = form.dates;
            const logo = form.branding.logoUrl || (legacy ? 'logo.png' : '');
            const hasShipping = sh.mode !== 'none';
            const methods = [pay.transferEnabled && 'Transferencia', pay.cardEnabled && 'Tarjeta'].filter(Boolean);
            const stepsCount = (form.followUps.steps || []).length;
            const missing = readiness ? readiness.items.filter(i => !i.ok).map(i => i.label.toLowerCase()) : [];
            const ownerPhone = (form.alerts.ownerPhone || '').trim();
            const row = (icon, text, warn) => <div className={'row' + (warn ? ' warn' : '')}><span className="ic"><PlatIcon name={icon} size={19} color={warn ? '#B36B00' : '#6B7599'} /></span><span>{text}</span></div>;
            return (
                <>
                    <div className="nx-pcard nx-biz">
                        <div className="banner">{logo ? <img src={logo} alt="" /> : <Avatar name={b.name} size={72} />}</div>
                        <div className="nm">{b.name || 'Tu negocio'}</div>
                        <div className="lc">{[b.city, b.country].filter(Boolean).join(', ')}</div>
                        {b.description && <div className="ds">{b.description}</div>}
                        <div className="nx-chipset">
                            {sa.personalization && <span className="nx-tagchip violet">Personalizable</span>}
                            {pay.transferEnabled && <span className="nx-tagchip green">Transferencia</span>}
                            {pay.cardEnabled && <span className="nx-tagchip blue">Tarjeta</span>}
                            {hasShipping && <span className="nx-tagchip orange">{sh.carrier || 'Envíos'}</span>}
                            {sh.pickupAvailable && <span className="nx-tagchip violet">Retiro en local</span>}
                            {dt.enabled && dt.alwaysAvailable && <span className="nx-tagchip violet">Disponible siempre</span>}
                        </div>
                    </div>

                    {canTest && <AssistantPreview form={form} />}

                    <div className="nx-pcard">
                        <h4>Resumen del negocio</h4>
                        <div className="nx-sum">
                            {row('pin', [b.city, b.country].filter(Boolean).join(', ') || 'Sin ciudad')}
                            {row('clock', b.timezone)}
                            {row('box', 'Vende: ' + (sa.goodsWord || 'productos') + (sa.perProductUnits ? ' (unidad y medida propias por producto)' : ' (por ' + sa.unitSingular + ')'))}
                            {row('tag', 'Personalización: ' + (sa.personalization ? 'Sí' : 'No'))}
                            {row('card', 'Pagos: ' + (methods.length ? methods.join(' y ') : 'sin definir'), !methods.length)}
                            {row('truck', hasShipping ? 'Envíos: ' + (sh.carrier || 'sin transportista') + (sh.coverage ? ' (' + sh.coverage + ')' : '') : 'Sin envíos' + (sh.pickupAvailable ? ' (retiro en local)' : ''))}
                            {row('calendar', 'Trabaja con fecha de evento: ' + (dt.enabled ? 'Sí' : 'No'))}
                            {row('bell', 'Seguimientos automáticos: ' + (form.followUps.enabled ? stepsCount : 'No'))}
                            {row('box', 'Empaques: ' + (form.packaging.enabled ? (form.packaging.types || []).length + ' opciones' : 'No'))}
                            {row('whatsapp', ownerPhone ? 'Recibe avisos en: ' + ownerPhone : 'Sin número para recibir avisos', !ownerPhone)}
                        </div>
                        {readiness && (
                            <div className={'nx-ready' + (missing.length ? ' warn' : '')}>
                                <PlatIcon name={missing.length ? 'warn' : 'sparkle'} size={22} color="#6C5CE7" />
                                <div>
                                    <div className="t">{missing.length ? 'Falta completar' : 'Todo listo para vender'}</div>
                                    <div className="d">{missing.length ? 'Pendiente: ' + missing.join(', ') + '.' : 'Tu configuración se aplica de inmediato en todos los chats del asistente.'}</div>
                                </div>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        function BusinessProfileForm({ onSaved, extras = [], legacy = false, readOnly = false, canTest = true }) {
            const [form, setForm] = useState(null);
            const [presets, setPresets] = useState([]);
            const [saving, setSaving] = useState(false);
            const [saved, setSaved] = useState(false);
            const [uploadingLogo, setUploadingLogo] = useState(false);
            const [readiness, setReadiness] = useState(null);
            const [activeSection, setActiveSection] = useState('top');
            const rootRef = useRef(null);
            const sectionIds = ['general', 'ventas', 'pagos', 'fechas', 'envios', 'seguimientos', 'empaques', 'avisos', ...extras.map(x => x.id)];
            const sectionKey = sectionIds.join(',');

            const loadReadiness = () => api('/api/me/readiness').then(setReadiness).catch(() => {});

            useEffect(() => {
                loadReadiness();
            }, []);

            useEffect(() => {
                const root = rootRef.current;
                if (!form || !root) return;
                const scroller = root.closest('.settings-container');
                if (!scroller) return;
                const onScroll = () => {
                    const base = scroller.getBoundingClientRect().top;
                    let current = 'top';
                    for (const id of sectionKey.split(',')) {
                        const el = document.getElementById('cfg-' + id);
                        if (el && el.getBoundingClientRect().top - base <= 170) current = id;
                    }
                    setActiveSection(current);
                };
                scroller.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => scroller.removeEventListener('scroll', onScroll);
            }, [!!form, sectionKey]);

            useEffect(() => {
                api('/api/business-profile').then(setForm).catch(err => alert('Error cargando el perfil: ' + err.message));
                api('/api/business-profile/presets').then(setPresets).catch(() => {});
            }, []);

            if (!form) {
                return <div className="settings-card"><h3>🏪 Perfil del negocio</h3><p className="hint">Cargando...</p></div>;
            }

            const set = (path, value) => {
                setForm(prev => setIn(prev, path, value));
                setSaved(false);
            };

            const text = (path, label, placeholder = '', hint = '', wide = false) => (
                <div className={`form-field ${wide ? 'wide' : ''}`}>
                    <label>{label}</label>
                    <input type="text" value={getIn(form, path) ?? ''} placeholder={placeholder} onChange={e => set(path, e.target.value)} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>
            );

            const number = (path, label, hint = '', step = '1') => (
                <div className="form-field">
                    <label>{label}</label>
                    <input type="number" min="0" step={step} value={getIn(form, path) ?? ''} onChange={e => set(path, e.target.value === '' ? '' : Number(e.target.value))} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>
            );

            const check = (path, label) => (
                <label className="check-row wide">
                    <input type="checkbox" checked={!!getIn(form, path)} onChange={e => set(path, e.target.checked)} /> {label}
                </label>
            );

            function loadPreset(id) {
                const preset = presets.find(item => item.id === id);
                if (!preset) return;
                if (!confirm(`¿Cargar la plantilla "${preset.label}"?\n\nReemplaza lo que ves en este formulario. No se guarda hasta que pulses "Guardar perfil".`)) return;
                setForm(JSON.parse(JSON.stringify(preset.profile)));
                setSaved(false);
            }

            function uploadLogo(e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (!/^image\/(jpeg|png)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
                    alert('El logo debe ser JPG o PNG de hasta 5 MB');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async () => {
                    setUploadingLogo(true);
                    try {
                        const data = await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: reader.result }) });
                        set('branding.logoUrl', data.url);
                    } catch (err) {
                        alert('Error subiendo el logo: ' + err.message);
                    } finally {
                        setUploadingLogo(false);
                    }
                };
                reader.readAsDataURL(file);
            }

            async function save() {
                setSaving(true);
                try {
                    const result = await api('/api/business-profile', { method: 'PUT', body: JSON.stringify(form) });
                    setForm(result);
                    setSaved(true);
                    onSaved(result);
                    loadReadiness();
                } catch (err) {
                    alert('Error guardando el perfil: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            const steps = form.followUps.steps || [];
            const shippingMode = form.shipping.mode;

            function goTo(id) {
                const scroller = rootRef.current && rootRef.current.closest('.settings-container');
                if (id === 'top') {
                    if (scroller) scroller.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                const el = document.getElementById('cfg-' + id);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            const navItems = [
                { id: 'top', icon: 'user', label: 'Perfil del negocio' },
                { id: 'general', icon: 'home', label: 'General' },
                { id: 'ventas', icon: 'tag', label: 'Ventas' },
                { id: 'pagos', icon: 'card', label: 'Pagos' },
                { id: 'fechas', icon: 'calendar', label: 'Fechas de entrega' },
                { id: 'envios', icon: 'truck', label: 'Envíos' },
                { id: 'seguimientos', icon: 'bell', label: 'Seguimientos' },
                { id: 'empaques', icon: 'box', label: 'Empaques' },
                { id: 'avisos', icon: 'sparkle', label: 'Avisos y estilo' },
                ...extras.map(x => ({ id: x.id, icon: x.icon, label: x.label }))
            ];

            const saveButton = (
                <button type="button" className="nx-save" onClick={save} disabled={saving}>
                    <PlatIcon name="save" size={19} color="#fff" /> {saving ? 'Guardando...' : 'Guardar cambios'}
                </button>
            );

            return (
                <div className="nx-set" ref={rootRef}>
                    <aside className="nx-set-nav">
                        <div className="ttl">Configuración</div>
                        <nav>
                            {navItems.map(item => (
                                <button key={item.id} type="button" className={activeSection === item.id ? 'on' : ''} onClick={() => goTo(item.id)}>
                                    <PlatIcon name={item.icon} size={19} color={activeSection === item.id ? '#2F4BD8' : '#6B7599'} /> {item.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <div className="nx-set-main">
                        <div className="nx-set-head">
                            <div>
                                <h1>Perfil del negocio</h1>
                                <p>Todo lo que hace único a tu negocio: cómo vende, cobra, envía y habla el asistente. Se aplica de inmediato en todos los chats y manda sobre las instrucciones.</p>
                            </div>
                            {readOnly
                                ? <div className="nx-savebox"><span className="nx-lock"><PlatIcon name="key" size={16} color="#6B7599" /> Solo el dueño puede cambiar la configuración</span></div>
                                : <div className="nx-savebox">
                                    <span className="save-status">{saved ? '✅ Guardado' : ''}</span>
                                    {saveButton}
                                </div>}
                        </div>

                        <CfgCard
                            id="general" icon="home" title="General" subtitle="Información básica de tu negocio"
                            right={presets.length > 0 && (
                                <div className="form-field">
                                    <label>Empezar desde una plantilla</label>
                                    <select value="" onChange={e => loadPreset(e.target.value)}>
                                        <option value="">Elegir plantilla…</option>
                                        {presets.map(preset => <option key={preset.id} value={preset.id}>{preset.label}</option>)}
                                    </select>
                                </div>
                            )}
                        >
                            <div className="nx-general">
                                <div className="nx-logo">
                                    <div className="box">
                                        {form.branding.logoUrl || legacy ? <img src={form.branding.logoUrl || 'logo.png'} alt="Logo" /> : <Avatar name={form.business.name} size={64} />}
                                    </div>
                                    <label className="pick">
                                        {uploadingLogo ? 'Subiendo…' : 'Cambiar logo'}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={uploadLogo} />
                                    </label>
                                    {form.branding.logoUrl && <button type="button" className="btn-link" onClick={() => set('branding.logoUrl', '')}>Quitar</button>}
                                    <small className="field-hint">PNG o JPG, máx. 5 MB</small>
                                </div>
                                <div className="profile-grid">
                                    {text('business.name', 'Nombre del negocio', 'Ej: Dulce Hogar')}
                                    {text('business.productEmoji', 'Emoji de productos', '🛍️', 'Va en el pie de cada foto')}
                                    {text('business.description', 'Qué es tu negocio', 'Ej: una tienda de zapatos para dama', 'Completa la frase "Nombre es …"', true)}
                                    {text('business.city', 'Ciudad')}
                                    {text('business.country', 'País')}
                                    <div className="form-field">
                                        <label>Zona horaria</label>
                                        <select value={form.business.timezone} onChange={e => set('business.timezone', e.target.value)}>
                                            {[...new Set([form.business.timezone, ...TIMEZONES])].map(tz => <option key={tz} value={tz}>{tz}</option>)}
                                        </select>
                                    </div>
                                    <div className="form-field">
                                        <label>Color principal</label>
                                        <input type="color" value={form.branding.primaryColor} onChange={e => set('branding.primaryColor', e.target.value)} />
                                    </div>
                                </div>
                            </div>
                        </CfgCard>

                        <CfgCard id="ventas" icon="tag" title="Cómo vendes" subtitle="Define cómo ofreces y describes tus productos">
                            <div className="profile-grid">
                                {text('sales.unitSingular', 'Unidad de venta', 'docena, par, unidad')}
                                {text('sales.unitPlural', 'Unidad en plural', 'docenas, pares, unidades')}
                                {text('sales.unitDetail', 'Qué incluye la unidad', 'Ej: 12 unidades', 'Déjalo vacío si no aplica')}
                                {text('sales.priceSuffix', 'Texto del precio en fotos', 'la docena, el par, c/u')}
                                {text('sales.productLabel', 'Cómo llamas a cada producto', 'Modelo, Producto, Diseño')}
                                {text('sales.productLabelPlural', 'En plural', 'Modelos, Productos')}
                                {text('sales.goodsWord', 'Qué vendes (para hablar del total)', 'velas, zapatos, productos')}
                                {text('sales.minimumOrder', 'Pedido mínimo', 'Ej: 2 docenas', 'Vacío = sin mínimo')}
                                {check('sales.personalization', 'Los productos se pueden personalizar')}
                                {check('sales.perProductUnits', 'Cada producto tiene su propia unidad y medida (cajas, tubos, metros…)')}
                                {check('sales.genderTagging', 'Los productos se marcan como niño, niña o neutro (baby shower)')}
                                {form.sales.personalization && text('sales.personalizationExamples', 'Qué se puede personalizar', 'Ej: colores, nombres y frases', '', true)}

        const AVATAR_COLORS = [['#E6EDFF', '#3B4FD8'], ['#EEE9FF', '#5B45D6'], ['#E3F6EC', '#1E8A4A'], ['#FFF1DA', '#B36B00'], ['#E1F4F8', '#1B7C93'], ['#FDE8EF', '#C2417A']];

        function Avatar({ name, size = 44 }) {
            const text = String(name || '?').trim();
            const initial = (text.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/) || ['?'])[0].toUpperCase();
            let hash = 0;
            for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) % 997;
            const [bg, fg] = AVATAR_COLORS[hash % AVATAR_COLORS.length];
            return <div className="nx-avatar" style={{ width: size, height: size, background: bg, color: fg, fontSize: Math.round(size * 0.4) }}>{initial}</div>;
        }

        function dayKey(value) {
            const date = parseTs(value);
            return date ? date.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ }) : '';
        }

        function dayLabel(value) {
            const key = dayKey(value);
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Hoy';
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'long', day: 'numeric', month: 'long' });
        }

        function listTime(value) {
            const key = dayKey(value);
            if (!key) return '';
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return formatTime(value);
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short' });
        }

        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            if (seconds < 60) return Math.max(1, Math.round(seconds)) + ' s';
            if (seconds < 3600) return Math.round(seconds / 60) + ' min';
            return (seconds / 3600).toFixed(1).replace('.', ',') + ' h';
        }

        function Delta({ now, before, lowerIsBetter }) {
            if (!before || before <= 0 || now === null || now === undefined) return null;
            const pct = Math.round((now - before) / before * 100);
            if (pct === 0) return <span className="nx-delta flat">= ayer</span>;
            const up = pct > 0;
            const good = lowerIsBetter ? !up : up;
            return <span className={'nx-delta ' + (good ? 'good' : 'bad')}>{up ? '↑ +' : '↓ '}{pct}%</span>;
        }

        function TodayCard({ data }) {
            const dateLabel = new Date().toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'short', day: 'numeric', month: 'long' });
            const t = data?.today, y = data?.yesterday;
            const tile = (icon, label, value, delta) => (
                <div className="nx-stat">
                    <div className="tile"><PlatIcon name={icon} size={20} color="#4F5BD5" /></div>
                    <div>
                        <div className="lab">{label}</div>
                        <div className="val">{value}{delta}</div>
                    </div>
                </div>
            );
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="calendar" size={20} color="#4F5BD5" /> Resumen de hoy</h3>
                        <span className="sm">{dateLabel}</span>
                    </div>
                    {!t ? <div className="nx-soft">Cargando...</div> : (
                        <div className="nx-stats">
                            {tile('chat', 'Conversaciones hoy', t.conversations, <Delta now={t.conversations} before={y.conversations} />)}
                            {tile('bag', 'Pedidos generados', t.orders, <Delta now={t.orders} before={y.orders} />)}
                            {tile('doc', 'Cotizaciones enviadas', t.quotations, <Delta now={t.quotations} before={y.quotations} />)}
                            {tile('clock', 'Tiempo de respuesta', formatDuration(t.responseSeconds), <Delta now={t.responseSeconds} before={y.responseSeconds} lowerIsBetter />)}
                        </div>
                    )}
                </div>
            );
        }

        function ClientCard({ summary, conv }) {

        const TAG_SUGGESTIONS = ['VIP', 'Mayorista', 'Seguimiento', 'Urgente', 'Pago pendiente'];

        function TagBar({ tags, onChange, readOnly = false }) {
            const [adding, setAdding] = useState(false);
            const [value, setValue] = useState('');
            function commit() {
                const tag = value.trim();
                setAdding(false);
                setValue('');
                if (tag && !tags.some(t => t.toLowerCase() === tag.toLowerCase())) onChange([...tags, tag]);
            }
            return (
                <div className="nx-tags">
                    {tags.map(tag => (
                        <span className="nx-tag" key={tag}>{tag}{!readOnly && <button type="button" title="Quitar etiqueta" onClick={() => onChange(tags.filter(t => t !== tag))}>×</button>}</span>
                    ))}
                    {adding ? (
                        <>
                            <input
                                className="nx-tag-input"
                                autoFocus
                                list="nx-tag-suggestions"
                                maxLength={24}
                                placeholder="Nueva etiqueta"
                                value={value}
                                onChange={e => setValue(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setAdding(false); setValue(''); } }}
                                onBlur={commit}
                            />
                            <datalist id="nx-tag-suggestions">{TAG_SUGGESTIONS.filter(t => !tags.includes(t)).map(t => <option key={t} value={t} />)}</datalist>
                        </>
                    ) : !readOnly && tags.length < 8 && <button type="button" className="nx-tag-add" title="Agregar etiqueta" onClick={() => setAdding(true)}>+</button>}
                </div>
            );
        }

        function taskDueInfo(task) {
            if (!task.due_date) return { label: 'Sin fecha', cls: 'pend', text: 'Pendiente' };
            const todayKey = new Date().toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ });
            const date = new Date(task.due_date + 'T12:00:00');
            const pretty = date.toLocaleDateString('es-EC', { day: 'numeric', month: 'long' });
            if (task.due_date < todayKey) return { label: pretty, cls: 'late', text: 'Atrasada' };
            if (task.due_date === todayKey) return { label: 'Hoy, ' + pretty, cls: 'today', text: 'Hoy' };
            return { label: pretty, cls: 'pend', text: 'Pendiente' };
        }

        function TasksCard({ tasks, onAdd, onToggle, onRemove, readOnly = false }) {
            const [open, setOpen] = useState(false);
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const pending = tasks.filter(t => !t.done).sort((a, b) => (a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1);
            async function save() {
                if (!title.trim()) return;
                await onAdd(title.trim(), date);
                setTitle('');
                setDate('');
                setOpen(false);
            }
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="check" size={20} /> Próxima acción</h3>
                        {!readOnly && pending.length > 0 && <button type="button" className="link" onClick={() => onToggle(pending[0], true)}>Marcar como completada</button>}
                    </div>
                    {pending.length === 0 && !open && <div className="nx-soft">No hay acciones pendientes.</div>}
                    {pending.map(task => {
                        const info = taskDueInfo(task);
                        return (
                            <div className="nx-task" key={task.id}>
                                {readOnly ? <span className="nx-check off"></span> : <button type="button" className="nx-check" title="Marcar como hecha" onClick={() => onToggle(task, true)}></button>}
                                <div className="info">
                                    <div className="tt">{task.title}</div>
                                    <div className="dd">{info.label}</div>
                                </div>
                                <span className={'nx-status ' + info.cls}>{info.text}</span>
                                {!readOnly && <button type="button" className="x" title="Borrar" onClick={() => onRemove(task)}>×</button>}
                            </div>
                        );
                    })}
                    {open ? (
                        <div className="nx-form">
                            <input type="text" autoFocus maxLength={160} placeholder="Ej: enviar confirmación de pedido" value={title} onChange={e => setTitle(e.target.value)} onKeyDown={e => e.key === 'Enter' && save()} />
                            <input type="date" value={date} onChange={e => setDate(e.target.value)} />
                            <div className="row">
                                <button type="button" className="save" onClick={save}>Guardar</button>
                                <button type="button" className="cancel" onClick={() => { setOpen(false); setTitle(''); setDate(''); }}>Cancelar</button>
                            </div>
                        </div>
                    ) : !readOnly && <button type="button" className="nx-add-link" onClick={() => setOpen(true)}>+ Agregar acción</button>}
                </div>
            );
        }

        function AlertsCard({ alerts, loading }) {
            return (
                <div className="nx-card">
                    <div className="nx-card-h"><h3><PlatIcon name="sparkle" size={20} color="#7C5CF0" /> Alertas</h3></div>
                    {loading ? <div className="nx-soft">Cargando...</div> : alerts.length === 0 ? <div className="nx-soft">Sin alertas por ahora.</div> : alerts.map(alert => (
                        <div className={'nx-alert ' + alert.level} key={alert.title}>
                            <PlatIcon name={alert.level === 'warn' ? 'clock' : 'bulb'} size={22} color={alert.level === 'warn' ? '#B36B00' : '#7C5CF0'} />
                            <div>
                                <div className="at">{alert.title}</div>
                                <div className="ax">{alert.text}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function readPhoto(file, done) {
            if (!file) return;
            // WhatsApp solo envía fotos JPG o PNG de hasta 5 MB.
            if (!['image/jpeg', 'image/png'].includes(file.type)) {
                alert('La foto debe ser JPG o PNG. WhatsApp no puede enviar otros formatos.');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('La foto pesa más de 5 MB. Usa una foto más liviana para que WhatsApp la pueda enviar.');
                return;
            }
            const reader = new FileReader();
            reader.onload = () => done(reader.result);
            reader.readAsDataURL(file);
        }

        function CatField({ icon, label, wide, children }) {
            return (
                <div className={'cat-f' + (wide ? ' wide' : '')}>
                    <label>{label}</label>
                    <div className="cat-in"><span className="ic"><PlatIcon name={icon} size={18} color="#6B7599" /></span>{children}</div>
                </div>
            );
        }

        /** Campos de un producto (los usa el formulario de agregar y la ventana de editar). Unidad y medida solo si el negocio las usa. */
        function ProductFields({ value, onChange, biz, categories, listId }) {
            const perProductUnits = !!biz?.sales?.perProductUnits;
            const genderTagging = !!biz?.sales?.genderTagging;
            const unit = biz?.sales?.unitSingular || 'unidad';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const categoryLabel = biz?.dates?.enabled ? 'Categoría / ' + biz.dates.eventLabel : 'Categoría';
            const set = (key, v) => onChange({ ...value, [key]: v });
            return (
                <>
                    <CatField icon="tag" label="Nombre del producto">
                        <input type="text" placeholder="Ej: nombre de tu producto" value={value.name} onChange={e => set('name', e.target.value)} />
                    </CatField>
                    <CatField icon="dollar" label={'Precio por ' + unit + ' ($)'}>
                        <input type="number" min="0" step="0.01" placeholder="Ej: 25.00" value={value.price} onChange={e => set('price', e.target.value)} />
                    </CatField>
                    <CatField icon="bag" label={categoryLabel}>
                        <input type="text" list={listId} placeholder="Ej: la categoría del producto" value={value.category} onChange={e => set('category', e.target.value)} />
                        <datalist id={listId}>{categories.map(c => <option key={c} value={c} />)}</datalist>
                    </CatField>
                    {perProductUnits && (
                        <>
                            <CatField icon="box" label={<>Unidad de venta <i>(opcional)</i></>}>
                                <input type="text" placeholder="Ej: caja de 10, tubo, metro" value={value.sale_unit} onChange={e => set('sale_unit', e.target.value)} />
                            </CatField>
                            <CatField icon="ruler" label={<>Medida <i>(opcional)</i></>}>
                                <input type="text" placeholder="Ej: 2,95 m x 0,17 m" value={value.measure} onChange={e => set('measure', e.target.value)} />
                            </CatField>
                            <CatField icon="layers" label={<>Unidades que trae <i>(opcional)</i></>}>
                                <input type="number" min="2" step="1" placeholder="Ej: 10 si la caja trae 10" value={value.pieces_per_unit} onChange={e => set('pieces_per_unit', e.target.value)} />
                            </CatField>
                        </>
                    )}
                    {genderTagging && (
                        <CatField icon="user" label="Es para">
                            <select value={value.gender || ''} onChange={e => set('gender', e.target.value)}>
                                <option value="">Neutro (para ambos)</option>
                                <option value="niño">Niño</option>
                                <option value="niña">Niña</option>
                            </select>
                        </CatField>
                    )}
                    {packagingTypes.length > 0 && (
                        <CatField icon="gift" label="Empaque incluido">
                            <select value={value.packaging} onChange={e => set('packaging', e.target.value)}>
                                <option value="">Sin definir</option>
                                {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                            </select>
                        </CatField>
                    )}
                </>
            );
        }

        const EMPTY_PRODUCT = { name: '', price: '', category: '', packaging: '', sale_unit: '', measure: '', pieces_per_unit: '', gender: '', photoBase64: '', photoPreview: '' };
        const SORTS = { recent: 'Más recientes', name: 'Nombre (A-Z)', low: 'Precio: menor a mayor', high: 'Precio: mayor a menor' };

        function CatalogView({ products, biz, legacy, reload, readOnly = false }) {
            const perProductUnits = !!biz?.sales?.perProductUnits;
            const genderTagging = !!biz?.sales?.genderTagging;
            const unit = biz?.sales?.unitSingular || 'unidad';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const [form, setForm] = useState(EMPTY_PRODUCT);
            const [saving, setSaving] = useState(false);
            const [drag, setDrag] = useState(false);
            const [search, setSearch] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('');
            const [sort, setSort] = useState('recent');
            const [view, setView] = useState('grid');
            const [editing, setEditing] = useState(null);
            const [busyId, setBusyId] = useState('');

            const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
            const total = products.length;
            const average = total ? products.reduce((sum, p) => sum + Number(p.price || 0), 0) / total : 0;
            const monthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const before = products.filter(p => { const t = parseTs(p.created_at); return t && t.getTime() <= monthAgo; }).length;
            const growth = before > 0 ? Math.round((total - before) / before * 100) : null;
            const pretty = text => (text ? text.charAt(0).toUpperCase() + text.slice(1).toLowerCase() : text);
            const categoryNames = categories.slice(0, 2).map(pretty).join(', ') + (categories.length > 2 ? '…' : '');

            const needle = search.trim().toLowerCase();
            const visible = products
                .filter(p => (!categoryFilter || p.category === categoryFilter) && (!needle || (p.name + ' ' + p.category).toLowerCase().includes(needle)))
                .sort((a, b) => {
                    if (sort === 'name') return String(a.name).localeCompare(String(b.name), 'es');
                    if (sort === 'low') return Number(a.price) - Number(b.price);
                    if (sort === 'high') return Number(b.price) - Number(a.price);
                    return (parseTs(b.created_at)?.getTime() || 0) - (parseTs(a.created_at)?.getTime() || 0);
                });

            const uploadPhoto = async base64 => (await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: base64 }) })).url;

            async function addProduct() {
                if (!form.name.trim() || !form.price || !form.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSaving(true);
                try {
                    const imageUrl = form.photoBase64 ? await uploadPhoto(form.photoBase64) : '';
                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: form.name, price: parseFloat(form.price), category: form.category, packaging: form.packaging,
                            sale_unit: form.sale_unit, measure: form.measure, pieces_per_unit: form.pieces_per_unit, gender: form.gender,
                            image_url: imageUrl
                        })
                    });
                    setForm(EMPTY_PRODUCT);
                    reload();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            function startEdit(p) {
                setEditing({
                    id: p.id, name: p.name || '', price: String(p.price ?? ''), category: p.category || '',
                    packaging: p.description || '', sale_unit: p.sale_unit || '', measure: p.measure || '',
                    pieces_per_unit: p.pieces_per_unit ? String(p.pieces_per_unit) : '', gender: p.gender || '',
                    image_url: p.image_url || '', photoBase64: '', photoPreview: ''
                });
            }

            async function saveEdit() {
                const e = editing;
                if (!e.name.trim() || !e.price || !e.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setBusyId(e.id);
                try {
                    const body = { name: e.name, price: parseFloat(e.price), category: e.category };
                    if (perProductUnits) Object.assign(body, { sale_unit: e.sale_unit, measure: e.measure, pieces_per_unit: e.pieces_per_unit });
                    if (genderTagging) body.gender = e.gender;
                    if (packagingTypes.length > 0) body.packaging = e.packaging;
                    if (e.photoBase64) body.image_url = await uploadPhoto(e.photoBase64);
                    await api('/api/products/' + e.id, { method: 'PUT', body: JSON.stringify(body) });
                    setEditing(null);
                    reload();
                } catch (err) {
                    alert('Error guardando el producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function duplicate(p) {
                setBusyId(p.id);
                try {
                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: p.name + ' (copia)', price: Number(p.price), category: p.category,
                            packaging: packagingTypes.some(t => t.name === p.description) ? p.description : '',
                            sale_unit: p.sale_unit || '', measure: p.measure || '', pieces_per_unit: p.pieces_per_unit || '',
                            gender: p.gender || '', image_url: p.image_url || ''
                        })
                    });
                    reload();
                } catch (err) {
                    alert('Error duplicando el producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            async function remove(p) {
                if (!confirm('¿Eliminar "' + p.name + '" del catálogo?')) return;
                setBusyId(p.id);
                try {
                    await api('/api/products/' + p.id, { method: 'DELETE' });
                    reload();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                } finally {
                    setBusyId('');
                }
            }

            const photo = (p, cls) => (p.image_url || legacy
                ? <img className={cls} src={p.image_url || 'logo.png'} alt="" loading="lazy" />
                : <div className={cls}><PlatIcon name="image" size={34} color="#9AA3C7" /></div>);
            const priceText = p => <>${Number(p.price).toFixed(2).replace(/\.00$/, '')} <small>por {(perProductUnits && p.sale_unit) || unit}</small></>;
            const detailLines = p => {
                const lines = [];
                if (perProductUnits) {
                    if (p.sale_unit) lines.push(['box', 'Unidad de venta: ' + p.sale_unit]);
                    if (p.measure) lines.push(['ruler', 'Medida: ' + p.measure]);
                    if (p.pieces_per_unit) lines.push(['layers', 'Unidades que trae: ' + p.pieces_per_unit]);
                }
                if (genderTagging && (p.gender === 'niño' || p.gender === 'niña')) lines.push(['user', 'Es para: ' + p.gender]);
                if (biz?.packaging?.enabled) lines.push(['gift', 'Empaque: ' + (p.description || 'Sin definir')]);
                return lines;
            };
            const actions = p => readOnly ? null : (
                <div className="cat-actions">
                    <button type="button" className="cat-btn" disabled={busyId === p.id} onClick={() => startEdit(p)}><PlatIcon name="edit" size={16} color="#2563EB" /><span className="lb">Editar</span></button>
                    <button type="button" className="cat-btn copy" disabled={busyId === p.id} onClick={() => duplicate(p)}><PlatIcon name="copy" size={16} color="#2A3766" /><span className="lb">Duplicar</span></button>
                    <button type="button" className="cat-btn del" disabled={busyId === p.id} title="Eliminar" onClick={() => remove(p)}><PlatIcon name="trash" size={16} color="#D03535" /></button>
                </div>
            );

            return (
                <div className="cat-page">
                    <div className="cat-wrap">
                        <div className="cat-head">
                            <div className="cat-title">
                                <div className="tile"><PlatIcon name="bag" size={28} color="#4F5BD5" /></div>
                                <div><h1>Catálogo de productos</h1><p>Gestiona los productos que compartes por WhatsApp</p></div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="box" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Productos activos</div>
                                    <div className="val">{total}{growth !== null && <span className={growth >= 0 ? 'up' : 'down'}>{growth >= 0 ? '↑ +' : '↓ '}{growth}%</span>}</div>
                                    {growth !== null && <div className="sub">vs. mes anterior</div>}
                                </div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="tag" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Categorías</div>
                                    <div className="val">{categories.length}</div>
                                    {categories.length > 0 && <div className="sub">{categoryNames}</div>}
                                </div>
                            </div>
                            <div className="cat-stat">
                                <div className="tile"><PlatIcon name="chart" size={24} color="#4F5BD5" /></div>
                                <div>
                                    <div className="lab">Precio promedio</div>
                                    <div className="val">${average.toFixed(2).replace(/\.00$/, '')}</div>
                                    <div className="sub">{perProductUnits ? 'por unidad de venta' : 'por ' + unit}</div>
                                </div>
                            </div>
                        </div>

                        {!readOnly && <div className="cat-card">
                            <div className="cat-add-h">
                                <div className="plus"><PlatIcon name="plus" size={24} color="#fff" /></div>
                                <div><h2>Agregar producto al catálogo</h2><p>Completa la información del producto. Luego podrás editarlo o compartirlo por WhatsApp.</p></div>
                            </div>
                            <div className="cat-add">
                                <div className="cat-f">
                                    <label>Foto del producto</label>
                                    <label
                                        className={'cat-drop' + (drag ? ' over' : '')}
                                        onDragOver={e => { e.preventDefault(); setDrag(true); }}
                                        onDragLeave={() => setDrag(false)}
                                        onDrop={e => { e.preventDefault(); setDrag(false); readPhoto(e.dataTransfer.files[0], data => setForm(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); }}
                                    >
                                        {form.photoPreview
                                            ? <img src={form.photoPreview} alt="" />
                                            : <><PlatIcon name="image" size={38} color="#6C7CF0" /><span>Haz clic para subir una imagen o arrástrala aquí</span><small>JPG, PNG (máx. 5 MB)</small></>}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={e => { readPhoto(e.target.files[0], data => setForm(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); e.target.value = ''; }} />
                                    </label>
                                </div>
                                <div className="cat-fields">
                                    <ProductFields value={form} onChange={setForm} biz={biz} categories={categories} listId="cat-list-new" />
                                    <button type="button" className="cat-submit" onClick={addProduct} disabled={saving}><PlatIcon name="plus" size={18} color="#fff" /> {saving ? 'Guardando...' : 'Agregar producto'}</button>
                                </div>
                            </div>
                        </div>}

                        <div className="cat-card">
                            <div className="cat-list-h">
                                <div className="ttl">
                                    <div className="tile"><PlatIcon name="grid" size={22} color="#4F5BD5" /></div>
                                    <div><h2>Tus productos</h2><p>Administra, edita o elimina los productos de tu catálogo</p></div>
                                </div>
                                <div className="cat-tools">
                                    <div className="cat-in"><span className="ic"><PlatIcon name="search" size={18} color="#6B7599" /></span><input type="text" placeholder="Buscar productos..." value={search} onChange={e => setSearch(e.target.value)} /></div>
                                    <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
                                        <option value="">Todas las categorías</option>
                                        {categories.map(c => <option key={c} value={c}>{pretty(c)}</option>)}
                                    </select>
                                    <select value={sort} onChange={e => setSort(e.target.value)}>
                                        {Object.entries(SORTS).map(([key, label]) => <option key={key} value={key}>Ordenar por: {label}</option>)}
                                    </select>
                                    <div className="cat-toggle">
                                        <button type="button" className={view === 'grid' ? 'on' : ''} title="Tarjetas" onClick={() => setView('grid')}><PlatIcon name="grid" size={19} color={view === 'grid' ? '#fff' : '#6B7599'} /></button>
                                        <button type="button" className={view === 'list' ? 'on' : ''} title="Lista" onClick={() => setView('list')}><PlatIcon name="list" size={19} color={view === 'list' ? '#fff' : '#6B7599'} /></button>
                                    </div>
                                </div>
                            </div>

                            {total === 0 ? (
                                <div className="cat-empty">Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo {biz?.business?.productEmoji || ''}</div>
                            ) : visible.length === 0 ? (
                                <div className="cat-empty">Ningún producto coincide con la búsqueda.</div>
                            ) : view === 'grid' ? (
                                <div className="cat-grid">
                                    {visible.map(p => (
                                        <div className="cat-item" key={p.id}>
                                            {photo(p, 'ph')}
                                            <div className="body">
                                                <span className="cat-tag">{p.category}</span>
                                                <h3>{p.name}</h3>
                                                <div className="cat-price">{priceText(p)}</div>
                                                <div className="cat-lines">{detailLines(p).map(([icon, text]) => <div key={icon}><PlatIcon name={icon} size={16} color="#8A93B5" /><span>{text}</span></div>)}</div>
                                                {actions(p)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="cat-rows">
                                    {visible.map(p => (
                                        <div className="cat-row" key={p.id}>
                                            {photo(p, 'th')}
                                            <div className="mid">
                                                <span className="cat-tag">{p.category}</span>
                                                <h3>{p.name}</h3>
                                                <div className="meta">{detailLines(p).map(([, text]) => text).join(' · ')}</div>
                                            </div>
                                            <div className="cat-price">{priceText(p)}</div>
                                            {actions(p)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {editing && (
                        <div className="cat-modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) setEditing(null); }}>
                            <div className="cat-modal">
                                <h2>Editar producto</h2>
                                <div className="edit-photo">
                                    {editing.photoPreview || editing.image_url ? <img src={editing.photoPreview || editing.image_url} alt="" /> : <div className="noimg"><PlatIcon name="image" size={30} color="#9AA3C7" /></div>}
                                    <label className="pick">Cambiar foto<input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={e => { readPhoto(e.target.files[0], data => setEditing(prev => ({ ...prev, photoBase64: data, photoPreview: data }))); e.target.value = ''; }} /></label>
                                </div>
                                <div className="cat-fields">
                                    <ProductFields value={editing} onChange={setEditing} biz={biz} categories={categories} listId="cat-list-edit" />
                                </div>
                                <div className="foot">
                                    <button type="button" className="cancel" onClick={() => setEditing(null)}>Cancelar</button>
                                    <button type="button" className="cat-submit" onClick={saveEdit} disabled={busyId === editing.id}>{busyId === editing.id ? 'Guardando...' : 'Guardar cambios'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App({ onLogout, branding, onBrandingChange }) {
            const [conversations, setConversations] = useState([]);
            const [selectedConv, setSelectedConv] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [botEnabled, setBotEnabled] = useState(true);
            const [stats, setStats] = useState({ total: 0, active: 0, orders: 0, revenue: 0 });
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('conversaciones');
            const [products, setProducts] = useState([]);
            const [systemPrompt, setSystemPrompt] = useState('');
            const [savingPrompt, setSavingPrompt] = useState(false);
            const [promptSaved, setPromptSaved] = useState(false);
            const [transferInfo, setTransferInfo] = useState('');
            const [savingTransfer, setSavingTransfer] = useState(false);
            const [transferSaved, setTransferSaved] = useState(false);
            const [pausingBot, setPausingBot] = useState(false);
            const [statsExpanded, setStatsExpanded] = useState(false);
            const [quotations, setQuotations] = useState([]);
            const [quoteFilter, setQuoteFilter] = useState('all');
            const [orders, setOrders] = useState([]);
            const [orderFilter, setOrderFilter] = useState('all');
            // Chat abierto en este momento: una respuesta lenta de otro chat no debe reemplazar sus mensajes.
            const openChatId = useRef(null);
            const [deletingChat, setDeletingChat] = useState(false);
            const [sending, setSending] = useState(false);
            const [biz, setBiz] = useState(null);
            const [businesses, setBusinesses] = useState([]);
            const currentBusinessId = getCurrentBusinessId() || null;
            const [session, setSession] = useState(null);
            const [today, setToday] = useState(null);
            const [listOverview, setListOverview] = useState({ previews: {}, clientIds: [] });
            const [summary, setSummary] = useState(null);
            const [search, setSearch] = useState('');
            const [listFilter, setListFilter] = useState('all');
            const [noteMode, setNoteMode] = useState(false);
            const [photoPicker, setPhotoPicker] = useState(false);
            const [noteText, setNoteText] = useState('');
            const isAdmin = session?.role === 'admin';
            // Mientras carga la sesión se muestra todo; el servidor igual rechaza lo que el rol no permite.
            const canEdit = !session || session.role !== 'staff';
            const canConfigure = !session || session.role === 'owner' || session.role === 'admin';
            const unit = biz?.sales.unitSingular || 'unidad';
            const unitPlural = biz?.sales.unitPlural || 'unidades';
            const productEmoji = biz?.business.productEmoji || '🛍️';
            const messagesRef = useRef(null);
            // Se sigue al último mensaje salvo que la dueña haya subido a leer mensajes anteriores.
            const stickToBottom = useRef(true);

            useEffect(() => {
                loadSession();
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                loadSystemPrompt();
                loadQuotations();
                loadPaymentInfo();

            function photoToJpeg(file) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(file);
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la foto')); };
                    img.src = url;
                });
            }

                input.onchange = async () => {
                    const files = Array.from(input.files || []).slice(0, 10);
                    if (files.length === 0) return;
                    const caption = prompt('Texto para acompañar la foto (opcional):') || '';
                    try {

                                body: JSON.stringify({
                                    conversationId: conv.id,
                                    phoneNumber: conv.phone_number,
                                    imageBase64: await photoToJpeg(files[i]),

                            });
