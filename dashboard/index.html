<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELAMIA - CRM WhatsApp Assistant</title>

    <!-- Instalable como app (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B96B4F">

    <!-- iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VELAMIA CRM">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --terracota: #B96B4F;
            --terracota-dark: #9C5740;
            --rosa-palo: #E3B7AC;
            --rosa-palo-suave: #F0DAD3;
            --beige: #F7EFEA;
            --beige-claro: #FCF8F5;
            --crema: #FDFAF7;
            --texto: #4A3B35;
            --texto-suave: #9C8880;
            --azul-suave: #A8C5D6;
            --verde-suave: #A8D5BA;
            --amarillo-suave: #E8C88A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--beige);
            color: var(--texto);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            color: var(--texto);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand img {
            height: 42px;
            width: auto;
            display: block;
        }

        .header-brand .subtitle {
            font-size: 12px;
            color: var(--texto-suave);
            letter-spacing: 0.5px;
        }

        .toggle-bot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
        }

        .toggle-bot.active {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .toggle-bot.inactive {
            background: #e39a9a;
            color: #6b2c2c;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            padding: 0 28px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
        }

        .nav-tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-suave);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--terracota);
        }

        .nav-tab.active {
            color: var(--terracota);
            border-bottom-color: var(--terracota);
        }

        .catalog-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .catalog-form {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 140px 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-field input, .form-field select {
            padding: 10px 12px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .photo-upload {
            width: 90px;
            height: 90px;
            border: 2px dashed var(--rosa-palo);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: var(--beige-claro);
            font-size: 22px;
            color: var(--rosa-palo);
        }

        .photo-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-add-product {
            background: var(--terracota);
            color: white;
            padding: 11px 22px;
            height: fit-content;
        }

        .btn-add-product:hover {
            background: var(--terracota-dark);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 16px rgba(185, 107, 79, 0.15);
        }

        .product-card .photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--rosa-palo-suave);
        }

        .product-card .info {
            padding: 14px;
        }

        .product-card .category-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: var(--terracota);
            background: var(--rosa-palo-suave);
            padding: 3px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .product-card .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--terracota);
        }

        .product-card .price small {
            font-size: 11px;
            font-weight: 400;
            color: var(--texto-suave);
        }

        .btn-delete-product {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #e39a9a;
            color: #b45050;
            padding: 6px;
            font-size: 12px;
        }

        .btn-delete-product:hover {
            background: #f5dcdc;
        }

        .empty-catalog {
            text-align: center;
            padding: 60px 20px;
            color: var(--texto-suave);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 20px 28px;
            background: var(--beige);
        }

        .stat-card {
            padding: 18px;
            border-radius: 14px;
            color: white;
            box-shadow: 0 2px 10px rgba(185, 107, 79, 0.12);
        }

        .stat-card:nth-child(1) { background: linear-gradient(135deg, var(--terracota), var(--terracota-dark)); }
        .stat-card:nth-child(2) { background: linear-gradient(135deg, var(--azul-suave), #8ba9bb); }
        .stat-card:nth-child(3) { background: linear-gradient(135deg, var(--amarillo-suave), #d1ac6a); }
        .stat-card:nth-child(4) { background: linear-gradient(135deg, var(--verde-suave), #85b89b); }

        .stat-card h4 {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .conversations-list {
            width: 300px;
            background: var(--crema);
            border-right: 1px solid var(--rosa-palo-suave);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversations-list-header {
            padding: 16px 18px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversation-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--beige);
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: var(--rosa-palo-suave);
        }

        .conversation-item.active {
            background: var(--rosa-palo-suave);
            border-left: 4px solid var(--terracota);
        }

        .conversation-item h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--texto);
        }

        .conversation-item p {
            font-size: 12px;
            color: var(--texto-suave);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--beige-claro);
            min-width: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 14px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.customer .message-bubble {
            background: var(--terracota);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: var(--rosa-palo-suave);
            color: var(--texto);
            border-bottom-left-radius: 4px;
        }

        .message-bubble img {
            max-width: 220px;
            border-radius: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .message-time {
            font-size: 11px;
            color: var(--texto-suave);
            margin-top: 4px;
        }

        .input-area {
            padding: 18px 24px;
            border-top: 1px solid var(--rosa-palo-suave);
            display: flex;
            gap: 10px;
            background: var(--crema);
        }

        textarea {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            resize: none;
            font-family: inherit;
            min-height: 56px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-send {
            background: var(--terracota);
            color: white;
        }

        .btn-send:hover {
            background: var(--terracota-dark);
        }

        .btn-photo {
            background: var(--rosa-palo);
            color: var(--texto);
        }

        .btn-photo:hover {
            background: var(--rosa-palo-suave);
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--texto-suave);
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
        }

        .spinner {
            border: 3px solid var(--rosa-palo-suave);
            border-top: 3px solid var(--terracota);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .conversations-list { width: 220px; }
            .header-brand img { height: 32px; }
            .catalog-form { grid-template-columns: 1fr; }
            .photo-upload { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuración de Supabase (solo lectura de datos)
        const SUPABASE_URL = 'https://yhaiprlfpmugohmzpzcq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0qYx-odpKqBHpDNZWGyNbg_-luUJY4J';

        // Backend real (envía mensajes de WhatsApp de verdad)
        const API_URL = 'https://whatsapp-assistant-velamia.onrender.com';
        const CRM_KEY = 'velamia_webhook_2024_secure_token';

        function App() {
            const [conversations, setConversations] = useState([]);
            const [selectedConv, setSelectedConv] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [botEnabled, setBotEnabled] = useState(true);
            const [stats, setStats] = useState({ total: 0, active: 0, orders: 0, revenue: 0 });
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('conversaciones');
            const [products, setProducts] = useState([]);
            const [newProduct, setNewProduct] = useState({ name: '', price: '', category: '', photoBase64: '', photoPreview: '' });
            const [savingProduct, setSavingProduct] = useState(false);

            useEffect(() => {
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                const interval = setInterval(() => {
                    loadConversations();
                    loadStats();
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            async function loadProducts() {
                try {
                    const res = await fetch(`${API_URL}/api/products`);
                    const data = await res.json();
                    setProducts(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando catálogo:', err);
                }
            }

            function handlePhotoSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    setNewProduct(prev => ({ ...prev, photoBase64: reader.result, photoPreview: reader.result }));
                };
                reader.readAsDataURL(file);
            }

            async function addProduct() {
                if (!newProduct.name.trim() || !newProduct.price || !newProduct.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSavingProduct(true);
                try {
                    let imageUrl = '';
                    if (newProduct.photoBase64) {
                        const uploadRes = await fetch(`${API_URL}/api/upload-image`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-crm-key': CRM_KEY },
                            body: JSON.stringify({ imageBase64: newProduct.photoBase64 })
                        });
                        const uploadData = await uploadRes.json();
                        if (uploadData.error) throw new Error(uploadData.error);
                        imageUrl = uploadData.url;
                    }

                    const res = await fetch(`${API_URL}/api/products`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-crm-key': CRM_KEY },
                        body: JSON.stringify({
                            name: newProduct.name,
                            price: parseFloat(newProduct.price),
                            category: newProduct.category,
                            image_url: imageUrl
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);

                    setNewProduct({ name: '', price: '', category: '', photoBase64: '', photoPreview: '' });
                    loadProducts();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSavingProduct(false);
                }
            }

            async function removeProduct(id) {
                if (!confirm('¿Eliminar este producto del catálogo?')) return;
                try {
                    await fetch(`${API_URL}/api/products/${id}`, {
                        method: 'DELETE',
                        headers: { 'x-crm-key': CRM_KEY }
                    });
                    loadProducts();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                }
            }

            async function loadBotStatus() {
                try {
                    const res = await fetch(`${API_URL}/api/bot-status`, {
                        headers: { 'x-crm-key': CRM_KEY }
                    });
                    const data = await res.json();
                    setBotEnabled(data.enabled);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function toggleBotStatus() {
                const newValue = !botEnabled;
                setBotEnabled(newValue);
                try {
                    await fetch(`${API_URL}/api/bot-status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-crm-key': CRM_KEY },
                        body: JSON.stringify({ enabled: newValue })
                    });
                } catch (err) {
                    alert('Error cambiando estado del bot: ' + err.message);
                    setBotEnabled(!newValue);
                }
            }

            async function sendPhoto() {
                if (!selectedConv) return;
                const imageUrl = prompt('Pega la URL de la foto a enviar:');
                if (!imageUrl) return;
                const caption = prompt('Descripción (opcional):') || '';

                try {
                    const res = await fetch(`${API_URL}/api/send-image`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-crm-key': CRM_KEY },
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            imageUrl,
                            caption
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    loadMessages(selectedConv.id);
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                }
            }

            useEffect(() => {
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

            async function loadConversations() {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/conversations?order=last_message_time.desc`, {
                        headers: { 'apikey': SUPABASE_KEY }
                    });
                    const data = await res.json();
                    setConversations(data);
                    setLoading(false);
                } catch (err) {
                    console.error('Error cargando conversaciones:', err);
                }
            }

            async function loadMessages(convId) {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?conversation_id=eq.${convId}&order=timestamp.asc`, {
                        headers: { 'apikey': SUPABASE_KEY }
                    });
                    const data = await res.json();
                    setMessages(data);
                } catch (err) {
                    console.error('Error cargando mensajes:', err);
                }
            }

            async function loadStats() {
                try {
                    const ordersRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=total_amount,status`, {
                        headers: { 'apikey': SUPABASE_KEY }
                    });

                    const orders = await ordersRes.json();
                    const revenue = Array.isArray(orders) ? orders.reduce((sum, o) => sum + (o.total_amount || 0), 0) : 0;

                    setStats({
                        total: conversations.length,
                        active: conversations.filter(c => c.status === 'active').length,
                        orders: Array.isArray(orders) ? orders.length : 0,
                        revenue: revenue
                    });
                } catch (err) {
                    console.error('Error cargando stats:', err);
                }
            }

            async function sendMessage() {
                if (!inputText.trim() || !selectedConv) return;

                try {
                    const res = await fetch(`${API_URL}/api/send-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-crm-key': CRM_KEY },
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            text: inputText
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);

                    setInputText('');
                    loadMessages(selectedConv.id);
                } catch (err) {
                    alert('Error enviando mensaje: ' + err.message);
                }
            }

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--beige)' }}>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando CRM...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="main">
                        <div className="header">
                            <div className="header-brand">
                                <img src="logo.png" alt="VELAMIA" />
                                <div>
                                    <div className="subtitle">CRM · Asistente WhatsApp</div>
                                </div>
                            </div>
                            <div className={`toggle-bot ${botEnabled ? 'active' : 'inactive'}`} onClick={toggleBotStatus}>
                                <span>{botEnabled ? '🤖 Bot Activo' : '🚫 Bot Inactivo'}</span>
                            </div>
                        </div>

                        <div className="nav-tabs">
                            <div className={`nav-tab ${activeTab === 'conversaciones' ? 'active' : ''}`} onClick={() => setActiveTab('conversaciones')}>💬 Conversaciones</div>
                            <div className={`nav-tab ${activeTab === 'catalogo' ? 'active' : ''}`} onClick={() => setActiveTab('catalogo')}>🕯️ Catálogo</div>
                        </div>

                        <div className="stats">
                            <div className="stat-card">
                                <h4>Total Clientes</h4>
                                <div className="number">{conversations.length}</div>
                            </div>
                            <div className="stat-card">
                                <h4>Conversaciones Activas</h4>
                                <div className="number">{stats.active}</div>
                            </div>
                            <div className="stat-card">
                                <h4>Pedidos</h4>
                                <div className="number">{stats.orders}</div>
                            </div>
                            <div className="stat-card">
                                <h4>Ingresos</h4>
                                <div className="number">${stats.revenue.toFixed(2)}</div>
                            </div>
                        </div>

                        {activeTab === 'conversaciones' ? (
                        <div className="content">
                            <div className="conversations-list">
                                <div className="conversations-list-header">Conversaciones</div>
                                {conversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        className={`conversation-item ${selectedConv?.id === conv.id ? 'active' : ''}`}
                                        onClick={() => setSelectedConv(conv)}
                                    >
                                        <h3>📱 {conv.customer_name || conv.phone_number}</h3>
                                        <p>{new Date(conv.last_message_time).toLocaleString('es-EC')}</p>
                                    </div>
                                ))}
                            </div>

                            {selectedConv ? (
                                <div className="chat-area">
                                    <div className="messages-container">
                                        {messages.map((msg, idx) => {
                                            const urlMatch = msg.content.match(/^https?:\/\/\S+/);
                                            const mediaUrl = urlMatch ? urlMatch[0] : null;
                                            const textPart = mediaUrl ? msg.content.replace(mediaUrl, '').replace(/^\n/, '') : msg.content;
                                            return (
                                                <div key={idx} className={`message ${msg.sender}`}>
                                                    <div>
                                                        <div className="message-bubble">
                                                            {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                            {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '220px', marginBottom: '6px', display: 'block' }} /> : null}
                                                            {textPart}
                                                        </div>
                                                        <div className="message-time">{new Date(msg.timestamp).toLocaleTimeString('es-EC')}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="input-area">
                                        <textarea
                                            placeholder="Escribe tu respuesta aquí..."
                                            value={inputText}
                                            onChange={e => setInputText(e.target.value)}
                                            onKeyPress={e => e.key === 'Enter' && !e.shiftKey && sendMessage()}
                                        ></textarea>
                                        <div className="button-group">
                                            <button className="btn-send" onClick={sendMessage}>📤 Enviar</button>
                                            <button className="btn-photo" onClick={sendPhoto}>📷 Foto</button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <p>Selecciona una conversación</p>
                                </div>
                            )}
                        </div>
                        ) : (
                        <div className="catalog-container">
                            <div className="catalog-form">
                                <div className="form-field">
                                    <label>Foto</label>
                                    <label className="photo-upload">
                                        {newProduct.photoPreview ? <img src={newProduct.photoPreview} /> : '📷'}
                                        <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhotoSelect} />
                                    </label>
                                </div>
                                <div className="form-field">
                                    <label>Nombre del producto</label>
                                    <input type="text" placeholder="Ej: Vela Aromática Lavanda" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Precio por docena ($)</label>
                                    <input type="number" step="0.01" placeholder="Ej: 25.00" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Categoría / Evento</label>
                                    <input type="text" placeholder="Ej: Bautizo, Cumpleaños, XV años" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} />
                                </div>
                                <button className="btn-add-product" onClick={addProduct} disabled={savingProduct}>
                                    {savingProduct ? 'Guardando...' : '+ Agregar'}
                                </button>
                            </div>

                            {products.length === 0 ? (
                                <div className="empty-catalog">
                                    <p>Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo 🕯️</p>
                                </div>
                            ) : (
                                <div className="catalog-grid">
                                    {products.map(product => (
                                        <div key={product.id} className="product-card">
                                            <img className="photo" src={product.image_url || 'logo.png'} />
                                            <div className="info">
                                                <span className="category-tag">{product.category}</span>
                                                <h4>{product.name}</h4>
                                                <div className="price">${product.price} <small>por docena</small></div>
                                                <button className="btn-delete-product" onClick={() => removeProduct(product.id)}>🗑️ Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
