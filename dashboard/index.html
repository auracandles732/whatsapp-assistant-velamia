<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // El CRM lo sirve el mismo servidor: se usa su propio origen (sirve igual en otro dominio).
        const API_URL = /^https?:$/.test(window.location.protocol)
            ? window.location.origin
            : 'https://whatsapp-assistant-velamia.onrender.com';
        const TOKEN_KEY = 'velamia_crm_token';

        let onSessionExpired = () => {};

        // Algunos navegadores bloquean el almacenamiento (modo privado, restricciones):
        // en ese caso la sesión dura lo que dure la pestaña en lugar de romper la app.
        let memoryToken = null;

        function getToken() {
            try {
                return localStorage.getItem(TOKEN_KEY) || memoryToken;
            } catch {
                return memoryToken;
            }
        }

        function setToken(value) {
            memoryToken = value;
            try {
                if (value === null) localStorage.removeItem(TOKEN_KEY);
                else localStorage.setItem(TOKEN_KEY, value);
            } catch {
                // sesión solo en memoria
            }
        }

        // Todas las peticiones pasan por el backend autenticado: el navegador
        // nunca maneja claves de Supabase ni de WhatsApp.
        const BUSINESS_KEY = 'currentBusinessId';

        function getCurrentBusinessId() {
            try {
                return localStorage.getItem(BUSINESS_KEY) || '';
            } catch {
                return '';
            }
        }

        function setCurrentBusinessId(value) {
            try {
                if (value) localStorage.setItem(BUSINESS_KEY, value);
                else localStorage.removeItem(BUSINESS_KEY);
            } catch {
                // sin almacenamiento: se trabaja en VELAMIA
            }
        }

        async function api(path, options = {}) {
            const token = getToken();
            const businessId = getCurrentBusinessId();
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(businessId ? { 'X-Business-Id': businessId } : {}),
                    ...(options.headers || {})
                }
            });

            if (res.status === 401) {
                setToken(null);
                onSessionExpired();
                throw new Error('Sesión expirada, vuelve a entrar');
            }

            // Durante un despliegue Render puede responder una página HTML en lugar de JSON.
            let data;
            try {
                data = await res.json();
            } catch {
                throw new Error('El servidor no está disponible en este momento, intenta en unos segundos');
            }
            if (!res.ok || (data && data.error)) throw new Error(data?.error || `Error ${res.status}`);
            return data;
        }

        // Tipos cuyo contenido guardado empieza con la URL del archivo.
        const MEDIA_TYPES = ['image', 'audio', 'document'];

        // La base guarda las fechas en UTC sin zona horaria; sin la "Z" el navegador
        // las toma como hora local y en Ecuador aparecen 5 horas adelantadas.
        let BUSINESS_TZ = 'America/Guayaquil';

        // Nombre, color, logo y zona horaria del negocio (perfil del negocio).
        function applyBranding(branding) {
            if (!branding) return;
            if (branding.name) document.title = `${branding.name} · Nexly`;
            if (/^#[0-9a-f]{6}$/i.test(branding.primaryColor || '')) {
                document.documentElement.style.setProperty('--terracota', branding.primaryColor);
            }
            if (branding.timezone) BUSINESS_TZ = branding.timezone;
        }

        const logoOf = branding => (branding && branding.logoUrl) || 'logo.png';

        function parseTs(value) {
            if (!value) return null;
            return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(value) ? value : `${value}Z`);
        }

        function formatDateTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
        }

        // Como en WhatsApp: *negrita*, _cursiva_ y ~tachado~ se ven con su formato, sin los signos.
        function renderWa(text) {
            const parts = String(text || '').split(/((?<![\w*])\*[^*\n]+\*(?![\w*])|(?<![\w_])_[^_\n]+_(?![\w_])|(?<![\w~])~[^~\n]+~(?![\w~]))/);
            return parts.map((part, i) => {
                if (i % 2 === 0) return part;
                const inner = part.slice(1, -1);
                if (part[0] === '*') return <strong key={i}>{inner}</strong>;
                if (part[0] === '_') return <em key={i}>{inner}</em>;
                return <s key={i}>{inner}</s>;
            });
        }

        function formatTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleTimeString('es-EC', { timeZone: BUSINESS_TZ, hour: 'numeric', minute: '2-digit' }) : '';
        }

        function isBotPausedIn(conv) {
            const until = parseTs(conv?.bot_paused_until);
            return !!until && until > new Date();
        }

        // ---------- Administración de negocios (solo con la contraseña maestra) ----------
        const EMPTY_BUSINESS_FORM = { name: '', preset: 'tienda', displayPhoneNumber: '', phoneNumberId: '', wabaId: '', metaAccessToken: '', openaiApiKey: '' };
        const fieldStyle = { width: '100%', padding: '8px', border: '1px solid var(--rosa-palo-suave)', borderRadius: '4px', boxSizing: 'border-box' };
        const labelStyle = { display: 'block', fontSize: '13px', marginBottom: '5px', fontWeight: '600' };
        const buttonStyle = { padding: '8px 14px', background: 'var(--terracota)', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' };
        const secondaryButtonStyle = { ...buttonStyle, background: 'var(--rosa-palo-suave)', color: 'var(--texto)' };

        /** Avisa antes de guardar algo que Meta u OpenAI van a rechazar (típico: el navegador rellenó el campo). */
        function credentialProblem(form) {
            const token = (form.metaAccessToken || '').trim();
            const key = (form.openaiApiKey || '').trim();
            if (token && !(token.startsWith('EAA') && token.length > 100)) {
                return `El token de Meta se ve incorrecto: los de Meta empiezan con "EAA" y son muy largos, y este empieza con "${token.slice(0, 3)}" y tiene ${token.length} caracteres.\n\nSuele pasar cuando el navegador rellena el campo con una contraseña guardada: borra el campo, pégalo de nuevo y revisa que quede completo.\n\n¿Guardar de todos modos?`;
            }
            if (key && !(key.startsWith('sk-') && key.length > 20)) {
                return `La clave de OpenAI se ve incorrecta: empiezan con "sk-" y esta empieza con "${key.slice(0, 3)}".\n\n¿Guardar de todos modos?`;
            }
            return null;
        }

        function CredentialFields({ form, setForm, business }) {
            const field = (key, label, placeholder, secret, hint) => (
                <div style={{ marginBottom: '12px' }}>
                    <label style={labelStyle}>{label}</label>
                    <input
                        type="text"
                        name={`campo-${key}`}
                        autoComplete="off"
                        data-lpignore="true"
                        spellCheck={false}
                        style={secret ? { ...fieldStyle, WebkitTextSecurity: 'disc' } : fieldStyle}
                        value={form[key]}
                        onChange={e => setForm({ ...form, [key]: e.target.value })}
                        placeholder={hint ? `Guardado ${hint} · déjalo vacío para conservarlo` : placeholder}
                    />
                    {secret && form[key] && (
                        <div style={{ fontSize: '11px', color: 'var(--texto-suave)', marginTop: '2px' }}>
                            Pegado: {form[key].trim().length} caracteres, empieza con "{form[key].trim().slice(0, 3)}"
                        </div>
                    )}
                </div>
            );
            return (
                <div>
                    {field('displayPhoneNumber', 'Número de WhatsApp del negocio', business?.meta_phone_number || 'Ej: +593 99 123 4567')}
                    {field('phoneNumberId', 'Phone Number ID (Meta)', business?.meta_phone_number_id || 'Ej: 123456789012345')}
                    {field('wabaId', 'WhatsApp Business Account ID (Meta)', business?.meta_business_account_id || 'Ej: 109876543210987')}
                    {field('metaAccessToken', 'Token de acceso de Meta', 'Token permanente del usuario del sistema', true, business?.meta_access_token_hint)}
                    {field('openaiApiKey', 'Clave de OpenAI (API key)', 'sk-...', true, business?.openai_api_key_hint)}
                    <div style={{ fontSize: '11px', color: 'var(--texto-suave)', marginBottom: '8px' }}>Panel de claves v3</div>
                </div>
            );
        }

        const ROLE_LABELS = { owner: 'Dueño (todo)', manager: 'Encargado (atiende y edita, sin configuración)', staff: 'Solo consulta' };
        const EMPTY_USER_FORM = { fullName: '', email: '', role: 'owner', password: '' };

        /** Usuarios con que una empresa entra al CRM (correo y contraseña). */
        function CompanyUsers({ company }) {
            const [users, setUsers] = useState([]);
            const [form, setForm] = useState(EMPTY_USER_FORM);
            const [busy, setBusy] = useState(false);
            const base = `/api/businesses/${company.id}/users`;

            async function load() {
                try {
                    setUsers(await api(base));
                } catch (err) {
                    alert('Error cargando usuarios: ' + err.message);
                }
            }

            useEffect(() => { load(); }, [company.id]);

            async function create() {
                if (!form.fullName.trim() || !form.email.trim()) return alert('Escribe el nombre y el correo');
                if (form.password.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                setBusy(true);
                try {
                    await api(base, { method: 'POST', body: JSON.stringify(form) });
                    alert(`Usuario creado.\n\nUsuario: ${form.email.trim().toLowerCase()}\nContraseña: la que escribiste`);
                    setForm(EMPTY_USER_FORM);
                    load();
                } catch (err) {
                    alert('Error creando usuario: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            async function update(user, changes, done) {
                try {
                    await api(`${base}/${user.id}`, { method: 'PATCH', body: JSON.stringify(changes) });
                    if (done) alert(done);
                    load();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            function changePassword(user) {
                const password = prompt(`Nueva contraseña para ${user.email} (mínimo 8 caracteres):`);
                if (password === null) return;
                if (password.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                update(user, { password }, 'Contraseña cambiada');
            }

            function toggle(user) {
                if (user.active && !confirm(`¿Desactivar a ${user.email}? Ya no podrá entrar al CRM.`)) return;
                update(user, { active: !user.active });
            }

            return (
                <div style={{ marginTop: '14px', background: 'var(--beige-claro)', padding: '12px', borderRadius: '6px', fontSize: '13px' }}>
                    <p style={{ marginBottom: '10px' }}>Cada usuario entra al CRM con su correo y su contraseña, y solo ve {company.name}.</p>

                    {users.length === 0 ? <p style={{ color: 'var(--texto-suave)', marginBottom: '10px' }}>Todavía no hay usuarios.</p> : users.map(u => (
                        <div key={u.id} style={{ padding: '8px 0', borderBottom: '1px solid var(--rosa-palo-suave)', opacity: u.active ? 1 : 0.6 }}>
                            <div><strong>{u.full_name}</strong> {u.active ? '' : '(desactivado)'}</div>
                            <div style={{ color: 'var(--texto-suave)' }}>{u.email}</div>
                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px', alignItems: 'center' }}>
                                <select value={u.role} onChange={e => update(u, { role: e.target.value })} style={{ padding: '5px', fontSize: '12px' }}>
                                    {Object.entries(ROLE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                </select>
                                <button style={secondaryButtonStyle} onClick={() => changePassword(u)}>Cambiar contraseña</button>
                                <button style={secondaryButtonStyle} onClick={() => toggle(u)}>{u.active ? 'Desactivar' : 'Activar'}</button>
                            </div>
                        </div>
                    ))}

                    <div style={{ marginTop: '14px' }}>
                        <strong>Nuevo usuario</strong>
                        <input style={{ ...fieldStyle, marginTop: '8px' }} placeholder="Nombre" value={form.fullName} onChange={e => setForm({ ...form, fullName: e.target.value })} />
                        <input style={{ ...fieldStyle, marginTop: '8px' }} placeholder="Correo (será su usuario)" autoComplete="off" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
                        <input style={{ ...fieldStyle, marginTop: '8px' }} type="password" autoComplete="new-password" placeholder="Contraseña (mínimo 8 caracteres)" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
                        <select style={{ ...fieldStyle, marginTop: '8px' }} value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
                            {Object.entries(ROLE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                        </select>
                        <button style={{ ...buttonStyle, marginTop: '10px' }} disabled={busy} onClick={create}>{busy ? 'Creando...' : '+ Crear usuario'}</button>
                    </div>
                </div>
            );
        }

        /** ¿El bot de la empresa atiende? Obligatorios en rojo, recomendados en naranja. */
        function ReadinessList({ readiness }) {
            if (!readiness) return null;
            return (
                <div style={{ margin: '8px 0', fontSize: '12px' }}>
                    <div style={{
                        fontWeight: 600, padding: '6px 8px', borderRadius: '4px', marginBottom: '6px',
                        background: readiness.botReady ? '#e8f5e9' : '#fdecea', color: readiness.botReady ? '#2e7d32' : '#c62828'
                    }}>
                        {readiness.botReady ? '🤖 ' : '⛔ '}{readiness.summary}
                    </div>
                    {readiness.items.map(item => (
                        <div key={item.key} title={item.ok ? '' : item.hint} style={{ color: item.ok ? '#2e7d32' : item.required ? '#c62828' : '#b26a00', marginBottom: '2px' }}>
                            {item.ok ? '✅' : item.required ? '🔴' : '⚠️'} {item.label}{item.key === 'catalog' && item.ok ? ` (${readiness.products})` : ''}
                            {!item.ok && <div style={{ color: 'var(--texto-suave)', marginLeft: '20px' }}>{item.hint}</div>}
                        </div>
                    ))}
                </div>
            );
        }

        function ConnectResult({ result }) {
            if (!result) return null;
            return (
                <div style={{ marginTop: '10px', fontSize: '12px' }}>
                    {result.steps.map((step, i) => (
                        <div key={i} style={{ color: step.ok ? '#2e7d32' : '#c62828' }}>{step.ok ? '✅' : '⚠️'} {step.detail}</div>
                    ))}
                </div>
            );
        }

        // Chats de Instagram y Messenger: en lugar del número guardan "ig:<id>" o "fb:<id>".
        const socialChannel = phone => /^ig:/.test(phone || '') ? 'instagram' : /^fb:/.test(phone || '') ? 'messenger' : null;
        const contactLine = phone => socialChannel(phone) === 'instagram' ? 'Instagram' : socialChannel(phone) === 'messenger' ? 'Messenger' : '+' + phone;
        const contactName = conv => conv?.customer_name || (socialChannel(conv?.phone_number) ? 'Cliente de ' + contactLine(conv.phone_number) : conv?.phone_number);
        // Pestañas de Conversaciones: cada red social por separado y con su color (WhatsApp verde, Instagram fucsia, Facebook azul).
        const CHANNELS = [
            { id: 'all', label: 'Todas', icon: null, color: '#4F5BD5' },
            { id: 'whatsapp', label: 'WhatsApp', icon: 'whatsapp', color: '#17964A' },
            { id: 'instagram', label: 'Instagram', icon: 'instagram', color: '#D6249F' },
            { id: 'messenger', label: 'Facebook', icon: 'messenger', color: '#0866FF' }
        ];
        const channelInfo = phone => CHANNELS.find(c => c.id === (socialChannel(phone) || 'whatsapp'));

        // Con `all` también marca WhatsApp (en la lista, donde conviven las tres redes).
        function ChannelMark({ phone, size = 15, all = false }) {
            if (!all && !socialChannel(phone)) return null;
            const ch = channelInfo(phone);
            return <span title={socialChannel(phone) ? contactLine(phone) : ch.label} style={{ display: 'inline-flex', verticalAlign: 'middle', marginRight: '4px' }}><PlatIcon name={ch.icon} size={size} color={ch.color} /></span>;
        }

        function PlatIcon({ name, size = 18, color = 'currentColor' }) {
            const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true };
            switch (name) {
                case 'check': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#22A559" /><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" /></svg>;
                case 'cross': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E5484D" /><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" /></svg>;
                case 'warn': return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z" fill="#F5A524" stroke="#F5A524" strokeWidth="2" strokeLinejoin="round" /><path d="M12 9.5v4.5M12 17h.01" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" /></svg>;
                case 'building': return <svg {...p}><path d="M4 21V5.5A1.5 1.5 0 0 1 5.5 4h8A1.5 1.5 0 0 1 15 5.5V21M15 9h3.5a1.5 1.5 0 0 1 1.5 1.5V21M2.5 21h19M8 8h3M8 12h3M8 16h3" /></svg>;
                case 'instagram': return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><path d="M17.5 6.5h.01" /></svg>;
                case 'tiktok': return <svg {...p}><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5" /><path d="M14 3c.4 2.6 2.3 4.4 5 4.6" /></svg>;
                case 'messenger': return <svg {...p}><path d="M12 3C7 3 3 6.7 3 11.3c0 2.6 1.3 4.9 3.3 6.4V21l3-1.7c.9.3 1.8.4 2.7.4 5 0 9-3.7 9-8.3S17 3 12 3z" /><path d="M7.5 13.5l3-3.2 2 2 3-3.2" /></svg>;
                case 'whatsapp': return <svg {...p}><path d="M20 12a8 8 0 0 1-11.8 7L4 20l1.100-4.1A8 8 0 1 1 20 12z" /><path d="M9.2 8.8c0 3 2 5.2 5 5.8l1.200-1.400-1.800-.9-.8.7a4.2 4.2 0 0 1-1.800-1.8l.7-.8-.9-1.8z" /></svg>;
                case 'key': return <svg {...p}><circle cx="8" cy="15" r="4" /><path d="M11 12l9-9M16 7l3 3M14 9l2 2" /></svg>;
                case 'chat': return <svg {...p}><path d="M4 5h16v11H9.5L5 20v-4H4z" /><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" /></svg>;
                case 'chevron': return <svg {...p}><path d="M9 6l6 6-6 6" /></svg>;
                case 'robot': return <svg {...p}><rect x="4.5" y="8" width="15" height="11" rx="3" /><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5M2.5 13v2M21.5 13v2" /></svg>;
                case 'users': return <svg {...p}><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><circle cx="17" cy="9" r="2.5" /><path d="M17.5 14.5a5 5 0 0 1 4 5" /></svg>;
                case 'pause': return <svg {...p}><rect x="5" y="4" width="14" height="16" rx="3" /><path d="M10 9v6M14 9v6" /></svg>;
                case 'play': return <svg {...p}><path d="M7 4.5l12 7.500-12 7.5z" /></svg>;
                case 'trash': return <svg {...p}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" /></svg>;
                case 'plus': return <svg {...p}><path d="M12 5v14M5 12h14" /></svg>;
                case 'refresh': return <svg {...p}><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5" /></svg>;
                case 'enter': return <svg {...p}><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M4 12h11M11 8l4 4-4 4" /></svg>;
                case 'logout': return <svg {...p}><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M15 8l4 4-4 4M19 12H9" /></svg>;
                case 'gear': return <svg {...p}><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" /></svg>;
                case 'doc': return <svg {...p}><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" /></svg>;
                case 'bag': return <svg {...p}><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2" /></svg>;
                case 'box': return <svg {...p}><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" /></svg>;
                case 'search': return <svg {...p}><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>;
                case 'send': return <svg {...p}><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z" /></svg>;
                case 'camera': return <svg {...p}><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>;
                case 'user': return <svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>;
                case 'pin': return <svg {...p}><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></svg>;
                case 'tag': return <svg {...p}><path d="M3 12V4h8l10 10-8 8z" /><circle cx="7.5" cy="8.5" r="1.2" /></svg>;
                case 'cart': return <svg {...p}><path d="M3 4h3l2.5 11h10L21 7H7" /><circle cx="9" cy="19" r="1.5" /><circle cx="17" cy="19" r="1.5" /></svg>;
                case 'clock': return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>;
                case 'calendar': return <svg {...p}><rect x="3.5" y="5" width="17" height="15" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>;
                case 'chart': return <svg {...p}><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-8" /></svg>;
                case 'note': return <svg {...p}><path d="M5 4h14v11l-5 5H5zM14 20v-5h5M8 9h8M8 13h4" /></svg>;
                case 'bulb': return <svg {...p}><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></svg>;
                case 'sparkle': return <svg {...p}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" /></svg>;
                case 'home': return <svg {...p}><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6" /></svg>;
                case 'card': return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M3 10h18M7 15h4" /></svg>;
                case 'truck': return <svg {...p}><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8" /><circle cx="7" cy="17.5" r="1.8" /><circle cx="17" cy="17.5" r="1.8" /></svg>;
                case 'bell': return <svg {...p}><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4" /></svg>;
                case 'save': return <svg {...p}><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6" /></svg>;
                case 'image': return <svg {...p}><rect x="3" y="4" width="18" height="16" rx="2.5" /><circle cx="9" cy="10" r="1.8" /><path d="M21 16l-5-5-8 8" /></svg>;
                case 'edit': return <svg {...p}><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" /></svg>;
                case 'copy': return <svg {...p}><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg>;
                case 'grid': return <svg {...p}><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg>;
                case 'list': return <svg {...p}><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></svg>;
                case 'ruler': return <svg {...p}><path d="M3 15L15 3l6 6L9 21zM7 11l2 2M10 8l2 2M13 5l2 2" /></svg>;
                case 'layers': return <svg {...p}><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5" /></svg>;
                case 'gift': return <svg {...p}><rect x="3" y="8" width="18" height="5" rx="1" /><path d="M5 13v7h14v-7M12 8v12M12 8c-2 0-4-1-4-3s3-2 4 3c1-5 4-5 4-3s-2 3-4 3z" /></svg>;
                case 'dollar': return <svg {...p}><path d="M12 3v18M16 7.5C15 6.5 13.7 6 12 6c-2.2 0-4 1-4 2.8 0 4 8 2 8 6.2 0 1.8-1.8 2.8-4 2.8-1.7 0-3.2-.6-4.2-1.7" /></svg>;
                default: return null;
            }
        }

        function PlatRow({ icon, children, hint, sub, onClick, muted, summary, action }) {
            const color = icon === 'robot' ? '#6C5CE7' : '#7B86B0';
            const inner = (
                <>
                    <PlatIcon name={icon} size={22} color={color} />
                    <span className="txt">{children}{hint && <span className="hint">{hint}</span>}{sub && <span className="sub">{sub}</span>}</span>
                    {action && <span className="cfg"><PlatIcon name="gear" size={15} color="#2563EB" /> {action}</span>}
                    {onClick && <span className="chev"><PlatIcon name="chevron" size={16} /></span>}
                </>
            );
            const cls = 'pl-row' + (muted ? ' muted' : '') + (summary ? ' summary' : '');
            return onClick ? <button type="button" className={cls} onClick={onClick}>{inner}</button> : <div className={cls}>{inner}</div>;
        }

        function BusinessCard({ business, selected, onSelect, onChanged, usage }) {
            const [mode, setMode] = useState(null); // 'keys' | 'access'
            const [form, setForm] = useState(EMPTY_BUSINESS_FORM);
            const [busy, setBusy] = useState(false);
            const [testResult, setTestResult] = useState(null);
            const [connectResult, setConnectResult] = useState(null);

            async function saveKeys() {
                const problem = credentialProblem(form);
                if (problem && !confirm(problem)) return;
                setBusy(true);
                try {
                    await api(`/api/businesses/${business.id}/credentials`, { method: 'PUT', body: JSON.stringify(form) });
                    setForm(EMPTY_BUSINESS_FORM);
                    setMode(null);
                    onChanged();
                } catch (err) {
                    alert('Error guardando claves: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            async function testKeys() {
                setBusy(true);
                setTestResult(null);
                try {
                    setTestResult(await api(`/api/businesses/${business.id}/test-credentials`, { method: 'POST' }));
                } catch (err) {
                    alert('Error probando claves: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            async function toggleActive() {
                const message = business.active
                    ? `¿Suspender ${business.name}?\n\n• El bot deja de responder en su número de WhatsApp.\n• Se detienen sus seguimientos automáticos.\n• Sus usuarios no pueden entrar al CRM.\n\nNo se borra nada: al reactivarla vuelve todo como estaba.`
                    : `¿Reactivar ${business.name}? El bot vuelve a responder y sus usuarios pueden entrar de nuevo.`;
                if (!confirm(message)) return;
                try {
                    await api(`/api/businesses/${business.id}`, { method: 'PATCH', body: JSON.stringify({ active: !business.active }) });
                    onChanged();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            // Servicio adicional que se vende aparte: al activarlo la empresa ve la pestaña Publicaciones.
            async function togglePublishing() {
                const on = !!business.addons?.publicaciones;
                const message = on
                    ? `¿Desactivar Publicaciones en redes para ${business.name}?\n\nSus publicaciones programadas dejan de salir. No se borra nada.`
                    : `¿Activar Publicaciones en redes para ${business.name}?\n\nEs un servicio adicional: verá la pestaña Publicaciones y podrá conectar su Facebook e Instagram.`;
                if (!confirm(message)) return;
                try {
                    await api(`/api/businesses/${business.id}`, { method: 'PATCH', body: JSON.stringify({ addons: { publicaciones: !on } }) });
                    onChanged();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            async function deleteCompany() {
                if (business.active) {
                    return alert(`Para eliminar ${business.name}, primero suspéndela.`);
                }
                const typed = prompt(
                    `⚠️ ELIMINAR ${business.name} PARA SIEMPRE\n\n` +
                    'Se borrarán todos sus chats, mensajes, cotizaciones, pedidos, catálogo, fotos, archivos, usuarios, configuración y claves. No se puede deshacer.\n\n' +
                    `Para confirmar, escribe el nombre exacto de la empresa: ${business.name}`
                );
                if (typed === null) return;
                if (typed.trim() !== business.name) return alert('El nombre no coincide. No se eliminó nada.');
                setBusy(true);
                try {
                    const result = await api(`/api/businesses/${business.id}`, { method: 'DELETE', body: JSON.stringify({ confirmName: typed.trim() }) });
                    const s = result.summary || {};
                    const files = (s['archivos_product-images'] || 0) + (s['archivos_chat-media'] || 0);
                    alert(`${business.name} fue eliminada por completo.\n\nChats: ${s.conversations || 0} · Mensajes: ${s.messages || 0} · Pedidos: ${s.orders || 0} · Cotizaciones: ${s.quotations || 0} · Productos: ${s.products || 0} · Usuarios: ${s.business_users || 0} · Archivos: ${files}`);
                    onChanged();
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            const status = (ok, text) => <span style={{ fontSize: '12px', color: ok ? '#2e7d32' : '#c62828' }}>{ok ? '✅' : '⚠️'} {text}</span>;

            // Mensualidad: hasta cuándo está pagada. Los pagos se anotan a mano o, más adelante, llegan solos con la tarjeta.
            const paidUntil = business.subscription ? parseTs(business.subscription.paid_until) : null;
            const daysLeft = paidUntil ? Math.ceil((paidUntil.getTime() - Date.now()) / 86400000) : null;
            const payLine = !paidUntil
                ? { color: '#8a6d00', text: '💵 Mensualidad: sin pagos registrados' }
                : daysLeft < 0
                    ? { color: '#c62828', text: '💵 Mensualidad vencida el ' + paidUntil.toLocaleDateString('es-EC') }
                    : { color: daysLeft <= 5 ? '#b26a00' : '#2e7d32', text: '💵 Mensualidad pagada hasta el ' + paidUntil.toLocaleDateString('es-EC') + (daysLeft <= 5 ? ' (vence en ' + daysLeft + ' día' + (daysLeft === 1 ? '' : 's') + ')' : '') };

            async function registerPayment() {
                const amount = prompt('Monto pagado en dólares (ej. 25):');
                if (amount === null || amount.trim() === '') return;
                const months = prompt('¿Cuántos meses cubre este pago?', '1');
                if (months === null) return;
                const method = prompt('¿Cómo pagó? (transferencia, efectivo, otro):', 'transferencia');
                if (method === null) return;
                const note = prompt('Nota o número de comprobante (opcional):') || '';
                setBusy(true);
                try {
                    const result = await api('/api/businesses/' + business.id + '/payments', {
                        method: 'POST',
                        body: JSON.stringify({ amount: Number(amount.replace(',', '.')), months: Number(months), method, note })
                    });
                    alert('Pago registrado. Mensualidad pagada hasta el ' + parseTs(result.paid_until).toLocaleDateString('es-EC') + (result.reactivated ? '.\nLa empresa estaba suspendida y volvió a quedar activa.' : '.'));
                    onChanged();
                } catch (err) {
                    alert('Error registrando el pago: ' + err.message);
                } finally {
                    setBusy(false);
                }
            }

            const readiness = business.readiness;
            const items = readiness ? readiness.items : [];
            let pill;
            if (!business.active) pill = { cls: 'off', text: 'Suspendida' };
            else if (business.legacy) pill = business.whatsapp_configured && business.openai_configured ? { cls: 'ok', text: 'Lista para usar' } : { cls: 'bad', text: 'Falta configurar' };
            else if (!readiness) pill = { cls: 'off', text: 'Sin revisar' };
            else if (!readiness.botReady) pill = { cls: 'bad', text: 'El bot no atiende' };
            else if (items.some(i => !i.ok)) pill = { cls: 'warn', text: 'Configuración pendiente' };
            else pill = { cls: 'ok', text: 'Lista para usar' };
            const keysItems = ['whatsapp', 'webhook', 'openai'];
            const openKeys = () => setMode(mode === 'keys' ? null : 'keys');
            const goCompany = business.active ? () => onSelect(business.id) : undefined;

            return (
                <div className={'pl-card' + (selected ? ' selected' : '') + (business.active ? '' : ' off')}>
                    <div className="pl-head">
                        <div className={'pl-tile ' + (business.legacy ? 'a' : 'b')}>
                            <PlatIcon name="building" size={30} color={business.legacy ? '#4F7BF0' : '#7C5CF0'} />
                        </div>
                        <div className="info">
                            <div className="name">{business.name}</div>
                            <div className="wa"><PlatIcon name="whatsapp" size={20} color="#22A559" /> {business.meta_phone_number || 'Sin número configurado'}</div>
                        </div>
                        <span className={'pl-pill ' + pill.cls}>{pill.text}</span>
                    </div>

                    <div className="pl-rows">
                        {business.legacy ? (
                            <>
                                <PlatRow icon="key" muted>Claves en el servidor (instalación original)</PlatRow>
                                <PlatRow icon={business.whatsapp_configured ? 'check' : 'cross'}>{business.whatsapp_configured ? 'WhatsApp configurado' : 'Falta configurar WhatsApp'}</PlatRow>
                                <PlatRow icon={business.openai_configured ? 'check' : 'cross'}>{business.openai_configured ? 'OpenAI configurado' : 'Falta la clave de OpenAI'}</PlatRow>
                            </>
                        ) : readiness && (
                            <>
                                <PlatRow icon="robot" summary>{readiness.summary}</PlatRow>
                                {items.map(item => (
                                    <PlatRow
                                        key={item.key}
                                        icon={item.ok ? 'check' : item.required ? 'cross' : 'warn'}
                                        hint={item.ok ? undefined : item.hint}
                                        action={item.ok ? undefined : 'Configurar'}
                                        onClick={keysItems.includes(item.key) ? openKeys : goCompany}
                                    >
                                        {item.label}{item.key === 'catalog' && item.ok ? ' (' + readiness.products + ')' : ''}
                                    </PlatRow>
                                ))}
                            </>
                        )}
                        <UsageRow usage={usage} />
                        {!business.legacy && (
                            <PlatRow icon="image" hint="Servicio adicional" action={business.addons?.publicaciones ? 'Desactivar' : 'Activar'} onClick={togglePublishing}>
                                Publicaciones en redes: {business.addons?.publicaciones ? 'activo' : 'no contratado'}
                            </PlatRow>
                        )}
                        {!business.legacy && <div style={{ fontSize: '13px', fontWeight: 600, color: payLine.color, padding: '6px 2px' }}>{payLine.text}</div>}
                    </div>

                    <div className="pl-actions">
                        {business.active && <button className="pl-btn primary" onClick={() => onSelect(business.id)}><PlatIcon name="enter" size={19} color="#fff" /> Entrar</button>}
                        {!business.legacy && <button className="pl-btn" disabled={busy} onClick={registerPayment}>💵 Registrar pago</button>}
                        {!business.legacy && <button className="pl-btn" onClick={openKeys}><PlatIcon name="key" size={19} color="#4F7BF0" /> Claves</button>}
                        <button className="pl-btn" onClick={() => setMode(mode === 'access' ? null : 'access')}><PlatIcon name="users" size={19} color="#4F7BF0" /> Usuarios</button>
                        {!business.legacy && <button className="pl-btn" onClick={toggleActive}><PlatIcon name={business.active ? 'pause' : 'play'} size={19} color="#4F7BF0" /> {business.active ? 'Suspender' : 'Reactivar'}</button>}
                        {!business.legacy && <button className="pl-btn danger" disabled={busy} onClick={deleteCompany}><PlatIcon name="trash" size={19} color="#D03535" /> Eliminar</button>}
                    </div>

                    {mode === 'keys' && (
                        <div style={{ marginTop: '14px', background: 'var(--beige-claro)', padding: '12px', borderRadius: '6px' }}>
                            <CredentialFields form={form} setForm={setForm} business={business} />
                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                                <button style={buttonStyle} disabled={busy} onClick={saveKeys}>{busy ? 'Guardando...' : 'Guardar claves'}</button>
                                <button style={secondaryButtonStyle} disabled={busy} onClick={testKeys}>Probar conexión</button>
                                <button style={secondaryButtonStyle} disabled={busy} onClick={async () => {
                                    setBusy(true);
                                    try {
                                        setConnectResult(await api(`/api/businesses/${business.id}/connect-whatsapp`, { method: 'POST' }));
                                        onChanged();
                                    } catch (err) {
                                        alert('Error conectando: ' + err.message);
                                    } finally {
                                        setBusy(false);
                                    }
                                }}>📲 Conectar WhatsApp</button>
                            </div>
                            {testResult && (
                                <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    {status(testResult.whatsapp.ok, `WhatsApp: ${testResult.whatsapp.detail}`)}
                                    {status(testResult.openai.ok, `OpenAI: ${testResult.openai.detail}`)}
                                </div>
                            )}
                            <ConnectResult result={connectResult} />
                        </div>
                    )}

                    {mode === 'access' && <CompanyUsers company={business} />}
                </div>
            );
        }

        /** Tokens en miles: 1.234.567 → "1,2 M". */
        function shortTokens(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.', ',') + ' M';
            if (n >= 1000) return Math.round(n / 1000) + ' mil';
            return String(n);
        }

        /** Montos chicos: $0,0043 se lee mejor que $0,00. */
        function money(value) {
            if (!value) return '$0';
            const decimals = value < 0.01 ? 4 : 2;
            return '$' + value.toFixed(decimals).replace('.', ',');
        }

        function UsageRow({ usage }) {
            if (!usage || !usage.month?.calls) return <PlatRow icon="chat" muted>Sin consumo de IA registrado</PlatRow>;
            const { today, week, month } = usage;
            const cachePct = month.input ? Math.round(month.cached * 100 / month.input) : 0;
            return (
                <PlatRow icon="chat" muted sub={month.calls + ' respuestas en 30 días · ' + shortTokens(month.input) + ' de entrada (' + cachePct + '% en caché) · ' + shortTokens(month.output) + ' de salida'}>
                    Gasto de IA: hoy <b>{money(today.cost)}</b> · 7 días <b>{money(week.cost)}</b> · 30 días <b>{money(month.cost)}</b>
                </PlatRow>
            );
        }

        function BusinessesPanel({ businesses, currentBusinessId, onSelect, onChanged }) {
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState(EMPTY_BUSINESS_FORM);
            const [saving, setSaving] = useState(false);
            const [usage, setUsage] = useState({});
            const [checking, setChecking] = useState(false);

            useEffect(() => {
                api('/api/businesses/usage').then(data => setUsage(data.usage || {})).catch(err => console.error('Error cargando consumo:', err));
            }, []);

            async function newSignupCode() {
                try {
                    const entry = await api('/api/signup-codes', { method: 'POST', body: JSON.stringify({ days: 30 }) });
                    prompt('Código de registro (sirve una sola vez y dura 30 días). Cópialo y envíaselo a quien pagó:', entry.code);
                } catch (err) {
                    alert('Error creando el código: ' + err.message);
                }
            }

            async function checkNow() {
                setChecking(true);
                try {
                    const result = await api('/api/health-check', { method: 'POST' });
                    alert(result.alerts && result.alerts.length
                        ? `Revisión de ${result.checked} empresas:\n\n` + result.alerts.join('\n')
                        : `Revisión de ${result.checked} empresas: todas siguen igual que ayer.`);
                    onChanged();
                } catch (err) {
                    alert('Error revisando: ' + err.message);
                } finally {
                    setChecking(false);
                }
            }

            async function create() {
                if (!form.name.trim()) return alert('Escribe el nombre del negocio');
                setSaving(true);
                try {
                    await api('/api/businesses', { method: 'POST', body: JSON.stringify(form) });
                    setForm(EMPTY_BUSINESS_FORM);
                    setShowForm(false);
                    onChanged();
                } catch (err) {
                    alert('Error creando negocio: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            return (
                <div className="pl-wrap">
                    <div className="pl-title">
                        <div className="tile"><PlatIcon name="building" size={30} color="#4F7BF0" /></div>
                        <div>
                            <h1>Empresas</h1>
                            <p>Gestiona tus empresas y asistentes de WhatsApp. Cada una tiene su propio número de WhatsApp, clave de OpenAI, catálogo, chats y configuración.</p>
                        </div>
                    </div>

                    <div className="pl-grid">
                        {businesses.map(b => (
                            <BusinessCard key={b.id} business={b} selected={currentBusinessId === b.id} onSelect={onSelect} onChanged={onChanged} usage={usage[b.id]} />
                        ))}
                    </div>

                    {!showForm ? (
                        <div className="pl-bottom">
                            <button className="pl-btn grad" onClick={() => setShowForm(true)}><PlatIcon name="plus" size={19} color="#fff" /> Nueva empresa</button>
                            <button className="pl-btn" onClick={newSignupCode}>🎟️ Crear código de registro</button>
                            <button className="pl-btn" disabled={checking} onClick={checkNow}><PlatIcon name="refresh" size={19} color="#4F7BF0" /> {checking ? 'Revisando...' : 'Revisar todas ahora'}</button>
                        </div>
                    ) : (
                        <div style={{ background: 'var(--beige-claro)', padding: '20px', borderRadius: '8px', maxWidth: '520px' }}>
                            <h3 style={{ marginBottom: '12px' }}>Nuevo negocio</h3>
                            <div style={{ marginBottom: '12px' }}>
                                <label style={labelStyle}>Nombre del negocio</label>
                                <input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Ej: IZA SHOES" style={fieldStyle} />
                            </div>
                            <div style={{ marginBottom: '12px' }}>
                                <label style={labelStyle}>Tipo de negocio (plantilla inicial)</label>
                                <select value={form.preset} onChange={e => setForm({ ...form, preset: e.target.value })} style={fieldStyle}>
                                    <option value="tienda">Tienda de productos (por unidad, sin fecha de evento)</option>
                                    <option value="eventos">Detalles para eventos (por docena, con fecha de evento)</option>
                                </select>
                            </div>
                            <p style={{ fontSize: '12px', color: 'var(--texto-suave)', margin: '4px 0 12px' }}>Las claves se pueden cargar ahora o después desde el botón 🔑 Claves.</p>
                            <CredentialFields form={form} setForm={setForm} />
                            <div style={{ display: 'flex', gap: '10px' }}>
                                <button style={{ ...buttonStyle, flex: 1 }} disabled={saving} onClick={create}>{saving ? 'Guardando...' : 'Crear negocio'}</button>
                                <button style={{ ...secondaryButtonStyle, flex: 1 }} onClick={() => { setShowForm(false); setForm(EMPTY_BUSINESS_FORM); }}>Cancelar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ---------- Pantalla general de la plataforma (administradora, antes de elegir empresa) ----------
        const VELAMIA_ID = 'velamia';

        function CompanyHome({ onLogout }) {
            const [companies, setCompanies] = useState([]);

                try {
                    const [velamia, others] = await Promise.all([

                        </div>

        // ---------- Conectar el número de WhatsApp con solo el número y un código ----------
        function ConnectNumberCard({ onDone }) {
            const [step, setStep] = useState('number');
            const [phone, setPhone] = useState('');
            const [name, setName] = useState('');
            const [code, setCode] = useState('');
            const [method, setMethod] = useState('SMS');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');

            async function requestCode(chosen) {
                setBusy(true);
                setMessage('');
                try {
                    await api('/api/me/whatsapp/start', { method: 'POST', body: JSON.stringify({ phone, displayName: name, method: chosen }) });
                    setMethod(chosen);
                    setStep('code');
                } catch (err) {
                    setMessage(err.message);
                } finally {
                    setBusy(false);
                }
            }

            async function verify() {
                setBusy(true);
                setMessage('');
                try {
                    const result = await api('/api/me/whatsapp/verify', { method: 'POST', body: JSON.stringify({ code }) });
                    if (result.ok) { setStep('done'); onDone && onDone(); }
                    else setMessage((result.steps || []).map(s => s.detail).join(' · ') || 'No se pudo conectar');
                } catch (err) {
                    setMessage(err.message);
                } finally {
                    setBusy(false);
                }
            }

            const box = { border: '1px solid #DCE2F5', borderRadius: '14px', padding: '16px', marginBottom: '18px', background: '#F8FAFF' };
            const input = { padding: '12px', borderRadius: '10px', border: '1px solid #DCE2F5', fontSize: '15px', width: '100%', marginBottom: '10px' };
            return (
                <div style={box}>
                    <h3 style={{ marginBottom: '6px' }}>📲 Conecta tu WhatsApp</h3>
                    {step === 'number' && (
                        <React.Fragment>
                            <p style={{ fontSize: '13px', color: 'var(--texto-suave)', marginBottom: '10px' }}>Escribe el número del negocio. Te llegará un código de 6 números para confirmar que es tuyo. El número no debe estar activo en el WhatsApp del celular.</p>
                            <input style={input} placeholder="Nombre del negocio (como lo verán tus clientes)" value={name} onChange={e => setName(e.target.value)} />
                            <input style={input} placeholder="Número de WhatsApp, ej. 099 123 4567" value={phone} onChange={e => setPhone(e.target.value)} inputMode="tel" />
                            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                <button style={buttonStyle} disabled={busy || !phone || !name} onClick={() => requestCode('SMS')}>{busy ? 'Enviando...' : 'Enviarme el código por SMS'}</button>
                                <button style={secondaryButtonStyle} disabled={busy || !phone || !name} onClick={() => requestCode('VOICE')}>Recibirlo por llamada</button>
                            </div>
                        </React.Fragment>
                    )}
                    {step === 'code' && (
                        <React.Fragment>

                try {

                    alert('Error guardando claves: ' + err.message);

                    setBusy(false);

        function setIn(obj, path, value) {
            const copy = JSON.parse(JSON.stringify(obj));
            const keys = path.split('.');
            let target = copy;
            for (const key of keys.slice(0, -1)) target = target[key];
            target[keys[keys.length - 1]] = value;
            return copy;
        }

            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            async function run(text) {
                const sent = (text ?? message).trim() || 'Hola';
                setMessage(sent);
                setBusy(true);
                setError('');
                try {
                    const data = await api('/api/business-profile/preview', { method: 'POST', body: JSON.stringify({ message: sent, profile: form }) });
                    setResult({ ...data, message: sent, at: new Date(), formKey });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setBusy(false);
                }
            }

            const time = result ? result.at.toLocaleTimeString('es-EC', { timeZone: BUSINESS_TZ, hour: '2-digit', minute: '2-digit', hour12: false }) : '';
            const extras = [];
            if (result) {
                if (result.photos && result.photos.length) extras.push({ text: 'Enviaría fotos de: ' + result.photos.join(', ') });

                                    <div className="t">{missing.length ? 'Falta completar' : 'Todo listo para vender'}</div>
                                    <div className="d">{missing.length ? 'Pendiente: ' + missing.join(', ') + '.' : 'Tu configuración se aplica de inmediato en todos los chats del asistente.'}</div>

        function BusinessProfileForm({ onSaved, extras = [], legacy = false, readOnly = false, canTest = true, mobile = false }) {
            const [form, setForm] = useState(null);
            const [presets, setPresets] = useState([]);
            const [saving, setSaving] = useState(false);
            const [saved, setSaved] = useState(false);
            const [uploadingLogo, setUploadingLogo] = useState(false);
            const [readiness, setReadiness] = useState(null);
            const [activeSection, setActiveSection] = useState('top');
            const [mSection, setMSection] = useState(null);
            const [mLast, setMLast] = useState('general');
            const rootRef = useRef(null);
            const sectionIds = ['general', 'ventas', 'pagos', 'fechas', 'envios', 'seguimientos', 'empaques', 'avisos', ...extras.map(x => x.id)];
            const sectionKey = sectionIds.join(',');

            const loadReadiness = () => api('/api/me/readiness').then(setReadiness).catch(() => {});

            useEffect(() => {
                loadReadiness();
            }, []);

            useEffect(() => {
                const root = rootRef.current;
                if (!form || !root) return;
                const scroller = root.closest('.settings-container');
                if (!scroller) return;
                const onScroll = () => {
                    const base = scroller.getBoundingClientRect().top;
                    let current = 'top';
                    for (const id of sectionKey.split(',')) {
                        const el = document.getElementById('cfg-' + id);
                        if (el && el.getBoundingClientRect().top - base <= 170) current = id;
                    }
                    setActiveSection(current);
                };
                scroller.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => scroller.removeEventListener('scroll', onScroll);
            }, [!!form, sectionKey]);

            useEffect(() => {
                api('/api/business-profile').then(setForm).catch(err => alert('Error cargando el perfil: ' + err.message));
                api('/api/business-profile/presets').then(setPresets).catch(() => {});
            }, []);

            if (!form) {
                return <div className="settings-card"><h3>🏪 Perfil del negocio</h3><p className="hint">Cargando...</p></div>;
            }

            const set = (path, value) => {
                setForm(prev => setIn(prev, path, value));
                setSaved(false);
            };

            const text = (path, label, placeholder = '', hint = '', wide = false) => (
                <div className={`form-field ${wide ? 'wide' : ''}`}>
                    <label>{label}</label>
                    <input type="text" value={getIn(form, path) ?? ''} placeholder={placeholder} onChange={e => set(path, e.target.value)} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>

            const number = (path, label, hint = '', step = '1') => (
                <div className="form-field">
                    <label>{label}</label>
                    <input type="number" min="0" step={step} value={getIn(form, path) ?? ''} onChange={e => set(path, e.target.value === '' ? '' : Number(e.target.value))} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>
            );

            const check = (path, label) => (
                <label className="check-row wide">
                    <input type="checkbox" checked={!!getIn(form, path)} onChange={e => set(path, e.target.checked)} /> {label}
                </label>
            );

            function loadPreset(id) {
                const preset = presets.find(item => item.id === id);
                if (!preset) return;
                if (!confirm(`¿Cargar la plantilla "${preset.label}"?\n\nReemplaza lo que ves en este formulario. No se guarda hasta que pulses "Guardar perfil".`)) return;
                setForm(JSON.parse(JSON.stringify(preset.profile)));
                setSaved(false);
            }

            function uploadLogo(e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (!/^image\/(jpeg|png)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
                    alert('El logo debe ser JPG o PNG de hasta 5 MB');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async () => {
                    setUploadingLogo(true);
                    try {
                        const data = await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: reader.result }) });
                        set('branding.logoUrl', data.url);
                    } catch (err) {
                        alert('Error subiendo el logo: ' + err.message);
                    } finally {
                        setUploadingLogo(false);
                    }
                };
                reader.readAsDataURL(file);
            }

            async function save() {
                setSaving(true);
                try {
                    const result = await api('/api/business-profile', { method: 'PUT', body: JSON.stringify(form) });
                    setForm(result);
                    setSaved(true);
                    onSaved(result);
                    loadReadiness();
                } catch (err) {
                    alert('Error guardando el perfil: ' + err.message);
                } finally {
                    setSaving(false);
                }

            const steps = form.followUps.steps || [];
            const shippingMode = form.shipping.mode;

            function goTo(id) {

                                        <label className="check-row" title="Es lo que el cliente pide con 'sin empaque', 'sin nada' o 'solo la vela'" style={{ margin: 0 }}><input type="checkbox" checked={!!type.bare} onChange={e => set('packaging.types.' + i + '.bare', e.target.checked)} /> Solo el producto</label>
                                        <button type="button" className="btn-link" onClick={() => set('packaging.types', form.packaging.types.filter((_, j) => j !== i))}>Quitar</button>

        const AVATAR_COLORS = [['#E6EDFF', '#3B4FD8'], ['#EEE9FF', '#5B45D6'], ['#E3F6EC', '#1E8A4A'], ['#FFF1DA', '#B36B00'], ['#E1F4F8', '#1B7C93'], ['#FDE8EF', '#C2417A']];

        function Avatar({ name, size = 44 }) {
            const text = String(name || '?').trim();
            const initial = (text.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/) || ['?'])[0].toUpperCase();
            let hash = 0;
            for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) % 997;
            const [bg, fg] = AVATAR_COLORS[hash % AVATAR_COLORS.length];
            return <div className="nx-avatar" style={{ width: size, height: size, background: bg, color: fg, fontSize: Math.round(size * 0.4) }}>{initial}</div>;
        }

        function dayKey(value) {
            const date = parseTs(value);
            return date ? date.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ }) : '';
        }

        function dayLabel(value) {
            const key = dayKey(value);
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Hoy';
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'long', day: 'numeric', month: 'long' });
        }

        function listTime(value) {
            const key = dayKey(value);
            if (!key) return '';
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return formatTime(value);
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short' });
        }

        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            if (seconds < 60) return Math.max(1, Math.round(seconds)) + ' s';
            if (seconds < 3600) return Math.round(seconds / 60) + ' min';
            return (seconds / 3600).toFixed(1).replace('.', ',') + ' h';
        }

        function Delta({ now, before, lowerIsBetter }) {
            if (!before || before <= 0 || now === null || now === undefined) return null;
            const pct = Math.round((now - before) / before * 100);
            if (pct === 0) return <span className="nx-delta flat">= ayer</span>;
            const up = pct > 0;
            const good = lowerIsBetter ? !up : up;
            return <span className={'nx-delta ' + (good ? 'good' : 'bad')}>{up ? '↑ +' : '↓ '}{pct}%</span>;
        }

        function TodayCard({ data }) {
            const dateLabel = new Date().toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'short', day: 'numeric', month: 'long' });
            const t = data?.today, y = data?.yesterday;
            const tile = (icon, label, value, delta) => (
                <div className="nx-stat">
                    <div className="tile"><PlatIcon name={icon} size={20} color="#4F5BD5" /></div>
                    <div>
                        <div className="lab">{label}</div>
                        <div className="val">{value}{delta}</div>
                    </div>
                </div>
            );
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="calendar" size={20} color="#4F5BD5" /> Resumen de hoy</h3>
                        <span className="sm">{dateLabel}</span>
                    </div>
                    {!t ? <div className="nx-soft">Cargando...</div> : (
                        <div className="nx-stats">
                            {tile('chat', 'Conversaciones hoy', t.conversations, <Delta now={t.conversations} before={y.conversations} />)}
                            {tile('bag', 'Pedidos generados', t.orders, <Delta now={t.orders} before={y.orders} />)}
                            {tile('doc', 'Cotizaciones enviadas', t.quotations, <Delta now={t.quotations} before={y.quotations} />)}
                            {tile('clock', 'Tiempo de respuesta', formatDuration(t.responseSeconds), <Delta now={t.responseSeconds} before={y.responseSeconds} lowerIsBetter />)}
                        </div>
                    )}
                </div>
            );
        }

        function ClientCard({ summary, conv }) {
            const c = summary?.customer;
            const name = c?.name || contactName(conv);
            const phone = contactLine(c?.phone || conv.phone_number);
            const line = (icon, text) => <div className="nx-line"><span className="ic"><PlatIcon name={icon} size={19} color="#6B7599" /></span><span>{text}</span></div>;
            return (
                <div className="nx-card">
                    <div className="nx-card-h"><h3><PlatIcon name="user" size={20} color="#4F5BD5" /> Resumen del cliente</h3></div>
                    <div className="nx-who">
                        <Avatar name={name} size={48} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                            <div className="nm">{name}</div>
                            <div className="ph">{phone}</div>
                        </div>
                        {summary && <span className={'nx-badge ' + (summary.badges[0] === 'Cliente' ? 'green' : 'gray')}>{summary.badges[0]}</span>}
                    </div>
                    {!summary ? <div className="nx-soft">Cargando...</div> : (
                        <>
                            {c.city && line('pin', c.city)}
                            {summary.interest && line('tag', summary.interest)}
                            {line('cart', c.ordersCount ? c.ordersCount + (c.ordersCount === 1 ? ' pedido' : ' pedidos') + ' · $' + c.totalSpent.toFixed(2) : 'Sin pedidos todavía')}
                            {c.quotationsCount > 0 && line('doc', c.quotationsCount + (c.quotationsCount === 1 ? ' cotización' : ' cotizaciones'))}
                            {c.frequent && line('user', 'Cliente frecuente')}
                        </>
                    )}
