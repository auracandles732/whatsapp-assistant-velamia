            const [orders, setOrders] = useState([]);
            const [orderFilter, setOrderFilter] = useState('all');
            // Chat abierto en este momento: una respuesta lenta de otro chat no debe reemplazar sus mensajes.
            const openChatId = useRef(null);
            const [deletingChat, setDeletingChat] = useState(false);
            const [sending, setSending] = useState(false);
            const [biz, setBiz] = useState(null);
            const [businesses, setBusinesses] = useState([]);
            const currentBusinessId = getCurrentBusinessId() || null;
            const [session, setSession] = useState(null);
            const isAdmin = session?.role === 'admin';
            const unit = biz?.sales.unitSingular || 'unidad';
            const unitPlural = biz?.sales.unitPlural || 'unidades';
            const productEmoji = biz?.business.productEmoji || '🛍️';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const messagesRef = useRef(null);
            // Se sigue al último mensaje salvo que la dueña haya subido a leer mensajes anteriores.
            const stickToBottom = useRef(true);

            useEffect(() => {
                loadSession();
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                loadSystemPrompt();
                loadQuotations();
                loadPaymentInfo();
                api('/api/business-profile')
                    .then(data => {
                        setBiz(data);
                        // Nombre, color, logo y zona horaria de la empresa en que se trabaja.
                        onBrandingChange({ name: data.business.name, primaryColor: data.branding.primaryColor, logoUrl: data.branding.logoUrl, timezone: data.business.timezone });
                    })
                    .catch(err => console.error('Error cargando perfil:', err));
                const interval = setInterval(() => {
                    loadConversations();
                    loadStats();
                    loadQuotations();
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            async function loadSystemPrompt() {
                try {
                    const data = await api('/api/system-prompt');
                    setSystemPrompt(data.prompt || '');
                } catch (err) {
                    console.error('Error cargando system prompt:', err);
                }
            }

            async function saveSystemPrompt() {
                setSavingPrompt(true);
                try {
                    await api('/api/system-prompt', {
                        method: 'POST',
                        body: JSON.stringify({ prompt: systemPrompt })
                    });
                    setPromptSaved(true);
                    setTimeout(() => setPromptSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando instrucciones: ' + err.message);
                } finally {
                    setSavingPrompt(false);
                }
            }

            async function loadPaymentInfo() {
                try {
                    const data = await api('/api/payment-info');
                    setTransferInfo(data.transfer || '');
                } catch (err) {
                    console.error('Error cargando datos de pago:', err);
                }
            }

            async function savePaymentInfo() {
                setSavingTransfer(true);
                try {
                    await api('/api/payment-info', {
                        method: 'POST',
                        body: JSON.stringify({ transfer: transferInfo })
                    });
                    setTransferSaved(true);
                    setTimeout(() => setTransferSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando datos de pago: ' + err.message);
                } finally {
                    setSavingTransfer(false);
                }
            }

            async function loadProducts() {
                try {
                    const data = await api('/api/products');
                    setProducts(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando catálogo:', err);
                }
            }

            function handlePhotoSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                // WhatsApp solo envía fotos JPG o PNG de hasta 5 MB.
                if (!['image/jpeg', 'image/png'].includes(file.type)) {
                    alert('La foto debe ser JPG o PNG. WhatsApp no puede enviar otros formatos.');
                    e.target.value = '';
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert('La foto pesa más de 5 MB. Usa una foto más liviana para que WhatsApp la pueda enviar.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    setNewProduct(prev => ({ ...prev, photoBase64: reader.result, photoPreview: reader.result }));
                };
                reader.readAsDataURL(file);
            }

            async function addProduct() {
                if (!newProduct.name.trim() || !newProduct.price || !newProduct.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSavingProduct(true);
                try {
                    let imageUrl = '';
                    if (newProduct.photoBase64) {
                        const uploadData = await api('/api/upload-image', {
                            method: 'POST',
                            body: JSON.stringify({ imageBase64: newProduct.photoBase64 })
                        });
                        imageUrl = uploadData.url;
                    }

                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: newProduct.name,
                            price: parseFloat(newProduct.price),
                            category: newProduct.category,
                            packaging: newProduct.packaging,
                            image_url: imageUrl
                        })
                    });

                    setNewProduct({ name: '', price: '', category: '', packaging: '', photoBase64: '', photoPreview: '' });
                    loadProducts();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSavingProduct(false);
                }
            }

            async function changeProductPackaging(id, packaging) {
                try {
                    await api(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify({ packaging }) });
                    setProducts(prev => prev.map(p => p.id === id ? { ...p, description: packaging } : p));
                } catch (err) {
                    alert('Error cambiando el empaque: ' + err.message);
                }
            }

            async function removeProduct(id) {
                if (!confirm('¿Eliminar este producto del catálogo?')) return;
                try {
                    await api(`/api/products/${id}`, { method: 'DELETE' });
                    loadProducts();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                }
            }

            async function loadBotStatus() {
                try {
                    const data = await api('/api/bot-status');
                    setBotEnabled(data.enabled);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function toggleBotStatus() {
                const newValue = !botEnabled;
                setBotEnabled(newValue);
                try {
                    await api('/api/bot-status', {
                        method: 'POST',
                        body: JSON.stringify({ enabled: newValue })
                    });
                } catch (err) {
                    alert('Error cambiando estado del bot: ' + err.message);
                    setBotEnabled(!newValue);
                }
            }

            async function loadSession() {
                try {
                    setSession(await api('/api/session'));
                } catch (err) {
                    console.error('Error cargando sesión:', err);
                }
            }

            async function changeOwnPassword() {
                const currentPassword = prompt('Escribe tu contraseña actual:');
                if (currentPassword === null) return;
                const newPassword = prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
                if (newPassword === null) return;
                if (newPassword.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                try {
                    await api('/api/me/password', { method: 'PUT', body: JSON.stringify({ currentPassword, newPassword }) });
                    alert('Contraseña cambiada');
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            // Volver a la pantalla general de empresas (solo administradora).
            function changeCompany() {
                setCurrentBusinessId('');
                window.location.reload();
            }

            async function sendPhoto() {
                if (!selectedConv) return;
                const imageUrl = prompt('Pega la URL de la foto a enviar:');
                if (!imageUrl) return;
                const caption = prompt('Descripción (opcional):') || '';

                try {
                    await api('/api/send-image', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            imageUrl,
                            caption
                        })
                    });
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                }
            }

            // La lista se refresca cada 5 s, así la pausa que active el bot (reclamo, pago...)
            // se refleja sola sin volver a abrir el chat.
            const currentConv = conversations.find(c => c.id === selectedConv?.id) || selectedConv;
            const botPausedInChat = isBotPausedIn(currentConv);

            async function loadQuotations() {
                try {
                    const data = await api('/api/quotations');
                    setQuotations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando cotizaciones:', err);
                }
            }

            async function loadOrders() {
                try {
                    const data = await api('/api/orders');
                    setOrders(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando pedidos:', err);
                }
            }

            async function changeOrderStatus(id, status) {
                try {
                    await api(`/api/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
                    await Promise.all([loadOrders(), loadStats()]);
                } catch (err) {
                    alert('Error cambiando estado del pedido: ' + err.message);
                }
            }

            // Los pedidos se actualizan solos mientras la pestaña está abierta.
            useEffect(() => {
                if (activeTab !== 'pedidos') return;
                loadOrders();
                const interval = setInterval(loadOrders, 5000);
                return () => clearInterval(interval);
            }, [activeTab]);

            async function changeQuotationStatus(id, status) {
                try {
                    await api(`/api/quotations/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
                    loadQuotations();
                } catch (err) {
                    alert('Error cambiando estado: ' + err.message);
                }
            }

            function openChatFromQuotation(conversationId) {
                const conv = conversations.find(c => c.id === conversationId);
                if (!conv) return;
                setSelectedConv(conv);
                setActiveTab('conversaciones');
            }

            async function deleteChat() {
                if (!currentConv) return;
                const name = currentConv.customer_name || currentConv.phone_number;
                const ok = confirm(`¿Eliminar el chat de ${name}?\n\nSe borrarán para siempre todos sus mensajes, fotos, audios, cotizaciones y pedidos. No se puede deshacer.`);
                if (!ok) return;

                setDeletingChat(true);
                try {
                    await api(`/api/conversations/${currentConv.id}`, { method: 'DELETE' });
                    setSelectedConv(null);
                    setMessages([]);
                    await Promise.all([loadConversations(), loadStats(), loadQuotations()]);
                } catch (err) {
                    alert('Error eliminando chat: ' + err.message);
                } finally {
                    setDeletingChat(false);
                }
            }

            async function pauseOrResumeBot() {
                if (!currentConv) return;
                setPausingBot(true);
                try {
                    const endpoint = botPausedInChat ? 'resume' : 'pause';
                    await api(`/api/conversations/${currentConv.id}/${endpoint}`, { method: 'POST', body: JSON.stringify({}) });
                    await loadConversations();
                } catch (err) {
                    alert(`Error ${botPausedInChat ? 'reactivando' : 'pausando'} el bot: ${err.message}`);
                } finally {
                    setPausingBot(false);
                }
            }

            function keepAtBottom() {
                const el = messagesRef.current;
                if (el && stickToBottom.current) el.scrollTop = el.scrollHeight;
            }

            function handleMessagesScroll() {
                const el = messagesRef.current;
                if (el) stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
            }

            useEffect(keepAtBottom, [messages]);

            useEffect(() => {
                // Al abrir otro chat no se muestran por un instante los mensajes del anterior.
                stickToBottom.current = true;
                setMessages([]);
                openChatId.current = selectedConv ? selectedConv.id : null;
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

            async function loadConversations() {
                try {
                    const data = await api('/api/conversations');
                    setConversations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando conversaciones:', err);
                } finally {
                    setLoading(false);
                }
            }

            async function loadMessages(convId) {
                try {
                    const data = await api(`/api/conversations/${convId}/messages`);
                    if (openChatId.current !== convId) return;
                    setMessages(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando mensajes:', err);
                }
            }

            async function loadStats() {
                try {
                    setStats(await api('/api/stats'));
                } catch (err) {
                    console.error('Error cargando stats:', err);
                }
            }

            async function sendMessage() {
                if (!inputText.trim() || !selectedConv || sending) return;

                // Sin esto, dos Enter seguidos le enviarían el mismo mensaje dos veces a la clienta.
                setSending(true);
                try {
                    // El servidor pausa el bot en este chat al enviar un mensaje manual.
                    await api('/api/send-message', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            text: inputText
                        })
                    });

                    setInputText('');
                    stickToBottom.current = true;
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando mensaje: ' + err.message);
                } finally {
                    setSending(false);
                }
            }

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--beige)' }}>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando CRM...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="main">
                        <div className="header">
                            <div className="header-brand">
                                {/* El logo por defecto (logo.png) es de VELAMIA: otra empresa sin logo propio no lo muestra. */}
                                {(branding.logoUrl || session?.business?.legacy) && <img src={logoOf(branding)} alt={branding.name || 'Logo'} />}
                                <div>
                                    <div className="subtitle">{branding.name ? `${branding.name} · ` : ''}CRM · Asistente WhatsApp</div>
                                </div>
                            </div>
                            <div className="header-actions">
                                {session?.business && <span style={{ fontSize: '13px', marginRight: '10px' }}>🏢 {session.business.name}</span>}
                                {isAdmin && <button className="btn-logout" style={{ marginRight: '8px' }} onClick={changeCompany}>Cambiar empresa</button>}
                                {session && !isAdmin && <button className="btn-logout" style={{ marginRight: '8px' }} onClick={changeOwnPassword}>Mi contraseña</button>}
                                <div className={`toggle-bot ${botEnabled ? 'active' : 'inactive'}`} onClick={toggleBotStatus}>
                                    <span>{botEnabled ? '🤖 Bot Activo' : '🚫 Bot Inactivo'}</span>
                                </div>
                                <button className="btn-logout" onClick={onLogout}>Salir</button>
                            </div>
                        </div>

                        <div className="nav-tabs">
                            {session && session.role === 'owner' && !session.business?.legacy && <div className={`nav-tab ${activeTab === 'claves' ? 'active' : ''}`} onClick={() => setActiveTab('claves')}>🔑 Claves</div>}
                            <div className={`nav-tab ${activeTab === 'conversaciones' ? 'active' : ''}`} onClick={() => setActiveTab('conversaciones')}>💬 Conversaciones</div>
                            <div className={`nav-tab ${activeTab === 'cotizaciones' ? 'active' : ''}`} onClick={() => setActiveTab('cotizaciones')}>🧾 Cotizaciones</div>
                            <div className={`nav-tab ${activeTab === 'pedidos' ? 'active' : ''}`} onClick={() => setActiveTab('pedidos')}>🛍️ Pedidos</div>
                            <div className={`nav-tab ${activeTab === 'catalogo' ? 'active' : ''}`} onClick={() => setActiveTab('catalogo')}>{productEmoji} Catálogo</div>
                            <div className={`nav-tab ${activeTab === 'configuracion' ? 'active' : ''}`} onClick={() => setActiveTab('configuracion')}>⚙️ Configuración</div>
                            <div className={`stats-toggle ${statsExpanded ? 'open' : ''}`} onClick={() => setStatsExpanded(!statsExpanded)}>
                                📊 {statsExpanded ? 'Ocultar estadísticas' : 'Estadísticas'}
                            </div>
                        </div>

                            {statsExpanded && (
                            <div className="stats">
                                <div className="stat-card">
                                    <h4>Total Clientes</h4>
                                    <div className="number">{stats.total}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Activas (últimas 24 h)</h4>
                                    <div className="number">{stats.active}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Pedidos</h4>
                                    <div className="number">{stats.orders}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Ventas en pedidos (sin cancelados)</h4>
                                    <div className="number">${stats.revenue.toFixed(2)}</div>
                                </div>
                            </div>
                            )}

                        {activeTab === 'claves' && session?.business && !session.business.legacy && (
                        <div className="content">
                            <OwnerKeysPanel business={session.business} onChanged={loadSession} />
                        </div>
                        )}

                        {activeTab === 'conversaciones' && (
                        <div className={`content ${selectedConv ? 'chat-open' : ''}`}>
                            <div className="conversations-list">
                                <div className="conversations-list-header">Conversaciones</div>
                                {conversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        className={`conversation-item ${selectedConv?.id === conv.id ? 'active' : ''}`}
                                        onClick={() => setSelectedConv(conv)}
                                    >
                                        <h3>📱 {conv.customer_name || conv.phone_number}</h3>
                                        <p>{formatDateTime(conv.last_message_time)}</p>
                                        {isBotPausedIn(conv) && <span className="paused-badge">⏸️ Te necesita</span>}
                                    </div>
                                ))}
                            </div>

                            {selectedConv ? (
                                <div className="chat-area">
                                    <div className={`chat-header ${botPausedInChat ? 'paused' : ''}`}>
                                        <button className="btn-back" onClick={() => setSelectedConv(null)}>← Chats</button>
                                        <span className="chat-name">
                                            {botPausedInChat
                                                ? `⏸️ Bot pausado: atiendes tú a ${currentConv.customer_name || currentConv.phone_number}`
                                                : `🤖 El bot atiende a ${currentConv.customer_name || currentConv.phone_number}`}
                                        </span>
                                        <div className="chat-header-actions">
                                            <button
                                                className={`btn-bot-control ${botPausedInChat ? 'paused' : 'active'}`}
                                                onClick={pauseOrResumeBot}
                                                disabled={pausingBot}
                                            >
                                                {botPausedInChat ? '▶️ Reactivar bot' : '⏸️ Pausar bot'}
                                            </button>
                                            <button className="btn-delete-chat" onClick={deleteChat} disabled={deletingChat}>
                                                {deletingChat ? 'Eliminando...' : '🗑️ Eliminar chat'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="messages-container" ref={messagesRef} onScroll={handleMessagesScroll}>
                                        {messages.map((msg) => {
                                            const content = msg.content || '';
                                            // Solo en fotos, audios y documentos la primera línea es la URL del archivo;
                                            // un enlace que escribe la clienta se muestra tal cual.
                                            const urlMatch = MEDIA_TYPES.includes(msg.type) ? content.match(/^https?:\/\/\S+/) : null;
                                            const mediaUrl = urlMatch ? urlMatch[0] : null;
                                            const textPart = mediaUrl ? content.slice(mediaUrl.length).replace(/^\n/, '') : content;
                                            return (
                                                <div key={msg.id} className={`message ${msg.sender}`}>
                                                    <div>
                                                        <div className="message-bubble">
                                                            {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} onLoad={keepAtBottom} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                            {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '220px', marginBottom: '6px', display: 'block' }} /> : null}
                                                            {msg.type === 'document' && mediaUrl ? <a href={mediaUrl} target="_blank" rel="noopener noreferrer" style={{ display: 'block', marginBottom: '6px', fontWeight: 600 }}>📎 Abrir documento</a> : null}
                                                            {textPart}
                                                        </div>
                                                        <div className="message-time">{formatTime(msg.timestamp)}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="input-area">
                                        <textarea
                                            placeholder="Escribe tu respuesta aquí..."
                                            value={inputText}
                                            onChange={e => setInputText(e.target.value)}
                                            onKeyPress={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    sendMessage();
                                                }
                                            }}
                                        ></textarea>
                                        <div className="button-group">
                                            <button className="btn-send" onClick={sendMessage} disabled={sending}>{sending ? 'Enviando...' : '📤 Enviar'}</button>
                                            <button className="btn-photo" onClick={sendPhoto}>📷 Foto</button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <p>Selecciona una conversación</p>
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'catalogo' && (
                        <div className="catalog-container">
                            <div className="catalog-form">
                                <div className="form-field">
                                    <label>Foto</label>
                                    <label className="photo-upload">
                                        {newProduct.photoPreview ? <img src={newProduct.photoPreview} /> : '📷'}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={handlePhotoSelect} />
                                    </label>
                                </div>
                                <div className="form-field">
                                    <label>Nombre del producto</label>
                                    <input type="text" placeholder="Ej: nombre del producto" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Precio por {unit} ($)</label>
                                    <input type="number" step="0.01" placeholder="Ej: 25.00" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>{biz?.dates.enabled ? `Categoría / ${biz.dates.eventLabel}` : 'Categoría'}</label>
                                    <input type="text" placeholder="Ej: la categoría del producto" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} />
                                </div>
                                {packagingTypes.length > 0 && (
                                    <div className="form-field">
                                        <label>Empaque incluido</label>
                                        <select value={newProduct.packaging} onChange={e => setNewProduct({...newProduct, packaging: e.target.value})}>
                                            <option value="">Sin definir</option>
                                            {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                                        </select>
                                    </div>
                                )}
                                <button className="btn-add-product" onClick={addProduct} disabled={savingProduct}>
                                    {savingProduct ? 'Guardando...' : '+ Agregar'}
                                </button>
                            </div>

                            {products.length === 0 ? (
                                <div className="empty-catalog">
                                    <p>Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo {productEmoji}</p>
                                </div>
                            ) : (
                                <div className="catalog-grid">
                                    {products.map(product => (
                                        <div key={product.id} className="product-card">
                                            <img className="photo" src={product.image_url || 'logo.png'} />
                                            <div className="info">
                                                <span className="category-tag">{product.category}</span>
                                                <h4>{product.name}</h4>
                                                <div className="price">${product.price} <small>por {unit}</small></div>
                                                {packagingTypes.length > 0 && (
                                                    <select className="packaging-select" value={product.description || ''} onChange={e => changeProductPackaging(product.id, e.target.value)}>
                                                        <option value="">🎁 Empaque sin definir</option>
                                                        {packagingTypes.map(t => <option key={t.name} value={t.name}>🎁 {t.name}</option>)}
                                                    </select>
                                                )}
                                                <button className="btn-delete-product" onClick={() => removeProduct(product.id)}>🗑️ Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'cotizaciones' && (() => {
                            const statusLabels = { pending: 'Pendiente', accepted: 'Aceptada', expired: 'Vencida' };
                            const visible = quoteFilter === 'all' ? quotations : quotations.filter(q => q.status === quoteFilter);
                            const total = visible.reduce((sum, q) => sum + Number(q.total_amount || 0), 0);
                            return (
                            <div className="quotes-container">
                                <div className="quotes-toolbar">
                                    <select value={quoteFilter} onChange={e => setQuoteFilter(e.target.value)}>
                                        <option value="all">Todas</option>
                                        <option value="pending">Pendientes</option>
                                        <option value="accepted">Aceptadas</option>
                                        <option value="expired">Vencidas</option>
                                    </select>
                                    <span>{visible.length} cotización(es) · ${total.toFixed(2)}</span>
                                </div>
                                {visible.length === 0 ? (
                                    <div className="empty-catalog"><p>Aún no hay cotizaciones. Se anotan solas cada vez que el bot le da a una clienta el valor total de su pedido, y te llega un aviso por WhatsApp 🧾</p></div>
                                ) : visible.map(q => {
                                    let items = [];
                                    try { items = typeof q.products === 'string' ? JSON.parse(q.products) : (q.products || []); } catch { items = []; }
                                    const customer = q.conversations?.customer_name || q.conversations?.phone_number || q.customer_phone;
                                    return (
                                        <div key={q.id} className="quote-card">
                                            <div className="quote-head">
                                                <div>
                                                    <div className="quote-customer">📱 {customer}</div>
                                                    <div className="quote-meta">
                                                        {formatDateTime(q.created_at)} · Código {q.id.substring(0, 8).toUpperCase()} · Válida hasta {formatDateTime(q.expires_at)}
                                                    </div>
                                                </div>
                                                <div className="quote-total">${Number(q.total_amount || 0).toFixed(2)}</div>
                                            </div>
                                            <ul className="quote-items">
                                                {items.map((item, i) => item.type === 'delivery' ? (
                                                    <li key={i}>📅 Entrega: {String(item.date || '').split('-').reverse().join('/')}</li>
                                                ) : item.type === 'shipping' ? (
                                                    <li key={i}>🚚 {item.name} — ${Number(item.price).toFixed(2)}</li>
                                                ) : (
                                                    <li key={i}>
                                                        {item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural} × {item.name} — ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                                        {item.personalization ? <><br /><small>🎨 {item.personalization}</small></> : null}
                                                        {item.packaging ? <><br /><small>🎁 Empaque {item.packaging}{item.packagingChanged ? ' (cambiado por la clienta)' : ''}</small></> : null}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="quote-actions">
                                                <span className={`quote-status ${q.status}`}>{statusLabels[q.status] || q.status}</span>
                                                <select value={q.status} onChange={e => changeQuotationStatus(q.id, e.target.value)}>
                                                    <option value="pending">Pendiente</option>
                                                    <option value="accepted">Aceptada</option>
                                                    <option value="expired">Vencida</option>
                                                </select>
                                                <button className="btn-photo" onClick={() => openChatFromQuotation(q.conversation_id)}>💬 Ver chat</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            );
                        })()}
                        {activeTab === 'pedidos' && (() => {
                            const orderLabels = { pending: 'Pendiente de pago', confirmed: 'Pagado · en preparación', shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado' };
                            const visible = orderFilter === 'all' ? orders : orders.filter(o => o.status === orderFilter);
                            const total = visible.filter(o => o.status !== 'cancelled').reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
                            return (
                            <div className="quotes-container">
                                <div className="quotes-toolbar">
                                    <select value={orderFilter} onChange={e => setOrderFilter(e.target.value)}>
                                        <option value="all">Todos</option>
                                        {Object.entries(orderLabels).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                    </select>
                                    <span>{visible.length} pedido(s) · ${total.toFixed(2)}</span>
                                </div>
                                <p className="hint" style={{ margin: '0 0 12px', fontSize: '12px', color: 'var(--texto-suave)' }}>Marca el avance de cada pedido: el asistente usa este estado cuando la clienta pregunta cómo va su pedido.</p>
                                {visible.length === 0 ? (
                                    <div className="empty-catalog"><p>Aún no hay pedidos. Se registran solos cuando una clienta confirma su compra o elige cómo pagar 🛍️</p></div>
                                ) : visible.map(o => {
                                    let items = [];
                                    try { items = typeof o.products === 'string' ? JSON.parse(o.products) : (o.products || []); } catch { items = []; }
                                    const customer = o.customer_name || o.conversations?.customer_name || o.conversations?.phone_number || o.customer_phone;
                                    return (
                                        <div key={o.id} className="quote-card">
                                            <div className="quote-head">
                                                <div>
                                                    <div className="quote-customer">📱 {customer}</div>
                                                    <div className="quote-meta">
                                                        {formatDateTime(o.created_at)} · Código {o.id.substring(0, 8).toUpperCase()}
                                                        {o.delivery_date ? ` · Entrega ${String(o.delivery_date).slice(0, 10).split('-').reverse().join('/')}` : ''}
                                                    </div>
                                                </div>
                                                <div className="quote-total">${Number(o.total_amount || 0).toFixed(2)}</div>
                                            </div>
                                            <ul className="quote-items">
                                                {items.map((item, i) => item.type === 'delivery' ? null : item.type === 'shipping' ? (
                                                    <li key={i}>🚚 {item.name} — ${Number(item.price).toFixed(2)}</li>
                                                ) : (
                                                    <li key={i}>
                                                        {item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural} × {item.name} — ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                                        {item.personalization ? <><br /><small>🎨 {item.personalization}</small></> : null}
                                                        {item.packaging ? <><br /><small>🎁 Empaque {item.packaging}{item.packagingChanged ? ' (cambiado por la clienta)' : ''}</small></> : null}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="quote-actions">
                                                <span className={`quote-status ${o.status}`}>{orderLabels[o.status] || o.status}</span>
                                                <select value={o.status} onChange={e => changeOrderStatus(o.id, e.target.value)}>
                                                    {Object.entries(orderLabels).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                                </select>
                                                <button className="btn-photo" onClick={() => openChatFromQuotation(o.conversation_id)}>💬 Ver chat</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            );
                        })()}
                        {activeTab === 'configuracion' && (
                        <div className="settings-container">
                            <BusinessProfileForm onSaved={saved => {
                                setBiz(saved);
                                onBrandingChange({ name: saved.business.name, primaryColor: saved.branding.primaryColor, logoUrl: saved.branding.logoUrl, timezone: saved.business.timezone });
                            }} />
                            <div className="settings-card">
                                <h3>🏦 Datos para transferencia</h3>
                                <p className="hint">Cuando una clienta elige pagar por transferencia, el bot le indica {biz && biz.payments.depositPercent < 100 ? `el anticipo del ${biz.payments.depositPercent}%` : 'el total a pagar'} y le envía este texto exactamente como lo escribas.{biz?.payments.cardEnabled ? ' Con tarjeta, el bot indica el pago del total, se pausa y te avisa para que envíes el link de pago.' : ''}</p>
                                <textarea
                                    className="prompt-textarea"
                                    style={{ minHeight: '140px' }}
                                    placeholder={'Banco:\nTipo de cuenta:\nNúmero de cuenta:\nTitular:\nCédula / RUC:\n\nEnvíanos el comprobante por este chat 🤍'}
                                    value={transferInfo}
                                    onChange={e => setTransferInfo(e.target.value)}
                                ></textarea>
                                <div className="settings-actions">
                                    <span className="save-status">{transferSaved ? '✅ Guardado' : (transferInfo.trim() ? '' : '⚠️ Sin datos: el bot te avisará cuando una clienta elija transferencia')}</span>
                                    <button className="btn-save-prompt" onClick={savePaymentInfo} disabled={savingTransfer}>
                                        {savingTransfer ? 'Guardando...' : '💾 Guardar datos de pago'}
                                    </button>
                                </div>
                            </div>
                            <div className="settings-card">
                                <h3>🧠 Instrucciones del asistente (System Prompt)</h3>
                                <p className="hint">Aquí defines el tono del asistente y detalles de tu negocio que no están en el perfil (horarios, políticas, preguntas frecuentes). Se aplica de inmediato en todos los chats. Precios, pagos, envíos y fechas vienen del Perfil del negocio y mandan sobre lo que escribas aquí.</p>
                                <textarea
                                    className="prompt-textarea"
                                    placeholder={`Ej: Eres parte del equipo de ${branding.name || 'mi negocio'}. Responde siempre en español, de forma cálida y cercana, con mensajes cortos y algún emoji.`}
                                    value={systemPrompt}
                                    onChange={e => setSystemPrompt(e.target.value)}
                                ></textarea>
                                <div className="settings-actions">
                                    <span className="save-status">{promptSaved ? '✅ Guardado' : ''}</span>
                                    <button className="btn-save-prompt" onClick={saveSystemPrompt} disabled={savingPrompt}>
                                        {savingPrompt ? 'Guardando...' : '💾 Guardar instrucciones'}
                                    </button>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        // Plataforma general: la marca de cada empresa se aplica recién al entrar en ella.
        const PLATFORM_BRANDING = { name: '', primaryColor: '', logoUrl: '', timezone: '' };

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());
            const [role, setRole] = useState(null);
            const [branding, setBranding] = useState(PLATFORM_BRANDING);

            useEffect(() => {
                onSessionExpired = () => { setRole(null); setAuthenticated(false); };
                document.title = 'CRM · Asistentes de WhatsApp';
            }, []);

            // Quién entró: la administradora sin empresa elegida ve la pantalla general de empresas.
            useEffect(() => {
                if (!authenticated) return;
                api('/api/session')
                    .then(data => setRole(data.role))
                    .catch(() => {
                        // La empresa elegida ya no existe o está desactivada: se vuelve a la pantalla general.
                        if (getCurrentBusinessId()) {
                            setCurrentBusinessId('');
                            window.location.reload();
                        }
                    });
            }, [authenticated]);

            const changeBranding = data => {
                applyBranding(data);
                setBranding(data);
            };

            const logout = () => {
                setToken(null);
                setCurrentBusinessId('');
                setRole(null);
                setAuthenticated(false);
            };

            if (!authenticated) {
                return <LoginScreen branding={PLATFORM_BRANDING} onLogin={() => setAuthenticated(true)} />;
            }
            if (!role) return <div style={{ padding: '40px', textAlign: 'center' }}>Cargando...</div>;
            if (role === 'admin' && !getCurrentBusinessId()) {
                return <CompanyHome onLogout={logout} />;
            }

            return <App branding={branding} onBrandingChange={changeBranding} onLogout={logout} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
