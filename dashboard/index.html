<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM WhatsApp</title>

    <!-- Instalable como app (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B96B4F">

    <!-- iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CRM">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <!-- Versiones fijas: una actualización externa de estas librerías no puede romper el CRM. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        :root {
            --terracota: #B96B4F;
            --terracota-dark: #9C5740;
            --rosa-palo: #E3B7AC;
            --rosa-palo-suave: #F0DAD3;
            --beige: #F7EFEA;
            --beige-claro: #FCF8F5;
            --crema: #FDFAF7;
            --texto: #4A3B35;
            --texto-suave: #9C8880;
            --azul-suave: #A8C5D6;
            --verde-suave: #A8D5BA;
            --amarillo-suave: #E8C88A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--beige);
            color: var(--texto);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            color: var(--texto);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand img {
            height: 34px;
            width: auto;
            display: block;
        }

        .header-brand .subtitle {
            font-size: 12px;
            color: var(--texto-suave);
            letter-spacing: 0.5px;
        }

        .toggle-bot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
        }

        .toggle-bot.active {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .toggle-bot.inactive {
            background: #e39a9a;
            color: #6b2c2c;
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 20px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            flex-shrink: 0;
        }

        .nav-tab {
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-suave);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--terracota);
        }

        .nav-tab.active {
            color: var(--terracota);
            border-bottom-color: var(--terracota);
        }

        .catalog-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .catalog-form {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 140px 1fr 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-field input, .form-field select {
            padding: 10px 12px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .photo-upload {
            width: 90px;
            height: 90px;
            border: 2px dashed var(--rosa-palo);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: var(--beige-claro);
            font-size: 22px;
            color: var(--rosa-palo);
        }

        .photo-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-add-product {
            background: var(--terracota);
            color: white;
            padding: 11px 22px;
            height: fit-content;
        }

        .btn-add-product:hover {
            background: var(--terracota-dark);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 16px rgba(185, 107, 79, 0.15);
        }

        .product-card .photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--rosa-palo-suave);
        }

        .product-card .info {
            padding: 14px;
        }

        .product-card .category-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: var(--terracota);
            background: var(--rosa-palo-suave);
            padding: 3px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .product-card .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--terracota);
        }

        .packaging-select {
            width: 100%;
            margin: 6px 0;
            padding: 6px 8px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        .product-card .price small {
            font-size: 11px;
            font-weight: 400;
            color: var(--texto-suave);
        }

        .btn-delete-product {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #e39a9a;
            color: #b45050;
            padding: 6px;
            font-size: 12px;
        }

        .btn-delete-product:hover {
            background: #f5dcdc;
        }

        .empty-catalog {
            text-align: center;
            padding: 60px 20px;
            color: var(--texto-suave);
        }

        .settings-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .settings-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            padding: 24px;
            max-width: 700px;
        }

        .settings-card h3 {
            font-size: 15px;
            margin-bottom: 6px;
            color: var(--texto);
        }

        .settings-card p.hint {
            font-size: 12px;
            color: var(--texto-suave);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 320px;
            padding: 14px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            background: var(--beige-claro);
            color: var(--texto);
            resize: vertical;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .settings-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .btn-save-prompt {
            background: var(--terracota);
            color: white;
        }

        .btn-save-prompt:hover {
            background: var(--terracota-dark);
        }

        .save-status {
            font-size: 12px;
            color: var(--verde-suave);
            font-weight: 600;
        }

        /* Botón de estadísticas dentro de la fila de pestañas: no ocupa una franja propia. */
        .stats-toggle {
            margin-left: auto;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-suave);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 14px;
            user-select: none;
            white-space: nowrap;
        }

        .stats-toggle:hover,
        .stats-toggle.open {
            color: var(--terracota);
            border-color: var(--terracota);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 12px 20px;
            background: var(--beige);
            flex-shrink: 0;
        }

        .stat-card {
            padding: 12px 16px;
            border-radius: 14px;
            color: white;
            box-shadow: 0 2px 10px rgba(185, 107, 79, 0.12);
        }

        .stat-card:nth-child(1) { background: linear-gradient(135deg, var(--terracota), var(--terracota-dark)); }
        .stat-card:nth-child(2) { background: linear-gradient(135deg, var(--azul-suave), #8ba9bb); }
        .stat-card:nth-child(3) { background: linear-gradient(135deg, var(--amarillo-suave), #d1ac6a); }
        .stat-card:nth-child(4) { background: linear-gradient(135deg, var(--verde-suave), #85b89b); }

        .stat-card h4 {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 22px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .conversations-list {
            width: 230px;
            background: var(--crema);
            border-right: 1px solid var(--rosa-palo-suave);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversations-list-header {
            padding: 16px 18px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversation-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--beige);
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: var(--rosa-palo-suave);
        }

        .conversation-item.active {
            background: var(--rosa-palo-suave);
            border-left: 4px solid var(--terracota);
        }

        .conversation-item h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--texto);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .paused-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: #fde2e2;
            color: #a33b3b;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 16px;
            background: var(--crema);
            border-bottom: 1px solid var(--rosa-palo-suave);
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-header.paused {
            background: #fde2e2;
            color: #a33b3b;
        }

        .chat-header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-delete-chat {
            background: transparent;
            color: #a33b3b;
            border: 1px solid #e8b4b4;
        }

        .btn-delete-chat:hover {
            background: #fde2e2;
        }

        .quotes-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            min-height: 0;
        }

        .quotes-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--texto-suave);
        }

        .quotes-toolbar select {
            padding: 6px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            background: var(--crema);
            color: var(--texto);
            font-size: 13px;
        }

        .quote-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }

        .quote-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quote-customer {
            font-weight: 700;
            font-size: 14px;
        }

        .quote-meta {
            font-size: 12px;
            color: var(--texto-suave);
            margin-top: 2px;
        }

        .quote-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--terracota);
        }

        .quote-items {
            margin: 8px 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .quote-items small {
            color: var(--texto-suave);
        }

        .quote-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quote-status {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .quote-status.pending { background: #fbeed3; color: #8a6420; }
        .quote-status.accepted { background: #dcefe3; color: #2f5540; }
        .quote-status.expired { background: #ece6e3; color: #7b6d68; }

        .quote-actions select {
            padding: 5px 8px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            background: var(--beige-claro);
            font-size: 12px;
        }

        .chat-header .chat-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-item p {
            font-size: 12px;
            color: var(--texto-suave);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--beige-claro);
            min-width: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 14px;
            word-wrap: break-word;
            /* Respeta los saltos de línea: sin esto las listas y los datos bancarios se ven como un solo bloque. */
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.customer .message-bubble {
            background: var(--terracota);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: var(--rosa-palo-suave);
            color: var(--texto);
            border-bottom-left-radius: 4px;
        }

        .message-bubble img {
            max-width: 220px;
            border-radius: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .message-time {
            font-size: 11px;
            color: var(--texto-suave);
            margin-top: 4px;
        }

        .input-area {
            padding: 8px 12px;
            border-top: 1px solid var(--rosa-palo-suave);
            display: flex;
            gap: 6px;
            background: var(--crema);
            flex-shrink: 0;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.4;
            min-height: 36px;
            max-height: 72px;
            background: var(--beige-claro);
            color: var(--texto);
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 4px;
            order: 2;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-send {
            background: var(--terracota);
            color: white;
        }

        .btn-send:hover {
            background: var(--terracota-dark);
        }

        .btn-photo {
            background: var(--rosa-palo);
            color: var(--texto);
        }

        .btn-photo:hover {
            background: var(--rosa-palo-suave);
        }

        .btn-bot-control {
            font-size: 12px;
        }

        .btn-bot-control.active {
            background: var(--amarillo-suave);
            color: var(--texto);
        }

        .btn-bot-control.paused {
            background: var(--verde-suave);
            color: #2f5540;
        }

        .btn-bot-control:hover {
            opacity: 0.9;
        }

        .btn-bot-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--texto-suave);
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--texto-suave);
        }

        .spinner {
            border: 3px solid var(--rosa-palo-suave);
            border-top: 3px solid var(--terracota);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--beige);
            padding: 20px;
        }

        .login-card {
            background: var(--crema);
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 18px;
            padding: 40px 34px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 6px 30px rgba(185, 107, 79, 0.1);
        }

        .login-card img {
            height: 54px;
            margin-bottom: 26px;
        }

        .login-card input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            background: var(--beige-claro);
            color: var(--texto);
            text-align: center;
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--terracota);
        }

        .login-card button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            background: var(--terracota);
            color: white;
            font-size: 14px;
        }

        .login-card button:hover {
            background: var(--terracota-dark);
        }

        .login-error {
            color: #b45050;
            font-size: 13px;
            margin-top: 14px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--rosa-palo);
            color: var(--texto-suave);
            padding: 9px 14px;
            font-size: 12px;
            margin-left: 10px;
        }

        .btn-logout:hover {
            background: var(--rosa-palo-suave);
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .settings-card + .settings-card { margin-top: 18px; }

        .profile-section {
            border-top: 1px solid var(--rosa-palo-suave);
            padding-top: 16px;
            margin-top: 16px;
        }

        .profile-section h4 {
            font-size: 13px;
            color: var(--texto);
            margin-bottom: 10px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .profile-grid .wide { grid-column: 1 / -1; }

        .field-hint {
            font-size: 11px;
            color: var(--texto-suave);
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--texto);
            cursor: pointer;
        }

        .step-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 70px auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .step-row input {
            padding: 8px 10px;
            border: 1px solid var(--rosa-palo-suave);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            background: var(--beige-claro);
            color: var(--texto);
            min-width: 0;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--terracota);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 0;
        }

        .logo-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-preview img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 8px;
            background: var(--beige-claro);
        }

        @media (max-width: 700px) {
            .profile-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .conversations-list { width: 220px; }
            .header-brand img { height: 32px; }
            .catalog-form { grid-template-columns: 1fr; }
            .photo-upload { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // El CRM lo sirve el mismo servidor: se usa su propio origen (sirve igual en otro dominio).
        const API_URL = /^https?:$/.test(window.location.protocol)
            ? window.location.origin
            : 'https://whatsapp-assistant-velamia.onrender.com';
        const TOKEN_KEY = 'velamia_crm_token';

        let onSessionExpired = () => {};

        // Algunos navegadores bloquean el almacenamiento (modo privado, restricciones):
        // en ese caso la sesión dura lo que dure la pestaña en lugar de romper la app.
        let memoryToken = null;

        function getToken() {
            try {
                return localStorage.getItem(TOKEN_KEY) || memoryToken;
            } catch {
                return memoryToken;
            }
        }

        function setToken(value) {
            memoryToken = value;
            try {
                if (value === null) localStorage.removeItem(TOKEN_KEY);
                else localStorage.setItem(TOKEN_KEY, value);
            } catch {
                // sesión solo en memoria
            }
        }

        // Todas las peticiones pasan por el backend autenticado: el navegador
        // nunca maneja claves de Supabase ni de WhatsApp.
        async function api(path, options = {}) {
            const token = getToken();
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            if (res.status === 401) {
                setToken(null);
                onSessionExpired();
                throw new Error('Sesión expirada, vuelve a entrar');
            }

            // Durante un despliegue Render puede responder una página HTML en lugar de JSON.
            let data;
            try {
                data = await res.json();
            } catch {
                throw new Error('El servidor no está disponible en este momento, intenta en unos segundos');
            }
            if (!res.ok || (data && data.error)) throw new Error(data?.error || `Error ${res.status}`);
            return data;
        }

        // Tipos cuyo contenido guardado empieza con la URL del archivo.
        const MEDIA_TYPES = ['image', 'audio', 'document'];

        // La base guarda las fechas en UTC sin zona horaria; sin la "Z" el navegador
        // las toma como hora local y en Ecuador aparecen 5 horas adelantadas.
        let BUSINESS_TZ = 'America/Guayaquil';

        // Nombre, color, logo y zona horaria del negocio (perfil del negocio).
        function applyBranding(branding) {
            if (!branding) return;
            if (branding.name) document.title = `${branding.name} · CRM`;
            if (/^#[0-9a-f]{6}$/i.test(branding.primaryColor || '')) {
                document.documentElement.style.setProperty('--terracota', branding.primaryColor);
            }
            if (branding.timezone) BUSINESS_TZ = branding.timezone;
        }

        const logoOf = branding => (branding && branding.logoUrl) || 'logo.png';

        function parseTs(value) {
            if (!value) return null;
            return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(value) ? value : `${value}Z`);
        }

        function formatDateTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
        }

        function formatTime(value) {
            const date = parseTs(value);
            return date ? date.toLocaleTimeString('es-EC', { timeZone: BUSINESS_TZ, hour: 'numeric', minute: '2-digit' }) : '';
        }

        function isBotPausedIn(conv) {
            const until = parseTs(conv?.bot_paused_until);
            return !!until && until > new Date();
        }

        function LoginScreen({ onLogin, branding }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [checking, setChecking] = useState(false);

            async function submit() {
                if (!password) return;
                setChecking(true);
                setError('');
                try {
                    const res = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json().catch(() => ({ error: 'El servidor no está disponible, intenta en unos segundos' }));
                    if (!res.ok) throw new Error(data.error || 'No se pudo entrar');
                    setToken(data.token);
                    onLogin();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setChecking(false);
                }
            }

            return (
                <div className="login-screen">
                    <div className="login-card">
                        <img src={logoOf(branding)} alt={branding.name || 'Logo'} />
                        <input
                            type="password"
                            placeholder="Contraseña"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && submit()}
                            autoFocus
                        />
                        <button onClick={submit} disabled={checking}>
                            {checking ? 'Entrando...' : 'Entrar al CRM'}
                        </button>
                        {error && <div className="login-error">{error}</div>}
                    </div>
                </div>
            );
        }

        const TIMEZONES = ['America/Guayaquil', 'America/Bogota', 'America/Lima', 'America/Caracas', 'America/Panama', 'America/Mexico_City', 'America/Santiago', 'America/Argentina/Buenos_Aires', 'America/La_Paz', 'America/Asuncion', 'America/Montevideo', 'America/New_York', 'Europe/Madrid'];

        function setIn(obj, path, value) {
            const copy = JSON.parse(JSON.stringify(obj));
            const keys = path.split('.');
            let target = copy;
            for (const key of keys.slice(0, -1)) target = target[key];
            target[keys[keys.length - 1]] = value;
            return copy;
        }

        const getIn = (obj, path) => path.split('.').reduce((o, key) => (o == null ? undefined : o[key]), obj);

        function BusinessProfileForm({ onSaved }) {
            const [form, setForm] = useState(null);
            const [presets, setPresets] = useState([]);
            const [saving, setSaving] = useState(false);
            const [saved, setSaved] = useState(false);
            const [uploadingLogo, setUploadingLogo] = useState(false);

            useEffect(() => {
                api('/api/business-profile').then(setForm).catch(err => alert('Error cargando el perfil: ' + err.message));
                api('/api/business-profile/presets').then(setPresets).catch(() => {});
            }, []);

            if (!form) {
                return <div className="settings-card"><h3>🏪 Perfil del negocio</h3><p className="hint">Cargando...</p></div>;
            }

            const set = (path, value) => {
                setForm(prev => setIn(prev, path, value));
                setSaved(false);
            };

            const text = (path, label, placeholder = '', hint = '', wide = false) => (
                <div className={`form-field ${wide ? 'wide' : ''}`}>
                    <label>{label}</label>
                    <input type="text" value={getIn(form, path) ?? ''} placeholder={placeholder} onChange={e => set(path, e.target.value)} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>
            );

            const number = (path, label, hint = '', step = '1') => (
                <div className="form-field">
                    <label>{label}</label>
                    <input type="number" min="0" step={step} value={getIn(form, path) ?? ''} onChange={e => set(path, e.target.value === '' ? '' : Number(e.target.value))} />
                    {hint && <small className="field-hint">{hint}</small>}
                </div>
            );

            const check = (path, label) => (
                <label className="check-row wide">
                    <input type="checkbox" checked={!!getIn(form, path)} onChange={e => set(path, e.target.checked)} /> {label}
                </label>
            );

            function loadPreset(id) {
                const preset = presets.find(item => item.id === id);
                if (!preset) return;
                if (!confirm(`¿Cargar la plantilla "${preset.label}"?\n\nReemplaza lo que ves en este formulario. No se guarda hasta que pulses "Guardar perfil".`)) return;
                setForm(JSON.parse(JSON.stringify(preset.profile)));
                setSaved(false);
            }

            function uploadLogo(e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (!/^image\/(jpeg|png)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
                    alert('El logo debe ser JPG o PNG de hasta 5 MB');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async () => {
                    setUploadingLogo(true);
                    try {
                        const data = await api('/api/upload-image', { method: 'POST', body: JSON.stringify({ imageBase64: reader.result }) });
                        set('branding.logoUrl', data.url);
                    } catch (err) {
                        alert('Error subiendo el logo: ' + err.message);
                    } finally {
                        setUploadingLogo(false);
                    }
                };
                reader.readAsDataURL(file);
            }

            async function save() {
                setSaving(true);
                try {
                    const result = await api('/api/business-profile', { method: 'PUT', body: JSON.stringify(form) });
                    setForm(result);
                    setSaved(true);
                    onSaved(result);
                } catch (err) {
                    alert('Error guardando el perfil: ' + err.message);
                } finally {
                    setSaving(false);
                }
            }

            const steps = form.followUps.steps || [];
            const shippingMode = form.shipping.mode;

            return (
                <div className="settings-card">
                    <h3>🏪 Perfil del negocio</h3>
                    <p className="hint">Todo lo que hace único a tu negocio: cómo vende, cobra, envía y habla el asistente. Se aplica de inmediato en todos los chats y manda sobre las instrucciones de abajo.</p>

                    {presets.length > 0 && (
                        <div className="form-field">
                            <label>Empezar desde una plantilla</label>
                            <select value="" onChange={e => loadPreset(e.target.value)}>
                                <option value="">Elegir plantilla…</option>
                                {presets.map(preset => <option key={preset.id} value={preset.id}>{preset.label}</option>)}
                            </select>
                        </div>
                    )}

                    <div className="profile-section">
                        <h4>Negocio</h4>
                        <div className="profile-grid">
                            {text('business.name', 'Nombre', 'Ej: Dulce Hogar')}
                            {text('business.productEmoji', 'Emoji de productos', '🛍️', 'Va en el pie de cada foto')}
                            {text('business.description', 'Qué es tu negocio', 'Ej: una tienda de zapatos para dama', 'Completa la frase "Nombre es …"', true)}
                            {text('business.city', 'Ciudad')}
                            {text('business.country', 'País')}
                            <div className="form-field">
                                <label>Zona horaria</label>
                                <select value={form.business.timezone} onChange={e => set('business.timezone', e.target.value)}>
                                    {[...new Set([form.business.timezone, ...TIMEZONES])].map(tz => <option key={tz} value={tz}>{tz}</option>)}
                                </select>
                            </div>
                            <div className="form-field">
                                <label>Color principal</label>
                                <input type="color" value={form.branding.primaryColor} onChange={e => set('branding.primaryColor', e.target.value)} />
                            </div>
                            <div className="form-field wide">
                                <label>Logo</label>
                                <div className="logo-preview">
                                    <img src={form.branding.logoUrl || 'logo.png'} />
                                    <label className="btn-link">
                                        {uploadingLogo ? 'Subiendo…' : 'Cambiar logo'}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={uploadLogo} />
                                    </label>
                                    {form.branding.logoUrl && <button className="btn-link" onClick={() => set('branding.logoUrl', '')}>Quitar</button>}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="profile-section">
                        <h4>Cómo vendes</h4>
                        <div className="profile-grid">
                            {text('sales.unitSingular', 'Unidad de venta', 'docena, par, unidad')}
                            {text('sales.unitPlural', 'Unidad en plural', 'docenas, pares, unidades')}
                            {text('sales.unitDetail', 'Qué incluye la unidad', 'Ej: 12 unidades', 'Déjalo vacío si no aplica')}
                            {text('sales.priceSuffix', 'Texto del precio en fotos', 'la docena, el par, c/u')}
                            {text('sales.productLabel', 'Cómo llamas a cada producto', 'Modelo, Producto, Diseño')}
                            {text('sales.productLabelPlural', 'En plural', 'Modelos, Productos')}
                            {text('sales.goodsWord', 'Qué vendes (para hablar del total)', 'velas, zapatos, productos')}
                            {text('sales.minimumOrder', 'Pedido mínimo', 'Ej: 2 docenas', 'Vacío = sin mínimo')}
                            {check('sales.personalization', 'Los productos se pueden personalizar')}
                            {form.sales.personalization && text('sales.personalizationExamples', 'Qué se puede personalizar', 'Ej: colores, nombres y frases', '', true)}
                        </div>
                    </div>

                    <div className="profile-section">
                        <h4>Pagos</h4>
                        <div className="profile-grid">
                            {check('payments.transferEnabled', 'Acepto transferencia bancaria (el bot envía tus datos de pago)')}
                            {form.payments.transferEnabled && number('payments.depositPercent', 'Anticipo por transferencia (%)', '100 = se paga todo al inicio')}
                            {check('payments.cardEnabled', 'Acepto tarjeta (el bot se pausa y te avisa para que envíes el link)')}
                            {form.payments.cardEnabled && text('payments.cardBrands', 'Tarjetas aceptadas', 'Ej: Visa y Mastercard')}
                        </div>
                    </div>

                    <div className="profile-section">
                        <h4>Fechas de entrega</h4>
                        <div className="profile-grid">
                            {check('dates.enabled', 'Trabajo con fecha de evento (el bot calcula la fecha de entrega)')}
                            {form.dates.enabled && text('dates.eventLabel', 'Cómo se llama la fecha', 'evento, boda, fiesta')}
                            {form.dates.enabled && number('dates.deliveryDaysBeforeEvent', 'Entrego días antes', '0 = el mismo día')}
                            {form.dates.enabled && number('dates.urgentDays', 'Avisarme si la entrega es en (días)')}
                            {form.dates.enabled && check('dates.alwaysAvailable', 'Siempre tengo disponibilidad (el bot no consulta fechas)')}
                        </div>
                    </div>

                    <div className="profile-section">
                        <h4>Envíos</h4>
                        <div className="profile-grid">
                            <div className="form-field wide">
                                <label>Tipo de envío</label>
                                <select value={shippingMode} onChange={e => set('shipping.mode', e.target.value)}>
                                    <option value="ecuador_table">Tarifario Servientrega Ecuador (origen Guayaquil)</option>
                                    <option value="flat">Tarifa fija a cualquier ciudad</option>
                                    <option value="none">Sin envíos</option>
                                </select>
                            </div>
                            {shippingMode === 'flat' && number('shipping.flatRate', 'Tarifa fija ($)', '', '0.01')}
                            {shippingMode !== 'none' && text('shipping.carrier', 'Transportista', 'Ej: Servientrega')}
                            {shippingMode !== 'none' && text('shipping.coverage', 'Cobertura', 'Ej: todo Ecuador')}
                            {shippingMode !== 'none' && number('shipping.unitsIncludedInRate', 'Cantidad que cubre la tarifa', '0 = sin recargo por cantidad')}
                            {shippingMode !== 'none' && number('shipping.extraCost', 'Recargo si supera esa cantidad ($)', '', '0.01')}
                            {shippingMode !== 'none' && check('shipping.showSeparately', 'Mostrar el envío por separado (si no, el total es un solo valor)')}
                            {check('shipping.pickupAvailable', 'Se puede retirar en el local')}
                            {(form.shipping.pickupAvailable || shippingMode === 'none') && text('shipping.pickupAddress', 'Dirección para retirar', 'Ej: Av. 9 de Octubre 123', '', true)}
                        </div>
                    </div>

                    <div className="profile-section">
                        <h4>Seguimientos automáticos</h4>
                        <div className="profile-grid">
                            {check('followUps.enabled', 'Enviar seguimientos a clientas que no responden')}
                        </div>
                        {form.followUps.enabled && (
                            <>
                                <p className="hint">Cada seguimiento es una plantilla aprobada en Meta y se envía tras esos días sin respuesta.</p>
                                {steps.map((step, i) => (
                                    <div key={i} className="step-row">
                                        <input type="text" placeholder="nombre_de_la_plantilla" value={step.template} onChange={e => set(`followUps.steps.${i}.template`, e.target.value.trim())} />
                                        <input type="number" min="1" value={step.days} onChange={e => set(`followUps.steps.${i}.days`, Number(e.target.value))} />
                                        <span>días</span>
                                        <button className="btn-link" onClick={() => set('followUps.steps', steps.filter((_, j) => j !== i))}>Quitar</button>
                                    </div>
                                ))}
                                <button className="btn-link" onClick={() => set('followUps.steps', [...steps, { template: '', days: (steps[steps.length - 1]?.days || 0) + 1 }])}>+ Agregar seguimiento</button>
                                <div className="profile-grid" style={{ marginTop: '10px' }}>
                                    {number('followUps.fromHour', 'Desde la hora (0-23)')}
                                    {number('followUps.untilHour', 'Hasta la hora (1-24)')}
                                    {text('followUps.optOutMessage', 'Respuesta si la clienta pide no recibir más', '', '', true)}
                                </div>
                            </>
                        )}
                    </div>

                    <div className="profile-section">
                        <h4>Empaques</h4>
                        <div className="profile-grid">
                            {check('packaging.enabled', 'Cada producto tiene un empaque incluido y la clienta puede cambiarlo')}
                        </div>
                        {form.packaging.enabled && (
                            <>
                                <p className="hint">El empaque de cada producto se elige en el Catálogo y va incluido en su precio. "Costo del cambio" es lo que se suma por {form.sales.unitSingular} si la clienta pide cambiar a ese empaque; si lo dejas vacío, el asistente no da el total y te avisa para que lo confirmes.</p>
                                {(form.packaging.types || []).map((type, i) => (
                                    <div key={i} className="step-row" style={{ gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 2fr) 90px auto' }}>
                                        <input type="text" placeholder="Nombre (Kraft)" value={type.name} onChange={e => set(`packaging.types.${i}.name`, e.target.value)} />
                                        <input type="text" placeholder="Cómo es" value={type.description} onChange={e => set(`packaging.types.${i}.description`, e.target.value)} />
                                        <input type="number" min="0" step="0.01" placeholder="Costo" title={`Costo del cambio por ${form.sales.unitSingular} ($)`} value={type.changeCost ?? ''} onChange={e => set(`packaging.types.${i}.changeCost`, e.target.value === '' ? null : Number(e.target.value))} />
                                        <button className="btn-link" onClick={() => set('packaging.types', form.packaging.types.filter((_, j) => j !== i))}>Quitar</button>
                                    </div>
                                ))}
                                <button className="btn-link" onClick={() => set('packaging.types', [...(form.packaging.types || []), { name: '', description: '', changeCost: null }])}>+ Agregar empaque</button>
                            </>
                        )}
                    </div>

                    <div className="profile-section">
                        <h4>Avisos y estilo</h4>
                        <div className="profile-grid">
                            {text('alerts.ownerPhone', 'Tu WhatsApp para recibir avisos', 'Ej: 593991234567', 'Con código de país, sin + ni espacios', true)}
                            {text('alerts.template', 'Plantilla de aviso para ti (Meta)', 'Ej: aviso_equipo', 'Vacío = aviso en texto libre (solo llega si escribiste al número en las últimas 24 h)', true)}
                            <div className="form-field wide">
                                <label>Emojis que usa el asistente</label>
                                <input type="text" value={(form.style.decorativeEmojis || []).join(' ')} onChange={e => set('style.decorativeEmojis', e.target.value.split(' '))} />
                                <small className="field-hint">Separados por espacio. El asistente los va rotando para no repetir.</small>
                            </div>
                            {check('style.humanPersona', 'Presentarse como una persona del equipo (nunca decir que es un asistente virtual)')}
                        </div>
                    </div>

                    <div className="settings-actions">
                        <span className="save-status">{saved ? '✅ Perfil guardado' : ''}</span>
                        <button className="btn-save-prompt" onClick={save} disabled={saving}>
                            {saving ? 'Guardando...' : '💾 Guardar perfil'}
                        </button>
                    </div>
                </div>
            );
        }

        function App({ onLogout, branding, onBrandingChange }) {
            const [conversations, setConversations] = useState([]);
            const [selectedConv, setSelectedConv] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [botEnabled, setBotEnabled] = useState(true);
            const [stats, setStats] = useState({ total: 0, active: 0, orders: 0, revenue: 0 });
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('conversaciones');
            const [products, setProducts] = useState([]);
            const [newProduct, setNewProduct] = useState({ name: '', price: '', category: '', packaging: '', photoBase64: '', photoPreview: '' });
            const [savingProduct, setSavingProduct] = useState(false);
            const [systemPrompt, setSystemPrompt] = useState('');
            const [savingPrompt, setSavingPrompt] = useState(false);
            const [promptSaved, setPromptSaved] = useState(false);
            const [transferInfo, setTransferInfo] = useState('');
            const [savingTransfer, setSavingTransfer] = useState(false);
            const [transferSaved, setTransferSaved] = useState(false);
            const [pausingBot, setPausingBot] = useState(false);
            const [statsExpanded, setStatsExpanded] = useState(false);
            const [quotations, setQuotations] = useState([]);
            const [quoteFilter, setQuoteFilter] = useState('all');
            const [deletingChat, setDeletingChat] = useState(false);
            const [sending, setSending] = useState(false);
            const [biz, setBiz] = useState(null);
            const unit = biz?.sales.unitSingular || 'unidad';
            const unitPlural = biz?.sales.unitPlural || 'unidades';
            const productEmoji = biz?.business.productEmoji || '🛍️';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const messagesRef = useRef(null);
            // Se sigue al último mensaje salvo que la dueña haya subido a leer mensajes anteriores.
            const stickToBottom = useRef(true);

            useEffect(() => {
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                loadSystemPrompt();
                loadQuotations();
                loadPaymentInfo();
                api('/api/business-profile').then(setBiz).catch(err => console.error('Error cargando perfil:', err));
                const interval = setInterval(() => {
                    loadConversations();
                    loadStats();
                    loadQuotations();
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            async function loadSystemPrompt() {
                try {
                    const data = await api('/api/system-prompt');
                    setSystemPrompt(data.prompt || '');
                } catch (err) {
                    console.error('Error cargando system prompt:', err);
                }
            }

            async function saveSystemPrompt() {
                setSavingPrompt(true);
                try {
                    await api('/api/system-prompt', {
                        method: 'POST',
                        body: JSON.stringify({ prompt: systemPrompt })
                    });
                    setPromptSaved(true);
                    setTimeout(() => setPromptSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando instrucciones: ' + err.message);
                } finally {
                    setSavingPrompt(false);
                }
            }

            async function loadPaymentInfo() {
                try {
                    const data = await api('/api/payment-info');
                    setTransferInfo(data.transfer || '');
                } catch (err) {
                    console.error('Error cargando datos de pago:', err);
                }
            }

            async function savePaymentInfo() {
                setSavingTransfer(true);
                try {
                    await api('/api/payment-info', {
                        method: 'POST',
                        body: JSON.stringify({ transfer: transferInfo })
                    });
                    setTransferSaved(true);
                    setTimeout(() => setTransferSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando datos de pago: ' + err.message);
                } finally {
                    setSavingTransfer(false);
                }
            }

            async function loadProducts() {
                try {
                    const data = await api('/api/products');
                    setProducts(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando catálogo:', err);
                }
            }

            function handlePhotoSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                // WhatsApp solo envía fotos JPG o PNG de hasta 5 MB.
                if (!['image/jpeg', 'image/png'].includes(file.type)) {
                    alert('La foto debe ser JPG o PNG. WhatsApp no puede enviar otros formatos.');
                    e.target.value = '';
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert('La foto pesa más de 5 MB. Usa una foto más liviana para que WhatsApp la pueda enviar.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    setNewProduct(prev => ({ ...prev, photoBase64: reader.result, photoPreview: reader.result }));
                };
                reader.readAsDataURL(file);
            }

            async function addProduct() {
                if (!newProduct.name.trim() || !newProduct.price || !newProduct.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSavingProduct(true);
                try {
                    let imageUrl = '';
                    if (newProduct.photoBase64) {
                        const uploadData = await api('/api/upload-image', {
                            method: 'POST',
                            body: JSON.stringify({ imageBase64: newProduct.photoBase64 })
                        });
                        imageUrl = uploadData.url;
                    }

                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: newProduct.name,
                            price: parseFloat(newProduct.price),
                            category: newProduct.category,
                            packaging: newProduct.packaging,
                            image_url: imageUrl
                        })
                    });

                    setNewProduct({ name: '', price: '', category: '', packaging: '', photoBase64: '', photoPreview: '' });
                    loadProducts();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSavingProduct(false);
                }
            }

            async function changeProductPackaging(id, packaging) {
                try {
                    await api(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify({ packaging }) });
                    setProducts(prev => prev.map(p => p.id === id ? { ...p, description: packaging } : p));
                } catch (err) {
                    alert('Error cambiando el empaque: ' + err.message);
                }
            }

            async function removeProduct(id) {
                if (!confirm('¿Eliminar este producto del catálogo?')) return;
                try {
                    await api(`/api/products/${id}`, { method: 'DELETE' });
                    loadProducts();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                }
            }

            async function loadBotStatus() {
                try {
                    const data = await api('/api/bot-status');
                    setBotEnabled(data.enabled);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function toggleBotStatus() {
                const newValue = !botEnabled;
                setBotEnabled(newValue);
                try {
                    await api('/api/bot-status', {
                        method: 'POST',
                        body: JSON.stringify({ enabled: newValue })
                    });
                } catch (err) {
                    alert('Error cambiando estado del bot: ' + err.message);
                    setBotEnabled(!newValue);
                }
            }

            async function sendPhoto() {
                if (!selectedConv) return;
                const imageUrl = prompt('Pega la URL de la foto a enviar:');
                if (!imageUrl) return;
                const caption = prompt('Descripción (opcional):') || '';

                try {
                    await api('/api/send-image', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            imageUrl,
                            caption
                        })
                    });
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                }
            }

            // La lista se refresca cada 5 s, así la pausa que active el bot (reclamo, pago...)
            // se refleja sola sin volver a abrir el chat.
            const currentConv = conversations.find(c => c.id === selectedConv?.id) || selectedConv;
            const botPausedInChat = isBotPausedIn(currentConv);

            async function loadQuotations() {
                try {
                    const data = await api('/api/quotations');
                    setQuotations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando cotizaciones:', err);
                }
            }

            async function changeQuotationStatus(id, status) {
                try {
                    await api(`/api/quotations/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
                    loadQuotations();
                } catch (err) {
                    alert('Error cambiando estado: ' + err.message);
                }
            }

            function openChatFromQuotation(conversationId) {
                const conv = conversations.find(c => c.id === conversationId);
                if (!conv) return;
                setSelectedConv(conv);
                setActiveTab('conversaciones');
            }

            async function deleteChat() {
                if (!currentConv) return;
                const name = currentConv.customer_name || currentConv.phone_number;
                const ok = confirm(`¿Eliminar el chat de ${name}?\n\nSe borrarán para siempre todos sus mensajes, fotos, audios, cotizaciones y pedidos. No se puede deshacer.`);
                if (!ok) return;

                setDeletingChat(true);
                try {
                    await api(`/api/conversations/${currentConv.id}`, { method: 'DELETE' });
                    setSelectedConv(null);
                    setMessages([]);
                    await Promise.all([loadConversations(), loadStats(), loadQuotations()]);
                } catch (err) {
                    alert('Error eliminando chat: ' + err.message);
                } finally {
                    setDeletingChat(false);
                }
            }

            async function pauseOrResumeBot() {
                if (!currentConv) return;
                setPausingBot(true);
                try {
                    const endpoint = botPausedInChat ? 'resume' : 'pause';
                    await api(`/api/conversations/${currentConv.id}/${endpoint}`, { method: 'POST', body: JSON.stringify({}) });
                    await loadConversations();
                } catch (err) {
                    alert(`Error ${botPausedInChat ? 'reactivando' : 'pausando'} el bot: ${err.message}`);
                } finally {
                    setPausingBot(false);
                }
            }

            function keepAtBottom() {
                const el = messagesRef.current;
                if (el && stickToBottom.current) el.scrollTop = el.scrollHeight;
            }

            function handleMessagesScroll() {
                const el = messagesRef.current;
                if (el) stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
            }

            useEffect(keepAtBottom, [messages]);

            useEffect(() => {
                // Al abrir otro chat no se muestran por un instante los mensajes del anterior.
                stickToBottom.current = true;
                setMessages([]);
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

            async function loadConversations() {
                try {
                    const data = await api('/api/conversations');
                    setConversations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando conversaciones:', err);
                } finally {
                    setLoading(false);
                }
            }

            async function loadMessages(convId) {
                try {
                    const data = await api(`/api/conversations/${convId}/messages`);
                    setMessages(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando mensajes:', err);
                }
            }

            async function loadStats() {
                try {
                    setStats(await api('/api/stats'));
                } catch (err) {
                    console.error('Error cargando stats:', err);
                }
            }

            async function sendMessage() {
                if (!inputText.trim() || !selectedConv || sending) return;

                // Sin esto, dos Enter seguidos le enviarían el mismo mensaje dos veces a la clienta.
                setSending(true);
                try {
                    // El servidor pausa el bot en este chat al enviar un mensaje manual.
                    await api('/api/send-message', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            text: inputText
                        })
                    });

                    setInputText('');
                    stickToBottom.current = true;
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando mensaje: ' + err.message);
                } finally {
                    setSending(false);
                }
            }

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--beige)' }}>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando CRM...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="main">
                        <div className="header">
                            <div className="header-brand">
                                <img src={logoOf(branding)} alt={branding.name || 'Logo'} />
                                <div>
                                    <div className="subtitle">{branding.name ? `${branding.name} · ` : ''}CRM · Asistente WhatsApp</div>
                                </div>
                            </div>
                            <div className="header-actions">
                                <div className={`toggle-bot ${botEnabled ? 'active' : 'inactive'}`} onClick={toggleBotStatus}>
                                    <span>{botEnabled ? '🤖 Bot Activo' : '🚫 Bot Inactivo'}</span>
                                </div>
                                <button className="btn-logout" onClick={onLogout}>Salir</button>
                            </div>
                        </div>

                        <div className="nav-tabs">
                            <div className={`nav-tab ${activeTab === 'conversaciones' ? 'active' : ''}`} onClick={() => setActiveTab('conversaciones')}>💬 Conversaciones</div>
                            <div className={`nav-tab ${activeTab === 'cotizaciones' ? 'active' : ''}`} onClick={() => setActiveTab('cotizaciones')}>🧾 Cotizaciones</div>
                            <div className={`nav-tab ${activeTab === 'catalogo' ? 'active' : ''}`} onClick={() => setActiveTab('catalogo')}>{productEmoji} Catálogo</div>
                            <div className={`nav-tab ${activeTab === 'configuracion' ? 'active' : ''}`} onClick={() => setActiveTab('configuracion')}>⚙️ Configuración</div>
                            <div className={`stats-toggle ${statsExpanded ? 'open' : ''}`} onClick={() => setStatsExpanded(!statsExpanded)}>
                                📊 {statsExpanded ? 'Ocultar estadísticas' : 'Estadísticas'}
                            </div>
                        </div>

                            {statsExpanded && (
                            <div className="stats">
                                <div className="stat-card">
                                    <h4>Total Clientes</h4>
                                    <div className="number">{stats.total}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Activas (últimas 24 h)</h4>
                                    <div className="number">{stats.active}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Pedidos</h4>
                                    <div className="number">{stats.orders}</div>
                                </div>
                                <div className="stat-card">
                                    <h4>Ventas en pedidos</h4>
                                    <div className="number">${stats.revenue.toFixed(2)}</div>
                                </div>
                            </div>
                            )}

                        {activeTab === 'conversaciones' && (
                        <div className="content">
                            <div className="conversations-list">
                                <div className="conversations-list-header">Conversaciones</div>
                                {conversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        className={`conversation-item ${selectedConv?.id === conv.id ? 'active' : ''}`}
                                        onClick={() => setSelectedConv(conv)}
                                    >
                                        <h3>📱 {conv.customer_name || conv.phone_number}</h3>
                                        <p>{formatDateTime(conv.last_message_time)}</p>
                                        {isBotPausedIn(conv) && <span className="paused-badge">⏸️ Te necesita</span>}
                                    </div>
                                ))}
                            </div>

                            {selectedConv ? (
                                <div className="chat-area">
                                    <div className={`chat-header ${botPausedInChat ? 'paused' : ''}`}>
                                        <span className="chat-name">
                                            {botPausedInChat
                                                ? `⏸️ Bot pausado: atiendes tú a ${currentConv.customer_name || currentConv.phone_number}`
                                                : `🤖 El bot atiende a ${currentConv.customer_name || currentConv.phone_number}`}
                                        </span>
                                        <div className="chat-header-actions">
                                            <button
                                                className={`btn-bot-control ${botPausedInChat ? 'paused' : 'active'}`}
                                                onClick={pauseOrResumeBot}
                                                disabled={pausingBot}
                                            >
                                                {botPausedInChat ? '▶️ Reactivar bot' : '⏸️ Pausar bot'}
                                            </button>
                                            <button className="btn-delete-chat" onClick={deleteChat} disabled={deletingChat}>
                                                {deletingChat ? 'Eliminando...' : '🗑️ Eliminar chat'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="messages-container" ref={messagesRef} onScroll={handleMessagesScroll}>
                                        {messages.map((msg) => {
                                            const content = msg.content || '';
                                            // Solo en fotos, audios y documentos la primera línea es la URL del archivo;
                                            // un enlace que escribe la clienta se muestra tal cual.
                                            const urlMatch = MEDIA_TYPES.includes(msg.type) ? content.match(/^https?:\/\/\S+/) : null;
                                            const mediaUrl = urlMatch ? urlMatch[0] : null;
                                            const textPart = mediaUrl ? content.slice(mediaUrl.length).replace(/^\n/, '') : content;
                                            return (
                                                <div key={msg.id} className={`message ${msg.sender}`}>
                                                    <div>
                                                        <div className="message-bubble">
                                                            {msg.type === 'image' && mediaUrl ? <img src={mediaUrl} onLoad={keepAtBottom} onClick={() => window.open(mediaUrl, '_blank')} /> : null}
                                                            {msg.type === 'audio' && mediaUrl ? <audio controls src={mediaUrl} style={{ maxWidth: '220px', marginBottom: '6px', display: 'block' }} /> : null}
                                                            {msg.type === 'document' && mediaUrl ? <a href={mediaUrl} target="_blank" rel="noopener noreferrer" style={{ display: 'block', marginBottom: '6px', fontWeight: 600 }}>📎 Abrir documento</a> : null}
                                                            {textPart}
                                                        </div>
                                                        <div className="message-time">{formatTime(msg.timestamp)}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="input-area">
                                        <textarea
                                            placeholder="Escribe tu respuesta aquí..."
                                            value={inputText}
                                            onChange={e => setInputText(e.target.value)}
                                            onKeyPress={e => {
                                                if (e.key === 'Enter' && !e.shiftKey) {
                                                    e.preventDefault();
                                                    sendMessage();
                                                }
                                            }}
                                        ></textarea>
                                        <div className="button-group">
                                            <button className="btn-send" onClick={sendMessage} disabled={sending}>{sending ? 'Enviando...' : '📤 Enviar'}</button>
                                            <button className="btn-photo" onClick={sendPhoto}>📷 Foto</button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <p>Selecciona una conversación</p>
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'catalogo' && (
                        <div className="catalog-container">
                            <div className="catalog-form">
                                <div className="form-field">
                                    <label>Foto</label>
                                    <label className="photo-upload">
                                        {newProduct.photoPreview ? <img src={newProduct.photoPreview} /> : '📷'}
                                        <input type="file" accept="image/jpeg,image/png" style={{ display: 'none' }} onChange={handlePhotoSelect} />
                                    </label>
                                </div>
                                <div className="form-field">
                                    <label>Nombre del producto</label>
                                    <input type="text" placeholder="Ej: nombre del producto" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>Precio por {unit} ($)</label>
                                    <input type="number" step="0.01" placeholder="Ej: 25.00" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                </div>
                                <div className="form-field">
                                    <label>{biz?.dates.enabled ? `Categoría / ${biz.dates.eventLabel}` : 'Categoría'}</label>
                                    <input type="text" placeholder="Ej: la categoría del producto" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} />
                                </div>
                                {packagingTypes.length > 0 && (
                                    <div className="form-field">
                                        <label>Empaque incluido</label>
                                        <select value={newProduct.packaging} onChange={e => setNewProduct({...newProduct, packaging: e.target.value})}>
                                            <option value="">Sin definir</option>
                                            {packagingTypes.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                                        </select>
                                    </div>
                                )}
                                <button className="btn-add-product" onClick={addProduct} disabled={savingProduct}>
                                    {savingProduct ? 'Guardando...' : '+ Agregar'}
