        }

        const AVATAR_COLORS = [['#E6EDFF', '#3B4FD8'], ['#EEE9FF', '#5B45D6'], ['#E3F6EC', '#1E8A4A'], ['#FFF1DA', '#B36B00'], ['#E1F4F8', '#1B7C93'], ['#FDE8EF', '#C2417A']];

        function Avatar({ name, size = 44 }) {
            const text = String(name || '?').trim();
            const initial = (text.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/) || ['?'])[0].toUpperCase();
            let hash = 0;
            for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) % 997;
            const [bg, fg] = AVATAR_COLORS[hash % AVATAR_COLORS.length];
            return <div className="nx-avatar" style={{ width: size, height: size, background: bg, color: fg, fontSize: Math.round(size * 0.4) }}>{initial}</div>;
        }

        function dayKey(value) {
            const date = parseTs(value);
            return date ? date.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ }) : '';
        }

        function dayLabel(value) {
            const key = dayKey(value);
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Hoy';
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'long', day: 'numeric', month: 'long' });
        }

        function listTime(value) {
            const key = dayKey(value);
            if (!key) return '';
            const now = new Date();
            if (key === now.toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return formatTime(value);
            if (key === new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: BUSINESS_TZ })) return 'Ayer';
            return parseTs(value).toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, day: 'numeric', month: 'short' });
        }

        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            if (seconds < 60) return Math.max(1, Math.round(seconds)) + ' s';
            if (seconds < 3600) return Math.round(seconds / 60) + ' min';
            return (seconds / 3600).toFixed(1).replace('.', ',') + ' h';
        }

        function Delta({ now, before, lowerIsBetter }) {
            if (!before || before <= 0 || now === null || now === undefined) return null;
            const pct = Math.round((now - before) / before * 100);
            if (pct === 0) return <span className="nx-delta flat">= ayer</span>;
            const up = pct > 0;
            const good = lowerIsBetter ? !up : up;
            return <span className={'nx-delta ' + (good ? 'good' : 'bad')}>{up ? '↑ +' : '↓ '}{pct}%</span>;
        }

        function TodayCard({ data }) {
            const dateLabel = new Date().toLocaleDateString('es-EC', { timeZone: BUSINESS_TZ, weekday: 'short', day: 'numeric', month: 'long' });
            const t = data?.today, y = data?.yesterday;
            const tile = (icon, label, value, delta) => (
                <div className="nx-stat">
                    <div className="tile"><PlatIcon name={icon} size={20} color="#4F5BD5" /></div>
                    <div>
                        <div className="lab">{label}</div>
                        <div className="val">{value}{delta}</div>
                    </div>
                </div>
            );
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="calendar" size={20} color="#4F5BD5" /> Resumen de hoy</h3>
                        <span className="sm">{dateLabel}</span>
                    </div>
                    {!t ? <div className="nx-soft">Cargando...</div> : (
                        <div className="nx-stats">
                            {tile('chat', 'Conversaciones hoy', t.conversations, <Delta now={t.conversations} before={y.conversations} />)}
                            {tile('bag', 'Pedidos generados', t.orders, <Delta now={t.orders} before={y.orders} />)}
                            {tile('doc', 'Cotizaciones enviadas', t.quotations, <Delta now={t.quotations} before={y.quotations} />)}
                            {tile('clock', 'Tiempo de respuesta', formatDuration(t.responseSeconds), <Delta now={t.responseSeconds} before={y.responseSeconds} lowerIsBetter />)}
                        </div>
                    )}
                </div>
            );
        }

        function ClientCard({ summary, conv }) {
            const c = summary?.customer;
            const name = c?.name || conv.customer_name || conv.phone_number;
            const phone = '+' + (c?.phone || conv.phone_number);
            const line = (icon, text) => <div className="nx-line"><span className="ic"><PlatIcon name={icon} size={19} color="#6B7599" /></span><span>{text}</span></div>;
            return (
                <div className="nx-card">
                    <div className="nx-card-h"><h3><PlatIcon name="user" size={20} color="#4F5BD5" /> Resumen del cliente</h3></div>
                    <div className="nx-who">
                        <Avatar name={name} size={48} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                            <div className="nm">{name}</div>
                            <div className="ph">{phone}</div>
                        </div>
                        {summary && <span className={'nx-badge ' + (summary.badges[0] === 'Cliente' ? 'green' : 'gray')}>{summary.badges[0]}</span>}
                    </div>
                    {!summary ? <div className="nx-soft">Cargando...</div> : (
                        <>
                            {c.city && line('pin', c.city)}
                            {summary.interest && line('tag', summary.interest)}
                            {line('cart', c.ordersCount ? c.ordersCount + (c.ordersCount === 1 ? ' pedido' : ' pedidos') + ' · $' + c.totalSpent.toFixed(2) : 'Sin pedidos todavía')}
                            {c.quotationsCount > 0 && line('doc', c.quotationsCount + (c.quotationsCount === 1 ? ' cotización' : ' cotizaciones'))}
                            {c.frequent && line('user', 'Cliente frecuente')}
                        </>
                    )}
                </div>
            );
        }

        function ProductsCard({ summary, onCatalog }) {
            const list = summary?.products || [];
            return (
                <div className="nx-card">
                    <div className="nx-card-h">
                        <h3><PlatIcon name="box" size={20} color="#4F5BD5" /> Productos consultados</h3>
                        <button type="button" className="link" onClick={onCatalog}>Ver catálogo</button>
                    </div>
                    {!summary ? <div className="nx-soft">Cargando...</div> : list.length === 0 ? <div className="nx-soft">Todavía no se le han mostrado productos.</div> : list.slice(0, 5).map(item => (
                        <div className="nx-prod" key={item.name}>
                            {item.image_url ? <img src={item.image_url} alt="" /> : <div className="noimg"><PlatIcon name="box" size={26} color="#9AA3C7" /></div>}
                            <div className="info">
                                <div className="pn">{item.name}</div>
                                <div className="pu">{[item.unit, item.measure].filter(Boolean).join(' · ')}</div>
                                <div className="pp">
                                    <span>{item.price !== null ? '$' + item.price.toFixed(2) : ''}</span>
                                    <span className="times">Consultado {item.times} {item.times === 1 ? 'vez' : 'veces'}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function App({ onLogout, branding, onBrandingChange }) {
            const [conversations, setConversations] = useState([]);
            const [selectedConv, setSelectedConv] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [botEnabled, setBotEnabled] = useState(true);
            const [stats, setStats] = useState({ total: 0, active: 0, orders: 0, revenue: 0 });
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('conversaciones');
            const [products, setProducts] = useState([]);
            const [newProduct, setNewProduct] = useState({ name: '', price: '', category: '', packaging: '', sale_unit: '', measure: '', pieces_per_unit: '', photoBase64: '', photoPreview: '' });
            const [savingProduct, setSavingProduct] = useState(false);
            const [systemPrompt, setSystemPrompt] = useState('');
            const [savingPrompt, setSavingPrompt] = useState(false);
            const [promptSaved, setPromptSaved] = useState(false);
            const [transferInfo, setTransferInfo] = useState('');
            const [savingTransfer, setSavingTransfer] = useState(false);
            const [transferSaved, setTransferSaved] = useState(false);
            const [pausingBot, setPausingBot] = useState(false);
            const [statsExpanded, setStatsExpanded] = useState(false);
            const [quotations, setQuotations] = useState([]);
            const [quoteFilter, setQuoteFilter] = useState('all');
            const [orders, setOrders] = useState([]);
            const [orderFilter, setOrderFilter] = useState('all');
            // Chat abierto en este momento: una respuesta lenta de otro chat no debe reemplazar sus mensajes.
            const openChatId = useRef(null);
            const [deletingChat, setDeletingChat] = useState(false);
            const [sending, setSending] = useState(false);
            const [biz, setBiz] = useState(null);
            const [businesses, setBusinesses] = useState([]);
            const currentBusinessId = getCurrentBusinessId() || null;
            const [session, setSession] = useState(null);
            const [today, setToday] = useState(null);
            const [listOverview, setListOverview] = useState({ previews: {}, clientIds: [] });
            const [summary, setSummary] = useState(null);
            const [search, setSearch] = useState('');
            const [listFilter, setListFilter] = useState('all');
            const isAdmin = session?.role === 'admin';
            const unit = biz?.sales.unitSingular || 'unidad';
            const unitPlural = biz?.sales.unitPlural || 'unidades';
            const productEmoji = biz?.business.productEmoji || '🛍️';
            const packagingTypes = biz?.packaging?.enabled ? (biz.packaging.types || []) : [];
            const messagesRef = useRef(null);
            // Se sigue al último mensaje salvo que la dueña haya subido a leer mensajes anteriores.
            const stickToBottom = useRef(true);

            useEffect(() => {
                loadSession();
                loadConversations();
                loadStats();
                loadBotStatus();
                loadProducts();
                loadSystemPrompt();
                loadQuotations();
                loadPaymentInfo();
                api('/api/business-profile')
                    .then(data => {
                        setBiz(data);
                        // Nombre, color, logo y zona horaria de la empresa en que se trabaja.
                        onBrandingChange({ name: data.business.name, primaryColor: data.branding.primaryColor, logoUrl: data.branding.logoUrl, timezone: data.business.timezone });
                    })
                    .catch(err => console.error('Error cargando perfil:', err));
                const interval = setInterval(() => {
                    loadConversations();
                    loadStats();
                    loadQuotations();
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (activeTab !== 'conversaciones') return;
                const load = () => {
                    api('/api/crm/today').then(setToday).catch(err => console.error('Error cargando resumen de hoy:', err));
                    api('/api/crm/list-overview').then(setListOverview).catch(err => console.error('Error cargando la lista:', err));
                };
                load();
                const interval = setInterval(load, 15000);
                return () => clearInterval(interval);
            }, [activeTab]);

            useEffect(() => {
                setSummary(null);
                if (activeTab !== 'conversaciones' || !selectedConv) return;
                const id = selectedConv.id;
                const load = () => api('/api/conversations/' + id + '/summary')
                    .then(data => { if (openChatId.current === id) setSummary(data); })
                    .catch(err => console.error('Error cargando resumen del cliente:', err));
                load();
                const interval = setInterval(load, 15000);
                return () => clearInterval(interval);
            }, [selectedConv?.id, activeTab]);

            async function loadSystemPrompt() {
                try {
                    const data = await api('/api/system-prompt');
                    setSystemPrompt(data.prompt || '');
                } catch (err) {
                    console.error('Error cargando system prompt:', err);
                }
            }

            async function saveSystemPrompt() {
                setSavingPrompt(true);
                try {
                    await api('/api/system-prompt', {
                        method: 'POST',
                        body: JSON.stringify({ prompt: systemPrompt })
                    });
                    setPromptSaved(true);
                    setTimeout(() => setPromptSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando instrucciones: ' + err.message);
                } finally {
                    setSavingPrompt(false);
                }
            }

            async function loadPaymentInfo() {
                try {
                    const data = await api('/api/payment-info');
                    setTransferInfo(data.transfer || '');
                } catch (err) {
                    console.error('Error cargando datos de pago:', err);
                }
            }

            async function savePaymentInfo() {
                setSavingTransfer(true);
                try {
                    await api('/api/payment-info', {
                        method: 'POST',
                        body: JSON.stringify({ transfer: transferInfo })
                    });
                    setTransferSaved(true);
                    setTimeout(() => setTransferSaved(false), 3000);
                } catch (err) {
                    alert('Error guardando datos de pago: ' + err.message);
                } finally {
                    setSavingTransfer(false);
                }
            }

            async function loadProducts() {
                try {
                    const data = await api('/api/products');
                    setProducts(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando catálogo:', err);
                }
            }

            function handlePhotoSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                // WhatsApp solo envía fotos JPG o PNG de hasta 5 MB.
                if (!['image/jpeg', 'image/png'].includes(file.type)) {
                    alert('La foto debe ser JPG o PNG. WhatsApp no puede enviar otros formatos.');
                    e.target.value = '';
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert('La foto pesa más de 5 MB. Usa una foto más liviana para que WhatsApp la pueda enviar.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    setNewProduct(prev => ({ ...prev, photoBase64: reader.result, photoPreview: reader.result }));
                };
                reader.readAsDataURL(file);
            }

            async function addProduct() {
                if (!newProduct.name.trim() || !newProduct.price || !newProduct.category.trim()) {
                    alert('Completa nombre, precio y categoría');
                    return;
                }
                setSavingProduct(true);
                try {
                    let imageUrl = '';
                    if (newProduct.photoBase64) {
                        const uploadData = await api('/api/upload-image', {
                            method: 'POST',
                            body: JSON.stringify({ imageBase64: newProduct.photoBase64 })
                        });
                        imageUrl = uploadData.url;
                    }

                    await api('/api/products', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: newProduct.name,
                            price: parseFloat(newProduct.price),
                            category: newProduct.category,
                            packaging: newProduct.packaging,
                            sale_unit: newProduct.sale_unit,
                            measure: newProduct.measure,
                            pieces_per_unit: newProduct.pieces_per_unit,
                            image_url: imageUrl
                        })
                    });

                    setNewProduct({ name: '', price: '', category: '', packaging: '', sale_unit: '', measure: '', pieces_per_unit: '', photoBase64: '', photoPreview: '' });
                    loadProducts();
                } catch (err) {
                    alert('Error agregando producto: ' + err.message);
                } finally {
                    setSavingProduct(false);
                }
            }

            async function changeProductPackaging(id, packaging) {
                try {
                    await api(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify({ packaging }) });
                    setProducts(prev => prev.map(p => p.id === id ? { ...p, description: packaging } : p));
                } catch (err) {
                    alert('Error cambiando el empaque: ' + err.message);
                }
            }

            /** Guarda la unidad, la medida o las piezas de un producto ya creado. */
            async function changeProductField(id, field, value) {
                try {
                    const saved = await api(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify({ [field]: value }) });
                    setProducts(prev => prev.map(x => x.id === id ? saved : x));
                } catch (err) {
                    alert('Error guardando el producto: ' + err.message);
                }
            }

            async function removeProduct(id) {
                if (!confirm('¿Eliminar este producto del catálogo?')) return;
                try {
                    await api(`/api/products/${id}`, { method: 'DELETE' });
                    loadProducts();
                } catch (err) {
                    alert('Error eliminando producto: ' + err.message);
                }
            }

            async function loadBotStatus() {
                try {
                    const data = await api('/api/bot-status');
                    setBotEnabled(data.enabled);
                } catch (err) {
                    console.error('Error cargando estado del bot:', err);
                }
            }

            async function toggleBotStatus() {
                const newValue = !botEnabled;
                setBotEnabled(newValue);
                try {
                    await api('/api/bot-status', {
                        method: 'POST',
                        body: JSON.stringify({ enabled: newValue })
                    });
                } catch (err) {
                    alert('Error cambiando estado del bot: ' + err.message);
                    setBotEnabled(!newValue);
                }
            }

            async function loadSession() {
                try {
                    setSession(await api('/api/session'));
                } catch (err) {
                    console.error('Error cargando sesión:', err);
                }
            }

            async function changeOwnPassword() {
                const currentPassword = prompt('Escribe tu contraseña actual:');
                if (currentPassword === null) return;
                const newPassword = prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
                if (newPassword === null) return;
                if (newPassword.length < 8) return alert('La contraseña debe tener al menos 8 caracteres');
                try {
                    await api('/api/me/password', { method: 'PUT', body: JSON.stringify({ currentPassword, newPassword }) });
                    alert('Contraseña cambiada');
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            // Volver a la pantalla general de empresas (solo administradora).
            function changeCompany() {
                setCurrentBusinessId('');
                window.location.reload();
            }

            async function sendPhoto() {
                if (!selectedConv) return;
                const imageUrl = prompt('Pega la URL de la foto a enviar:');
                if (!imageUrl) return;
                const caption = prompt('Descripción (opcional):') || '';

                try {
                    await api('/api/send-image', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            imageUrl,
                            caption
                        })
                    });
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando foto: ' + err.message);
                }
            }

            // La lista se refresca cada 5 s, así la pausa que active el bot (reclamo, pago...)
            // se refleja sola sin volver a abrir el chat.
            const currentConv = conversations.find(c => c.id === selectedConv?.id) || selectedConv;
            const botPausedInChat = isBotPausedIn(currentConv);

            const clientSet = new Set(listOverview.clientIds || []);
            const dayAgoMs = Date.now() - 24 * 60 * 60 * 1000;
            const isRecent = c => { const t = parseTs(c.last_message_time); return !!t && t.getTime() > dayAgoMs; };
            const needsCount = conversations.filter(isBotPausedIn).length;
            const searchText = search.trim().toLowerCase();
            const visibleConversations = conversations.filter(c => {
                if (searchText && !((c.customer_name || '').toLowerCase().includes(searchText) || (c.phone_number || '').includes(searchText))) return false;
                if (listFilter === 'needs') return isBotPausedIn(c);
                if (listFilter === 'clients') return clientSet.has(c.id);
                if (listFilter === 'recent') return isRecent(c);
                return true;
            });

            async function loadQuotations() {
                try {
                    const data = await api('/api/quotations');
                    setQuotations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando cotizaciones:', err);
                }
            }

            async function loadOrders() {
                try {
                    const data = await api('/api/orders');
                    setOrders(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando pedidos:', err);
                }
            }

            async function changeOrderStatus(id, status) {
                try {
                    await api(`/api/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
                    await Promise.all([loadOrders(), loadStats()]);
                } catch (err) {
                    alert('Error cambiando estado del pedido: ' + err.message);
                }
            }

            // Los pedidos se actualizan solos mientras la pestaña está abierta.
            useEffect(() => {
                if (activeTab !== 'pedidos') return;
                loadOrders();
                const interval = setInterval(loadOrders, 5000);
                return () => clearInterval(interval);
            }, [activeTab]);

            async function changeQuotationStatus(id, status) {
                try {
                    await api(`/api/quotations/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
                    loadQuotations();
                } catch (err) {
                    alert('Error cambiando estado: ' + err.message);
                }
            }

            function openChatFromQuotation(conversationId) {
                const conv = conversations.find(c => c.id === conversationId);
                if (!conv) return;
                setSelectedConv(conv);
                setActiveTab('conversaciones');
            }

            async function deleteChat() {
                if (!currentConv) return;
                const name = currentConv.customer_name || currentConv.phone_number;
                const ok = confirm(`¿Eliminar el chat de ${name}?\n\nSe borrarán para siempre todos sus mensajes, fotos, audios, cotizaciones y pedidos. No se puede deshacer.`);
                if (!ok) return;

                setDeletingChat(true);
                try {
                    await api(`/api/conversations/${currentConv.id}`, { method: 'DELETE' });
                    setSelectedConv(null);
                    setMessages([]);
                    await Promise.all([loadConversations(), loadStats(), loadQuotations()]);
                } catch (err) {
                    alert('Error eliminando chat: ' + err.message);
                } finally {
                    setDeletingChat(false);
                }
            }

            async function pauseOrResumeBot() {
                if (!currentConv) return;
                setPausingBot(true);
                try {
                    const endpoint = botPausedInChat ? 'resume' : 'pause';
                    await api(`/api/conversations/${currentConv.id}/${endpoint}`, { method: 'POST', body: JSON.stringify({}) });
                    await loadConversations();
                } catch (err) {
                    alert(`Error ${botPausedInChat ? 'reactivando' : 'pausando'} el bot: ${err.message}`);
                } finally {
                    setPausingBot(false);
                }
            }

            function keepAtBottom() {
                const el = messagesRef.current;
                if (el && stickToBottom.current) el.scrollTop = el.scrollHeight;
            }

            function handleMessagesScroll() {
                const el = messagesRef.current;
                if (el) stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
            }

            useEffect(keepAtBottom, [messages]);

            useEffect(() => {
                // Al abrir otro chat no se muestran por un instante los mensajes del anterior.
                stickToBottom.current = true;
                setMessages([]);
                openChatId.current = selectedConv ? selectedConv.id : null;
                if (selectedConv) {
                    loadMessages(selectedConv.id);
                    const interval = setInterval(() => loadMessages(selectedConv.id), 3000);
                    return () => clearInterval(interval);
                }
            }, [selectedConv]);

            async function loadConversations() {
                try {
                    const data = await api('/api/conversations');
                    setConversations(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando conversaciones:', err);
                } finally {
                    setLoading(false);
                }
            }

            async function loadMessages(convId) {
                try {
                    const data = await api(`/api/conversations/${convId}/messages`);
                    if (openChatId.current !== convId) return;
                    setMessages(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error cargando mensajes:', err);
                }
            }

            async function loadStats() {
                try {
                    setStats(await api('/api/stats'));
                } catch (err) {
                    console.error('Error cargando stats:', err);
                }
            }

            async function sendMessage() {
                if (!inputText.trim() || !selectedConv || sending) return;

                // Sin esto, dos Enter seguidos le enviarían el mismo mensaje dos veces a la clienta.
                setSending(true);
                try {
                    // El servidor pausa el bot en este chat al enviar un mensaje manual.
                    await api('/api/send-message', {
                        method: 'POST',
                        body: JSON.stringify({
                            conversationId: selectedConv.id,
                            phoneNumber: selectedConv.phone_number,
                            text: inputText
                        })
                    });

                    setInputText('');
                    stickToBottom.current = true;
                    loadMessages(selectedConv.id);
                    loadConversations();
                } catch (err) {
                    alert('Error enviando mensaje: ' + err.message);
                } finally {
                    setSending(false);
                }
            }

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--beige)' }}>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando CRM...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container nx-page">
                    <div className="main">
                        <div className="nx-top">
                            <div className="nx-brand">
                                {/* El logo por defecto (logo.png) es de VELAMIA: otra empresa sin logo propio no lo muestra. */}
                                {(branding.logoUrl || session?.business?.legacy) && <img src={logoOf(branding)} alt={branding.name || 'Logo'} />}
                                <div>
                                    <div className="t">{branding.name || session?.business?.name || 'CRM'}</div>
                                    <div className="s">CRM · Asistente WhatsApp</div>
                                </div>
                            </div>

                            <div className="nx-tabs">
                                {session && session.role === 'owner' && !session.business?.legacy && <div className={'nx-tab' + (activeTab === 'claves' ? ' active' : '')} onClick={() => setActiveTab('claves')}><PlatIcon name="key" size={19} /><span className="lbl">Claves</span></div>}
                                <div className={'nx-tab' + (activeTab === 'conversaciones' ? ' active' : '')} onClick={() => setActiveTab('conversaciones')}><PlatIcon name="chat" size={19} /><span className="lbl">Conversaciones</span></div>
                                <div className={'nx-tab' + (activeTab === 'cotizaciones' ? ' active' : '')} onClick={() => setActiveTab('cotizaciones')}><PlatIcon name="doc" size={19} /><span className="lbl">Cotizaciones</span></div>
                                <div className={'nx-tab' + (activeTab === 'pedidos' ? ' active' : '')} onClick={() => setActiveTab('pedidos')}><PlatIcon name="bag" size={19} /><span className="lbl">Pedidos</span></div>
                                <div className={'nx-tab' + (activeTab === 'catalogo' ? ' active' : '')} onClick={() => setActiveTab('catalogo')}><PlatIcon name="box" size={19} /><span className="lbl">Catálogo</span></div>
                                <div className={'nx-tab' + (activeTab === 'configuracion' ? ' active' : '')} onClick={() => setActiveTab('configuracion')}><PlatIcon name="gear" size={19} /><span className="lbl">Configuración</span></div>
                            </div>

                            <div className="nx-actions">
                                {session?.business && (isAdmin
                                    ? <button type="button" className="nx-pill" title="Cambiar empresa" onClick={changeCompany}><PlatIcon name="building" size={18} color="#4F5BD5" /><span className="lbl-hide">{session.business.name}</span></button>
                                    : <span className="nx-pill"><PlatIcon name="building" size={18} color="#4F5BD5" /><span className="lbl-hide">{session.business.name}</span></span>)}
                                {session && !isAdmin && <button type="button" className="nx-pill" onClick={changeOwnPassword}><PlatIcon name="key" size={18} color="#4F5BD5" /><span className="lbl-hide">Mi contraseña</span></button>}
                                <button type="button" className={'nx-pill ' + (botEnabled ? 'bot-on' : 'bot-off')} onClick={toggleBotStatus}><span className="dot"></span>{botEnabled ? 'Bot Activo' : 'Bot Inactivo'}</button>
                                <button type="button" className="nx-pill" onClick={() => setStatsExpanded(!statsExpanded)}><PlatIcon name="chart" size={18} color="#4F5BD5" /><span className="lbl-hide">{statsExpanded ? 'Ocultar' : 'Estadísticas'}</span></button>

        // Plataforma general: la marca de cada empresa se aplica recién al entrar en ella.
        const PLATFORM_BRANDING = { name: '', primaryColor: '', logoUrl: '', timezone: '' };

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());
            const [role, setRole] = useState(null);
            const [branding, setBranding] = useState(PLATFORM_BRANDING);

            useEffect(() => {
                onSessionExpired = () => { setRole(null); setAuthenticated(false); };
                document.title = 'Nexly';
            }, []);

            // Quién entró: la administradora sin empresa elegida ve la pantalla general de empresas.
            useEffect(() => {
                if (!authenticated) return;
                api('/api/session')
                    .then(data => setRole(data.role))
                    .catch(() => {
                        // La empresa elegida ya no existe o está desactivada: se vuelve a la pantalla general.
                        if (getCurrentBusinessId()) {
                            setCurrentBusinessId('');
                            window.location.reload();
                        }
                    });
            }, [authenticated]);

            const changeBranding = data => {
                applyBranding(data);
                setBranding(data);
            };

            const logout = () => {
                setToken(null);
                setCurrentBusinessId('');
                setRole(null);
                setAuthenticated(false);
            };

            if (!authenticated) {
                return <LoginScreen branding={PLATFORM_BRANDING} onLogin={() => setAuthenticated(true)} />;
            }
            if (!role) return <div style={{ padding: '40px', textAlign: 'center' }}>Cargando...</div>;
            if (role === 'admin' && !getCurrentBusinessId()) {
                return <CompanyHome onLogout={logout} />;
            }

            return <App branding={branding} onBrandingChange={changeBranding} onLogout={logout} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
