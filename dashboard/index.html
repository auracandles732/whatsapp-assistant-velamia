                                </button>
                            </div>

                            {products.length === 0 ? (
                                <div className="empty-catalog">
                                    <p>Aún no has agregado productos. Usa el formulario de arriba para empezar tu catálogo {productEmoji}</p>
                                </div>
                            ) : (
                                <div className="catalog-grid">
                                    {products.map(product => (
                                        <div key={product.id} className="product-card">
                                            <img className="photo" src={product.image_url || 'logo.png'} />
                                            <div className="info">
                                                <span className="category-tag">{product.category}</span>
                                                <h4>{product.name}</h4>
                                                <div className="price">${product.price} <small>por {unit}</small></div>
                                                {packagingTypes.length > 0 && (
                                                    <select className="packaging-select" value={product.description || ''} onChange={e => changeProductPackaging(product.id, e.target.value)}>
                                                        <option value="">🎁 Empaque sin definir</option>
                                                        {packagingTypes.map(t => <option key={t.name} value={t.name}>🎁 {t.name}</option>)}
                                                    </select>
                                                )}
                                                <button className="btn-delete-product" onClick={() => removeProduct(product.id)}>🗑️ Eliminar</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        )}
                        {activeTab === 'cotizaciones' && (() => {
                            const statusLabels = { pending: 'Pendiente', accepted: 'Aceptada', expired: 'Vencida' };
                            const visible = quoteFilter === 'all' ? quotations : quotations.filter(q => q.status === quoteFilter);
                            const total = visible.reduce((sum, q) => sum + Number(q.total_amount || 0), 0);
                            return (
                            <div className="quotes-container">
                                <div className="quotes-toolbar">
                                    <select value={quoteFilter} onChange={e => setQuoteFilter(e.target.value)}>
                                        <option value="all">Todas</option>
                                        <option value="pending">Pendientes</option>
                                        <option value="accepted">Aceptadas</option>
                                        <option value="expired">Vencidas</option>
                                    </select>
                                    <span>{visible.length} cotización(es) · ${total.toFixed(2)}</span>
                                </div>
                                {visible.length === 0 ? (
                                    <div className="empty-catalog"><p>Aún no hay cotizaciones. Se anotan solas cada vez que el bot le da a una clienta el valor total de su pedido, y te llega un aviso por WhatsApp 🧾</p></div>
                                ) : visible.map(q => {
                                    let items = [];
                                    try { items = typeof q.products === 'string' ? JSON.parse(q.products) : (q.products || []); } catch { items = []; }
                                    const customer = q.conversations?.customer_name || q.conversations?.phone_number || q.customer_phone;
                                    return (
                                        <div key={q.id} className="quote-card">
                                            <div className="quote-head">
                                                <div>
                                                    <div className="quote-customer">📱 {customer}</div>
                                                    <div className="quote-meta">
                                                        {formatDateTime(q.created_at)} · Código {q.id.substring(0, 8).toUpperCase()} · Válida hasta {formatDateTime(q.expires_at)}
                                                    </div>
                                                </div>
                                                <div className="quote-total">${Number(q.total_amount || 0).toFixed(2)}</div>
                                            </div>
                                            <ul className="quote-items">
                                                {items.map((item, i) => item.type === 'delivery' ? (
                                                    <li key={i}>📅 Entrega: {String(item.date || '').split('-').reverse().join('/')}</li>
                                                ) : item.type === 'shipping' ? (
                                                    <li key={i}>🚚 {item.name} — ${Number(item.price).toFixed(2)}</li>
                                                ) : (
                                                    <li key={i}>
                                                        {item.quantity} {Number(item.quantity) === 1 ? unit : unitPlural} × {item.name} — ${(Number(item.price) * Number(item.quantity)).toFixed(2)}
                                                        {item.personalization ? <><br /><small>🎨 {item.personalization}</small></> : null}
                                                        {item.packaging ? <><br /><small>🎁 Empaque {item.packaging}{item.packagingChanged ? ' (cambiado por la clienta)' : ''}</small></> : null}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="quote-actions">
                                                <span className={`quote-status ${q.status}`}>{statusLabels[q.status] || q.status}</span>
                                                <select value={q.status} onChange={e => changeQuotationStatus(q.id, e.target.value)}>
                                                    <option value="pending">Pendiente</option>
                                                    <option value="accepted">Aceptada</option>
                                                    <option value="expired">Vencida</option>
                                                </select>
                                                <button className="btn-photo" onClick={() => openChatFromQuotation(q.conversation_id)}>💬 Ver chat</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            );
                        })()}
                        {activeTab === 'configuracion' && (
                        <div className="settings-container">
                            <BusinessProfileForm onSaved={saved => {
                                setBiz(saved);
                                onBrandingChange({ name: saved.business.name, primaryColor: saved.branding.primaryColor, logoUrl: saved.branding.logoUrl, timezone: saved.business.timezone });
                            }} />
                            <div className="settings-card">
                                <h3>🏦 Datos para transferencia</h3>
                                <p className="hint">Cuando una clienta elige pagar por transferencia, el bot le indica {biz && biz.payments.depositPercent < 100 ? `el anticipo del ${biz.payments.depositPercent}%` : 'el total a pagar'} y le envía este texto exactamente como lo escribas.{biz?.payments.cardEnabled ? ' Con tarjeta, el bot indica el pago del total, se pausa y te avisa para que envíes el link de pago.' : ''}</p>
                                <textarea
                                    className="prompt-textarea"
                                    style={{ minHeight: '140px' }}
                                    placeholder={'Banco:\nTipo de cuenta:\nNúmero de cuenta:\nTitular:\nCédula / RUC:\n\nEnvíanos el comprobante por este chat 🤍'}
                                    value={transferInfo}
                                    onChange={e => setTransferInfo(e.target.value)}
                                ></textarea>
                                <div className="settings-actions">
                                    <span className="save-status">{transferSaved ? '✅ Guardado' : (transferInfo.trim() ? '' : '⚠️ Sin datos: el bot te avisará cuando una clienta elija transferencia')}</span>
                                    <button className="btn-save-prompt" onClick={savePaymentInfo} disabled={savingTransfer}>
                                        {savingTransfer ? 'Guardando...' : '💾 Guardar datos de pago'}
                                    </button>
                                </div>
                            </div>
                            <div className="settings-card">
                                <h3>🧠 Instrucciones del asistente (System Prompt)</h3>
                                <p className="hint">Aquí defines el tono del asistente y detalles de tu negocio que no están en el perfil (horarios, políticas, preguntas frecuentes). Se aplica de inmediato en todos los chats. Precios, pagos, envíos y fechas vienen del Perfil del negocio y mandan sobre lo que escribas aquí.</p>
                                <textarea
                                    className="prompt-textarea"
                                    placeholder={`Ej: Eres parte del equipo de ${branding.name || 'mi negocio'}. Responde siempre en español, de forma cálida y cercana, con mensajes cortos y algún emoji.`}
                                    value={systemPrompt}
                                    onChange={e => setSystemPrompt(e.target.value)}
                                ></textarea>
                                <div className="settings-actions">
                                    <span className="save-status">{promptSaved ? '✅ Guardado' : ''}</span>
                                    <button className="btn-save-prompt" onClick={saveSystemPrompt} disabled={savingPrompt}>
                                        {savingPrompt ? 'Guardando...' : '💾 Guardar instrucciones'}
                                    </button>
                                </div>
                            </div>
                        </div>
                        )}
                    </div>
                </div>
            );
        }

        function Root() {
            const [authenticated, setAuthenticated] = useState(!!getToken());
            const [branding, setBranding] = useState({ name: '', primaryColor: '', logoUrl: '', timezone: '' });

            useEffect(() => {
                onSessionExpired = () => setAuthenticated(false);
                fetch(`${API_URL}/api/public/branding`)
                    .then(res => res.json())
                    .then(data => { applyBranding(data); setBranding(data); })
                    .catch(() => {});
            }, []);

            const changeBranding = data => {
                applyBranding(data);
                setBranding(data);
            };

            if (!authenticated) {
                return <LoginScreen branding={branding} onLogin={() => setAuthenticated(true)} />;
            }

            return <App branding={branding} onBrandingChange={changeBranding} onLogout={() => {
                setToken(null);
                setAuthenticated(false);
            }} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW error:', err));
        }
    </script>
</body>
</html>
